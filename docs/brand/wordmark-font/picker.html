<title>Open DJ Wordmark Blind Pick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Archivo:wdth,wght@125,800&family=Bricolage+Grotesque:opsz,wght@96,800&family=Anybody:wdth,wght@150,800&family=Krona+One&family=Sora:wght@800&family=Red+Hat+Display:wght@900&family=Dela+Gothic+One&family=Familjen+Grotesk:wght@700&family=Rubik+Mono+One&family=Syne:wght@800&family=Big+Shoulders+Display:wght@800&family=Michroma&family=Bebas+Neue&family=Anton&family=Archivo+Black&family=Syncopate:wght@700&family=Oswald:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #0b0d12;
    --panel: #11141b;
    --line: #232834;
    --ink: #e8ebf2;
    --muted: #8a92a6;
    --cue: #ff9f1c;      /* rekordbox-ish cue orange */
    --keep: #3ddc97;
    --cut: #ff5d6c;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  header { max-width: 1180px; margin: 0 auto; padding: 28px 24px 8px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: end; justify-content: space-between; }
  header h1 { margin: 0; font: 500 13px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  header p { margin: 6px 0 0; max-width: 62ch; color: var(--muted); }
  .bar { display: flex; gap: 10px; align-items: center; }
  button { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--cue); outline-offset: 2px; }
  #reveal { border-color: var(--cue); color: var(--cue); }
  main { max-width: 1180px; margin: 0 auto; padding: 16px 24px 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: grid; grid-template-rows: auto auto; }
  .tile[data-vote="keep"] { border-color: var(--keep); }
  .tile[data-vote="cut"] { opacity: .45; }
  .stage { aspect-ratio: 16 / 9; display: grid; place-items: center; align-content: center; gap: 14px; background: radial-gradient(120% 90% at 50% 40%, #161b26 0%, var(--ground) 70%); position: relative; }
  .mark { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1; white-space: nowrap; }
  body.caps .mark { text-transform: uppercase; font-size: clamp(1.7rem, 4.2vw, 2.9rem); }
  #caps[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .sub { font: 400 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .sub::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--cue); margin-right: 8px; vertical-align: 1px; }
  .slot { position: absolute; top: 10px; left: 12px; font: 500 12px/1 var(--mono); color: var(--muted); letter-spacing: .1em; }
  .foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .name { flex: 1; font: 400 12px/1.3 var(--mono); color: var(--muted); }
  .name[hidden] { display: none !important; }
  .foot .spacer { flex: 1; }
  .foot button { padding: 8px 10px; }
  .foot button[aria-pressed="true"].k { background: var(--keep); color: #04120b; border-color: var(--keep); }
  .foot button[aria-pressed="true"].c { background: var(--cut); color: #1a0306; border-color: var(--cut); }
  #result { max-width: 1180px; margin: 0 auto; padding: 0 24px 40px; font: 400 13px/1.6 var(--mono); color: var(--ink); white-space: pre-wrap; }
  @media (prefers-reduced-motion: no-preference) { .tile { transition: opacity .15s, border-color .15s; } }
</style>

<header>
  <div>
    <h1>Open DJ · launch wordmark · blind</h1>
    <p>Nineteen candidates, shuffled, named only by letter. One of them is what ships today. Showing ALL CAPS; toggle for mixed case. Mark each Keep or Cut, then Reveal and tell me what you kept and cut (and in which case).</p>
  </div>
  <div class="bar">
    <button id="caps" type="button" aria-pressed="true">ALL CAPS</button>
    <button id="shuffle" type="button">Reshuffle</button>
    <button id="reveal" type="button">Reveal</button>
  </div>
</header>
<main id="grid"></main>
<div id="result" aria-live="polite"></div>

<script>
  const FONTS = [
    { name: "Current (system SF Pro 700)", css: "font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-weight:700;letter-spacing:-0.01em" },
    { name: "Unbounded 700", css: "font-family:'Unbounded',sans-serif;font-weight:700;letter-spacing:-0.02em" },
    { name: "Archivo Expanded 800 (wdth 125)", css: "font-family:'Archivo',sans-serif;font-weight:800;font-stretch:125%;letter-spacing:-0.01em" },
    { name: "Bricolage Grotesque 800", css: "font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-0.02em" },
    { name: "Anybody 800 (wdth 150)", css: "font-family:'Anybody',sans-serif;font-weight:800;font-stretch:150%;letter-spacing:-0.01em" },
    { name: "Krona One", css: "font-family:'Krona One',sans-serif;font-weight:400;letter-spacing:-0.01em" },
    { name: "Sora 800", css: "font-family:'Sora',sans-serif;font-weight:800;letter-spacing:-0.03em" },
    { name: "Red Hat Display 900", css: "font-family:'Red Hat Display',sans-serif;font-weight:900;letter-spacing:-0.02em" },
    { name: "Dela Gothic One", css: "font-family:'Dela Gothic One',sans-serif;font-weight:400;letter-spacing:0" },
    { name: "Familjen Grotesk 700", css: "font-family:'Familjen Grotesk',sans-serif;font-weight:700;letter-spacing:-0.02em" },
    { name: "Rubik Mono One", css: "font-family:'Rubik Mono One',sans-serif;font-weight:400;letter-spacing:-0.02em" },
    { name: "Syne 800", css: "font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-0.01em" },
    { name: "Big Shoulders Display 800", css: "font-family:'Big Shoulders Display',sans-serif;font-weight:800;letter-spacing:0.02em" },
    { name: "Michroma", css: "font-family:'Michroma',sans-serif;font-weight:400;letter-spacing:0.02em" },
    { name: "Bebas Neue", css: "font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:0.03em" },
    { name: "Anton", css: "font-family:'Anton',sans-serif;font-weight:400;letter-spacing:0.01em" },
    { name: "Archivo Black", css: "font-family:'Archivo Black',sans-serif;font-weight:400;letter-spacing:-0.01em" },
    { name: "Syncopate 700", css: "font-family:'Syncopate',sans-serif;font-weight:700;letter-spacing:0.04em" },
    { name: "Oswald 700", css: "font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.02em" },
  ];
  const grid = document.getElementById("grid");
  const result = document.getElementById("result");
  let order = [], revealed = false;

  // Opens in the recorded round-3 list order so a letter means the same face on every visit
  // (A = current, then Unbounded, Archivo, Bricolage, Anybody = E ...). Reshuffle re-blinds.
  function shuffle(fixed) {
    order = FONTS.map((f, i) => i);
    if (!fixed) order.sort(() => Math.random() - 0.5);
    revealed = false; result.textContent = ""; render();
  }
  function render() {
    grid.innerHTML = "";
    order.forEach((fontIdx, slot) => {
      const f = FONTS[fontIdx], letter = String.fromCharCode(65 + slot);
      const tile = document.createElement("section");
      tile.className = "tile"; tile.dataset.vote = "";
      tile.innerHTML = `
        <div class="stage"><span class="slot">${letter}</span>
          <span class="mark" style="${f.css}">Open DJ</span>
          <span class="sub">Starting engine</span></div>
        <div class="foot"><span class="name" ${revealed ? "" : "hidden"}>${f.name}</span>
          ${revealed ? "" : '<span class="spacer"></span>'}
          <button class="k" type="button" aria-pressed="false">Keep</button>
          <button class="c" type="button" aria-pressed="false">Cut</button></div>`;
      const [k, c] = tile.querySelectorAll("button");
      const set = v => { tile.dataset.vote = tile.dataset.vote === v ? "" : v;
        k.setAttribute("aria-pressed", tile.dataset.vote === "keep"); c.setAttribute("aria-pressed", tile.dataset.vote === "cut"); };
      k.onclick = () => set("keep"); c.onclick = () => set("cut");
      tile.dataset.font = f.name; tile.dataset.letter = letter;
      grid.appendChild(tile);
    });
  }
  document.getElementById("shuffle").onclick = () => shuffle(false);
  document.getElementById("reveal").onclick = () => {
    const tiles = [...grid.children];
    tiles.forEach(t => { t.querySelector(".name").hidden = false; const s = t.querySelector(".spacer"); if (s) s.remove(); });
    const kept = tiles.filter(t => t.dataset.vote === "keep").map(t => `${t.dataset.letter} = ${t.dataset.font}`);
    const cut = tiles.filter(t => t.dataset.vote === "cut").map(t => `${t.dataset.letter} = ${t.dataset.font}`);
    result.textContent = `Case: ${document.body.classList.contains("caps") ? "ALL CAPS" : "Mixed"}\nKept: ${kept.join("; ") || "none"}\nCut:  ${cut.join("; ") || "none"}`;
  };
  const capsBtn = document.getElementById("caps");
  const setCaps = on => { document.body.classList.toggle("caps", on); capsBtn.setAttribute("aria-pressed", on); };
  capsBtn.onclick = () => setCaps(capsBtn.getAttribute("aria-pressed") !== "true");
  setCaps(true);
  shuffle(true);
</script>
