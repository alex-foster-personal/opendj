# gitleaks configuration: the default ruleset plus proven false-positive allowlists.
# Spec: docs/security/secret-scanning.md. Every allowlist entry says why it is safe.
# Never allowlist a live credential: rotate it in Doppler first, then allowlist as history.

[extend]
useDefault = true

[[allowlists]]
description = """\
  localStorage and cache-key constants (PREFS_STORAGE_KEY = 'opendj.prefs', \
  SKEY_REVISION = '...'): identifiers, not credentials. The first full-history run \
  (Mon 14 Sep 2026) attributed 33 of its 103 generic-api-key hits to this shape. \
  Review by Sun 13 Dec 2026."""
regexTarget = "line"
regexes = [
  '''(?i)(storage_key|prefs_key|skey_revision)["']?\s*[:=]''',
]

[[allowlists]]
description = """\
  Ed25519 test-store key factory in tests/plugins/plugin_kit.py: a field default that generates a fresh in-memory \
  key per test, never a stored credential. Flagged as generic-api-key at its introduction (aa6f7f038, PR #6522). \
  Path AND line, so the same shape anywhere else still reports. Review by Sat 16 Oct 2027."""
condition = "AND"
regexTarget = "line"
paths = ['''tests/plugins/plugin_kit\.py''']
regexes = [
  '''default_factory=Ed25519PrivateKey\.generate\)''',
]

[[allowlists]]
description = """\
  Fixture digest constants (API_CHANGELOG_SHA256 = "<64 hex>"): the sha256 of a \
  committed test fixture, recomputable from the tree, not a credential. Matched only as \
  a NAME_SHA256 assignment of exactly 64 lowercase hex digits. First hit Fri 16 Oct 2026 \
  (PR #6833, (private path)). Scoped to that file with AND, so a \
  real secret named *_SHA256 anywhere else is still reported. Review by Sun 13 Dec 2026."""
condition = "AND"
paths = [
  '''^tests/entitlements/test_polar_source\.py$''',
]
regexTarget = "line"
regexes = [
  '''^\s*[A-Z][A-Z0-9_]*_SHA256\s*=\s*"[0-9a-f]{64}"\s*$''',
]

[[allowlists]]
description = """\
  The ui-prefs localStorage key in the gig-stamp mirror unit test \
  (const KEY = 'mdt.rb.ui-prefs.v1'): an identifier, not a credential. Flagged as \
  generic-api-key in PR #6208 history (7b24d9e34). Path AND the key literal, so the same shape \
  elsewhere still reports. Review by Sun 13 Dec 2026."""
condition = "AND"
regexTarget = "line"
paths = ['''^apps/webui/frontend/tests/unit/gig-stamp-mirror\.test\.mjs$''']
regexes = [
  '''mdt\.rb\.ui-prefs\.v1''',
]
