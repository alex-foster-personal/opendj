# osv-scanner configuration. Spec: docs/security/dependency-scanning.md
#
# Every IgnoredVulns entry needs `reason` AND `ignoreUntil`, at most 90 days out
# (scripts/security/secscan.py osv-lint-config fails the scan otherwise).
# Priorities follow (private path)#patch-priority:
#   P1 -> 30 days    P2 / P3 -> 90 days, counted from the day the entry was written or renewed.
# Baseline measured Mon 14 Sep 2026 on main e869c78b3 with osv-scanner 2.6.0.
# Re-measured Thu 15 Oct 2026 (osv-scanner 2.6.0, every manifest, empty config): 20 of the 29
# P1 entries that expired Wed 14 Oct were already fixed and were removed; rustls and the
# python-multipart floor were fixed in the same change; esbuild was renewed; the entries
# dated 2027-01-13 below are findings that appeared since the baseline.
# An expired entry stops ignoring, so the daily scan reopens its issue by itself.

