# Runner-minute budget per pytest run (TEST-BUDGET round 0, Fri 30 Oct 2026; round 5 made it a
# hard cap the same day).
#
# A PR head or a queue draft may spend this many runner minutes across its five fast-lane
# shards. The selector (scripts/ci_test_selection.py, `--budget ci/test-budget.yml`) prices
# its selection with the model below and trims it to fit the way `cap` says. Dropped modules
# are listed in selection.json so an escape can be attributed to the budget; the nightly full
# runs (ci.yml schedule, full-ci.yml) still run everything, and what escapes is fixed forward.
# A push to main is priced as `pr_head` over every change since main's last green `ci gate`
# (Tue 3 Nov 2026, (private path)). Decision records:
# (private path), (private path).
#
# Why 10 (the maintainer, Fri 30 Oct 2026): "What if we set max 10 total runner minutes as a rule and
# intelligent selection just gets to choose which tests it's allowed to run?" The queue
# simulator (fleet-af ci--whatif, (private path) round 2) says 10 runner-minutes a run
# merges 460 a day on the 14 seats that work with a 57 minute median wait; the test rounds
# before this one left a run at about 53, which the same seats turn into 220 to 290 a day.
# Measured on the last 80 merged PRs (59 selections): the direct importers of a change run
# median 0.1, p90 3.1, max 10.3 ledger-min against the 9.25 ledger-min a 10 runner-min run leaves
# after shard overhead (the max prices at 10.84 runner-min), so the cap cuts at most 6 of the 59
# (the count above 9.25 was not re-measured; p90 bounds it). The whole import reach exceeds it
# on 25 of 59.
version: 2

runner_minutes:
  pr_head: 10
  queue_draft: 10

# `hard`: rank every selected module by distance from the change (0 the changed module itself
# and `CI-Tests:` declarations, 1 its direct importers and test-area data, 2 the whole-tree
# guards, 3 named references, 4 couplings, n for n import hops, a conftest's reach one past
# the conftest), then by recorded seconds ascending, and keep the nearest until the budget is
# spent. `weak-links`: round 0's rule, drop only the weak links listed in `drop_order` and let
# strong links exceed the budget.
cap: hard

# Cost model: shard runner minutes = shards x overhead + ledger minutes x per_ledger_minute.
# First fitted on 258 PR-head runs (R2 0.885) by fleet-af ci--whatif (src/ci_whatif/cost.py) at
# 0.52 and 0.80. Refitted Mon 9 Nov 2026 against REAL minutes, because the old price let the
# cap leak: on the last 70 PR-head ci.yml runs with a hard-cap selection, the pytest fast lane
# jobs' summed started_at..completed_at ran median 7.8, p90 10.45 runner-min, 9 of 70 over 10,
# against a planned median of 8.5 and none planned over 10. Real/planned was median 0.89, p75
# 1.03, p90 1.22. A cap fills every selection to near the budget (ledger 7.2 to 9.2 min), so the
# slope and intercept cannot be separated on these runs (least squares R2 0.14); both old
# coefficients are scaled by the p90 ratio 1.22 instead, so a run planned at the cap lands at or
# under it nine times in ten. Five shards now cost 3.17 of the 10 before a test runs, which
# leaves 6.97 ledger-minutes of tests per run (was 9.25). `shards` stays the runtime --shards
# value the selector checks; CI-DYNSHARD launches fewer, which the fitted overhead absorbs.
# Refit with the same measure once round 6 (two shards) lands. ci/test-budget-main-hourly.yml
# keeps its own model.
model:
  overhead_min_per_shard: 0.634
  min_per_ledger_minute: 0.976
  shards: 5

# Weak-link rules the `weak-links` cap may drop, in the order they are dropped: round 0's rule as
# shipped, where test-area data is a STRONG link and is never dropped. The strings are the reason
# prefixes scripts/ci_test_selection_rules.py records. The hard cap ranks by distance instead and
# reads this list only to stay loadable under either cap.
drop_order:
  - "coupling `"
  - "named reference"
  - "conftest reach `"
