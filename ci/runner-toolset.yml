  #----- Playwright browsers (repo pin: playwright 1.61.1 in pnpm-lock.yaml) ---
  # revisions derived from playwright-core@1.61.1/browsers.json; re-derive on every playwright bump
  # verify checks the payload, not the dir name: Playwright writes INSTALLATION_COMPLETE
  # last, so an interrupted install lacks it; the executable run catches a deleted payload.
  - {name: playwright-chromium, kind: playwright, version: "1228", source: "repo:apps/**/pnpm-lock.yaml (playwright 1.61.1)", provides: [], needed_by: [e2e, periodic], install: "as the runner user in apps/webui/frontend: pnpm exec playwright install --with-deps chromium", verify: "d=~/.cache/ms-playwright/chromium-1228 && test -f \"$d/INSTALLATION_COMPLETE\" && \"$d/chrome-linux64/chrome\" --version >/dev/null && echo \"$d\""}
  - {name: playwright-chromium-headless-shell, kind: playwright, version: "1228", source: "repo:apps/**/pnpm-lock.yaml (playwright 1.61.1)", provides: [], needed_by: [e2e, periodic], install: "installed with playwright-chromium", verify: "d=~/.cache/ms-playwright/chromium_headless_shell-1228 && test -f \"$d/INSTALLATION_COMPLETE\" && \"$d/chrome-headless-shell-linux64/chrome-headless-shell\" --version >/dev/null && echo \"$d\""}
  - {name: playwright-webkit, kind: playwright, version: "2311", source: "repo:apps/**/pnpm-lock.yaml (playwright 1.61.1)", provides: [], needed_by: [e2e], install: "as the runner user in apps/webui/frontend: pnpm exec playwright install --with-deps webkit", verify: "d=~/.cache/ms-playwright/webkit-2311 && test -f \"$d/INSTALLATION_COMPLETE\" && \"$d/minibrowser-wpe/MiniBrowser\" --version </dev/null | grep '^WPE WebKit ' >/dev/null && { \"$d/minibrowser-gtk/MiniBrowser\" --version </dev/null 2>&1 || true; } | grep -E 'WebKitGTK |Failed to open display' >/dev/null && echo \"$d\"", notes: "both MiniBrowsers execute their payload: WPE prints its version headless; GTK needs a display for --version, so reaching 'Failed to open display' proves the binary loaded and ran"}
  - {name: playwright-ffmpeg, kind: playwright, version: "1011", source: "repo:apps/**/pnpm-lock.yaml (playwright 1.61.1)", provides: [], needed_by: [e2e], install: "installed with playwright-chromium", verify: "d=~/.cache/ms-playwright/ffmpeg-1011 && test -f \"$d/INSTALLATION_COMPLETE\" && \"$d/ffmpeg-linux\" -version >/dev/null && echo \"$d\""}

