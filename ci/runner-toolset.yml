# Runner toolset: every system dependency a self-hosted Linux CI runner must
# provide, declared once, with the version CI uses. The model is GitHub's own
# runner-images `toolset.json`: one declarative manifest, applied by
# configuration management, kept complete by a test.
#
# Decision record: docs/decisions/ADR-NEW-runner-toolset-manifest.md
#
# Consumers (read this file, never a copy of it):
#   - tests/scripts/test_runner_toolset_complete.py: scans workflows, the scripts
#     and justfile/Makefile recipes they call, and tests/, and fails when CI uses
#     an executable, apt package or Playwright browser not declared here.
#   - scripts/runner_toolset_verify.py: runs every `verify` on a host as the
#     runner user and prints OK / MISMATCH / MISSING / UNKNOWN.
#   - the Ansible CI-host playbook and the host audit (outside this repo),
#     which install and check exactly this list.
#
# ----- schema (version 1) ---------------------------------------------------
# name       unique id. For kind apt it is the apt package name; for kind
#            playwright it is `playwright-<browser>`.
# kind       apt | binary | toolchain | toolcache | playwright | fixture |
#            python-global
#              apt           an Ubuntu package, installed at the pinned version
#              binary        a single upstream release file (checksum-pinned by
#                            the installer)
#              toolchain     a language toolchain installed for the runner user
#              toolcache     a tool under $AGENT_TOOLSDIRECTORY that a
#                            `setup-*` action resolves instead of downloading
#              playwright    a browser build under the runner user's
#                            ~/.cache/ms-playwright
#              fixture       a data tree CI reads, pinned by content hash
#              python-global a package installed into a toolcache interpreter
# version    the version CI uses. When the repo pins it, the repo value is
#            copied here and `source` names the file; otherwise the reference
#            host's measured value is used and `source` says so.
# match      exact (default): `version` must appear as a whole token in the
#            verify output. prefix: `version` followed by more dotted parts.
#            min: the first dotted number in the output must be >= version.
# observed   (optional) the reference host's value where it differs from, or
#            is looser than, `version`.
# source     `repo:<path>` or `agentbox` (the reference host, measured as the
#            runner user `ghrunner` on Mon 28 Sep 2026).
# install    how to install it, as root unless it says otherwise.
# verify     a bash command run AS THE RUNNER USER with the runner's own job
#            PATH (<runner-dir>/.path). Exit 0 and print the version when
#            present; exit nonzero when absent or broken.
# provides   executables this entry supplies to jobs. The completeness test
#            reads this. For kinds apt, binary and toolchain they must also
#            resolve on the runner PATH; toolcache entries reach PATH only
#            inside a job, after their setup action runs.
# needed_by  job families that fail without it.
# notes      (optional) why, and anything a consumer must know.
#
# ----- deliberately NOT here: host configuration ----------------------------
# Checked by scripts/ci_runner_host_audit.sh (host-config, not tools), per
# docs/ci-actions-cost-review-2026-08-16.md "Self-hosted runner provisioning":
#   item 1  non-root runner account with NOPASSWD sudo
#   item 2  AGENT_TOOLSDIRECTORY in <runner>/.env, owned by the runner user
#   item 4  filesystem mtime tick (informational; fixed test-side)
#   item 5  <runner>/.path readable by the runner user
#   item 8  /tmp sticky (fixed repo-side via $RUNNER_TEMP)
#   item 9  host locks (repo-side, scripts/ci_host_lock.sh)
#   item 10 MUX_FIXTURE_HOST in .env (the fixture CONTENT is pinned below)
#   item 11 AppArmor profile /etc/apparmor.d/bwrap so bwrap can run
#   item 12 apt-daily timers off, APT::Periodic zeroed, needrestart list mode
#   item 13 ACTIONS_RUNNER_HOOK_JOB_COMPLETED hook
# Items 3, 6, 7, 11 (packages), 14 and 15 are entries below.

schema: 1
reference_host: agentbox
runner_user: ghrunner
measured: "Mon 28 Sep 2026"

entries:
