  - name: webui_frontend
    # The Svelte/TypeScript app under apps/webui/. No Python imports it, so its consumers
    # are the pytest inputs that MENTION it: tests that build it, read its files, or run
    # its toolchain name the path in their text. The bare word is deliberately included:
    # computed paths (`WEBUI / "frontend"`) name only that. Measured Tue 22 Sep 2026:
    # 53 test modules name the full path, 18 more only the bare word, across 13 scopes.
    sources: ["apps/webui/frontend/"]
    tests: []
    dependents: ["agentic_testing", "cloud", "cloudsync", "engine_core", "entitlements", "opendj_cli", "perf", "quality", "scripts", "standalone", "stems", "webui"]
    mentions: ["apps/webui/frontend", "frontend"]
  - name: prose
    # Documentation trees. Round 5 measured that prose is NOT harmless here (24 files named
    # by literal path inside tests, six modules that glob for it), so an unclaimed prose path
    # answered FULL and 46 of 60 recent merges carried one. Round 10 claims the trees and
    # finds their consumers the way round 9 found the frontend's: by what tests spell. The
    # mentions are bare directory names, not suffixes: a `.md` mention matched an error
    # message in tests/conftest.py that names CLAUDE.md, which would have carried the scope.
    # Root-level markdown stays unclaimed (FULL) for the same reason. `.planning/REQUIREMENTS.md`
    # is a full trigger above and wins before this scope is consulted.
    sources: ["docs/", "specs/", "app_docs/", ".planning/", "handoffs/", "blog/"]
    tests: []
    dependents: ["agentic_testing", "analysis_key", "cloudsync", "database", "engine_core", "fixtures", "lyrics", "mik", "open_dj", "perf", "quality", "scripts", "shared", "stems", "webui"]
