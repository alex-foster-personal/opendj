# Scopes for SMARTEST-CI's pull request planner (`scripts/ci_plan.py`, round 5).
#
# Scope names are the module names `mergify ci scopes` will use, so queue batching by
# scope needs no renames later. Patterns: a trailing `/` is a path prefix, `*` stops at a
# directory boundary and `**` crosses one.
#
# The planner NARROWS only; anything it cannot place answers FULL, and
# `tests/scripts/test_ci_plan_config.py` fails when a tracked test module is claimed by
# no scope and matched by no `always` entry, which is how a new test directory is stopped
# from becoming a silently unrun one.
version: 1

# A change here means the selection itself cannot be trusted to narrow.
full_triggers:
  - "pyproject.toml"
  - "uv.lock"
  - "justfile"
  - "conftest.py"
  - "**/conftest.py"
  - ".github/workflows/**"
  - "ci/test-scopes.yml"
  - "scripts/ci_plan.py"
  - "tests/fixtures/**"
  - "tests/helpers/**"
  - "apps/shared/**"
  # CI INPUTS that are not source. `ci.yml`'s own path filter RE-INCLUDES
  # `.planning/REQUIREMENTS.md` after excluding `.planning/**`, which is that workflow
  # saying the path is an input rather than documentation: `reqs.json` is generated from it
  # and gated against it, and three commits that drifted the ledger skipped the PR gate and
  # surfaced on main. `reqs.json` and `.mergify.yml` are read by tests the same way.
  # Without these the planner said SKIP_PYTEST for 6 of the last 60 merges that `ci.yml`
  # RAN, and `tests/scripts/test_ci_plan.py` now reads the re-inclusion list from the
  # workflow so a new one cannot be missed here.
  - ".planning/REQUIREMENTS.md"
  - "reqs.json"
  - ".mergify.yml"
  - "ci/**"

# Tests no scope claims. Included in EVERY SCOPED plan rather than dropped from it.
always:
  - "tests/*.py"
  - "tests/analysis_contract/"
  - "tests/controller_probe/"
  - "tests/data/"
  - "tests/docs/"
  - "tests/integration/"
  - "tests/live/"
  - "tests/lyrics_search/"
  - "tests/ops/"

