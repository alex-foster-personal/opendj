  - name: engine_core
    sources: ["apps/engine_core/"]
    tests: ["tests/engine_core/"]
    dependents: ["cloudsync", "database", "entitlements", "opendj_cli", "quality", "scripts", "shared", "stems", "sync_hub", "webui"]
