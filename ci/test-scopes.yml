  - name: webui_frontend
    # The Svelte/TypeScript app under apps/webui/. No Python imports it, so its consumers
    # are the pytest inputs that MENTION it: tests that build it, read its files, or run
    # its toolchain name the path in their text. The bare word is deliberately included:
    # computed paths (`WEBUI / "frontend"`) name only that. Measured Tue 22 Sep 2026:
    # 53 test modules name the full path, 18 more only the bare word, across 13 scopes.
    sources: ["apps/webui/frontend/"]
    tests: []
    mentions: ["apps/webui/frontend", "frontend"]
    dependents: ["agentic_testing", "analysis_beatgrid", "cloud", "cloudsync", "engine_core", "entitlements", "opendj_cli", "perf", "quality", "scripts", "standalone", "stems", "vocals", "webui"]
  - name: requirements
    # Round 17. The requirements ledger and the JSON generated from it. On the 60 merges up
    # to d5eb4022c1 it was the ONLY full trigger for 26, so SCOPED goes 9 -> 35 of 60.
    # `ci.yml` re-includes the ledger, which makes it a
    # CI input: the `contracts` job's reqs drift gate keys off `ci.yml`'s scope job, not this
    # plan, so it still runs. Consumers are found by mention (43 test modules spell one of
    # these names; no conftest or global helper does). Longest prefix: this owns the ledger
    # inside `prose`'s `.planning/`.
    sources: [".planning/REQUIREMENTS.md", "reqs.json"]
    tests: []
    mentions: ["REQUIREMENTS.md", "reqs.json"]
    dependents: ["analysis_key", "perf", "quality", "scripts"]
  - name: prose
    # Documentation trees. Round 5 measured that prose is NOT harmless here (24 files named
    # by literal path inside tests, six modules that glob for it), so an unclaimed prose path
    # answered FULL and 46 of 60 recent merges carried one. Round 10 claims the trees and
    # finds their consumers the way round 9 found the frontend's: by what tests spell. The
    # mentions are bare directory names, not suffixes: a `.md` mention matched an error
    # message in tests/conftest.py that names CLAUDE.md, which would have carried the scope.
    # Root-level markdown stayed unclaimed (FULL) for the same reason. Round 18 claims the
    # community files by exact name, each mentioned by that same name (the PR template by its
    # stem, which can only select more), so no suffix can match an unrelated literal: on the 60 merges up to f495fdb775 this moves 7 from FULL to
    # SCOPED (36 -> 43). Two suites read every tracked file without spelling one
    # (`(private path)`, `(private path)`);
    # this scope already selects `quality` and `scripts`, which is why these files join it rather
    # than a scope of their own. Any other root file stays unclaimed: CLAUDE.md, AGENTS.md, release
    # notes, `coverage-matrix.md`, and README.md, which a beatbench test spells, so claiming it
    # adds beatbench to 18 scopes' dependents to narrow 1 of those merges. `.planning/REQUIREMENTS.md` belongs to the
    # longer `requirements` prefix above.
    sources: ["docs/", "specs/", "app_docs/", ".planning/", "handoffs/", "blog/", "research/",
              "CHANGELOG.md", "PARITY-TODO.md", "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md",
              ".github/ISSUE_TEMPLATE/", ".github/PULL_REQUEST_TEMPLATE.md",
              ".github/FUNDING.yml"]
    tests: []
    mentions: ["docs", "specs", "app_docs", ".planning", "handoffs", "blog", "research",
               "CHANGELOG.md", "PARITY-TODO.md", "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md",
               "ISSUE_TEMPLATE", "PULL_REQUEST_TEMPLATE", "FUNDING.yml"]
    dependents: ["agentic_testing", "analysis_bench", "analysis_key", "cloudsync", "database", "engine_core", "fixtures", "lyrics", "mik", "open_dj", "perf", "quality", "scripts", "shared", "stems", "webui"]
