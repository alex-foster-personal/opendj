# Scopes for SMARTEST-CI's pull request planner (`scripts/ci_plan.py`, round 5).
#
# Scope names double as merge-queue impacted-target names if the queue ever runs in
# parallel mode (it runs single today: nearly every scope lists every other as a
# dependent, so lanes would collapse to one). Patterns: a trailing `/` is a path
# prefix, `*` stops at a directory boundary and `**` crosses one.
#
# The planner NARROWS only; anything it cannot place answers FULL, and
# `tests/scripts/test_ci_plan_config.py` fails when a tracked test module is claimed by
# no scope and matched by no `always` entry, which is how a new test directory is stopped
# from becoming a silently unrun one.
version: 2

# A change here means the selection itself cannot be trusted to narrow.
full_triggers:
  - "pyproject.toml"
  - "uv.lock"
  - "requirements.txt"
  # The CI venv is synced from these locks (scripts/ci_lock.py, issue #4252).
  - "requirements-*.in"
  - "pylock.*.toml"
  - "justfile"
  - "conftest.py"
  - "**/conftest.py"
  - ".github/workflows/**"
  - "ci/test-scopes.yml"
  - "scripts/ci_plan*.py"
  - "tests/fixtures/**"
  - "tests/helpers/**"
  - "apps/shared/**"
  # CI INPUTS that are not source. `ci/trunk-merge-queue.json` and the rest of `ci/` are
  # read by tests the way the planner's own config is. `.planning/REQUIREMENTS.md` and
  # `reqs.json` used to be here too; round 17 moved them to the `requirements` scope below
  # (ADR-NEW-requirements-scope): `ci.yml` still RUNS for them (its re-inclusion list), the
  # reqs drift gate runs on that, and pytest runs the suites that read them.
  - "ci/**"
  # The perf KPI ledger, cards and map, re-included by `ci.yml` for the same reason: suites
  # in perf, webui and lyrics read the real files (PR #4473, Wed 30 Sep 2026).
  - "docs/perf/*.json"

# Scopes a GLOBAL pytest helper (a conftest, or a support module matched by `always`)
# imports or mentions. Such a helper is loaded by suites across the whole tree, so a
# change to a path one of these scopes OWNS runs everything. DERIVED, not hand-written:
# `helper_carried_scopes` in scripts/ci_plan_carry.py recomputes the set and a test holds this
# list to it. Named by scope rather than written as path triggers because ownership is
# longest-prefix (`apps/webui/frontend/` is its own scope inside `apps/webui/`), and a
# prefix trigger on the parent would swallow the child. Round 9.
helper_carried: ["adapters", "analysis", "analysis_beatgrid", "analysis_key", "analysis_waveform", "audit", "cloud", "database", "entitlements", "genre_infer", "loudness", "lyrics", "open_dj", "shared", "smartlists", "stems", "sync", "sync_hub", "vocals"]

# Tests no scope claims. Included in EVERY SCOPED plan rather than dropped from it.
always:
  - "tests/*.py"
  - "tests/analysis_contract/"
  - "tests/controller_probe/"
  - "tests/data/"
  - "tests/docs/"
  - "tests/integration/"
  - "tests/live/"
  - "tests/lyrics_search/"
  - "tests/ops/"
  # Global helper: the root conftest registers tests.support.spawned_servers (DEVOPS-17).
  - "tests/support/"

scopes:
  - name: adapters
    sources: ["apps/adapters/"]
    tests: ["tests/adapters/"]
    dependents: ["agentbox", "agentic_testing", "analysis", "analysis_beatgrid", "analysis_bench", "analysis_key", "analysis_loudness", "analysis_structure", "analysis_waveform", "audit", "autodj", "beatbench", "bench_tryer_calibration", "cloud", "cloudsync", "database", "dedup", "dj_copilot", "engine_core", "entitlements", "fixtures", "genre_infer", "launcher", "loudness", "lyrics", "lyrics_alignment", "mik", "open_dj", "opendj_cli", "pairings", "parity", "perf", "play_analytics", "playlist_sets", "quality", "reconcile", "scripts", "sets", "shared", "smartlists", "spotify", "standalone", "stems", "streaming_transfer", "sync", "sync_hub", "tags", "vocals", "voice", "webui"]
