# Scopes for SMARTEST-CI's pull request planner (`scripts/ci_plan.py`, round 5).
#
# Scope names are the module names `mergify ci scopes` will use, so queue batching by
# scope needs no renames later. Patterns: a trailing `/` is a path prefix, `*` stops at a
# directory boundary and `**` crosses one.
#
# The planner NARROWS only; anything it cannot place answers FULL, and
# `tests/scripts/test_ci_plan_config.py` fails when a tracked test module is claimed by
# no scope and matched by no `always` entry, which is how a new test directory is stopped
# from becoming a silently unrun one.
version: 1

# A change here means the selection itself cannot be trusted to narrow.
full_triggers:
  - "pyproject.toml"
  - "uv.lock"
  # The pytest jobs `uv pip install -r requirements.txt` before collecting, so a dependency
  # added, removed or moved there can change every shard. It matched neither this list nor
  # a scope, so a requirements-only change planned SKIP_PYTEST.
  # `test_every_file_the_pytest_jobs_install_from_is_a_full_trigger` reads ci.yml for the
  # install inputs rather than trusting this list to stay complete.
  - "requirements.txt"
  - "justfile"
  - "conftest.py"
  - "**/conftest.py"
  - ".github/workflows/**"
  - "ci/test-scopes.yml"
  - "scripts/ci_plan.py"
  - "tests/fixtures/**"
  - "tests/helpers/**"
  - "apps/shared/**"
  # CI INPUTS that are not source. `ci.yml`'s own path filter RE-INCLUDES
  # `.planning/REQUIREMENTS.md` after excluding `.planning/**`, which is that workflow
  # saying the path is an input rather than documentation: `reqs.json` is generated from it
  # and gated against it, and three commits that drifted the ledger skipped the PR gate and
  # surfaced on main. `reqs.json` and `.mergify.yml` are read by tests the same way.
  # Without these the planner said SKIP_PYTEST for 6 of the last 60 merges that `ci.yml`
  # RAN, and `tests/scripts/test_ci_plan.py` now reads the re-inclusion list from the
  # workflow so a new one cannot be missed here.
  - ".planning/REQUIREMENTS.md"
  - "reqs.json"
  - ".mergify.yml"
  - "ci/**"

# Tests no scope claims. Included in EVERY SCOPED plan rather than dropped from it.
always:
  - "tests/*.py"
  - "tests/analysis_contract/"
  - "tests/controller_probe/"
  - "tests/data/"
  - "tests/docs/"
  - "tests/integration/"
  - "tests/live/"
  - "tests/lyrics_search/"
  - "tests/ops/"

scopes:
  - name: adapters
    sources: ["apps/adapters/"]
    tests: ["tests/adapters/"]
    dependents: ["analysis_beatgrid", "analysis_waveform", "cloudsync", "engine_core", "lyrics", "open_dj", "opendj_cli", "shared", "webui"]
  - name: agentbox
    sources: ["apps/agentbox/"]
    tests: ["tests/agentbox/"]
  - name: analysis
    sources: ["apps/analysis/"]
    tests: ["tests/analysis/"]
    dependents: ["analysis_beatgrid", "analysis_key", "analysis_loudness", "analysis_waveform", "engine_core", "lyrics", "opendj_cli", "shared", "smartlists", "sync", "webui"]
  - name: analysis_beatgrid
    sources: ["apps/analysis_beatgrid/"]
    tests: ["tests/analysis_beatgrid/"]
    dependents: ["webui"]
  - name: analysis_bench
    sources: ["apps/analysis_bench/"]
    tests: ["tests/analysis_bench/"]
    dependents: ["analysis_beatgrid", "beatbench"]
  - name: analysis_key
    sources: ["apps/analysis_key/"]
    tests: ["tests/analysis_key/"]
    dependents: ["analysis", "analysis_bench", "opendj_cli", "webui"]
  - name: analysis_loudness
    sources: ["apps/analysis_loudness/"]
    tests: ["tests/analysis_loudness/"]
  - name: analysis_waveform
    sources: ["apps/analysis_waveform/"]
    tests: ["tests/analysis_waveform/"]
    dependents: ["analysis_bench", "shared", "webui"]
  - name: audit
    sources: ["apps/audit/"]
    tests: ["tests/audit/"]
    dependents: ["sync", "webui"]
  - name: cloud
    sources: ["apps/cloud/"]
    tests: ["tests/cloud/"]
    dependents: ["cloudsync", "engine_core", "lyrics", "scripts", "shared", "stems", "webui"]
  - name: database
    sources: ["apps/database/"]
    tests: ["tests/database/"]
    dependents: ["cloudsync", "quality", "shared"]
  - name: dedup
    sources: ["apps/dedup/"]
    tests: ["tests/dedup/"]
    dependents: ["engine_core", "webui"]
  - name: dj_copilot
    sources: ["apps/dj_copilot/"]
