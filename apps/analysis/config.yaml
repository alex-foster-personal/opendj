# Phase 6 analysis config.  Tunable without code edits.
# Provenance: 06-01-PLAN §Step 1 + 06-02-PLAN §Step 1.

analyzer:
  max_track_minutes: 30
  sample_rate_hz: 44100
  mono: true

energy:
  # RMS-dBFS upper bounds -> 1..10 energy bins.  Genre-sensitive.
  rms_dbfs_bins:
    - [-40.0, 1]
    - [-35.0, 2]
    - [-30.0, 3]
    - [-26.0, 4]
    - [-22.0, 5]
    - [-18.0, 6]
    - [-14.0, 7]
    - [-10.0, 8]
    - [-6.0, 9]
    - [0.0, 10]

own_beatgrid:
  # Which grid the own beatgrid lane serves (NATIVE-19, JIK, Thu 1 Oct 2026):
  #   const_regions  one constant-tempo line fitted to the track's longest
  #                  steady stretch (NATIVE-18), the line fitter where no
  #                  stretch covers half the track
  #   line           a least-squares line per constant-tempo segment (NATIVE-16)
  #   raw            the model's beat times exactly as it heard them
  # MDT_BEATGRID_GRID_FIT, when set, overrides this for one process.
  grid_fit: const_regions

beatgrid_detector:
  max_downbeat_transient_gap_beats: 2.0
  max_bpm_drift_pct: 0.3
  cue_grid_tolerance_ms: 50

auto_cues:
  max_cues_per_track: 8
  bin_count: 8
  min_cue_gap_ms: 100
  downbeat_snap_tolerance_ms: 60
  label_set:
    - intro
    - drop
    - break
    - outro
