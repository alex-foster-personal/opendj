[package]
name = "djay-drag-spike"
version = "0.0.1"
description = "Phase 17 Plan 01 -- prove tauri-plugin-drag produces a djay Pro acceptable drag"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
