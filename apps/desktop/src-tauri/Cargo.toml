[package]
name = "opendj-desktop"
version = "0.1.0"
description = "Open DJ desktop shell -- Tauri 2 window that boots its bundled engine"
edition = "2021"
# Raised from 1.77 when the shell gained the sidecar. rfd's macOS backend
# resolves through objc2, whose floor is 1.77.2, and cargo's MSRV-aware
# resolver picks dependency versions against THIS number: leaving it at 1.77
# silently selects older, unrelated crate versions rather than failing.
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Escaping the engine origin and the build stamp into the bootstrap init
# script. Already in the tree as a tauri dependency, so this adds no build cost.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
# The engine is spawned into its own process group so app exit can kill the
# whole group; killpg is the syscall that does it. Also already in the tree.
libc = "0.2"
# Native modal for the one failure this shell cannot recover from: the engine
# did not come up. Without it that failure is a blank window, which is the
# exact outcome the bundled-engine work exists to remove. The GTK backend
# lets the Rust test gate compile the shell on its Linux runner.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# The auto-update channel. The plugin is the ONLY component that can apply an
# update: it re-fetches the manifest itself, verifies the minisign signature
# against `plugins.updater.pubkey`, and swaps the .app bundle. The engine's
# /api/v1/update/check is deliberately NOT wired into it -- a check that handed
# the installer a pre-parsed manifest would move signature verification out of
# the component that owns it.
tauri-plugin-updater = "2"
# `check()` reports a newer version; something has to restart into it. Exposed
# through the same capability as the updater so the apply path is one grant,
# not two.
tauri-plugin-process = "2"
# Open OAuth consent URLs in the system browser so Google passkeys/WebAuthn work
# outside the embedded WKWebView.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# CUEOUT-22: the loopback socket the page relays headphone cue PCM over to
# the native CoreAudio output (src/cue_sink.rs). Blocking std I/O on its own
# threads, the same feature set the odj-audio engine already uses, so no async
# runtime and no TLS enter the shell.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# WKWebView deliberately has no Web MIDI API. On macOS the shell bridges the
# same class-compliant three-byte messages through CoreMIDI so the installed
# app has controller parity with the Chrome development loop. Target-gated so
# Linux and Windows shell builds do not gain an unused native MIDI backend.
[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11"

# DEBUG BUILDS ONLY, and deliberately expressed as a cfg-gated DEPENDENCY
# rather than a Cargo feature: this crate serves an unauthenticated W3C
# WebDriver endpoint on 127.0.0.1:4445 that will evaluate arbitrary JavaScript
# in the window. Gating the dependency makes shipping it in the release dmg a
# compile-time impossibility rather than a promise someone has to remember.
#
# It is what makes a real-shell e2e possible on macOS at all. WKWebView exposes
# no WebDriver, so `tauri-driver` supports only Windows and Linux -- Tauri's own
# docs say "macOS has no WKWebView driver tool available". This plugin instead
# drives the WKWebView natively (objc2) and returns results through a
# WKScriptMessageHandler, NOT through Tauri IPC. That distinction is the whole
# reason it works here: this shell navigates to a remote http:// engine origin,
# and Tauri v2 classifies that as Origin::Remote and denies IPC to it unless a
# capability explicitly grants it.
#
# NOTE: `tauri-plugin-wdio` is a DIFFERENT crate that DOES route over IPC and
# would be dead on the engine origin. Not that one.
[target.'cfg(debug_assertions)'.dependencies]
tauri-plugin-wdio-webdriver = "1"

[[bin]]
name = "opendj-desktop"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
