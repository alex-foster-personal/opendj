[package]
name = "opendj-desktop"
version = "0.1.0"
description = "Open DJ desktop shell -- Tauri 2 thin window over the local engine"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Sole use: escaping the engine origin into the bootstrap init script.
# Already in the tree as a tauri dependency, so this adds no build cost.
serde_json = "1"

[[bin]]
name = "opendj-desktop"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
