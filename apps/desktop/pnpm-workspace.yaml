# Mirrors apps/webui/frontend/pnpm-workspace.yaml.
#
# esbuild backs tsx, which runs the TypeScript wdio config and specs.
#
# edgedriver and geckodriver arrive transitively from webdriverio and are
# deliberately DENIED: the embedded provider drives this app's own WKWebView
# natively, so downloading Edge and Firefox drivers would be pure cost for
# browsers this tier never launches.
allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false

# mocha 10 (via @wdio/mocha-framework) still asks for serialize-javascript ^6,
# which carries GHSA RCE and CPU-DoS advisories fixed in 7.0.5. The
# serialize(obj, opts) API mocha's parallel mode calls is unchanged in 7.
overrides:
  serialize-javascript: ^7.0.5
