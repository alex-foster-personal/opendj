# Standalone package (apps/desktop/electron), not part of the webui workspace.
#
# electron's postinstall downloads the Chromium runtime for the host platform.
# electron-builder also pulls electron-winstaller for the Windows installer;
# the macOS dir target never runs it, and an explicit false is the decision
# pnpm 11 requires so install does not exit ERR_PNPM_IGNORED_BUILDS.
# `allowBuilds` is the pnpm 11 spelling the rest of the repo uses;
# `onlyBuiltDependencies` is pnpm 10's.
allowBuilds:
  electron: true
  electron-winstaller: false
onlyBuiltDependencies:
  - electron
