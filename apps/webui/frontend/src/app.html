<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#0d0f12" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The app background, before any stylesheet: app.css arrives with the
		     JavaScript, and until it does the document would paint the browser's
		     default canvas. Same color as app.css's --bg (a unit test holds the
		     two together). A bare element selector on purpose, so every later
		     rule, including overlay mode's transparent html, still wins. -->
		<style>
			html {
				background: #0b0d11;
				color-scheme: dark;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
