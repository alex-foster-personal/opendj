# zizmor configuration. Spec: docs/security/ci-supply-chain.md
#
# Every suppression pins file:line, so a moved or new finding reappears and the
# workflows scan goes red (fails safe). Each carries a reason and a review date.
# Audited Tue 15 Sep 2026 with zizmor 1.30.1. Review by Sun 13 Dec 2026.
rules:
  dangerous-triggers:
    ignore:
      # workflow_run by design. These run the default branch's workflow code, never
      # check out the triggering run's head, and read its metadata only through `env`.
      # ci-cost-guard.yml and stable-evidence.yml left workflow_run for a
      # schedule on Tue 22 Sep 2026; error-sink.yml was folded into the cost
      # guard's pass and removed (RUN-COUNT round 3).
      - trunk-job-verdict.yml:24
      - trunk-red-alarm.yml:16
      # e2e.yml (Wed 4 Nov 2026, ADR-NEW-e2e-after-ci-gate): a pull request's E2E is a
      # workflow_run of CI so it starts only after `ci gate` is green. Unlike the two
      # above it DOES check out the triggering pull request's merge ref, as the old
      # pull_request run did, with the same read-only token (`permissions:` at the top:
      # contents, actions, checks, pull-requests, all read; the verdict job alone holds
      # checks: write, to publish `e2e verdict` on the triggering head, and runs the
      # repository's own scripts/ci_e2e_admission.py), `persist-credentials: false`
      # on every checkout, and the same R2 artifact secrets the pull_request run already
      # had. The repository is private, so no fork head reaches it. Review with the rest.
      - e2e.yml:24
      # e2e-main-starvation.yml (Thu 5 Nov 2026): workflow_run of E2E by design, to wake the
      # main-gate starvation watchdog on PR E2E load. It checks out the default branch only
      # (no `ref:`, `persist-credentials: false`), never reads the triggering run's head, and
      # runs main's own scripts/ci_e2e_main_starvation.py. Same class as the two above.
      - e2e-main-starvation.yml:21
  github-env:
    ignore:
      # The two port-lane steps write MUSIC_DJ_PORT_LANE from RUNNER_NAME alone (the
      # runner's own name, never pull-request content); they predate the workflow_run
      # trigger and this audit only fires alongside a dangerous trigger. Wed 4 Nov 2026.
      # Repinned Fri 6 Nov 2026 (were 922 and 2109, before that 917 and 2102): the same two
      # steps, moved down by lines added above them.
      - e2e.yml:926
      - e2e.yml:2113
  artipacked:
    ignore:
      # These checkouts keep credentials because a later step runs git fetch
      # (periodic-checks preview-drift, on a runner with no other
      # credential for this private repo) or git fetch + push (debt-index-regen).
      # None of these jobs uploads the checkout as an artifact.
      - debt-index-regen.yml:127
      - periodic-checks.yml:1059
