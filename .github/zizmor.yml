# zizmor configuration. Spec: docs/security/ci-supply-chain.md
#
# Every suppression pins file:line, so a moved or new finding reappears and the
# workflows scan goes red (fails safe). Each carries a reason and a review date.
# Audited Tue 15 Sep 2026 with zizmor 1.30.1. Review by Sun 13 Dec 2026.
rules:
  dangerous-triggers:
    ignore:
      # workflow_run by design. These run the default branch's workflow code, never
      # check out the triggering run's head, and read its metadata only through env:.
      # ci-cost-guard.yml and stable-evidence.yml left workflow_run for a
      # schedule on Tue 22 Sep 2026; error-sink.yml was folded into the cost
      # guard's pass and removed (RUN-COUNT round 3).
      - trunk-job-verdict.yml:24
      - trunk-red-alarm.yml:16
  artipacked:
    ignore:
      # These checkouts keep credentials because a later step runs git fetch
      # (periodic-checks preview-drift, on a GitHub-hosted runner with no other
      # credential for this private repo) or git fetch + push (debt-index-regen).
      # None of these jobs uploads the checkout as an artifact.
      - debt-index-regen.yml:91
      - periodic-checks.yml:943
