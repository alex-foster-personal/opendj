# Donations are LINK-OUT ONLY (specs/saas-spec.md FUND-01). This file is the
# entire donations implementation: GitHub renders a Sponsor button from it and
# nothing in this repo has an OAuth flow, a webhook receiver or a backend for
# money. There is deliberately no code behind this.
#
# Ko-fi: low friction, consumer audience, 0% on tips.
# GitHub Sponsors: 0% fees, for the developer-literate subset.
#
# Patreon is REJECTED, not merely absent (FUND-02): worst all-in fees of any
# option surveyed, the heaviest integration (OAuth plus a hosted webhook
# receiver this project does not have), and officially no developer support
# since 2020. Do not add it here.
#
# Supporter recognition, if it is ever offered, MUST stay passive and public --
# a name on a page, never a product benefit (FUND-03). Money that grants
# features goes through a paid plan, where the tax treatment is already right.
#
# ko_fi is COMMENTED OUT until the handle is actually claimed, and that is a
# safety decision rather than tidiness. ko-fi.com answers 403 to any
# programmatic probe -- an existing handle and a nonexistent one are
# indistinguishable from here -- so shipping `ko_fi: opendj` unverified risks
# pointing a live Sponsor button at a STRANGER'S tip jar and sending them
# money meant for this project. Claim ko-fi.com/opendj, then uncomment.
#
# github: below needs Sponsors enabled on the account to render at all. It
# carries no such risk (the handle is unambiguously ours and the failure mode
# is a button that does not appear), so it ships enabled.
#
# ko_fi: opendj
github: [maintainer]
