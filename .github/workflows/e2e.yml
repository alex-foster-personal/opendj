name: E2E

# Makes the third clause of the per-PR merge gate real.
#
# .planning/FANOUT-CONVENTIONS.md has always stated the gate as "svelte-check 0
# errors, scoped pytest green, e2e smoke if user-visible". The first two are
# enforced by ci.yml. The third never was: before this file there was no
# Playwright job and no e2e step in any of the eight workflows, so every
# "e2e smoke passed" in a PR body was an agent running Playwright by hand on a
# developer machine at whatever load that machine happened to be under, with
# the result recorded only in prose. Issue #624 has the full account.
#
# SEPARATE FILE, not a job inside ci.yml, for three reasons:
#   1. E2E needs a full PYTHON environment, not just node: 6 of the 9 Playwright
#      configs shell out to `uv run`, and the webkit gate boots the real engine.
#      ci.yml's frontend job is node-only, and a node-only runner fails these in
#      a way that reads as a test failure rather than a missing interpreter.
#   2. A distinct check name is what a branch protection rule can require.
#   3. E2E can be sized, scheduled and reasoned about without perturbing the
#      fast lane's latency budget.
#
# It is registered in ci-cost-guard.yml's workflow list so its runs get priced
# like every other workflow.

on:
  pull_request:
    branches: [main]
    # EVERY pull request to main triggers this workflow (issue #4168); the
    # docs-only skip moved inside the run. The `scope` job evaluates
    # E2E_PATHS_IGNORE in scripts/ci_pr_scope.py against the merge commit and
    # the gate runs only when it says in scope. A trigger-level filter created
    # no run at all for a docs-only change, so a merge queue waiting on a named
    # check (Trunk, draft-PR mode) waited out its timeout. The list: docs, plus
    # workflow YAML and pytest-only trees that cannot change Playwright behavior.
  push:
    branches: [main]
    # A push run needs no aggregator to exist, so push keeps its trigger-level
    # filter. GitHub reads trigger filters only from this file, so this is a
    # literal copy of E2E_PATHS_IGNORE in scripts/ci_pr_scope.py, pinned equal
    # to it by tests/scripts/test_ci_required_gate_wiring.py.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "handoffs/**"
      - ".planning/**"
      - "specs/**"
      - "blog/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/e2e.yml"
      - "tests/perf/**"
      - "tests/docs/**"
  schedule:
    # 04:17 UTC daily, for the extended tier. Off-peak and deliberately not on
    # the hour, where GitHub's scheduler queues are busiest.
    - cron: "17 4 * * *"
  workflow_dispatch:

# Concurrency uses the SAME shape as ci.yml, deliberately, so this repo has one
# house pattern rather than a third variant to reason about.
#
# Push runs get a per-commit group, so a merge can never cancel the previous
# merge's run. Non-push runs keep one group per ref, so a new commit on a PR
# still supersedes its predecessor, which is the behavior worth keeping.
#
# This is NOT the conditional `cancel-in-progress: github.event_name != 'push'`
# that PR #631 tried first. That shape was measured and did not work: three
# post-fix trunk runs (589d2a5d, 481c29ba, a1a78c47) were still cancelled 1-2s
# after the next push run was created, each killer carrying the guard. PR #646
# replaced it with the per-SHA group below, which removes the PRECONDITION for
# cancelling instead of making the cancellation conditional, and therefore does
# not depend on the mechanism that was in dispute.
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read
  # Cross-workflow artifact download from ci.yml (issue #1513).
  actions: read

env:
  # apps.shared.library_mode refuses to import on non-darwin platforms without
  # this. ci.yml sets the same value for its openapi dump. 'local' is
  # schema-and-fixture only; no real library is reachable from a runner.
  MDT_LIBRARY_MODE: local

  # Keep .pyc out of the workspace: root-owned bytecode under .venv is what
  # made actions/checkout fail with EACCES and skip every test step (#1338).
  # This covers interpreters these workflows start directly. It does NOT reach
  # anything run through `sudo`, which resets the environment with no env_keep
  # for this name, so the pre-checkout hygiene step below is the repair path
  # for a root-run interpreter.
  PYTHONDONTWRITEBYTECODE: "1"
  # Every Python this workflow starts, including the engine the Playwright
  # webServer boots and the `apps.analysis.run` it shells out to during the
  # ingest-refresh spec, dumps the Python stack of a fatal signal to stderr.
  # Since Tue 8 Sep 2026 19:53 UTC agentbox's kernel log shows
  # `python3: segfault at 0 ip 0` about once a minute under this workflow's
  # jobs, attributed to that subprocess, and the daemon reports only
  # "apps.analysis.run exited -11" (trunk red 8a17e7ade, run 34335714597).
  # The kernel names the binary; faulthandler names the frame.
  PYTHONFAULTHANDLER: "1"

jobs:
  # ---------------------------------------------------------------------------
  # SCOPE (issue #4168). Every pull request triggers this workflow; this job
  # decides whether its change set is in scope (E2E_PATHS_IGNORE in
  # scripts/ci_pr_scope.py) and the gate runs only on `in_scope == 'true'`, so a
  # docs-only change occupies no e2e runner and `e2e verdict` still reports.
  # ---------------------------------------------------------------------------
  scope:
    name: e2e scope (docs-only skip decision)
    # Seconds of work on the light pool, never the pytest or e2e label: the job
    # runs `git diff` on the merge commit and one stdlib script. Every event runs
    # it; only a pull_request can come out of scope.
    # A Trunk queue draft (trunk-merge/* head, author trunk-io[bot], same-repo
    # head) prefers the opt-in CI_RUNS_ON_MERGE_QUEUE pool on every job on its
    # path to a required status, the e2e gate excepted; unset, the chain is
    # unchanged (ADR-NEW-trunk-queue-drafts-use-a-reserved-runner-pool).
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON_MERGE_QUEUE || vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      in_scope: ${{ steps.decide.outputs.in_scope }}
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # 0, not 2: every persistent-runner checkout fetches full history
          # (docs/decisions/ADR-NEW-uniform-checkout-depth-on-persistent-runners.md),
          # which is a superset of the depth-2 this job used to need to diff
          # the pull_request test-merge commit against its first (base) parent.
          fetch-depth: 0
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout. Runs before the job's first python3;
      # tests/scripts/test_ci_workflow_stale_install_coverage.py enforces it.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      - name: Decide whether this change set is in e2e.yml's scope
        id: decide
        run: python3 -m scripts.ci_required_gate scope --workflow e2e.yml

  # ---------------------------------------------------------------------------
  # TIER 1, BLOCKING on every PR and every push to main.
  #
  # Everything in this job is hermetic: it needs the repo, a production build,
  # and audio this repo GENERATES. No rekordbox library, no real music, no
  # network. That is the property that makes it safe to block on, and it is why
  # the specs below are the ones chosen rather than the ones with the most
  # coverage.
  # ---------------------------------------------------------------------------
  gate:
    name: e2e gate (webkit artifact + hermetic chromium)
    needs: scope
    if: needs.scope.outputs.in_scope == 'true'
    # Runner is a repo-variable switch (see ci.yml's `test` job for the full
    # rationale). vars.CI_RUNS_ON_E2E absent -> hosted ubuntu-latest; set to
    # '["self-hosted","linux","e2e"]' it targets agentbox specifically, the
    # only self-hosted runner carrying the `e2e` label and the apt access
    # `playwright install --with-deps` needs.
    #
    # That access is now sudo rather than root: agentbox's runners were moved
    # off root on Thu 3 Sep 2026 because the pytest lane's permission tests
    # cannot be arranged as a user who bypasses permissions (see "Self-hosted
    # runner provisioning" in docs/ci-actions-cost-review-2026-08-16.md).
    # --with-deps below stays unconditional because it is safe either way:
    # Playwright runs its apt step directly when uid 0 and through `sudo`
    # otherwise, and the runner user has NOPASSWD sudo.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_E2E || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      # One native thread per process. This job's "Root Playwright suite" step
      # runs the webui refresh job, which shells out to
      # `apps.analysis.run --backend librosa --workers 2` (see
      # apps/webui/server/routes/ingest_analysis_argv.py). Without a cap,
      # OpenBLAS and numba fan every call out across every thread the host
      # has, exactly the failure mode ci.yml's `test` job already documents
      # (tests/scripts/test_ci_thread_caps.py) and was never carried over
      # here: this job shares the same self-hosted agentbox host with up to
      # ten other concurrent runner jobs. Under that contention a
      # ProcessPoolExecutor worker fork can land mid-BLAS-thread-activity and
      # die outright - concurrent.futures.process.BrokenProcessPool,
      # tests/e2e/ingest-refresh.spec.ts:56 - intermittently, worse the busier
      # the host is, and with no OOM-kill line because nothing here is short
      # on memory. Seen on PR #1092, PR #1306 (run 33981951903 attempt 2) and
      # elsewhere Fri-Sat 4-5 Sep 2026. One thread each removes the
      # oversubscription rather than papering over a dead worker.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"

    steps:
      # Pre-checkout hygiene for the persistent self-hosted workspace (#1338).
      # checkout cleans the tree as the runner user, so one root-owned file in
      # it fails the unlink with EACCES, dies at step 2, and skips every test
      # step after it -- a red carrying no test evidence. The runner user has
      # NOPASSWD sudo (e2e.yml documents it). This runs as root, so it is
      # bounded three ways, and each bound is load-bearing. A mount point
      # beneath the workspace fails the step outright: `-xdev` alone is not
      # enough, because a bind mount from elsewhere on the SAME filesystem
      # keeps the same st_dev and is traversed regardless (measured on the
      # runner host, Fri 5 Sep 2026). `-xdev` then stops a cross-filesystem
      # mount appearing after that check. The workspace path is escaped the way
      # mountinfo escapes field 5 and handed to awk through ENVIRON, NOT `-v`:
      # `-v` processes escape sequences, so it decodes \040 straight back to a
      # space and undoes the escaping it was given. `chown -h` acts on a symlink
      # itself rather than its referent, so a link pointing out of the tree cannot
      # drag the repair outside. One `find` expression drives the count and
      # the repair, so the number reported is the set acted on.
      #
      # The counts come from `find`, not from `chown -c`: GNU coreutils prints
      # that report on stdout but uutils prints it on stderr, so a piped count
      # reads 0 forever on a uutils host and the log would claim the step found
      # nothing when it had just repaired thousands of files. `remaining` is
      # the proof the repair landed, and a non-zero one fails here rather than
      # letting checkout die at the next step with a worse message.
      #
      # It also NAMES the offending entries -- owner, UTC mtime, path -- and
      # names them BEFORE the chown, because the repair destroys the very
      # evidence that identifies the writer. #1338 could say 957 to 1130 files
      # per runner but not which process wrote them, and cost a forensic
      # session for want of exactly this. The listing goes to a file rather
      # than into `head` down a pipe: under `pipefail` a SIGPIPE'd `find`
      # fails the step. TZ reaches `find` through `env` because sudo here is
      # `env_reset` with no SETENV, so `sudo TZ=UTC find` is refused outright,
      # and an mtime printed in local time under a `Z` suffix is a lie.
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # SHA-pinned to the v4 tag commit (resolved 2026-04-17), matching ci.yml.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history on every persistent runner: a shallow fetch here makes the next job --unshallow (test_ci_workspace_reuse.py).
          fetch-depth: 0
          persist-credentials: false
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Derive the worktree-port lane from the runner identity
        # This job is the only one that claims a dynamic pair from the pool
        # (apps/webui/port_config.py, via `pnpm test:e2e` below): each
        # self-hosted runner is a separate clone with its own registry and
        # lock (issue #1301), so two runners on one host both start
        # allocating from slot 0 of the SAME pool and can select the same
        # pair. MUSIC_DJ_PORT_LANE shifts one runner's whole pool window
        # clear of every other lane's.
        #
        # RUNNER_NAME is the self-hosted agent's registered name (`agentName`
        # in its `.runner` file), e.g. "agentbox-2", or "nucbox-wsl" with no
        # trailing number for a host's first-registered runner. Lane 0 is
        # left unclaimed for local dev (unset var, e.g. `just webui-ports` on
        # a developer machine that is also a runner host), so an unsuffixed
        # name gets lane 1 and a suffixed name gets its numeric index plus 1.
        # Thus an unsuffixed runner never collides with local dev or suffix 1.
        run: |
          set -euo pipefail
          runner_name="${RUNNER_NAME:-}"
          if [[ -z "$runner_name" ]]; then
            echo "::error::RUNNER_NAME is unset; cannot derive a safe port lane" >&2
            exit 1
          fi
          if [[ "$runner_name" =~ -([0-9]+)$ ]]; then
            lane=$((BASH_REMATCH[1] + 1))
          else
            lane=1
          fi
          echo "MUSIC_DJ_PORT_LANE=${lane}" >> "$GITHUB_ENV"
          echo "[OK] runner ${runner_name} -> MUSIC_DJ_PORT_LANE=${lane}"

      - name: Assert MUSIC_DJ_PORT_LANE is set
        run: |
          set -euo pipefail
          lane="${MUSIC_DJ_PORT_LANE:-}"
          [[ "$lane" =~ ^[0-9]+$ ]] || {
            echo "::error::MUSIC_DJ_PORT_LANE is unset or invalid after lane derivation" >&2
            exit 1
          }
          echo "[OK] MUSIC_DJ_PORT_LANE=${lane}"

      - name: Reclaim stale E2E servers before port claim
        run: bash scripts/ci_e2e_port_hygiene.sh

      - name: Enable pinned pnpm
        # Order matters: corepack before setup-node, so a `pnpm` shim exists on
        # PATH when setup-node's `cache: pnpm` resolves the store. Same
        # ordering constraint ci.yml documents.
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          # pnpm on GitHub-hosted runners only. A self-hosted runner's store
          # already persists at the runner user's `pnpm store path` and is
          # SHARED by every runner service on the host; setup-node restores its
          # cache tarball with absolute paths straight into that store,
          # index.db included, under jobs that are reading it (trunk e14bd2f0a3,
          # Sat 5 Sep 2026: `[ERR_PNPM_ERR_SQLITE_ERROR] disk I/O error` on a
          # healthy disk). tests/scripts/test_ci_pnpm_cache_self_hosted.py.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: apps/webui/frontend/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Same 3.11 target ci.yml pins, and for the same reason.
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          # Hosted-only, like the pnpm cache (tests/scripts/test_ci_pnpm_cache_self_hosted.py).
          # On a self-hosted host the persistent ~/.cache/uv IS the cache, and with the
          # action's cache on, its post step runs `uv cache prune --ci` against that
          # directory while fifteen sibling jobs hold its lock: trunk E2E red on
          # 227fb7c86 (Wed 9 Sep 2026, "Timeout (300s) when waiting for lock on
          # /home/ghrunner/.cache/uv"), and a sibling's prune is what tore an
          # archive entry out from under `uv sync` on 34275041870 the day before.
          enable-cache: ${{ runner.environment == 'github-hosted' }}

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: System deps for pyrekordbox (SQLCipher)
        # The engine imports pyrekordbox, which links libsqlcipher at runtime.
        # Ubuntu noble ships the runtime .so inside libsqlcipher-dev.
        run: |
          scripts/ci_apt_present.sh libsqlcipher-dev || scripts/ci_host_lock.sh packages sudo env -C / sh -c 'apt-get update && apt-get install -y libsqlcipher-dev'

      - name: Install Python deps into the project venv
        # `uv sync`, NOT `uv run --no-sync`. The webkit config boots the engine
        # with `uv run --no-sync`, which requires an already-populated .venv;
        # against an unpopulated one it resolves somewhere else entirely and
        # reports success while binding the wrong thing. Populating the venv
        # here is what makes that command mean what it says.
        run: uv sync --extra tags --extra analysis

      - name: Prove the venv is populated and is this checkout's
        # Fail fast and loudly rather than letting the engine boot fail 180s
        # later inside a Playwright webServer timeout, where the real cause is
        # invisible.
        run: |
          set -euo pipefail
          test -x .venv/bin/python || { echo "[ERROR] .venv/bin/python missing after uv sync"; exit 1; }
          echo "[OK] venv interpreter: $(.venv/bin/python -c 'import sys; print(sys.executable)')"
          .venv/bin/python -c "import apps.engine_core" \
            || { echo "[ERROR] engine package not importable from the project venv"; exit 1; }
          echo "[OK] apps.engine_core imports"

      - name: Keep the numba JIT cache across jobs on this runner
        # librosa's numba artifacts live beside its source by default, and this
        # job recreated `.venv` every run, so every job paid a 25-45 s cold
        # compile in the warm-up step (measured Tue 8 Sep 2026: 41-46 s on
        # every shard, 0.3 s once the cache survives venv recreation). One
        # directory per RUNNER: a runner runs one job at a time, so the
        # warm-up below is the only cold writer it ever sees, and the stamp
        # next to it is what lets the warm-up prove the cache is still what
        # that serial writer left. Hosted runners get a fresh HOME per job
        # and simply compile once, as before.
        # Keyed by the toolchain too (python, numba, llvmlite, librosa, numpy
        # versions, printed by the module that owns the cache): an upgrade
        # lands in an empty directory and compiles once under the lock,
        # instead of numba rejecting stale artifacts at first use in whatever
        # processes got there first, concurrently and cold.
        run: |
          identity="$(.venv/bin/python -m apps.analysis.jit_warmup --identity)"
          dir="$HOME/.cache/mdt-numba/${RUNNER_NAME:?RUNNER_NAME is unset}/${identity:?identity is empty}"
          mkdir -p "$dir/cache" "$dir/lock"
          chmod 700 "$HOME/.cache/mdt-numba" "$dir" "$dir/lock"
          { echo "NUMBA_CACHE_DIR=$dir/cache"; echo "MDT_NUMBA_WARMUP_DIR=$dir/lock"; } >> "$GITHUB_ENV"

      - name: Purge and warm the numba JIT cache (#1316)
        # The crash this job kept dying on was never fork, the pool, or thread
        # oversubscription. librosa marks several hot paths
        # `@numba.guvectorize(..., cache=True)`, which compile on first call
        # and write `.nbi`/`.nbc` artifacts beside the librosa source. Two
        # `apps.analysis.run` processes meeting a COLD cache interleave those
        # writes, the index and the object file stop agreeing, and from then
        # on every process that LOADS the cache jumps into a partially-mapped
        # object and dies at a NULL instruction pointer - including runs with
        # `--workers 1` and no child process at all. Measured on agentbox: 12
        # concurrent cold-cache processes poisoned the cache, 5 later
        # SEQUENTIAL runs against it were 5/5 dead, and the same cache warmed
        # once serially first survived 28/28 concurrent runs.
        #
        # Two halves, both load-bearing and in this order:
        #
        # PURGE IF STALE, because the corruption OUTLIVES the job. The workspace and
        # its `.venv` persist between runs on this self-hosted runner, so one
        # poisoned cache killed every later e2e job on that runner until the
        # artifacts were deleted by hand (five runner workspaces on Sat 5 Sep
        # 2026). Warming cannot repair it: loading the corrupt entry is what
        # segfaults, so no in-process code runs after it. Only deletion does.
        #
        # `--purge-if-stale` purges exactly when the stamp does not vouch for the
        # cache on disk: the cache is per runner and persistent (step above), a
        # runner runs one job at a time, so a stamped cache is one this serial
        # warm-up left and is kept (0.3 s); anything else is purged first.
        #
        # WARM, because a purge alone leaves the cache cold, which is the
        # state that corrupts. The engine's refresh route spawns
        # `apps.analysis.run` per chunk, so a cold cache plus a real drain is
        # exactly the race. Warming serially here means every process this
        # job starts finds a complete cache and only ever reads it.
        #
        # `apps.analysis.jit_warmup` is the same code path `apps.analysis.run`
        # calls internally, invoked as a module rather than reimplemented
        # inline, so this step cannot drift from the warm-up that ships. It
        # exits non-zero if it warms zero artifacts onto disk, which is the
        # positive check: a warm-up step that silently warmed nothing is
        # exactly the green-but-useless signal this issue hid behind.
        # Pinned by tests/scripts/test_ci_jit_warmup.py.
        run: .venv/bin/python -m apps.analysis.jit_warmup --backend librosa --purge-if-stale

      - name: Runner preflight - node tools and disk
        # Fail here, naming the runner, rather than mid-install with a cryptic
        # pnpm error on a missing tool or a full disk. scripts/ci_node_preflight.sh
        # (it deliberately does not run `pnpm store status`; see the script).
        run: scripts/ci_node_preflight.sh apps/webui/frontend

      - name: Install frontend dependencies
        working-directory: apps/webui/frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version for the browser cache key
        id: pw
        working-directory: apps/webui/frontend
        # Key the cache on the exact version. A browser cache reused across a
        # Playwright upgrade is how you get a driver/browser mismatch that
        # looks like a product failure.
        run: echo "version=$(pnpm exec playwright --version | tr -d '\n' | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        # Hosted-only: this uploads to GitHub's cache storage, which still
        # costs and buys nothing on agentbox, whose ~/.cache/ms-playwright
        # already persists locally between runs. Empty var means hosted.
        if: vars.CI_RUNS_ON_E2E == ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-webkit-chromium

      - name: Install Playwright browsers
        working-directory: apps/webui/frontend
        # webkit AND chromium, deliberately, and no firefox.
        #
        # webkit is the point of this job. The packaged desktop app is a
        # WKWebView and Playwright's webkit shares that engine core, so this is
        # the only gate in the repo that can see the class of fault where the
        # installed app is broken while every chromium/dev-server gate is
        # green. Two such faults have already shipped (blob: AudioWorklet
        # modules, esbuild-lowered class fields in a self-stringifying
        # worklet), and three separate agents flagged webkit as an unverified
        # blind spot in a single evening.
        #
        # chromium carries the hermetic suites below, which are chromium
        # configured. firefox is installed by neither: nothing in this product
        # ships or targets it, so its browser download and system deps would be
        # runner minutes spent on a surface with no users.
        #
        # --with-deps even on a cache hit: the apt libraries live outside
        # ~/.cache/ms-playwright and are not restored by it.
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" packages \
            pnpm exec playwright install --with-deps webkit chromium

      - name: Virtual audio sink (PulseAudio null sink)
        # WITHOUT THIS THE WEBKIT GATE IS FLAKY, and flaky is worse than absent:
        # a gate that fails at random gets muted, which is how the repo ended up
        # with unenforced gates in the first place.
        #
        # Measured, not assumed. `double-click loads deck 1 and deck 2 with a
        # real worklet` PASSED on run 33451307165 and FAILED on run
        # 33453793079 at the same commit range with
        # "AudioContext did not enter running state; current state is
        # interrupted". A headless Linux runner has no audio device at all, so
        # WebKit's GStreamer backend can leave the context in `interrupted`.
        # Whether it does is a race, which is exactly why one run passed.
        #
        # A null sink gives the backend a real device to open that discards
        # samples. It does NOT fake the audio graph: decode, the worklet and
        # the analyser all still run for real, which is what the suite measures.
        run: |
          scripts/ci_apt_present.sh pulseaudio || scripts/ci_host_lock.sh packages sudo env -C / apt-get install -y pulseaudio
          # Setup and restore both run under the pulse-sink host lock: the server
          # is shared by every job of this user on the host, and the ownership
          # check plus the mutation must be one critical section. See the script.
          scripts/ci_host_lock.sh pulse-sink scripts/ci_pulse_sink.sh setup

      - name: Acquire production frontend artifact from CI
        # The webkit gate refuses to load without a production build and says
        # so at config time. Poll CI for the stamped artifact; never rebuild
        # locally (issue #1513).
        id: frontend-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci_frontend_build_acquire_from_ci.sh "${{ github.sha }}"

      # -- TIER 1a: the WebKit artifact gate ----------------------------------
      - name: WebKit artifact gate (production build, named subset)
        if: ${{ steps.frontend-artifact.outcome == 'success' && !cancelled() }}
        working-directory: apps/webui/frontend
        # Engine-served production build, webkit, one worker, zero retries.
        # Retries stay at zero because a flaky worklet IS the defect under
        # test, so a retry would launder the signal. The library is a
        # throwaway fixture the repo generates from stdlib `wave` and ingests
        # through the real folder adapter, inside a sandboxed HOME.
        #
        # NAMED QUARANTINE, not a silent skip. This runs only setup-entry-points
        # (--grep "setup entry points") and none of webkit-deckload.
        #
        # WHY THE DECK-LOAD TESTS ARE NOT HERE, measured rather than assumed.
        # Across 5 runs on ubuntu-latest AFTER the audio sink landed, 2 had a
        # deck test fail, for two DIFFERENT reasons:
        #
        #   - `double-click loads deck 1 and deck 2 with a real worklet`:
        #     "AudioContext did not enter running state; current state is
        #     interrupted" (run 33457566974 attempt 3). The PulseAudio null
        #     sink reduced this but did not eliminate it. Tracked in #680.
        #   - `the wave row exposes the decoded duration of the loaded audio`:
        #     "deck 1 did not land a seek to 0ms: position 12255ms of 60000ms"
        #     (run 33456706346). Tracked in #637 with the 2.25x playhead rate,
        #     which looks like the same projection defect seen twice.
        #
        #   Attempts 1, 2 and 3 of ONE re-run of ONE commit went pass, pass,
        #   fail. That is the definition of a gate that waves rather than
        #   bites, and a gate that fails at random gets muted, which is how
        #   this repo ended up with an unenforced merge-gate clause at all.
        #   Shipping a flaky blocking gate to fix an absent one is a bad trade.
        #
        # WHAT THIS STILL BUYS, which is not nothing and is still WEBKIT:
        # setup-entry-points has passed 10/10 on all 5 runs. It drives the
        # PRODUCTION build served by the ENGINE under webkit, so it gates the
        # artifact boot path, the settings accelerator surviving the production
        # transform, and the build identity chip. It does NOT gate the audio
        # worklet path. That limit is real and is stated in the PR body rather
        # than papered over.
        #
        # The nightly extended job runs the whole config (no grep) with a
        # presence check so serial skip cannot report as a complete run.
        # Quarantined tests may still be red; that is the point. Once #637 and
        # #680 are fixed the end state is the whole suite blocking and this
        # --grep deleted.
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" webkit-deckload \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 8690 -- \
            pnpm exec playwright test \
            --config tests/e2e/playwright.webkit-deckload.config.ts \
            --project webkit --grep "setup entry points" \
            --output test-results/setup-entry-points

      # -- TIER 1a-bis: cross-browser deck-load smoke (#770) -------------------
      - name: Debugger for the deck-load hang capture (#4281)
        if: ${{ steps.frontend-artifact.outcome == 'success' && !cancelled() }}
        # gdb lets scripts/ci_hang_capture.py (wrapped round the smoke below) take
        # a native backtrace of a hung WebKitWebProcess. Non-fatal: without it the
        # capture still records per-thread BUSY/BLOCKED and says gdb is UNKNOWN.
        continue-on-error: true
        run: |
          scripts/ci_apt_present.sh gdb || scripts/ci_host_lock.sh packages sudo env -C / apt-get install -y gdb

      - name: Deck-load smoke (chromium + webkit, production build)
        working-directory: apps/webui/frontend
        if: ${{ steps.frontend-artifact.outcome == 'success' && !cancelled() }}
        # Separate step, same engine-served artifact and fixture library as
        # the step above (webServer boots fresh per `playwright test`
        # invocation, so this pays one more ~1s engine boot -- everything
        # else, the browser downloads, apt deps, pnpm build, the audio sink,
        # was already paid for by the step above).
        #
        # deckload-smoke.spec.ts asserts ONLY the load-SETTLE signal
        # (`stable_id` landing, held across polls) and never calls
        # `_resumeContext` / waits on `audible` -- that is the play path, not
        # the load path, and is where the #637/#680 flakiness quarantined
        # above actually lives (audio-engine.svelte.ts's AudioContext
        # running-state check). It is therefore NOT the same test as the
        # quarantined ones above with a lighter assertion; it exercises a
        # different, earlier code path that does not touch AudioContext at
        # all. Measured rather than assumed: 6 consecutive local runs on this
        # repo's WSL/ubuntu-family dev box, 24/24 sub-tests green, ~11s per
        # run, before this was wired in here (issue #770 report has the
        # detail). If it EVER flakes in CI, quarantine it the same way as the
        # tests above and say so in the PR/issue rather than muting silently.
        #
        # --project twice, explicitly, rather than relying on the chromium
        # project's own testMatch restriction: this is the parity half of
        # #770 ("both chromium and webkit"), and an explicit list survives
        # config drift the way an implicit default would not.
        #
        # --output, here and on every playwright invocation below: all of
        # these configs default to the same test-results/ dir, and Playwright
        # clears its outputDir at the start of every run. Without a distinct
        # dir per step, a later GREEN step deletes an earlier FAILED step's
        # trace/screenshot before "Upload failure artifacts" (which only runs
        # once, at the end of the job) can read them -- so a cross-browser
        # failure here would ship with no diagnosable artifact (flagged on
        # review, PR #860).
        #
        # HANG CAPTURE (#4281): the webkit half hangs to the 120s test timeout on
        # agentbox, and the traces cannot say whether the WebProcess is stuck in a
        # native GStreamer/PulseAudio wait or spinning. scripts/ci_hang_capture.py
        # answers that DURING the hang (Playwright closes the browser at timeout,
        # so a later failure step finds nothing): if the run is still going at 60s
        # and 95s (a green run takes about 20s) it records each WebKitWebProcess
        # thread as BUSY or BLOCKED with its wait channel, plus a gdb backtrace,
        # into test-results/hang-capture/, which "Upload failure artifacts" ships.
        # It passes playwright's exit code through untouched and never kills
        # anything. It sits inside the host lock so lock waits do not count.
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" webkit-deckload \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 8690 -- \
            python3 "$GITHUB_WORKSPACE/scripts/ci_hang_capture.py" \
            --out test-results/hang-capture --at 60,95 -- \
            pnpm exec playwright test \
            --config tests/e2e/playwright.webkit-deckload.config.ts \
            --project webkit --project chromium --grep "deck-load smoke" \
            --output test-results/deckload-smoke

      # -- TIER 1b: hermetic chromium suites ----------------------------------
      # These run as steps in THIS job rather than a job of their own on
      # purpose: a separate job would re-pay checkout, node, pnpm install,
      # python, uv sync and the browser download, which together dominate the
      # cost. Sharing the setup is the single biggest runner-minute saving
      # available here, worth more than the warm-server seam is in CI.
      - name: Hermetic gate - rekordbox writeback disabled
        working-directory: apps/webui/frontend
        # `!cancelled()` so a red webkit gate does not SKIP this one and turn
        # two independent answers into one. That happened on the first run of
        # this workflow: the webkit step failed and both chromium gates
        # reported `skipped`, which reads as 'fine' and means 'unknown'.
        if: ${{ !cancelled() }}
        # Every /api/v1/** call is fulfilled in-page, so this suite needs no
        # backend and no library and can run literally anywhere.
        # Fixed loopback port (see the vite/playwright config it names) on a
        # host that runs up to eight e2e jobs at once: hold the per-suite host
        # lock so a second copy of this step WAITS instead of dying on
        # 'is already used'. Same reason as the webkit-deckload steps.
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" rekordbox-gate \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 5399 -- \
            pnpm exec playwright test --config tests/e2e/playwright.rekordbox-gate.config.ts --output test-results/rekordbox-gate

      - name: Hermetic gate - stretch quality smoke
        working-directory: apps/webui/frontend
        # `!cancelled()` so a red webkit gate does not SKIP this one and turn
        # two independent answers into one. That happened on the first run of
        # this workflow: the webkit step failed and both chromium gates
        # reported `skipped`, which reads as 'fine' and means 'unknown'.
        if: ${{ !cancelled() }}
        # No webServer, no port, no data dir; it synthesizes its own audio.
        # STRETCH_QUALITY_PLAN is deliberately unset so the smoke arm runs and
        # the full grid stays skipped: the grid is a quality sweep, not a gate.
        run: pnpm exec playwright test --config tests/e2e/playwright.stretch-quality.config.ts --output test-results/stretch-quality

      - name: Hermetic gate - master12-cue34 output topology
        if: ${{ !cancelled() }}
        # No webServer, no port, no data dir: the djio graph is rendered by a
        # real four-channel OfflineAudioContext and the samples are read back.
        # The script skips only while the whole feature (source, spec, config)
        # is absent, as on main before the preview (PR #3837) lands, and fails
        # when any one of the three is here without the others.
        run: bash scripts/ci_output_topology_gate.sh apps/webui/frontend

      # -- Comment-hotkey gate, real backend + fixture library ---------------
      # NOT hermetic like the two steps above: this suite needs a real
      # backend and a real (throwaway, generated-audio) fixture library --
      # PREFLIGHT-01's library-attached check holds the whole app on its
      # "Starting up" screen for an empty library, so /performance cannot
      # even mount without one (playwright.comment-hotkey-gate.config.ts's
      # own header explains this in full; T6, Sun 6 Sep 2026). Still cheap
      # enough for a per-PR gate rather than the nightly `extended` job:
      # measured 13/13 green in ~2m9s on a quiet 8-core machine (load ~50,
      # climbing to ~270 mid-run without going red) and ~4m50s on a heavily
      # contended one (load 90-427) -- both well inside this job's existing
      # per-suite budget, unlike the ffmpeg/webkit suites the `extended` job
      # exists for. This suite went un-runnable from Sat 5 Sep 2026 (#1308)
      # until #1337 + this fix (T6) restored it, and was never wired into
      # any workflow in the meantime -- confirmed by grepping every
      # playwright.*.config.ts against .github/workflows/*.yml.
      - name: Comment-hotkey gate - real backend, fixture library
        working-directory: apps/webui/frontend
        # `!cancelled()` so a red webkit gate does not SKIP this one and turn
        # two independent answers into one -- same reasoning as the two
        # hermetic gates above.
        if: ${{ !cancelled() }}
        # Fixed loopback port (see the vite/playwright config it names) on a
        # host that runs up to eight e2e jobs at once: hold the per-suite host
        # lock so a second copy of this step WAITS instead of dying on
        # 'is already used'. Same reason as the webkit-deckload steps.
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" comment-hotkey-gate \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 5321 8696 -- \
            pnpm exec playwright test --config tests/e2e/playwright.comment-hotkey-gate.config.ts --output test-results/comment-hotkey-gate

      # -- AutoPlay stall-banner gate, real backend + fixture library --------
      # Same PREFLIGHT-01 library-attached reason as comment-hotkey: without
      # a fixture library, /performance parks on "Starting up" and the banner
      # never mounts. Own ports 5324/8699. Host lock because eight e2e jobs
      # share a host. Issue #1659: a gate that never runs is the original
      # defect one level up.
      - name: AutoPlay stall-banner gate - real backend, fixture library
        working-directory: apps/webui/frontend
        if: ${{ !cancelled() }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" autoplay-stall-gate \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 5324 8699 -- \
            pnpm exec playwright test --config tests/e2e/playwright.autoplay-stall-gate.config.ts --output test-results/autoplay-stall-gate

      # -- Headphone device probe gate, performance Playwright config ---------
      # CUEOUT-06 / issue #2090: the probe clicks "+ OUT" by its accessible
      # name (aria-label="ADD OUTPUT"). Without a CI step referencing
      # playwright.performance.config.ts the mismatch timed out every run and
      # stayed invisible. Own ports 5273/8686; host lock because eight e2e jobs
      # share a host.
      - name: Headphone device probe gate - performance config
        working-directory: apps/webui/frontend
        if: ${{ !cancelled() }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" performance-headphone-gate \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 5273 8686 -- \
            pnpm exec playwright test --config tests/e2e/playwright.performance.config.ts tests/e2e/performance-headphone-device-probe.spec.ts --output test-results/performance-headphone-gate

      - name: Root Playwright suite (real engine + Vite)
        working-directory: apps/webui/frontend
        # `test:e2e` fixes a pair reserved for this suite, builds its own
        # generated-audio library, and starts the engine before Vite. This is
        # the default Playwright command developers run, so running it here
        # keeps its API-backed specs from becoming an unobserved test estate.
        if: ${{ !cancelled() }}
        run: pnpm test:e2e --output test-results/root-playwright

      - name: Library jobs ordering (chromium, dry runner)
        working-directory: apps/webui/frontend
        if: ${{ !cancelled() }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" library-jobs \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 8704 5277 -- \
            pnpm exec playwright test --config tests/e2e/playwright.library-jobs.config.ts --output test-results/library-jobs

      # -- Onboarding: the boot gate and a new user's first run (SETUP-25) ------
      # Both suites existed and NO workflow ran them: fresh-install-onboarding
      # (#2722's auto-open regression) and preflight-gate (PREFLIGHT-01) sat
      # behind a config only a human ever invoked, and two of their assertions
      # rotted unseen. Shares 5321/8696 with the comment-hotkey gate, so it
      # holds THAT lock name: one port, one lock (see the fixed-port lock test).
      - name: Preflight boot gate + fresh-install onboarding (real backends)
        working-directory: apps/webui/frontend
        if: ${{ !cancelled() }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" comment-hotkey-gate \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 5321 5323 8696 8697 -- \
            pnpm exec playwright test --config tests/e2e/playwright.preflight-gate.config.ts --output test-results/preflight-gate

      # The onboarding gauntlet (SETUP-21..23, specs/onboarding-gauntlet.md):
      # every test boots its own brand-new PACKAGED engine on an OS-assigned
      # port against the production artifact, so it pins no port and needs no
      # host lock. Known open bugs (#3422) are test.fail, so a fix flips the
      # case red until its marker is removed, never silently green.
      - name: Onboarding gauntlet (packaged engine, production build)
        working-directory: apps/webui/frontend
        if: ${{ steps.frontend-artifact.outcome == 'success' && !cancelled() }}
        run: pnpm exec playwright test --config tests/e2e/playwright.onboarding.config.ts --output test-results/onboarding-gauntlet

      - name: Restore the PulseAudio server (unload our null sink, previous default back)
        # Always, even after a red suite: the server may be the host's shared,
        # long-lived one, and the next job (or anything else on the host) must
        # not inherit a discarding default sink or one more null-sink module.
        if: always()
        run: |
          scripts/ci_host_lock.sh pulse-sink scripts/ci_pulse_sink.sh restore

      - name: Upload failure artifacts
        if: failure()
        # Non-fatal: a byproduct upload must not red a job on a storage 403.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-gate-failures
          # The engine's own logs from each suite's fixture data dir travel with
          # the Playwright output: twice on Sat 5 Sep 2026 the suite failed on
          # "apps.analysis.run exited 5" and the traceback lived only here,
          # cleaned by the next checkout before anyone read it.
          #
          # The glob is `*-data` rather than the one Root dir it was written for.
          # Every suite in this job seeds its own dir (deckload-data,
          # autoplay-stall-gate-data, comment-hotkey-gate-data,
          # hotcue-mapping-gate-data, lyrics-words-data, preflight-gate-*-data),
          # and only Root's were kept, so a failure in any other suite uploaded a
          # trace with no server side to read against it. Measured on issue #3477
          # (webkit loses its browser mid-suite): the two failures on Tue 22 Sep
          # 2026, one on `main` and one on PR #3548, are both deckload-smoke, and
          # both artifacts carry Root's logs while deckload-data's -- the ones
          # covering the dead page -- were discarded with the checkout.
          path: |
            apps/webui/frontend/test-results/**
            apps/webui/frontend/playwright-report/**
            apps/webui/frontend/tests/e2e/fixtures/*-data/logs/**
          if-no-files-found: ignore
          retention-days: 2

  # ---------------------------------------------------------------------------
  # TIER 2, NIGHTLY. Not a PR gate, but a real red when it breaks.
  #
  # These suites are hermetic too, but each boots its own server and one needs
  # ffmpeg, so together they cost more than a per-PR gate should. Running them
  # once a day catches drift within a day, which for these surfaces is enough.
  #
  # `continue-on-error` is deliberately NOT set anywhere here. A suite that
  # runs but can never report red is only marginally better than one that never
  # runs, and this repo already has enough green-looking signal that carries no
  # verification. When this job fails, the workflow is red.
  # ---------------------------------------------------------------------------
  extended:
    name: e2e extended (nightly)
    # ORDERED AFTER `gate`, not merely locked against it. Both jobs run the
    # webkit-deckload suite on the same fixed port, and on a schedule or
    # dispatch run both are eligible at once, so on a host with two runner
    # services they would start together. The host lock below would then make
    # one of them WAIT on the other, and this one runs the full 23-test suite:
    # a `gate` blocked behind it for up to 45 minutes would hit its own
    # 30-minute job timeout and report a red that means nothing.
    # `needs` removes the contention instead of queueing it (Codex P1 on
    # #1014, discussion_r3924582000).
    #
    # `!cancelled()` rather than `success()`: a failing gate is exactly when the
    # nightly full suite is most worth having, and quarantined is not the same
    # as unwatched.
    needs: gate
    if: >-
      !cancelled()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # See the `gate` job above for the runner-selection and --with-deps note.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_E2E || '"ubuntu-latest"') }}
    timeout-minutes: 45
    env:
      # One native thread per process, as on the pytest jobs (#1157). The
      # engine this job boots forks apps.analysis.run's process pool; on
      # agentbox that fork with OpenBLAS/numba threads live produced 238
      # python3 "segfault at 0" kernel entries on Sat 5 Sep 2026 and five
      # BrokenProcessPool failures in the Root Playwright suite once eight
      # e2e runners shared the host. tests/scripts/test_ci_thread_caps.py.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"

    steps:
      # Pre-checkout hygiene for the persistent self-hosted workspace (#1338).
      # checkout cleans the tree as the runner user, so one root-owned file in
      # it fails the unlink with EACCES, dies at step 2, and skips every test
      # step after it -- a red carrying no test evidence. The runner user has
      # NOPASSWD sudo (e2e.yml documents it). This runs as root, so it is
      # bounded three ways, and each bound is load-bearing. A mount point
      # beneath the workspace fails the step outright: `-xdev` alone is not
      # enough, because a bind mount from elsewhere on the SAME filesystem
      # keeps the same st_dev and is traversed regardless (measured on the
      # runner host, Fri 5 Sep 2026). `-xdev` then stops a cross-filesystem
      # mount appearing after that check. The workspace path is escaped the way
      # mountinfo escapes field 5 and handed to awk through ENVIRON, NOT `-v`:
      # `-v` processes escape sequences, so it decodes \040 straight back to a
      # space and undoes the escaping it was given. `chown -h` acts on a symlink
      # itself rather than its referent, so a link pointing out of the tree cannot
      # drag the repair outside. One `find` expression drives the count and
      # the repair, so the number reported is the set acted on.
      #
      # The counts come from `find`, not from `chown -c`: GNU coreutils prints
      # that report on stdout but uutils prints it on stderr, so a piped count
      # reads 0 forever on a uutils host and the log would claim the step found
      # nothing when it had just repaired thousands of files. `remaining` is
      # the proof the repair landed, and a non-zero one fails here rather than
      # letting checkout die at the next step with a worse message.
      #
      # It also NAMES the offending entries -- owner, UTC mtime, path -- and
      # names them BEFORE the chown, because the repair destroys the very
      # evidence that identifies the writer. #1338 could say 957 to 1130 files
      # per runner but not which process wrote them, and cost a forensic
      # session for want of exactly this. The listing goes to a file rather
      # than into `head` down a pipe: under `pipefail` a SIGPIPE'd `find`
      # fails the step. TZ reaches `find` through `env` because sudo here is
      # `env_reset` with no SETENV, so `sudo TZ=UTC find` is refused outright,
      # and an mtime printed in local time under a `Z` suffix is a lie.
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history on every persistent runner: a shallow fetch here makes the next job --unshallow (test_ci_workspace_reuse.py).
          fetch-depth: 0
          persist-credentials: false
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Derive the worktree-port lane from the runner identity
        run: |
          set -euo pipefail
          runner_name="${RUNNER_NAME:-}"
          if [[ -z "$runner_name" ]]; then
            echo "::error::RUNNER_NAME is unset; cannot derive a safe port lane" >&2
            exit 1
          fi
          if [[ "$runner_name" =~ -([0-9]+)$ ]]; then
            lane=$((BASH_REMATCH[1] + 1))
          else
            lane=1
          fi
          echo "MUSIC_DJ_PORT_LANE=${lane}" >> "$GITHUB_ENV"
          echo "[OK] runner ${runner_name} -> MUSIC_DJ_PORT_LANE=${lane}"

      - name: Assert MUSIC_DJ_PORT_LANE is set
        run: |
          set -euo pipefail
          lane="${MUSIC_DJ_PORT_LANE:-}"
          [[ "$lane" =~ ^[0-9]+$ ]] || {
            echo "::error::MUSIC_DJ_PORT_LANE is unset or invalid after lane derivation" >&2
            exit 1
          }
          echo "[OK] MUSIC_DJ_PORT_LANE=${lane}"

      - name: Reclaim stale E2E servers before port claim
        run: bash scripts/ci_e2e_port_hygiene.sh

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          # pnpm on GitHub-hosted runners only. A self-hosted runner's store
          # already persists at the runner user's `pnpm store path` and is
          # SHARED by every runner service on the host; setup-node restores its
          # cache tarball with absolute paths straight into that store,
          # index.db included, under jobs that are reading it (trunk e14bd2f0a3,
          # Sat 5 Sep 2026: `[ERR_PNPM_ERR_SQLITE_ERROR] disk I/O error` on a
          # healthy disk). tests/scripts/test_ci_pnpm_cache_self_hosted.py.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: apps/webui/frontend/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          # Hosted-only, like the pnpm cache (tests/scripts/test_ci_pnpm_cache_self_hosted.py).
          # On a self-hosted host the persistent ~/.cache/uv IS the cache, and with the
          # action's cache on, its post step runs `uv cache prune --ci` against that
          # directory while fifteen sibling jobs hold its lock: trunk E2E red on
          # 227fb7c86 (Wed 9 Sep 2026, "Timeout (300s) when waiting for lock on
          # /home/ghrunner/.cache/uv"), and a sibling's prune is what tore an
          # archive entry out from under `uv sync` on 34275041870 the day before.
          enable-cache: ${{ runner.environment == 'github-hosted' }}

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: System deps (SQLCipher for pyrekordbox, ffmpeg for the stems fixture)
        # tests.stems.seed_e2e_library shells out to ffmpeg to build its
        # throwaway library. Without it that suite fails on a missing binary,
        # which reads as a product failure and is not one.
        run: |
          scripts/ci_apt_present.sh libsqlcipher-dev ffmpeg || scripts/ci_host_lock.sh packages sudo env -C / sh -c 'apt-get update && apt-get install -y libsqlcipher-dev ffmpeg'

      - name: Install Python deps into the project venv
        run: uv sync --extra dev

      - name: Runner preflight - node tools and disk
        # Fail here, naming the runner, rather than mid-install with a cryptic
        # pnpm error on a missing tool or a full disk. scripts/ci_node_preflight.sh
        # (it deliberately does not run `pnpm store status`; see the script).
        run: scripts/ci_node_preflight.sh apps/webui/frontend

      - name: Install frontend dependencies
        working-directory: apps/webui/frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version for the browser cache key
        id: pw
        working-directory: apps/webui/frontend
        run: echo "version=$(pnpm exec playwright --version | tr -d '\n' | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        # Hosted-only; see the `gate` job's identical step above.
        if: vars.CI_RUNS_ON_E2E == ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-webkit-chromium

      - name: Install Playwright browsers
        working-directory: apps/webui/frontend
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" packages \
            pnpm exec playwright install --with-deps webkit chromium

      - name: Virtual audio sink (PulseAudio null sink)
        # WITHOUT THIS THE WEBKIT GATE IS FLAKY, and flaky is worse than absent:
        # a gate that fails at random gets muted, which is how the repo ended up
        # with unenforced gates in the first place.
        #
        # Measured, not assumed. `double-click loads deck 1 and deck 2 with a
        # real worklet` PASSED on run 33451307165 and FAILED on run
        # 33453793079 at the same commit range with
        # "AudioContext did not enter running state; current state is
        # interrupted". A headless Linux runner has no audio device at all, so
        # WebKit's GStreamer backend can leave the context in `interrupted`.
        # Whether it does is a race, which is exactly why one run passed.
        #
        # A null sink gives the backend a real device to open that discards
        # samples. It does NOT fake the audio graph: decode, the worklet and
        # the analyser all still run for real, which is what the suite measures.
        run: |
          scripts/ci_apt_present.sh pulseaudio || scripts/ci_host_lock.sh packages sudo env -C / apt-get install -y pulseaudio
          # Setup and restore both run under the pulse-sink host lock: the server
          # is shared by every job of this user on the host, and the ownership
          # check plus the mutation must be one critical section. See the script.
          scripts/ci_host_lock.sh pulse-sink scripts/ci_pulse_sink.sh setup

      - name: Acquire production frontend artifact from CI
        id: frontend-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci_frontend_build_acquire_from_ci.sh "${{ github.sha }}"

      - name: Extended - FULL webkit artifact suite (no grep)
        if: ${{ steps.frontend-artifact.outcome == 'success' && !cancelled() }}
        working-directory: apps/webui/frontend
        # Whole webkit-deckload config, no grep. Serial skip is gone (#712);
        # the next step asserts every listed test executed. Quarantined tests
        # may still be red; that is the point. 1800s host lock and global
        # timeout: a PR gate waiting behind this needs a bound longer than the
        # suite, or the wait itself becomes the failure.
        env:
          MDT_CI_HOST_LOCK_TIMEOUT_S: 1800
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/webkit-full/results.json
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" webkit-deckload \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 8690 -- \
            pnpm exec playwright test \
            --config tests/e2e/playwright.webkit-deckload.config.ts \
            --output test-results/webkit-full \
            --reporter=list --reporter=json \
            --global-timeout=1800000

      - name: Assert nightly webkit suite executed every listed test
        if: always() && !cancelled()
        working-directory: apps/webui/frontend
        run: |
          "${GITHUB_WORKSPACE}/.venv/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/playwright_presence_check.py" \
            --floor 41 \
            test-results/webkit-full/results.json

      # -- EVERY step below is guarded `if: ${{ !cancelled() }}` ---------------
      # The step above is red BY DESIGN: it is the no-grep webkit run whose
      # whole purpose is keeping the tests quarantined under #637/#680 visible.
      # A GitHub Actions step defaults to `if: success()`, so that one red
      # stepped over every step after it, and on both nightly runs that had
      # ever happened desktop setup, play analytics, stretch artifact, stems
      # progress and midi-map resync were SKIPPED (issue #913). None of those
      # configs is referenced anywhere else in CI, so those suites had never
      # executed there at all. The `gate` job above already guards every one of
      # its playwright steps for the same reason; this job simply never got the
      # guard. `!cancelled()` rather than `always()`: a cancelled run must still
      # stop, or a killed runner keeps booting suites with no one watching.
      # tests/scripts/test_ci_e2e_extended_job_isolation.py holds both this and
      # the per-step `--output` rule below.
      - name: Extended - desktop setup page
        working-directory: apps/webui/frontend
        # Fixed loopback port (see the vite/playwright config it names) on a
        # host that runs up to eight e2e jobs at once: hold the per-suite host
        # lock so a second copy of this step WAITS instead of dying on
        # 'is already used'. Same reason as the webkit-deckload steps.
        if: ${{ !cancelled() }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" desktop-setup \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 5216 9473 -- \
            pnpm exec playwright test --config tests/e2e/playwright.desktop-setup.config.ts \
            --output test-results/desktop-setup

      - name: Extended - play analytics
        working-directory: apps/webui/frontend
        # Boots a self-seeding SQLite fixture server; no real library.
        # Fixed loopback port (see the vite/playwright config it names) on a
        # host that runs up to eight e2e jobs at once: hold the per-suite host
        # lock so a second copy of this step WAITS instead of dying on
        # 'is already used'. Same reason as the webkit-deckload steps.
        if: ${{ !cancelled() }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" play-analytics \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 9414 5214 -- \
            pnpm exec playwright test --config tests/e2e/playwright.play-analytics.config.ts \
            --output test-results/play-analytics

      - name: Extended - library wheel
        working-directory: apps/webui/frontend
        # Real engine over a throwaway genre-family fixture (state.db +
        # master.plain.db). The root deckload library has no vendor mapping
        # and 503s this route, so this suite is the UI evidence for LIBUX-06.
        # Fixed loopback port (see the vite/playwright config it names) on a
        # host that runs up to eight e2e jobs at once: hold the per-suite host
        # lock so a second copy of this step WAITS instead of dying on
        # 'is already used'. Same reason as the webkit-deckload steps.
        if: ${{ !cancelled() }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" library-wheel \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 9428 5228 -- \
            pnpm exec playwright test --config tests/e2e/playwright.library-wheel.config.ts \
            --output test-results/library-wheel

      - name: Extended - stretch artifact (chromium + webkit)
        working-directory: apps/webui/frontend
        # Fixed loopback port (see the vite/playwright config it names) on a
        # host that runs up to eight e2e jobs at once: hold the per-suite host
        # lock so a second copy of this step WAITS instead of dying on
        # 'is already used'. Same reason as the webkit-deckload steps.
        if: ${{ !cancelled() }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" stretch-artifact \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 5311 -- \
            pnpm exec playwright test --config tests/e2e/playwright.stretch-artifact.config.ts \
            --output test-results/stretch-artifact

      - name: Extended - stems progress
        working-directory: apps/webui/frontend
        # Real apps.engine_core over a throwaway ffmpeg-built library, with the
        # Modal GPU call replaced by the repo's own in-tree double at
        # tests.stems.modal_separator_double. That substitution is the suite's
        # own design, not something this workflow introduces.
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test --config tests/e2e/playwright.stems.config.ts --output test-results/stems-progress

      - name: Extended - midi maps resync
        working-directory: apps/webui/frontend
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test --config tests/e2e/playwright.midi-maps-resync.config.ts --output test-results/midi-maps-resync

      - name: Extended - playlist switch bench (PERF-UI-05 pytest gate)
        # tests/perf/test_library_playlist_switch_bench.py is a pytest test
        # that drives `pnpm exec playwright test` over the playlist-switch
        # latency config against a real engine and asserts the measured p50s
        # against the committed caps. It needs the frontend build, node_modules
        # and a chromium this job already has, and it is ignored by both
        # pytest lanes in ci.yml (a 600 s test timeout plus a 240 s webServer
        # timeout ate a whole shard's 1380 s budget on #3732). An ephemeral
        # port is chosen per run inside the test, so no host lock is needed.
        # tests/scripts/test_ci_playlist_bench_lane.py pins this step.
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/pytest -q -p no:cacheprovider \
            --basetemp="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-playlist-switch-bench" \
            tests/perf/test_library_playlist_switch_bench.py

      - name: Extended - hot-cue mapping gate, real backend + fixture library
        working-directory: apps/webui/frontend
        # Guards the user-facing safety property from #736/#804 that an empty
        # hot-cue pad on an unmapped or never-loaded deck must not fire a
        # rekordbox write. Never wired into any workflow before #949 --
        # confirmed by grepping every playwright.*.config.ts against
        # .github/workflows/*.yml, the same way the comment-hotkey gate in
        # the `gate` job was found unwired.
        #
        # NOT placed in the blocking `gate` job despite passing locally
        # (~10s, 2 specs): #949's own issue body flagged this exact risk
        # unconfirmed -- "I did not check whether it is stable under CI's
        # parallelism ... that last one is the assumption most likely to be
        # wrong, and it should be confirmed before the step is added." PR
        # #1446 confirmed it wrong on the first CI run: the unmapped-deck
        # spec timed out in `page.waitForFunction` waiting on
        # `decks[1].stable_id`, immediately after an `xrun` (audio underrun)
        # warning, on run 34208199917 job 102002652185 -- the identical
        # failure shape already quarantined here for `webkit-deckload`
        # (#680/#637): correct app state observed within ~3s by direct
        # instrumentation, but never observed by Playwright's rAF-driven
        # poll. Quarantined into nightly per that precedent rather than
        # forced green; promote back to `gate` if a future investigation
        # roots out the flake source.
        #
        # Placed LAST and guarded `!cancelled()` (Codex, PR #1446 review
        # r3956492935): every other step above uses the default `success()`
        # condition, so a failure anywhere upstream would otherwise SKIP this
        # step, and a failure IN this known-flaky suite would otherwise skip
        # every step below it -- exactly the independent-evidence loss the
        # `gate` job's own `!cancelled()` steps already guard against.
        # Running it last means its expected flake cannot suppress
        # desktop-setup/play-analytics/stretch-artifact/stems, and running it
        # unconditionally means an upstream failure cannot suppress its own
        # independent answer either.
        if: ${{ !cancelled() }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci_host_lock.sh" hotcue-mapping-gate \
            "$GITHUB_WORKSPACE/scripts/ci_reap_port_holders.sh" 5320 8695 -- \
            pnpm exec playwright test --config tests/e2e/playwright.hotcue-mapping-gate.config.ts --output test-results/hotcue-mapping-gate

      - name: Restore the PulseAudio server (unload our null sink, previous default back)
        # Always, even after a red suite: the server may be the host's shared,
        # long-lived one, and the next job (or anything else on the host) must
        # not inherit a discarding default sink or one more null-sink module.
        if: always()
        run: |
          scripts/ci_host_lock.sh pulse-sink scripts/ci_pulse_sink.sh restore

      - name: Upload failure artifacts
        if: failure()
        # Non-fatal: a byproduct upload must not red a job on a storage 403.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-extended-failures
          path: |
            apps/webui/frontend/test-results/**
            apps/webui/frontend/playwright-report/**
          if-no-files-found: ignore
          retention-days: 2

  verdict:
    name: e2e verdict
    # THE check-run a merge queue or branch protection requires from this
    # workflow (Trunk Merge Queue's required status, issue #4168). Created on
    # every run because it needs `always()`; concludes SUCCESS only when the
    # scope job said out of scope and the gate was skipped, or said in scope and
    # the gate succeeded (scripts/ci_required_gate.py). Never SKIPPED, since how
    # a queue reads `skipped` is undocumented. If the gate is ever skipped on
    # ordinary PR heads by design (PR #4175's queue-draft-only gate), that
    # condition belongs in the scope decision, not in the gate's own `if`:
    # tests/scripts/test_ci_required_gate_wiring.py pins the gate's `if` to the
    # scope output alone, so the verdict can never read a designed skip as red
    # or an undesigned one as green. `extended` is nightly-only and not gated.
    needs:
      - scope
      - gate
    if: ${{ always() }}
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON_MERGE_QUEUE || vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # 0: every persistent-runner checkout fetches full history
          # (docs/decisions/ADR-NEW-uniform-checkout-depth-on-persistent-runners.md).
          fetch-depth: 0
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout. Runs before the job's first python3;
      # tests/scripts/test_ci_workflow_stale_install_coverage.py enforces it.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      - name: Aggregate the gated jobs into one verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci_required_gate verdict
