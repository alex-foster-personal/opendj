name: E2E Main Starvation

# Issue #5831 (W46). Wed 7 Oct 2026, main 2411a8f23190's e2e gate sat QUEUED for about
# 1h45m with no runner while all 4 `e2e` runners took newer PR jobs, and nothing alarmed:
# trunk-red-alarm.yml fires only on a COMPLETED failure, and a job that never starts
# never completes. e2e.yml's gate already prefers the opt-in CI_RUNS_ON_E2E_TRUNK lane
# (E2ELANE-01) for a main push; this watchdog is the backstop for when that lane is off,
# offline, or the dispatcher orphans the job anyway.
#
# It finds a main push E2E gate queued with no runner for more than 30 minutes, opens or
# comments the `ci:e2e-main-starved` issue, cancels the run, and re-runs it ONCE (attempt
# 1 on main's tip only). scripts/ci_e2e_main_starvation.py holds the rules and their
# MINI-PRD; the run reads red whenever it alarms.
#
# TRIGGERS. Not cron alone: sub-hourly schedule delivery fell to about 2% a day from
# Sat 3 Oct 2026 (#5694). Starvation needs PR e2e traffic to happen at all (that is what
# takes the runners), and every E2E run that completes fires workflow_run
# here, so the watchdog is woken by the very load that starves main. The
# cron stays as a best-effort backstop. The concurrency group keeps one sweep running
# and at most one pending, so a burst of E2E events costs a couple of 30 s sweeps.
on:
  workflow_run:
    workflows: [E2E]
    # Completed only (ADR-NEW-starvation-watchdog-wakes-on-completed): a completion is when
    # a runner frees and the dispatcher picks main's gate or passes it over. `requested`
    # too doubled the sweeps on the main-fix reserve, about one a minute against a
    # 30-minute threshold, for no earlier alarm.
    types: [completed]
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only: no issue, no cancel, no re-run"
        type: boolean
        default: false

env:
  # Keep .pyc out of the reused self-hosted workspace (same ratchet as trunk-tip-only.yml).
  PYTHONDONTWRITEBYTECODE: "1"

# workflow_run uses the default branch's workflow definition and this job never checks
# out or runs the triggering SHA, only main's own checkout of this script.
permissions:
  # Cancel and re-run the starved E2E run.
  actions: write
  # Open or comment the alarm issue.
  issues: write
  contents: read

concurrency:
  # One sweep at a time, never cancelled mid-rerun; GitHub keeps only the newest pending.
  group: e2e-main-starvation
  cancel-in-progress: false

jobs:
  watch:
    name: Alarm and re-run a starved main e2e gate
    # The ADR-0041 main-fix reserve, as trunk-tip-only.yml uses it, never the `e2e` or
    # the general pools: a watchdog for queue starvation queued behind that same backlog
    # cannot watch it. Hosted ubuntu-latest only when the variable is unset.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_MAIN_FIX || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      # Pre-checkout hygiene for the persistent self-hosted workspace (#1338):
      # the same block every self-hosted job carries, pinned identical by
      # (private path). On the hosted
      # fallback the workspace is fresh and the step is a no-op scan.
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history on every persistent runner: a shallow fetch here makes the next job --unshallow (test_ci_workspace_reuse.py).
          fetch-depth: 0
          persist-credentials: false
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      - name: Preflight gh auth
        run: scripts/ci_runner_preflight.sh gh

      # No uv sync: the script is pure stdlib, so the runner's python3 runs it as
      # ci-budget-watch.yml runs its scripts, and a 30 s sweep stays 30 s. The interpreter
      # is resolved once and launched by that path (AGENTS.md "Portable by default"), and
      # the path is printed so a run says which python it used. No python3 is UNKNOWN (2).
      - name: Find, alarm and re-run a starved main e2e gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -uo pipefail
          py="$(command -v python3 || true)"
          [ -n "$py" ] || { echo "::error::[UNKNOWN] no python3 on PATH; starvation unmeasured"; exit 2; }
          py="$(readlink -f "$py")"
          echo "[e2e-main-starvation] interpreter: $py ($("$py" --version 2>&1))"
          "$py" -m scripts.ci_e2e_main_starvation --repo "$GITHUB_REPOSITORY" $DRY_RUN
