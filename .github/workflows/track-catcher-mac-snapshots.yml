name: Track Catcher Mac snapshots

# Builds "Open DJ Track Catcher.app" (ad-hoc signed; no mic is used here),
# runs the core tests on macOS, then `TrackCatcher --snapshot` drives the
# real window through every design state and saves PNGs for comparison with
# the design artifact (TCAPP-6577i).
#
# Hosted macOS spend is the maintainer-gated, as in macos-desktop-compile.yml: the
# CI_HOSTED_OS_JOBS switch, a manual dispatch, a v* tag, or the narrower
# TC_MAC_SNAPSHOTS repository variable, which admits pull requests touching
# Track Catcher only. A label is not used because the repo's workflow
# condition checkers evaluate only event, ref and vars.

on:
  push:
    branches:
      - main
    # v* release tags (the hosted macOS release rule); paths do not filter tag pushes.
    tags:
      - "v*"
    paths:
      - apps/track-catcher-mac/**
      - apps/live-core/**
      - .github/workflows/track-catcher-mac-snapshots.yml
  pull_request:
    paths:
      - apps/track-catcher-mac/**
      - apps/live-core/**
      - .github/workflows/track-catcher-mac-snapshots.yml
  workflow_dispatch:

concurrency:
  group: track-catcher-mac-snapshots-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: true

env:
  # CI byproducts go to R2 through ./.github/actions/r2-artifact (CI artifact storage rule).
  CI_ARTIFACT_R2_ACCOUNT_ID: ${{ secrets.ARTIFACT_ARCHIVE_R2_ACCOUNT_ID }}
  CI_ARTIFACT_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_ARCHIVE_R2_ACCESS_KEY_ID }}
  CI_ARTIFACT_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_ARCHIVE_R2_SECRET_ACCESS_KEY }}
  CI_ARTIFACT_R2_BUCKET: ${{ vars.ARTIFACT_ARCHIVE_R2_BUCKET }}

permissions:
  contents: read

jobs:
  snapshots:
    name: Track Catcher app build and snapshots
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_MAC_ARM64 || '"macos-14"') }}
    timeout-minutes: 25
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (vars.TC_MAC_SNAPSHOTS == 'true' && github.event_name == 'pull_request')
      || (vars.CI_HOSTED_OS_JOBS == 'true'
      && (github.event_name == 'push' || github.event_name == 'pull_request'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          toolchain: "1.96.0"
      - name: Python
        id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check the Python on PATH is this checkout's
        # Self-hosted guard (ci_runner_preflight.sh): runs after the last
        # setup-python and before the first Python launch below.
        run: scripts/ci_runner_preflight.sh python3
      - name: Resolve toolchain paths
        run: |
          swift_bin="$(command -v swift)" && echo "swift: $swift_bin"
          echo "SWIFT=$swift_bin" >> "$GITHUB_ENV"
      - name: Build the app
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: '"$PY" apps/track-catcher-mac/scripts/bundle.py --adhoc'
      - name: Core tests on macOS against the real engine
        working-directory: apps/track-catcher-mac
        env:
          ODJ_LIVE: ${{ github.workspace }}/apps/live-core/target/release/odj-live
        run: '"$SWIFT" test'
      - name: Snapshot every design state from the real window
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: '"$PY" apps/track-catcher-mac/scripts/snapshots.py "$RUNNER_TEMP/snapshots"'
      - name: Upload snapshots
        # Byproduct upload: non-fatal, as every upload is (a storage 403 or quota
        # miss must not red a green job). The verdict step above already fails
        # the job on any missing or flat PNG, so the gate does not depend on this.
        if: always()
        continue-on-error: true
        uses: ./.github/actions/r2-artifact
        with:
          mode: upload
          name: track-catcher-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
