name: Release Check

# Runs the aggregated pre-release gates (`make release-check`) on:
#   - pushes to `release/*` branches (integration branches cutting a release)
#   - PRs targeting `release/*` branches
#   - creation of a `v*` tag (final cut)
# The target runs: pytest, ruff lint, python -m build, reqs-check.

on:
  push:
    branches: ["release/*"]
    tags: ["v*"]
  pull_request:
    branches: ["release/*"]

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: make release-check
    runs-on: ubuntu-latest

    steps:
      # SHA-pinned to the v4 tag commit (matches ci.yml).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        # SHA-pinned to the v5 tag commit (matches ci.yml).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System deps for pyrekordbox (SQLCipher)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: Create project venv
        # The Makefile expects VENV=.venv with python/pytest/ruff inside it.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install build ruff

      - name: Run make release-check
        env:
          # Provide GH_TOKEN so the optional `gh release view` step can query
          # the repo; the step is non-fatal regardless.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-check

      - name: Upload built dists
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn
