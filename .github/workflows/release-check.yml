name: Release Check

# Runs the aggregated pre-release gates (`make release-check`) on:
#   - pushes to `release/*` branches (integration branches cutting a release)
#   - PRs targeting `release/*` branches
#   - creation of a `v*` tag (final cut)
# The target runs: pytest, ruff lint, python -m build, reqs-check.

on:
  push:
    branches: ["release/*"]
    tags: ["v*"]
  pull_request:
    branches: ["release/*"]
  # Lets the macos-native-companion job below be run by hand while
  # vars.CI_HOSTED_OS_JOBS is unset; see that job's comment.
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  # Trunk verification is never cancellable. A merge burst used to cancel each
  # run's predecessor and leave heads whose jobs never executed (Mon 31 Aug 2026:
  # six merges in 25s left main with no completed pytest or frontend job, while
  # nothing reported a problem, because a cancelled job is not a failed one).
  #
  # This gives every trunk push its OWN group rather than making the cancellation
  # conditional, matching ci.yml. A conditional flag was tried first (#631) and
  # did not hold: three post-fix trunk runs were still cancelled seconds after the
  # next push run was created. Removing the shared group removes the precondition
  # for cancelling at all, so it does not depend on the mechanism that failed.
  # Pull requests keep the shared group and still cancel superseded runs.
  cancel-in-progress: true

jobs:
  release-check:
    name: make release-check
    # Runner is a repo-variable switch; see ci.yml's `test` job for the full
    # rationale. Empty vars.CI_RUNS_ON_LINUX -> hosted ubuntu-latest.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 30

    steps:
      # SHA-pinned to the v4 tag commit (matches ci.yml).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          clean: true

      - name: Setup Python
        # SHA-pinned to the v5 tag commit (matches ci.yml).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6

      - name: Create project venv
        # The Makefile expects VENV=.venv with python and pytest inside it.
        #
        # ruff is deliberately NOT installed here. `make lint` runs the ruff
        # pinned in ops/quality/requirements.txt through `uv run --no-project
        # --with-requirements`, so a copy in this venv is never invoked; it
        # was only ever a third, unpinned ruff floating alongside the two that
        # are pinned. Guarded by tests/quality/test_toolchain_pins.py.
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt build maturin

      - name: System deps for pyrekordbox (SQLCipher)
        # Keep the project interpreter available to any post-failure steps.
        run: |
          scripts/ci_host_lock.sh packages sudo sh -c 'apt-get update && apt-get install -y libsqlcipher-dev file'

      - name: Run make release-check
        env:
          # Provide GH_TOKEN so the optional `gh release view` step can query
          # the repo; the step is non-fatal regardless.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Serial, for the same measured reason ci.yml's pytest step is:
          # `-n auto` came out SLOWER on a 4-vCPU ubuntu runner (295s against
          # 273-289s serial). The Makefile defaults to `auto` because it is
          # normally driven from a dev machine, where parallel wins 2.7x.
          # See ops/test-latency/README.md.
          PYTEST_JOBS: "0"
        run: make release-check

      - name: Upload built dists
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn
          retention-days: 7
