name: Release Check

# Runs the aggregated pre-release gates (`make release-check`) on:
#   - pushes to `release/*` branches (integration branches cutting a release)
#   - PRs targeting `release/*` branches
#   - creation of a `v*` tag (final cut)
# The target runs: pytest, ruff lint, python -m build, reqs-check.

on:
  push:
    branches: ["release/*"]
    tags: ["v*"]
  pull_request:
    branches: ["release/*"]

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: make release-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # SHA-pinned to the v4 tag commit (matches ci.yml).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        # SHA-pinned to the v5 tag commit (matches ci.yml).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6

      - name: System deps for pyrekordbox (SQLCipher)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: Create project venv
        # The Makefile expects VENV=.venv with python/pytest/ruff inside it.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install build maturin ruff

      - name: Run make release-check
        env:
          # Provide GH_TOKEN so the optional `gh release view` step can query
          # the repo; the step is non-fatal regardless.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Serial, for the same measured reason ci.yml's pytest step is:
          # `-n auto` came out SLOWER on a 4-vCPU ubuntu runner (295s against
          # 273-289s serial). The Makefile defaults to `auto` because it is
          # normally driven from a dev machine, where parallel wins 2.7x.
          # See ops/test-latency/README.md.
          PYTEST_JOBS: "0"
        run: make release-check

      - name: Upload built dists
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn
          retention-days: 7

  macos-native-companion:
    name: macOS native companion wheel
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6

      - name: Install release gate dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest

      - name: Build, inspect, install, and prove real ANLZ parity
        run: make waveform-native-release-check

      - name: Prove the macOS ABI3 wheel imports on Python 3.14
        run: |
          uv run --isolated --no-project --python 3.14 --with numpy \
            --with dist/music_dj_tools-*.whl python -c \
            'import _rb_waveform_native as n, numpy as np; assert n.bands_payload({"low": np.array([0.0, 1.0])}, 100)["length"] == 2'

      - name: Upload macOS production wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: music-dj-tools-macos-arm64
          path: dist/music_dj_tools-*.whl
          if-no-files-found: error
          retention-days: 7
