name: Debt index regen (main)

# Regenerate the committed `.planning/TECH-DEBT.md` after a merge lands a
# `.planning/debt/*.md` file (issue #1415). A PR never regenerates the index:
# two PRs rewriting the same generated file is exactly the concurrent-merge
# conflict this workflow exists to remove. The index is therefore a main-side
# artifact and this workflow is what keeps it current after every merge.
#
# The bot commit is pushed with the GITHUB_TOKEN, and a push made by that token
# does not create new workflow runs, so this cannot loop; `[skip ci]` in the
# message is belt-and-braces for the same reason.
#
# The job fails loudly when regeneration raises. That is deliberate: a debt
# file that reaches main through a docs-only PR skips the pytest lane, so this
# post-merge regeneration is the first place its malformed metadata is seen.

on:
  push:
    branches: [main]
    paths:
      - ".planning/debt/**"
      - ".planning/TECH-DEBT.md"

permissions:
  contents: write

concurrency:
  group: debt-index-regen
  cancel-in-progress: false

# Self-hosted runners are shared, so this workflow honours the same hygiene
# contract as every other persistent-workspace workflow (issue #1338): reclaim
# workspace ownership before checkout, and never let Python leave .pyc files
# in the workspace.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  regenerate:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi
      # SHA-pinned to the v4 tag commit (matches ci.yml and docs.yml).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      # scripts/debt_index imports only the standard library, so this runs on
      # the runner's plain interpreter: no venv, no uv, no provisioning.
      - name: Regenerate and commit the index
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push_url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The checkout is pinned to the pushed SHA, but main can advance while
          # this job queues (a merge lane pushing the next debt file). Re-base
          # on the live branch each attempt so the bot commit stays a clean
          # push. `reset --hard` here touches only this runner's own checkout,
          # never a shared agent worktree.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m scripts.debt_index
            if git diff --quiet -- .planning/TECH-DEBT.md; then
              echo "[regen] .planning/TECH-DEBT.md is already current"
              exit 0
            fi
            git add .planning/TECH-DEBT.md
            git commit -m "chore(debt): regenerate .planning/TECH-DEBT.md [skip ci]"
            if git push "$push_url" HEAD:main; then
              echo "[regen] committed the regenerated index"
              exit 0
            fi
            echo "[regen] push attempt $attempt rejected (main moved); re-basing and retrying"
          done
          echo "::error::could not push the regenerated index after 3 attempts"
          exit 1

      # Wires the documented main-side guard (.planning/DEBT-POLICY.md) into the
      # workflow that is supposed to satisfy it: the previous step either pushed
      # a fresh regeneration or found the index already current, and either way
      # the local checkout now holds exactly what main has (or is about to
      # have). Fail loudly if that state is not actually current over every
      # debt file - a silent gap here is exactly the bug this check exists to
      # catch.
      - name: Verify the regenerated index is current
        run: |
          set -euo pipefail
          python3 -m scripts.debt_index --check --require-current
