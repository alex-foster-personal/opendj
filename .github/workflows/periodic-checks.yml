name: Periodic checks

# The tier that runs OFF the per-PR path (DEVOPS-01..03).
#
# Policy, with one row per check and the reasoning behind each cadence:
# docs/ops/periodic-checks.md. Ledger issue: #1492.
#
# WHY THIS EXISTS. Per-PR CI is deliberately thin (the maintainer, Fri 28 Aug 2026:
# momentum over ceremony). The full pytest suite moved to full-ci.yml behind
# workflow_dispatch, the unreliable webkit tests moved to a nightly tier, and
# docs-only PRs stopped triggering CI at all. Nothing then watched where those
# checks landed, and it showed. Measured Tue 8 Sep 2026:
#
#   full-ci.yml       had NEVER been run, in the 11 days since it was created
#   e2e extended      had failed eight nights running, always at the same step,
#                     with the blocking gate job green each of those nights
#   windows-parity    had NEVER been run
#
# So this workflow's job is not only to RUN things. It is to make the result
# LAND somewhere a human sees without going to look: one comment per window on
# the ledger issue, pass/fail per row, plus the conclusion of the scheduled
# workflows that run on their own clock.
#
# THE MERGE WINDOW. `merges:50` is derived, never stored as a counter:
#   last_sha <- newest ledger comment carrying <!-- periodic-checks state sha=... -->
#   count    <- gh api repos/{repo}/compare/{last_sha}...main --jq .total_commits
# COMPARE API, not git rev-list. A shallow runner checkout must not change the
# count (DEVOPS-02). total_commits is a CEILING on integrations: squash merges
# contribute one, but a merge commit brings its branch commits into the range
# too, so the window may fire slightly early. That is the right direction to
# be wrong in. A missing marker or a compare 404 (rewritten base) reports
# `bootstrap` and RUNS rather than computing a small wrong number and
# disabling this workflow forever. Each threshold has its own marker so a
# merges:100 row cannot share the merges:50 base.
#
# THE WEEKLY FLOOR (policy PR #1494). The merge count alone can starve a quiet
# window forever: a slow week with fewer than 50 merges never runs the full
# suite, the bundle trend, or the perf bench, and a regression sits unmeasured
# until merge volume happens to pick back up. `elapsed_days` -- wall-clock days
# since the SAME state-marker comment's own `created_at`, not a stored counter
# -- is a second, independent OR arm: the window also runs once 7 days have
# passed since the last one, regardless of how few merges landed. Recorded
# alongside the SHA is `threshold=<N>`, the merge threshold that was ACTUALLY
# in force for that window (default or a workflow_dispatch override), so a
# later read of the ledger comment never has to assume which value produced
# a given run.

on:
  schedule:
    # 05:40 UTC. Deliberately AFTER e2e.yml's 04:17 nightly so the report step
    # can read that run's conclusion, and off the hour where GitHub's scheduler
    # queues are busiest.
    - cron: "40 5 * * *"
    # Row 8 (dependency audit): monthly, NOT the merge window. A nightly
    # advisory would red every open PR for a reason no author caused.
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run every row regardless of the merge count"
        type: boolean
        default: false
      threshold:
        description: "Merges required to trigger a window (default 50)"
        type: string
        required: false
      dependency_audit:
        description: "Run row 8 dependency audit outside the monthly schedule"
        type: boolean
        default: false

concurrency:
  # One window at a time. Two overlapping windows would both read the same
  # state SHA and post two comments claiming the same merges.
  group: periodic-checks
  cancel-in-progress: false

# issues: read at the top (the window job reads ledger comments); only the jobs
# that post to the ledger issue widen to issues: write (zizmor excessive-permissions).
permissions:
  actions: read
  contents: read
  issues: read

env:
  LEDGER_ISSUE: "1492"
  DEFAULT_THRESHOLD: "50"
  # Self-hosted runners persist the workspace between jobs, so a .pyc written
  # by one job is a file the next one may not own. Repo-wide rule, enforced by
  # tests/quality/test_workspace_ownership_hygiene.py.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether this window runs, and name the merges it covers.
  # Cheap (three API calls) and always runs, so a skipped window is still
  # visible as a run with a reason rather than as silence.
  # ---------------------------------------------------------------------------
  window:
    name: merge window
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.compute.outputs.run }}
      count: ${{ steps.compute.outputs.count }}
      base: ${{ steps.compute.outputs.base }}
      base_at: ${{ steps.compute.outputs.base_at }}
      head: ${{ steps.compute.outputs.head }}
      head_at: ${{ steps.compute.outputs.head_at }}
      threshold: ${{ steps.compute.outputs.threshold }}
      elapsed_days: ${{ steps.compute.outputs.elapsed_days }}
      reason: ${{ steps.compute.outputs.reason }}
      # Row 10 (windows parity): own marker, own threshold. Sharing `run`
      # would fire a 30-minute Windows job every merges:50 window.
      run_windows_parity: ${{ steps.compute.outputs.run_windows_parity }}
      windows_parity_count: ${{ steps.compute.outputs.windows_parity_count }}
      windows_parity_base: ${{ steps.compute.outputs.windows_parity_base }}
      windows_parity_reason: ${{ steps.compute.outputs.windows_parity_reason }}
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # Depth 1 is enough: the merge count comes from gh api compare, not git.
      # clean: false, like every other self-hosted checkout in this workflow
      # (tests/scripts/test_ci_workspace_reuse.py): this job installs nothing
      # itself, but it shares a persistent runner with every other job here,
      # and a clean: true checkout wipes node_modules/.venv/target for the
      # NEXT job regardless of whether THIS one needed them.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      # agentbox runners have shipped gh 2.62.0 (confirmed live: agentbox-15,
      # job 103871571683, Fri 12 Sep 2026 onward), below the 2.64.0 that
      # `gh api --paginate --slurp` needs (scripts/gh_version_guard.py:
      # MIN_GH_VERSION). require_gh_min_version() turns that into a named
      # failure instead of the opaque `unknown flag: --slurp`, but a named
      # failure still skips all 13 downstream jobs (#2883) -- so this step
      # installs a pinned, checksum-verified gh ahead of it rather than
      # relying on the runner image. tests/quality/test_periodic_checks_gh_version.py
      # asserts this pin never drops below the guard's own floor.
      - name: Install pinned gh (agentbox ships 2.62.0, --slurp needs 2.64.0+)
        env:
          GH_CLI_VERSION: "2.100.0"
          GH_CLI_SHA256: "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/gh-cli-pin"
          rm -rf "$dir" && mkdir -p "$dir"
          tarball="${dir}/gh.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${GH_CLI_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$dir"
          install -Dm755 "${dir}/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" "${dir}/bin/gh"
          # Prepend, not append: GITHUB_PATH entries go to the FRONT of PATH
          # for later steps, so this must win over whatever gh the runner
          # image already has ahead of it on PATH.
          echo "${dir}/bin" >> "$GITHUB_PATH"

      - name: Verify gh version
        run: gh --version

      - name: Compute the window
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
          THRESHOLD_IN: ${{ inputs.threshold }}
        run: |
          set -euo pipefail
          threshold="${THRESHOLD_IN:-$DEFAULT_THRESHOLD}"
          python3 -m scripts.periodic_window decide \
            --repo "$REPO" \
            --ledger-issue "$LEDGER_ISSUE" \
            --threshold "$threshold" \
            --force "${FORCE:-false}" \
            --clock-days 7 \
            --github-output "$GITHUB_OUTPUT"

          # Row 10 (windows parity): own marker, own threshold. A merges:100
          # row that read the merges:50 marker would skip forever: every
          # 50-window moves the shared SHA forward before 100 accrue
          # (docs/ops/periodic-checks.md, "One marker per row"). No weekly
          # floor: the table states merges:100 only.
          WP_THRESHOLD=100
          python3 -m scripts.periodic_window decide \
            --kind windows_parity \
            --row=10 \
            --repo "$REPO" \
            --ledger-issue "$LEDGER_ISSUE" \
            --threshold "$WP_THRESHOLD" \
            --force "${FORCE:-false}" \
            --clock-days 0 \
            --github-output "$GITHUB_OUTPUT"

          _out() { grep "^$1=" "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-; }
          run="$(_out run)"
          reason="$(_out reason)"
          head="$(_out head)"
          wp_run="$(_out run_windows_parity)"
          wp_reason="$(_out windows_parity_reason)"

          echo "### Periodic checks window" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- run: \`${run}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- reason: ${reason}" >> "$GITHUB_STEP_SUMMARY"
          echo "- head: \`${head}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- row 10 (windows parity): \`${wp_run}\` (${wp_reason})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Watchdog for `window` itself (issue #2906). Every downstream job
  # (report/skip-report/windows-parity-report/windows-parity-skip-report) is
  # gated on `needs.window.result == 'success'`, so a failure IN `window` had
  # no path to the ledger at all: five weeks silent until #2905 fixed the one
  # cause (agentbox `gh` 2.62 lacking `--slurp`) that was actually tripping it.
  # This job is the missing CLASS fix: it fires on ANY future `window` failure,
  # not just that one.
  #
  # It must not read anything `window` would only have produced on success --
  # that is the exact mistake being fixed -- so its evidence comes from the
  # Actions API for this run's own `merge window` job, never from
  # `needs.window.outputs.*`.
  #
  # CANCELLED counts as failure here, unlike trunk-job-verdict.yml's own
  # `!= 'cancelled'` exclusion. That exclusion exists because ordinary PR CI
  # churn cancels runs constantly, and alerting on every one would be alert
  # fatigue. `window` has no such churn: it runs on a fixed schedule or a
  # manual dispatch, its concurrency group sets `cancel-in-progress: false`,
  # and nothing else in this workflow can cancel it. The only way `window`
  # reads `cancelled` is a human or an external actor stopping the run, which
  # is exactly the "reads as neutral in every dashboard" case
  # trunk-job-verdict.yml was built to stop, so it is alarmed here rather than
  # excused.
  #
  # SKIPPED is not reachable for `window`: it is the first job in this
  # workflow, carries no `if:` of its own, and has no `needs:`, so nothing
  # upstream can skip it. No branch here handles a state its subject cannot
  # enter.
  # ---------------------------------------------------------------------------
  window-failure-report:
    name: ledger comment (window job failed)
    needs: [window]
    if: always() && (needs.window.result == 'failure' || needs.window.result == 'cancelled')
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Record the window failure and fail visibly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          WINDOW_RESULT: ${{ needs.window.result }}
        run: |
          set -euo pipefail
          short="${HEAD_SHA:0:8}"

          # `window`'s own outputs are exactly what it may not have produced --
          # it failed or was cancelled before reaching them. Ask the Actions
          # API about THIS run's "merge window" job instead: its conclusion
          # and per-step conclusions exist regardless of what the job's own
          # script did.
          job_json="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.name == "merge window")][0] // empty')"

          if [ -z "$job_json" ]; then
            job_url="${RUN_URL}"
            failed_step="UNKNOWN - the merge window job was not found in this run's job list"
          else
            job_url="$(jq -r '.html_url' <<<"$job_json")"
            failed_step="$(jq -r '
              [.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled")][0].name
              // "UNKNOWN - no step reported failure or cancellation"
            ' <<<"$job_json")"
          fi

          title="Periodic checks: the window job itself ${WINDOW_RESULT} at $short"

          # --repo is REQUIRED: this job has no actions/checkout step (window
          # failed before anything meaningful could be checked out), so gh has
          # no git remote to infer the repository from. Verified empirically
          # (issue #2906 PR testing): gh label create with neither --repo nor
          # a git checkout fails outright with "failed to run git: fatal: not
          # a git repository", which would have killed this step under
          # set -euo pipefail before it ever reached the ledger comment below.
          gh label create ci:periodic-checks-window-failed \
            --repo "$REPO" \
            --color B60205 \
            --description "The window job failed/was cancelled before it could report; downstream rows were skipped" \
            --force

          report_file="${RUNNER_TEMP}/window-failure-${RUN_ID}.md"
          cat > "$report_file" <<EOF
          ## periodic-checks.yml: the \`window\` job itself ${WINDOW_RESULT}

          - Commit: \`${HEAD_SHA}\`
          - Trigger: \`${EVENT_NAME}\`
          - Run: [${RUN_ID}](${RUN_URL})
          - Job: [merge window](${job_url})
          - Failed/cancelled step: \`${failed_step}\`

          Every downstream row (report/skip-report/windows-parity-report) is
          gated on \`needs.window.result == 'success'\`, so none of them ran
          and none of them could have reported this. This comment is the only
          record of this window until a human fixes \`window\` itself.

          <!-- periodic-checks window-failure sha=${HEAD_SHA} run=${RUN_ID} -->
          EOF

          gh issue comment "${LEDGER_ISSUE:-1492}" --repo "$REPO" --body-file "$report_file"
          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=$title::The periodic-checks window job ${WINDOW_RESULT} on commit $short. See ${RUN_URL}"
          exit 1

  # ---------------------------------------------------------------------------
  # Row 1: the full pytest suite, including the slow product-edge suites the
  # per-PR fast lane deselects with --ignore (tests/analysis, tests/vocals,
  # tests/sync/usb, tests/sets). Reused from full-ci.yml rather than copied, so
  # a dispatched full run and a periodic one are provably the same suite.
  # ---------------------------------------------------------------------------
  full-suite:
    name: full pytest suite
    needs: window
    if: needs.window.outputs.run == 'true'
    uses: ./.github/workflows/full-ci.yml
    # Pinned to the recorded head for the same reason as the checkouts below:
    # the reusable workflow otherwise checks out the event's ref, which may
    # already have moved past the SHA this window reports on.
    with:
      ref: ${{ needs.window.outputs.head }}
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Row 4 (trend half): the per-surface ceilings are already a per-PR gate. What
  # per-PR pass/fail does NOT give is the absolute numbers over time, so this
  # records them. It still fails on a breach: a measurement lane that cannot go
  # red is not a check.
  # ---------------------------------------------------------------------------
  bundle-trend:
    name: bundle size trend
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # The SHA the window RECORDED, not the workflow event's ref: main can
      # advance between the two, and the report persists the window head as
      # the next state marker, so an unpinned checkout would mark commits
      # covered that no check here ever executed.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.window.outputs.head }}
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      # corepack BEFORE setup-node, so a pnpm shim exists when setup-node's
      # `cache: pnpm` resolves the store. Same order as ci.yml's frontend job.
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          # Hosted-only. Self-hosted hosts share ONE pnpm store across every
          # runner on the box, and a setup-node cache restore corrupted it
          # (#1299). Enforced by tests/scripts/test_ci_pnpm_cache_self_hosted.py.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: apps/webui/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/webui/frontend
        run: pnpm install --frozen-lockfile

      - name: Build production frontend
        working-directory: apps/webui/frontend
        run: pnpm build

      - name: Measure and record
        working-directory: apps/webui/frontend
        run: |
          set -euo pipefail
          bash scripts/check-bundle-size.sh --json | tee "${RUNNER_TEMP}/bundle.json"
          {
            echo "### Bundle size"
            echo ""
            echo '```json'
            cat "${RUNNER_TEMP}/bundle.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurement
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-size-${{ needs.window.outputs.head }}
          path: ${{ runner.temp }}/bundle.json
          if-no-files-found: warn
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Row 5: the boot-burst perf bench, against docs/perf/performance-register.md.
  # A MEASUREMENT lane: it prints medians and never fails on a threshold, so a
  # red here means the harness broke, not that the app got slower. That is
  # exactly what continue-on-error: false is protecting.
  #
  # Its fixture binds :8692, distinct from the e2e gate's fixed ports, so it
  # does not contend with e2e.yml on a shared host.
  # ---------------------------------------------------------------------------
  perf-bench:
    name: perf bench (boot burst)
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_E2E || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      MDT_LIBRARY_MODE: local
      UV_NO_SYNC: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      # 0 (the fixture default) measures raw loopback: the two-track burst
      # comes back ~86ms, about 40x too small to resolve the production
      # regression this bench exists to catch (per the Boot request window
      # row in docs/perf/performance-register.md). 120 matches the declared
      # per-request regime the 472->383ms #645 result was measured under, so
      # a periodic PASS here is a real measurement, not noise dressed as one.
      BOOT_BURST_LATENCY_MS: "120"
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # The SHA the window RECORDED, not the workflow event's ref: main can
      # advance between the two, and the report persists the window head as
      # the next state marker, so an unpinned checkout would mark commits
      # covered that no check here ever executed.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.window.outputs.head }}
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: Install Python deps into the project venv
        run: uv sync --extra dev --extra analysis

      - name: Install frontend dependencies
        working-directory: apps/webui/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/webui/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Boot-burst bench
        # The body of `just boot-burst-bench`, inlined: this job does not
        # install `just`, and a missing `just` would read as a bench failure
        # rather than as a missing tool. Keep in sync with the recipe.
        working-directory: apps/webui/frontend
        run: |
          set -euo pipefail
          pnpm exec svelte-kit sync
          pnpm build
          pnpm exec playwright test \
            --config tests/e2e/playwright.boot-burst.config.ts \
            2>&1 | tee "${RUNNER_TEMP}/boot-burst.log"
          {
            echo "### Boot-burst bench"
            echo ""
            echo '```'
            tail -40 "${RUNNER_TEMP}/boot-burst.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boot-burst-${{ needs.window.outputs.head }}
          path: ${{ runner.temp }}/boot-burst.log
          if-no-files-found: warn
          retention-days: 1

