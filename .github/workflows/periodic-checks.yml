  # ---------------------------------------------------------------------------
  # Row 9 (remote half): preview-branch drift. Cheap, no toolchain, so it runs
  # every window regardless of the merge count.
  #
  # This half reads origin's ref ONLY. The authoritative half runs on the Air
  # against the live worktree, and the script says so in its own output rather
  # than letting a green here read as "the preview is fine".
  # ---------------------------------------------------------------------------
  preview-drift:
    name: preview drift (remote refs)
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.drift.outputs.verdict }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Credentials persist on purpose: the drift step runs `git fetch origin`
          # against this private repo on a GitHub-hosted runner, which has no other
          # credential. Suppressed by file:line in .github/zizmor.yml.
          # The SHA the window recorded; see the bundle job for why.
          ref: ${{ needs.window.outputs.head }}
          # git cherry compares patch ids across the whole divergence, so this
          # needs real history, not a depth-1 clone.
          fetch-depth: 0
          clean: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Drift check
        id: drift
        run: |
          set -uo pipefail
          # NOT `... || true` followed by `$?`: after a pipeline or an
          # `|| true`, `$?` reads 0 and the verdict is lost. scripts/
          # shell_construct_lint.py bans that construct for exactly this
          # reason. if/else captures the real code.
          if python -m scripts.preview_drift_check --remote --fetch --json \
               > drift.json 2> drift.err; then
            code=0
          else
            code=$?
          fi
          cat drift.err >&2 || true
          cat drift.json || true
          verdict="$(python -c 'import json,sys; print(json.load(open("drift.json")).get("verdict","UNKNOWN"))' 2>/dev/null || echo UNKNOWN)"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview drift (remote refs only)"
            echo ""
            echo "verdict: \`${verdict}\` (exit ${code})"
            echo ""
            echo '```json'
            cat drift.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # FOSSIL (exit 2) is a real finding but not a regression: it means the
          # ref needs re-pointing, not that anyone shipped ungated code. It is
          # reported in the ledger comment and does not red the workflow.
          # DRIFT (1) and UNKNOWN (3) do.
          case "$code" in
            0|2) exit 0 ;;
            *) exit "$code" ;;
          esac

  # ---------------------------------------------------------------------------
  # Row 11: requirement status drift (DEVOPS-07, issue #1605). The instrument
  # is `scripts/reqs_cited_unflipped.py` (#1618): it lists every v1 id a merged
  # PR names while the id still reads `pending` in `reqs.json`, which is the
  # visible half of "shipped work whose checkbox never flipped". REQHYG-02
  # makes a behaviour PR carry its ids; nothing makes the `- [ ]` become
  # `- [x]`, and its own text says the markdown half stays agent discipline.
  #
  # WHAT WAS MISSING WAS THE CADENCE, and that is what this job is. Row 11 of
  # docs/ops/periodic-checks.md recorded this report as pasted into a burn-down
  # comment by hand, which is the shape that file itself calls a P0: a cadence
  # with no runs is indistinguishable from a check that does not exist. The
  # report is a REPORT, never a gate -- a docs PR naming an id is a legitimate
  # false positive, which is why the per-PR hard gate is a separate script
  # (`scripts/reqs_flip_gate.py`) with a different rule.
  #
  # UNKNOWN is not zero. The tool exits 2 when `gh` cannot list merged PRs,
  # precisely so an unreadable source is never rendered as "no drift"; a failed
  # read fails this job, and the ledger row then reads FAIL rather than a clean
  # count, because a green over an unmeasured row is the failure the periodic
  # tier exists to prevent.
  # ---------------------------------------------------------------------------
  reqs-drift:
    name: requirement status drift
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.drift.outputs.verdict }}
    # Declaring a block REPLACES the workflow default, so `contents: read` is
    # restated for actions/checkout. `pull-requests: read` is what lets
    # `gh pr list` read the merged PRs this row measures (#1709 hit
    # "Resource not accessible by integration" without it).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # The SHA the window recorded; see the bundle job for why.
          ref: ${{ needs.window.outputs.head }}
          clean: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Requirement status drift
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOW_SINCE: ${{ needs.window.outputs.base_at }}
          WINDOW_UNTIL: ${{ needs.window.outputs.head_at }}
        run: |
          set -uo pipefail
          # Measure the window this run RECORDED, not a rolling week: the window
          # is an interval between two ledger comments, and 50 merges or 7
          # elapsed days (whichever comes first) makes it shorter or longer than
          # seven days often enough that a fixed week either misses the first day
          # of a long window or re-reports merges an earlier window already
          # covered. Both bounds are the ones `window` published above.
          # Bootstrap has no previous comment, so there is no interval to
          # measure and the ad-hoc 7-day slice is the fallback.
          if [ -n "$WINDOW_SINCE" ] && [ -n "$WINDOW_UNTIL" ]; then
            window_args=(--since "$WINDOW_SINCE" --until "$WINDOW_UNTIL")
          else
            window_args=(--days 7)
          fi
          # REQS_JSON_PATH is unset in production, so this is a no-op here: it
          # exists so a test can point the tool at a pinned reqs.json snapshot
          # instead of this repo's live one, whose v1 pending ids keep flipping
          # under it (tests/quality/test_periodic_checks_reqs_drift_row.py).
          if [ -n "${REQS_JSON_PATH:-}" ]; then
            window_args+=(--reqs-path "$REQS_JSON_PATH")
          fi
          # NOT `... || true` followed by `$?`: after either, `$?` reads 0 and
          # the verdict is lost. scripts/shell_construct_lint.py bans that
          # construct for exactly this reason. if/else captures the real code.
          if python -m scripts.reqs_cited_unflipped "${window_args[@]}" > drift.out 2> drift.err; then
            code=0
          else
            code=$?
          fi
          cat drift.err >&2
          cat drift.out

          # The tool's OWN summary line is the measurement, not our grep of its
          # detail lines. A traceback, a partial write or a changed format
          # leaves `declared` empty, and an empty parse falls through to
          # UNKNOWN rather than to a zero -- a clean count rendered from a
          # failed parse is the silent zero this row exists to avoid.
          declared="$(sed -n 's/^\[reqs-cited-unflipped\].*cited pending ids=\([0-9][0-9]*\)$/\1/p' drift.out)"
          ids="$(grep -oE '^  [A-Z][A-Z0-9]*(-[A-Z0-9]+)*-[0-9]+[a-z]?' drift.out | sed 's/^  //' | sort -u)"
          id_total="$(printf '%s\n' "$ids" | grep -c .)"

          if [ "$code" -eq 0 ] && [ -n "$declared" ] && [ "$declared" = "$id_total" ]; then
            if [ "$id_total" = "0" ]; then
              id_list="none"
            elif [ "$id_total" -gt 15 ]; then
              # Truncation is NAMED, never silent: the count above the list is
              # the whole measurement, and the run log carries every line.
              id_list="$(printf '%s\n' "$ids" | head -n 15 | paste -sd', ' -), +$(( id_total - 15 )) more (full list in the run log)"
            else
              id_list="$(printf '%s\n' "$ids" | paste -sd', ' -)"
            fi
            verdict="${id_total} cited pending id(s): ${id_list}"
          else
            verdict="UNKNOWN - NOT MEASURED (exit ${code})"
          fi
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          {
            echo "### Requirement status drift (row 11)"
            echo ""
            echo "verdict: \`${verdict}\`"
            echo ""
            echo '```'
            cat drift.out 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A finding is not a failure: this row reports, a person judges each
          # id against its own acceptance lines. An unreadable source IS, and
          # so is a run that exited 0 with a summary this job could not read:
          # `verdict` above already reads UNKNOWN - NOT MEASURED in that case,
          # and exiting 0 on `code` alone would publish that UNKNOWN into the
          # ledger as a PASS. The exit predicate is therefore the SAME one the
          # verdict branch uses, so the job's status and its verdict can never
          # disagree (issue #1605 review).
          if [ "$code" -eq 0 ] && [ -n "$declared" ] && [ "$declared" = "$id_total" ]; then
            exit 0
          fi
          exit 1

  # ---------------------------------------------------------------------------
  # Row 7: desktop dmg smoke Linux observe (DEVOPS-04, #2352).
  # Headed Mac build/launch/attach cannot run here. This job is the fail-fast
  # wiring Linux can land: the in-repo instrument still refuses zero counts
  # and never calls ship_dmg.sh, and the ledger reports headed evidence as
  # OBSERVED or UNOBSERVED/needs:mac. UNKNOWN (exit 2) reds the job. A missing
  # Mac run is UNOBSERVED, never a silent skip and never a row=7 SHA marker
  # (that marker is owned by ops/dmg-smoke/run.sh on the Air).
  # ---------------------------------------------------------------------------
  dmg-smoke-cadence:
    name: desktop dmg smoke observe
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.observe.outputs.verdict }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.window.outputs.head }}
          clean: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Desktop dmg smoke cadence observe
        id: observe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if python -m scripts.dmg_smoke_cadence_observe \
               --repo "$GITHUB_REPOSITORY" \
               --ledger-issue "$LEDGER_ISSUE" > observe.out 2> observe.err; then
            code=0
          else
            code=$?
          fi
          cat observe.err >&2
          cat observe.out
          declared="$(sed -n 's/^\[dmg-smoke-cadence\] \(.*\)$/\1/p' observe.out | tail -n 1)"
          if [ "$code" -eq 2 ] || [ -z "$declared" ]; then
            verdict="UNKNOWN - NOT MEASURED (exit ${code})"
          else
            verdict="$declared"
          fi
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          {
            echo "### Desktop dmg smoke (row 7)"
            echo ""
            echo "verdict: \`${verdict}\`"
            echo ""
            echo '```'
            cat observe.out 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ] && [ -n "$declared" ]; then
            exit 0
          fi
          exit 1

  # ---------------------------------------------------------------------------
  # Row 14: duplicate-writer / near-duplicate fleet state (DEVOPS-10, #1580).
  # Cheap, no product toolchain: PyYAML plus the committed inventory at
  # ops/fleet/state-files.yaml. Runs every merge window, same as preview-drift
  # and reqs-drift. UNKNOWN (exit 2) is a failed read, never a clean zero.
  # ---------------------------------------------------------------------------
  duplicate-writer:
    name: duplicate-writer (fleet state)
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.window.outputs.head }}
          clean: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Provision duplicate-writer venv
        # Synced from the hash-pinned lock, never resolved (issue #4252). A
        # separate step, so a provisioning failure cannot read as a verdict.
        run: scripts/ci_venv.sh 3.11 --lock ops/fleet/pylock.duplicate-writer.toml

      - name: Duplicate-writer check
        run: |
          set -uo pipefail
          # NOT `... || true` followed by `$?`: after a pipeline or an
          # `|| true`, `$?` reads 0 and the verdict is lost. scripts/
          # shell_construct_lint.py bans that construct for exactly this
          # reason. if/else captures the real code.
          if .venv/bin/python -m scripts.duplicate_writer_check > dupes.out 2> dupes.err; then
            code=0
          else
            code=$?
          fi
          cat dupes.err >&2 || true
          cat dupes.out || true
          {
            echo "### Duplicate-writer (row 14)"
            echo ""
            echo "exit ${code}"
            echo ""
            echo '```'
            cat dupes.out 2>/dev/null
            cat dupes.err 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Findings (1) and UNKNOWN (2) both red the job. A missing inventory
          # must never render as a pass.
          exit "$code"

  # ---------------------------------------------------------------------------
  # Row 8: dependency audit (DEVOPS-01, #1507). Monthly cadence on its own
  # schedule arm, NOT the merge window: a new advisory overnight must not red
  # every open PR. Policy commands live in docs/ops/periodic-checks.md row 8;
  # the instrument is scripts/dependency_audit.py.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: dependency audit (row 8)
    if: >-
      github.event.schedule == '0 6 1 * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.dependency_audit == true)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 45
    outputs:
      verdict: ${{ steps.audit.outputs.verdict }}
      head: ${{ steps.head.outputs.sha }}
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: main
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Resolve main head
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          [ -n "$sha" ] || { echo "::error::could not resolve main"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: A Rust toolchain must be present
        run: |
          command -v cargo >/dev/null || {
            echo "::error::no cargo on PATH - cargo audit cannot run on this runner"
            exit 1
          }
          cargo --version

      - name: Ensure cargo-audit
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: Install JS lockfile trees for pnpm audit
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/webui/frontend install --frozen-lockfile

      - name: Dependency audit
        id: audit
        run: |
          set -uo pipefail
          if python -m scripts.dependency_audit --json "${RUNNER_TEMP}/dependency-audit.json" \
               > "${RUNNER_TEMP}/dependency-audit.txt" 2> "${RUNNER_TEMP}/dependency-audit.err"; then
            code=0
          else
            code=$?
          fi
          cat "${RUNNER_TEMP}/dependency-audit.err" >&2 || true
          cat "${RUNNER_TEMP}/dependency-audit.txt" || true
          summary="$(grep -E '^\[dependency-audit\]' "${RUNNER_TEMP}/dependency-audit.txt" | tail -1 || true)"
          if [ "$code" -eq 3 ]; then
            verdict="UNKNOWN - NOT MEASURED"
          elif [ "$code" -eq 1 ]; then
            verdict="FINDINGS (${summary:-see run log})"
          elif [ "$code" -eq 0 ]; then
            verdict="PASS (${summary:-clean})"
          else
            verdict="UNKNOWN - unexpected exit ${code}"
          fi
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          {
            echo "### Dependency audit (row 8)"
            echo ""
            echo "verdict: \`${verdict}\` (exit ${code})"
            echo ""
            echo '```'
            cat "${RUNNER_TEMP}/dependency-audit.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          exit 1

      - name: Upload audit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ steps.head.outputs.sha }}
          path: |
            ${{ runner.temp }}/dependency-audit.json
            ${{ runner.temp }}/dependency-audit.txt
          if-no-files-found: warn
          retention-days: 2

  dependency-audit-report:
    name: dependency audit ledger (row 8)
    needs: dependency-audit
    if: always() && needs.dependency-audit.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Post row 8 result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LEDGER_ISSUE: "1492"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD: ${{ needs.dependency-audit.outputs.head }}
          VERDICT: ${{ needs.dependency-audit.outputs.verdict }}
          RESULT: ${{ needs.dependency-audit.result }}
        run: |
          set -euo pipefail
          mark() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "CANCELLED" ;;
              skipped) echo "SKIPPED" ;;
              "") echo "NOT RUN" ;;
              *) echo "UNKNOWN ($1)" ;;
            esac
          }
          cat > comment.md <<EOF
          ## Periodic check row 8 (dependency audit)

          - head: \`${HEAD}\`
          - result: $(mark "$RESULT")
          - verdict: \`${VERDICT:-UNKNOWN}\`
          - run: ${RUN_URL}

          Full output is in the workflow log and the \`dependency-audit-${HEAD}\` artifact.

          <!-- periodic-checks row=8 state sha=${HEAD} -->
          EOF
          gh issue comment "${LEDGER_ISSUE:-1492}" --repo "$REPO" --body-file comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Row 10: Windows rekordbox parity (#1508). Own merges:100 window, own
  # ledger marker. Calls windows-parity.yml so a periodic run and a manual
  # dispatch are the same workflow. Timeout stays 30 minutes on the callee;
  # GitHub forbids timeout-minutes on a reusable-workflow caller.
  # ---------------------------------------------------------------------------
  windows-parity:
    name: Windows Rekordbox parity (row 10)
    needs: window
    if: needs.window.outputs.run_windows_parity == 'true'
    uses: ./.github/workflows/windows-parity.yml
    with:
      ref: ${{ needs.window.outputs.head }}
    permissions:
      contents: read

  windows-parity-report:
    name: windows parity ledger (row 10)
    needs: [window, windows-parity]
    if: always() && needs.window.outputs.run_windows_parity == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Post row 10 result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD: ${{ needs.window.outputs.head }}
          BASE: ${{ needs.window.outputs.windows_parity_base }}
          COUNT: ${{ needs.window.outputs.windows_parity_count }}
          REASON: ${{ needs.window.outputs.windows_parity_reason }}
          RESULT: ${{ needs.windows-parity.result }}
        run: |
          set -euo pipefail
          mark() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "CANCELLED" ;;
              skipped) echo "SKIPPED" ;;
              "") echo "NOT RUN" ;;
              *) echo "UNKNOWN ($1)" ;;
            esac
          }
          window_desc="${BASE:0:9}..${HEAD:0:9}"
          [ -n "$BASE" ] || window_desc="bootstrap..${HEAD:0:9}"
          merges="$COUNT"
          [ "$COUNT" != "-1" ] || merges="unknown (bootstrap window)"
          cat > comment.md <<EOF
          ## Periodic check row 10 (Windows parity)

          - window: \`${window_desc}\`
          - merges in window: **${merges}**
          - trigger: ${REASON}
          - result: $(mark "$RESULT")
          - run: ${RUN_URL}

          A FAIL with no job log means GitHub-hosted Windows did not provision
          a runner (hosted OS billing is gated; see windows-parity.yml). That
          is a real miss, not a pass.

          <!-- periodic-checks row=10 state sha=${HEAD} threshold=100 -->
          EOF
          gh issue comment "${LEDGER_ISSUE:-1492}" --repo "$REPO" --body-file comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

  windows-parity-skip-report:
    name: windows parity skip (row 10)
    needs: [window]
    if: always() && needs.window.result == 'success' && needs.window.outputs.run_windows_parity != 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Post row 10 skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD: ${{ needs.window.outputs.head }}
          BASE: ${{ needs.window.outputs.windows_parity_base }}
          COUNT: ${{ needs.window.outputs.windows_parity_count }}
          REASON: ${{ needs.window.outputs.windows_parity_reason }}
        run: |
          set -euo pipefail
          window_desc="${BASE:0:9}..${HEAD:0:9}"
          [ -n "$BASE" ] || window_desc="bootstrap..${HEAD:0:9}"
          merges="$COUNT"
          [ "$COUNT" != "-1" ] || merges="unknown (bootstrap window)"
          cat > comment.md <<EOF
          ## Periodic check row 10 skip (Windows parity)

          - window: \`${window_desc}\`
          - merges in window: **${merges}** (threshold 100)
          - trigger: ${REASON}
          - result: SKIP (merge count under threshold)
          - run: ${RUN_URL}

          A skip is a report, not silence. No row=10 state SHA is recorded.
          EOF
          gh issue comment "${LEDGER_ISSUE:-1492}" --repo "$REPO" --body-file comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # One comment per window on the ledger issue (DEVOPS-03). This is the whole
  # point: a scheduled run attached to no PR is invisible, which is how eight
  # consecutive nightly failures went unnoticed.
  #
  # if: always() so a window that FAILS still records its state SHA. Without
  # that, a red window would be re-measured from the same base forever and the
  # count would grow without bound.
  # ---------------------------------------------------------------------------
  report:
    permissions:
      actions: read
      contents: read
      issues: write
    name: ledger comment
    needs: [window, full-suite, bundle-trend, perf-bench, perf-bench-stem-decode, perf-bench-waveform-render, preview-drift, reqs-drift, dmg-smoke-cadence, duplicate-writer]
    if: always() && needs.window.result == 'success' && needs.window.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # clean: false, like every other self-hosted checkout in this workflow
      # (tests/scripts/test_ci_workspace_reuse.py): same runner, same rule.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: Post the window result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE: ${{ needs.window.outputs.base }}
          BASE_AT: ${{ needs.window.outputs.base_at }}
          HEAD: ${{ needs.window.outputs.head }}
          COUNT: ${{ needs.window.outputs.count }}
          THRESHOLD: ${{ needs.window.outputs.threshold }}
          REASON: ${{ needs.window.outputs.reason }}
          R_FULL: ${{ needs.full-suite.result }}
          R_BUNDLE: ${{ needs.bundle-trend.result }}
          R_PERF: ${{ needs.perf-bench.result }}
          R_PERF_STEM: ${{ needs.perf-bench-stem-decode.result }}
          R_PERF_WAVE: ${{ needs.perf-bench-waveform-render.result }}
          R_DRIFT: ${{ needs.preview-drift.result }}
          V_DRIFT: ${{ needs.preview-drift.outputs.verdict }}
          R_REQS: ${{ needs.reqs-drift.result }}
          V_REQS: ${{ needs.reqs-drift.outputs.verdict }}
          R_DMG: ${{ needs.dmg-smoke-cadence.result }}
          V_DMG: ${{ needs.dmg-smoke-cadence.outputs.verdict }}
          R_DUPES: ${{ needs.duplicate-writer.result }}
        run: |
          set -euo pipefail

          # A job result is one of success / failure / cancelled / skipped. An
          # allowlist, not a "not failure" test: cancelled, skipped and
          # timed_out are NOT passes, and reading them as passes is how a board
          # ends up green while nothing ran.
          mark() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "CANCELLED" ;;
              skipped) echo "SKIPPED" ;;
              "") echo "NOT RUN" ;;
              *) echo "UNKNOWN ($1)" ;;
            esac
          }

          # Row 2 runs on its own clock in e2e.yml, so its verdict is READ, not
          # re-run. A workflow with no scheduled run at all reports NO RUNS
          # rather than passing by absence.
          #
          # --repo is REQUIRED here: this job has no checkout, so gh has no
          # repository to infer and the call dies with "failed to determine
          # base repo". With stderr dropped and `|| true`, that read as "no
          # scheduled runs" every window and hid the very nightly failures
          # this row exists to surface. A FAILED QUERY is not a finding, so
          # the two outcomes are now distinct and stderr is shown.
          # `.[]`, not `.[0]`: on an empty array `.[0]` yields null and jq
          # renders "in progress (null) null", a non-empty line for zero runs.
          #
          # `--created` is REQUIRED, not cosmetic: e2e.yml's own nightly clock
          # is what this row reports on, and without a recency floor
          # `--limit 1` returns the newest run EVER, scheduled or not skipped
          # for days. That reads as a fresh PASS indefinitely once the
          # schedule itself stops firing, which is exactly the silent-failure
          # shape row 2 exists to catch. e2e.yml runs nightly at 04:17 UTC;
          # a 48h floor tolerates one missed night without ever accepting a
          # genuinely stale result as current.
          #
          # The cutoff is a full timestamp, not `+%F` (date-only): a
          # date-only floor is midnight of that calendar date, not "48h ago",
          # so at this workflow's 05:40 UTC start `+%F` on "2 days ago" is
          # ~53h40m back and lets a third-night-old run still match. `+%FT%TZ`
          # pins the floor to exactly 48h before this run started.
          #
          # `--status completed` is REQUIRED (r3974766506): without it,
          # `--limit 1` can select the 04:17 run while it is STILL QUEUED OR
          # RUNNING at this window's start, whose null conclusion rendered as
          # "in progress" -- and then the NEXT window's `--limit 1` moves on
          # to a newer scheduled run and never looks at that one again. A run
          # that later fails after this window already reported "in
          # progress" on it was then never revisited by any later window,
          # exactly the silent-failure shape this row exists to catch.
          # Restricting to completed runs means this row always reports the
          # last run that actually FINISHED within the floor, so a run is
          # only ever reported once it has a real conclusion to show, and
          # nothing in flight gets silently abandoned.
          #
          # `--limit 30`, not `1` (r3974912528): `--status completed` alone
          # still lets a FAILURE go unreported if two nightly runs complete
          # between two windows -- night N is still running at this window's
          # start (so `--status completed --limit 1` returns night N-1's
          # PASS instead), night N then FAILS, and by the time the NEXT
          # window runs, night N+1 has ALSO completed, so `--limit 1` returns
          # N+1 and N's failure is never seen by any window. Fetching every
          # completed run within the floor below (at most one a night, so
          # even a month-long gap stays well under 30) and preferring the
          # newest FAILURE over the newest PASS means a failure inside the
          # floor is always surfaced, even if a later run already passed
          # again.
          #
          # The floor itself is the PREVIOUS window's own timestamp
          # (`BASE_AT`, the state marker comment's `created_at`), not a fixed
          # 48h (r3975092357): this workflow's own cadence can go up to 7
          # DAYS between windows (the weekly floor OR-arm above, PR #1494),
          # so a fixed 48h floor left every night before the last 2 silently
          # uncovered whenever a quiet week pushed windows further apart than
          # that -- a failure on night 3 of a 7-night gap, later followed by
          # a pass, aged out unseen by BOTH the window that missed it and
          # every later one. Anchoring the floor to the actual last report
          # closes that gap exactly, with no assumption about how far apart
          # windows can get. `BASE_AT` is only empty together with `BASE` on
          # a bootstrap window (no prior report to anchor to), where a 48h
          # floor is a reasonable first measurement with nothing before it to
          # miss.
          e2e_created_floor="$(date -u -d '2 days ago' +%FT%TZ)"
          if [ -n "${BASE_AT:-}" ]; then
            e2e_created_floor="$(date -u -d "$BASE_AT" +%FT%TZ)"
          fi

          # r3975509887: `gh run list` only ever exposes the WHOLE RUN's
          # conclusion, but e2e.yml's `extended` job runs `needs: gate` /
          # `if: !cancelled()` -- ordered after `gate`, not gated on its
          # success, specifically so the nightly full suite still runs (and
          # can PASS) even when `gate` fails. Reading the run-level
          # conclusion therefore reports `gate`'s pass/fail, not row 2's own
          # subject, and can print a clean PASS for a night the extended
          # suite never even completed, or a FAIL for a night it passed fine.
          # `gh run list --json` has no per-job field at all (its own field
          # list omits `jobs` entirely), so each candidate run needs a
          # separate `gh api .../jobs` call to read the `extended` job's OWN
          # conclusion. A run whose jobs listing has no `extended` job at all
          # reads as "MISSING", not a pass -- absence is not success.
          e2e_job_query_failed=""
          if e2e_runs="$(gh run list --repo "$REPO" --workflow e2e.yml \
                           --event schedule --status completed --limit 30 \
                           --created ">=$e2e_created_floor" \
                           --json databaseId,createdAt,url \
                         2>e2e.err)"; then
            e2e_candidates="[]"
            while IFS=$'\t' read -r run_id created url; do
              [ -n "$run_id" ] || continue
              if job_conclusion="$(gh api "repos/$REPO/actions/runs/$run_id/jobs" \
                                     --jq '.jobs[] | select(.name == "e2e extended (nightly)") | .conclusion' \
                                   2>e2e_job.err)"; then
                [ -n "$job_conclusion" ] || job_conclusion="MISSING"
                e2e_candidates="$(jq -c --arg c "$job_conclusion" --arg t "$created" --arg u "$url" \
                                    '. + [{"conclusion": $c, "createdAt": $t, "url": $u}]' <<<"$e2e_candidates")"
              else
                cat e2e_job.err >&2
                e2e_job_query_failed=1
                break
              fi
            done < <(jq -r '.[] | [(.databaseId|tostring), .createdAt, .url] | @tsv' <<<"$e2e_runs")
          else
            cat e2e.err >&2
            e2e_job_query_failed=1
          fi

          if [ -n "$e2e_job_query_failed" ]; then
            e2e_line="QUERY FAILED - this row was NOT measured (see run log)"
          else
            e2e_line="$(jq -r 'def fails: map(select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"));
                                if length == 0 then empty else
                                  ((fails | sort_by(.createdAt) | last) // (sort_by(.createdAt) | last))
                                  | "\(.conclusion) (\(.createdAt)) \(.url)"
                                end' <<<"$e2e_candidates")"
            [ -n "$e2e_line" ] || e2e_line="NO COMPLETED SCHEDULED RUNS FOUND (or none within the last 2 days)"
          fi

          window_desc="${BASE:0:9}..${HEAD:0:9}"
          [ -n "$BASE" ] || window_desc="bootstrap..${HEAD:0:9}"
          merges="$COUNT"
          [ "$COUNT" != "-1" ] || merges="unknown (bootstrap window)"

          # DEVOPS-03 P0/P1: AFTER window_desc so the e2e_line extraction
          # tests still see the raw conclusion, not the alarm prefix.
          alarm=""
          if [ -z "${e2e_job_query_failed:-}" ]; then
            printf '%s' "${e2e_candidates:-[]}" > e2e_candidates.json
            alarm="$(python3 -m scripts.periodic_window alarm \
                      --candidates-file e2e_candidates.json \
                      --cadence-seconds 86400 \
                      --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
          fi

          cat > comment.md <<EOF
          ## Periodic check window \`${window_desc}\`

          - merges in window: **${merges}**
          - trigger: ${REASON}
          - run: ${RUN_URL}

          | Row | Check | Result |
          |---|---|---|
          | 1 | full pytest suite incl. slow markers | $(mark "$R_FULL") |
          | 2 | e2e extended (own nightly clock) | ${e2e_line} |
          | 4 | bundle size trend | $(mark "$R_BUNDLE") |
          | 5 | perf bench (boot burst) | $(mark "$R_PERF") |
          | 6 | perf bench (stem decode) | $(mark "$R_PERF_STEM") |
          | 6 | perf bench (waveform render) | $(mark "$R_PERF_WAVE") |
          | 7 | desktop dmg smoke (Linux observe; headed attach needs:mac) | $(mark "$R_DMG") verdict \`${V_DMG:-UNKNOWN}\` |
          | 9 | preview drift (remote refs) | $(mark "$R_DRIFT") verdict \`${V_DRIFT:-UNKNOWN}\` |
          | 11 | requirement status drift (cited but unflipped) | $(mark "$R_REQS") verdict \`${V_REQS:-UNKNOWN}\` |
          | 14 | duplicate-writer (fleet state inventory) | $(mark "$R_DUPES") |

          Rows 3 and 8: see \`docs/ops/periodic-checks.md\`. Row 7 Linux
          observe is in this table; headed Mac attach stays needs:mac until
          \`com.af.dmg-smoke\` is loaded. Row 10 (Windows parity) posts its
          own ledger comment when its merges:100 window fires. A row absent
          from this table did not run and must not be read as passing.
          $( [ -z "$alarm" ] || printf '\n**%s**\n' "$alarm" )

          <!-- periodic-checks state sha=${HEAD} threshold=${THRESHOLD} -->
          EOF

          gh issue comment "$LEDGER_ISSUE" --repo "$REPO" --body-file comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

  skip-report:
    name: ledger skip comment
    needs: [window]
    if: always() && needs.window.result == 'success' && needs.window.outputs.run != 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Post the skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE: ${{ needs.window.outputs.base }}
          HEAD: ${{ needs.window.outputs.head }}
          COUNT: ${{ needs.window.outputs.count }}
          THRESHOLD: ${{ needs.window.outputs.threshold }}
          REASON: ${{ needs.window.outputs.reason }}
        run: |
          set -euo pipefail
          window_desc="${BASE:0:9}..${HEAD:0:9}"
          [ -n "$BASE" ] || window_desc="bootstrap..${HEAD:0:9}"
          merges="$COUNT"
          [ "$COUNT" != "-1" ] || merges="unknown (bootstrap window)"
          cat > comment.md <<EOF
          ## Periodic check window skip \`${window_desc}\`

          - merges in window: **${merges}** (threshold ${THRESHOLD})
          - trigger: ${REASON}
          - result: SKIP (merge count under threshold)
          - run: ${RUN_URL}

          A skip is a report, not silence. No state SHA is recorded, so the
          next window re-measures from the same base.
          EOF
          gh issue comment "$LEDGER_ISSUE" --repo "$REPO" --body-file comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
