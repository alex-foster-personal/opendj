name: macOS Desktop Compile

# Type-check the Open DJ desktop Tauri shell on macOS for every change under
# apps/desktop/**. Linux cargo test in ci.yml (DEVLOOP-05) never compiles
# macOS-only code paths such as launch.rs's #[cfg(not(target_os = "linux"))]
# block, which is how PR #2950's E0716 shipped green (issue #2975, DEVOPS-12).
#
# This is a compile gate only. Payload provenance, signing, and dmg smoke stay in
# macos-packaging.yml and the human-gated just dmg path (DEVOPS-04).

on:
  push:
    branches:
      - main
    paths:
      - apps/desktop/**
      - .github/workflows/macos-desktop-compile.yml
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/macos-desktop-compile.yml
  create:
  workflow_dispatch:

concurrency:
  group: macos-desktop-compile-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-compile:
    name: desktop shell cargo check
    # Self-hosted macOS pool since Thu 15 Oct 2026 (hosted-runner exit, issue #5638):
    # vars.CI_RUNS_ON_MAC_LIGHT = ["self-hosted","macOS","mac-light"], any of the four
    # fleet Macs (megamac X64, the Air, DL, airgap ARM64). A compile gate has no arch
    # need. Unset variable = the hosted macos-14 fallback.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_MAC_LIGHT || '"macos-14"') }}
    # 15, not 5: a cold check on megamac's 2013 Xeon takes several minutes. target/
    # persists in the self-hosted workspace, so steady state stays near hosted speed.
    timeout-minutes: 15
    # Hosted spend is the maintainer-gated: same CI_HOSTED_OS_JOBS switch as
    # macos-packaging.yml. The variable arm is conjoined with push/PR only so
    # branch `create` events do not bill macOS minutes when the switch is on.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (vars.CI_HOSTED_OS_JOBS == 'true'
      && (github.event_name == 'push' || github.event_name == 'pull_request'))

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Persistent self-hosted workspace contract (tests/scripts/test_ci_workspace_reuse.py):
          # full history, and clean: false so target/ survives; the next step removes the rest.
          fetch-depth: 0
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251), required on every self-hosted checkout job.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          toolchain: "1.96.0"

      # Cache only under apps/desktop/src-tauri/target (not Linux target dirs).
      # Hosted only: a self-hosted Mac keeps target/ in its persistent workspace.
      - name: Restore cargo cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: macos-desktop-compile-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-desktop-compile-

      - name: Cargo check opendj-desktop (macOS shell compile gate)
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/src-tauri/payload
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "### Desktop shell cargo check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- started (UTC): $started" >> "$GITHUB_STEP_SUMMARY"
          scripts/ci_cargo_selfheal.sh apps/desktop/src-tauri/Cargo.toml dev \
            cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --bin opendj-desktop
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "- finished (UTC): $finished" >> "$GITHUB_STEP_SUMMARY"
