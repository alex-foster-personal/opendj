name: macOS Desktop Compile

# Type-check the Open DJ desktop Tauri shell on macOS for every change under
# apps/desktop/**. Linux cargo test in ci.yml (DEVLOOP-05) never compiles
# macOS-only code paths such as launch.rs's #[cfg(not(target_os = "linux"))]
# block, which is how PR #2950's E0716 shipped green (issue #2975, DEVOPS-12).
#
# This is a compile gate only. Payload provenance, signing, and dmg smoke stay in
# macos-packaging.yml and the human-gated just dmg path (DEVOPS-04).

on:
  push:
    branches:
      - main
    paths:
      - apps/desktop/**
      - .github/workflows/macos-desktop-compile.yml
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/macos-desktop-compile.yml
  create:
  workflow_dispatch:

concurrency:
  group: macos-desktop-compile-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-compile:
    name: desktop shell cargo check
    runs-on: macos-14
    timeout-minutes: 5
    # Hosted spend is the maintainer-gated: same CI_HOSTED_OS_JOBS switch as
    # macos-packaging.yml. The variable arm is conjoined with push/PR only so
    # branch `create` events do not bill macOS minutes when the switch is on.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (vars.CI_HOSTED_OS_JOBS == 'true'
      && (github.event_name == 'push' || github.event_name == 'pull_request'))

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          clean: true

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          toolchain: "1.96.0"

      # Cache only under apps/desktop/src-tauri/target (not Linux target dirs).
      - name: Restore cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: macos-desktop-compile-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-desktop-compile-

      - name: Cargo check opendj-desktop (macOS shell compile gate)
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/src-tauri/payload
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "### Desktop shell cargo check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- started (UTC): $started" >> "$GITHUB_STEP_SUMMARY"
          scripts/ci_cargo_selfheal.sh apps/desktop/src-tauri/Cargo.toml dev \
            cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --bin opendj-desktop
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "- finished (UTC): $finished" >> "$GITHUB_STEP_SUMMARY"
