name: Lockfile check

# pyproject.toml and uv.lock must agree. Renovate security PR #2740 raised
# pytest in pyproject.toml but could not regenerate uv.lock (Renovate
# commented "Artifact update problem"), and it merged anyway: from then on,
# `uv sync --extra dev` on main failed to resolve for every agent
# (Mon 14 Sep 2026). This job fails such a PR in seconds instead.
#
# Report-only, like every check here (ADR-0043). Fleet merges treat completed
# checks as binding once ADR-0042 follow-up F1 lands.
#
# Two jobs, two halves of "agree":
# - `uv-lock` (GitHub-hosted, gated on hosted billing): `uv lock --check`, the
#   full resolution against the index. Skipped while hosted Actions are
#   blocked on billing, and a skip is unavailable evidence, not a verdict.
# - `lock-metadata` (self-hosted pool, never gated): the metadata half, which
#   is the #2740 shape. uv.lock records the root package's requires-dist
#   verbatim from pyproject.toml at the last `uv lock`, so a pyproject.toml
#   edit without a `uv lock` differs from it. scripts/lock_metadata_check.py
#   compares the two with tomllib alone: no resolution, no network, no
#   environment, no package code, which is what makes it safe on a persistent
#   runner where `uv lock --check` is not (Codex P1 on #3763). It cannot see
#   pinned versions gone stale with pyproject.toml unchanged; that stays the
#   hosted job's half.

# uv.toml is on both lists because it outranks [tool.uv] for every setting the
# metadata job compares, so a PR that adds or edits it changes what `uv lock`
# resolves without touching either file the job reads; the job then reports
# UNKNOWN (scripts/lock_settings.py refuse_uv_toml) rather than not running at
# all (Codex P2 on #3763, round 57).
on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - uv.toml
      - .github/workflows/lockfile-check.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - uv.toml

permissions:
  contents: read

env:
  # Keep .pyc out of the persistent self-hosted workspace (#1338).
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: lockfile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uv-lock:
    name: uv.lock matches pyproject.toml
    # GitHub-hosted on purpose: resolving a dependency PR can build sdists,
    # which runs package code, and that must not happen on the persistent
    # self-hosted runners (docs/security/ci-supply-chain.md).
    #
    # Hosted availability is separate from a lockfile verdict; skipped remains unavailable.
    if: vars.CI_HOSTED_LOCKFILE_CHECK == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
      - name: uv lock --check
        run: uv lock --check

  lock-metadata:
    name: uv.lock metadata matches pyproject.toml (no resolution)
    # Self-hosted on purpose: this job resolves nothing and runs no package
    # code (stdlib tomllib over two files), so the sdist exposure that keeps
    # `uv lock --check` hosted does not apply, and it stays fail-closed while
    # hosted billing is blocked. tests/scripts/test_lockfile_check_gate.py
    # pins that it is never gated.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled checkout can leave locks; require no live workspace git.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # Full history so origin/main is current enough for the ancestry guard
      # (issue #3513). edited below re-runs body declarations; ancestry catches
      # stale synthetic merge refs that predate trunk ADR fixes.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: uv.lock metadata matches pyproject.toml
        # Exit 1 = stale (each odd requirement named). Exit 2 = the check
        # could not measure (no root package, an uncomparable requirement),
        # which is never a pass.
        timeout-minutes: 1
        run: python -m scripts.lock_metadata_check
