name: Trunk quarantine review

# FIRST OBSERVED QUARANTINED age, never provider entry/statusSince age.
# Supersedes: the blocked quarantine-entry candidate parser. The tracker body
# persists observations for EVERY current test ID from its first successful read.
# Complete paged snapshots remove absent IDs; API/read/schema failures write nothing.
# Observation span is not proof of uninterrupted quarantine between weekly reads.
# Same org-token isolation as ci.yml: hosted runner, no checkout/actions.

on:
  schedule:
    # Mondays 07:10 UTC.
    - cron: "10 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the issue body instead of writing the issue"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: trunk-quarantine-review
  cancel-in-progress: false

jobs:
  review:
    name: First observed quarantined over 7 days (tracking issue)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: List long-quarantined tests and update the tracking issue
        id: review
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
          TRUNK_API_URL: https://api.trunk.io
          TRUNK_TEST_COLLECTION_ID: dViMBgFA
          MAX_AGE_DAYS: "7"
          ISSUE_TITLE: "Trunk quarantine review: tests quarantined over 7 days"
          AF_SERVICE_ID: com.opendj.quarantine-review
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          trap 'echo "::error title=Trunk quarantine review::read/validation/write failed; observation history was not inferred"' ERR
          : "${TRUNK_API_TOKEN:?TRUNK_API_TOKEN is not provisioned}"
          pages_dir=$(mktemp -d)
          trap 'rm -rf "$pages_dir"' EXIT
          trunk_get() {
            local out=$1 path=$2; shift 2
            if ! curl --get --silent --show-error --fail-with-body --max-time 20 --retry 2 \
                --header "Authorization: Bearer ${TRUNK_API_TOKEN}" "$@" \
                "${TRUNK_API_URL}${path}" > "$out"; then
              echo "::error title=Trunk quarantine review::GET ${path} failed: $(head -c 300 "$out" | tr -d '\n')"
              exit 1
            fi
          }
          # BODY-SIZE-CHECK-BEGIN: conservative operator budget, not a measured provider limit.
          check_issue_body_size() {
            local body_bytes
            body_bytes=$(jq -Rs 'utf8bytelength' "$1")
            if [ "$body_bytes" -gt 60000 ]; then
              echo "::error title=Trunk quarantine review::ISSUE_BODY_BUDGET_EXCEEDED: ${body_bytes} UTF-8 bytes exceeds the 60000-byte operator budget; no issue changed and no IDs dropped. Reduce the quarantine incident or design reviewed ledger partitioning before retrying."
              return 1
            fi
          }
          # BODY-SIZE-CHECK-END
          # An unknown testCollectionId on /v2/tests answers 200 with an empty list; this read 404s instead.
          trunk_get "${pages_dir}/collection.json" "/v2/test-collections/${TRUNK_TEST_COLLECTION_ID}"
          cursor=""
          for page in $(seq 1 21); do
            [ "$page" -le 20 ] || { echo "::error title=Trunk quarantine review::more than 20 pages"; exit 1; }
            args=(--data-urlencode "testCollectionId=${TRUNK_TEST_COLLECTION_ID}"
              --data-urlencode "quarantineState=quarantined" --data-urlencode "limit=100")
            [ -z "$cursor" ] || args+=(--data-urlencode "cursor=${cursor}")
            out="${pages_dir}/page-${page}.json"
            trunk_get "$out" /v2/tests "${args[@]}"
            jq -e '.data | type == "array"' "$out" > /dev/null || {
              echo "::error title=Trunk quarantine review::page ${page} has no data array: $(head -c 300 "$out")"
              exit 1
            }
            [ "$(jq -r '.hasMore' "$out")" = "true" ] || break
            cursor=$(jq -r '.nextCursor // empty' "$out")
            [ -n "$cursor" ] || { echo "::error title=Trunk quarantine review::hasMore without a nextCursor"; exit 1; }
          done
          # Verify a complete snapshot before reading or mutating persistent state.
          jq -e --arg collection "$TRUNK_TEST_COLLECTION_ID" '.id == $collection' "${pages_dir}/collection.json" > /dev/null
          jq -e -s '
            # SNAPSHOT-VALIDATION-BEGIN
            all(.[]; (.hasMore | type) == "boolean"
              and (.total | type) == "number" and .total >= 0 and (.total | floor) == .total)
            and ([.[].total] | unique | length) == 1
            and ([.[].data[]] | length) == .[0].total
            and ([.[].data[]] as $rows | all($rows[];
              (.id | type) == "string" and (.id | length) > 0
              and .quarantineState == "quarantined"
              and (.name | type) == "string"
              and (.className | type) == "string")
              and ($rows | length) == ($rows | map(.id) | unique | length))
            # SNAPSHOT-VALIDATION-END
          ' "${pages_dir}"/page-*.json > /dev/null
          now_epoch=$(jq -nr 'now | floor')
          # Read all issues, including closed ones, avoiding search-index lag/limits.
          : "${GH_REPO:?GH_REPO is required for the canonical observation ledger}"
          gh api --paginate --slurp "repos/${GH_REPO}/issues?state=all&per_page=100" > "${pages_dir}/issues.json"
          jq -c --arg title "$ISSUE_TITLE" '[.[][] | select(.pull_request == null and .title == $title)]' \
            "${pages_dir}/issues.json" > "${pages_dir}/trackers.json"
          tracker_count=$(jq length "${pages_dir}/trackers.json")
          [ "$tracker_count" -le 1 ] || { echo "::error title=Trunk quarantine review::multiple exact-title trackers; no issue changed"; exit 1; }
          issue=$(jq -r '.[0].number // empty' "${pages_dir}/trackers.json")
          ledger_prefix='<!-- trunk-quarantine-observations-v1 '
          # TRACKER-OWNERSHIP-BEGIN
          if [ -n "$issue" ]; then
            # Only this workflow's own tracker is ever edited, and only with its ledger
            # intact. A first run is "no exact-title issue at all". An exact-title issue
            # without the ownership marker on its first line, or without exactly one
            # ledger marker, is someone else's issue or a damaged tracker: stop before
            # any write rather than replace its body or reset every observation age.
            jq -r '.[0].body // ""' "${pages_dir}/trackers.json" > "${pages_dir}/previous-body.md"
            owner_line=$(head -n 1 "${pages_dir}/previous-body.md" | tr -d '\r')
            [ "$owner_line" = "<!-- trunk-quarantine-review -->" ] || {
              echo "::error title=Trunk quarantine review::issue #${issue} has the tracker title but not this workflow's ownership marker; no issue changed"; exit 1;
            }
            markers=$(awk '/<!-- trunk-quarantine-observations/ {n++} END {print n+0}' "${pages_dir}/previous-body.md")
            [ "$markers" -eq 1 ] || { echo "::error::issue #${issue} carries ${markers} observation ledger markers, not 1; no issue changed"; exit 1; }
            sed -n 's/^<!-- trunk-quarantine-observations-v1 \(.*\) -->$/\1/p' "${pages_dir}/previous-body.md" > "${pages_dir}/ledger.json"
            [ -s "${pages_dir}/ledger.json" ] || { echo "::error::invalid observation ledger marker; no issue changed"; exit 1; }
          fi
          # TRACKER-OWNERSHIP-END
          if [ ! -f "${pages_dir}/ledger.json" ]; then
            jq -n --arg repo "$GH_REPO" --arg collection "$TRUNK_TEST_COLLECTION_ID" \
              '{schema:1,repository:$repo,collectionId:$collection,observedAtEpoch:0,tests:{}}' > "${pages_dir}/ledger.json"
          fi
          # Schema/provenance and clock checks prevent invented/cross-repo history.
          jq -e -s --arg repo "$GH_REPO" --arg collection "$TRUNK_TEST_COLLECTION_ID" --argjson now "$now_epoch" '
            # LEDGER-VALIDATION-BEGIN
            if length != 1 then error("observation ledger must contain exactly one JSON document")
            else .[0] end
            | type == "object" and (keys | sort) == ["collectionId","observedAtEpoch","repository","schema","tests"]
            and .schema == 1 and .repository == $repo and .collectionId == $collection
            and (.observedAtEpoch | type) == "number" and .observedAtEpoch >= 0
            and .observedAtEpoch <= $now and (.observedAtEpoch | floor) == .observedAtEpoch
            and (.tests | type) == "object"
            and (.observedAtEpoch as $last | all(.tests | to_entries[];
              (.key | length) > 0 and (.value | type) == "number"
              and .value > 0 and .value <= $last and (.value | floor) == .value))
            # LEDGER-VALIDATION-END
          ' "${pages_dir}/ledger.json" > /dev/null || {
            echo "::error title=Trunk quarantine review::invalid observation ledger schema/provenance/clock; no issue changed"; exit 1;
          }
          jq -c -s --slurpfile previous "${pages_dir}/ledger.json" --argjson now "$now_epoch" '
            # OBSERVATION-PARSER-BEGIN: actual collection snapshot, no failure-history age.
            [.[].data[]] as $rows
            | $previous[0] | .observedAtEpoch = $now
            | .tests as $old
            | .tests = ($rows | map({key:.id,value:($old[.id] // $now)}) | from_entries)
            # OBSERVATION-PARSER-END
          ' "${pages_dir}"/page-*.json > "${pages_dir}/next-ledger.json"
          cutoff_epoch=$(jq -nr --argjson days "$MAX_AGE_DAYS" --argjson now "$now_epoch" '$now - $days * 86400')
          jq -c -s --slurpfile ledger "${pages_dir}/next-ledger.json" --argjson cutoff "$cutoff_epoch" '
            [.[].data[] | . + {firstObservedEpoch:$ledger[0].tests[.id]}
              | select(.firstObservedEpoch < $cutoff)] | sort_by(.firstObservedEpoch)
          ' "${pages_dir}"/page-*.json > "${pages_dir}/stale.json"
          total=$(jq '.tests | length' "${pages_dir}/next-ledger.json")
          old=$(jq length "${pages_dir}/stale.json")
          echo "Quarantined tests: ${total}; FIRST OBSERVED QUARANTINED over ${MAX_AGE_DAYS} days: ${old} (collection $(jq -r .name "${pages_dir}/collection.json"))"
          body="${RUNNER_TEMP:-$pages_dir}/issue-body.md"
          {
            echo "<!-- trunk-quarantine-review -->"
            echo "FIRST OBSERVED QUARANTINED review as of $(jq -nr --argjson now "$now_epoch" '$now | todate')."
            echo "Current quarantined tests: ${total}. First observed over ${MAX_AGE_DAYS} days ago: ${old}."
            echo "Age measures the span since this review first observed a test ID quarantined. It is not exact quarantine-entry age, statusSince age, or proof of uninterrupted quarantine between observations. Missing history starts now; complete snapshots reset IDs that disappear and later return."
            echo "Every current ID is recorded from its first observation, including tests below the threshold. Failed fetches/read validation and dry runs preserve the stored ledger."
            echo
            echo "Each listed test needs an issue to fix it, or removal. Generated by .github/workflows/trunk-quarantine-review.yml (CIQUAR-03)."
            echo
            echo '| Test ID | Test | Class | FIRST OBSERVED QUARANTINED |'
            echo '|---------|------|-------|----------------------------|'
            jq -r 'def cell: tostring | gsub("[\\r\\n|`]"; " "); .[] | "| \(.id | cell) | \(.name | cell) | \(.className | cell) | \(.firstObservedEpoch | todate) |"' "${pages_dir}/stale.json"
            echo
            echo "${ledger_prefix}$(cat "${pages_dir}/next-ledger.json") -->"
          } > "$body"
          check_issue_body_size "$body"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: the tracking issue body would be:"
            cat "$body"
            exit 0
          fi
          # Persist EVERY first observation immediately, even when no test is old.
          # Below-threshold state lives in the same canonical closed tracker.
          if [ -z "$issue" ] && [ "$total" -eq 0 ]; then
            echo "No observations and no tracker; nothing to write."
            exit 0
          fi
          if [ -z "$issue" ]; then
            issue=$(gh issue create --title "$ISSUE_TITLE" --body-file "$body")
          else
            gh issue edit "$issue" --body-file "$body"
          fi
          state=$(gh issue view "$issue" --json state --jq .state)
          if [ "$old" -gt 0 ] && [ "$state" = "CLOSED" ]; then
            gh issue reopen "$issue"
          elif [ "$old" -eq 0 ] && [ "$state" = "OPEN" ]; then
            gh issue close "$issue" --comment "No test currently observed quarantined has a first-observed span over ${MAX_AGE_DAYS} days. Observation ledger retained."
          fi
