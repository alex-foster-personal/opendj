name: Build docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex--v2-integration]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA-pinned to the v4 tag commit (resolved 2026-04-17).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      # SHA-pinned to the v5 tag commit (resolved 2026-04-17).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install docs deps
        run: pip install -r requirements-docs.txt
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        # SHA-pinned to the v3 tag commit (resolved 2026-04-17).
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    needs: build
    # Deploy is best-effort: GitHub Pages may not be enabled at the repo level
    # yet (actions/deploy-pages returns 404 until Settings -> Pages is turned on).
    # Strict mkdocs build above is the CI gate; deploy failing must not block
    # the integration branch.
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        # SHA-pinned to the v4 tag commit (resolved 2026-04-17).
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
