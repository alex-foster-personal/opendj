name: Durations ledger (main)

# The shard durations ledger is built on main, published as an artifact, and
# installed by ci.yml before the fast lane splits (scripts/ci_durations_ledger.py
# has the whole contract). A PR never commits `.test_durations` to refresh it:
# that was the only route until Fri 2 Oct 2026, every refresh PR (#4699, #5048)
# conflicted with every other one, and a stale ledger bounced the whole merge
# queue (#5063). The committed file stays as the seed a run falls back to when
# no published ledger exists.
#
# No bot commit: only the Trunk app may write main (debt-index-regen.yml fails
# for exactly that reason), so the ledger travels as an artifact. Retention is
# 7 days; a schedule that stops for longer degrades CI to the committed seed,
# loudly (ci.yml's scope job warns), never to a smaller run.
#
# Supersedes: the hand-made refresh PR that committed a new `.test_durations`
# (the "Refresh procedure" in ops/test-latency/README.md, round 4; #4699, #5048).
# That section now redirects here and keeps the recipe only to refresh the seed
# when no published ledger exists. Decision record:
# docs/decisions/ADR-NEW-durations-ledger-built-on-main-as-an-artifact.md.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"

permissions:
  actions: read
  contents: read

concurrency:
  group: durations-ledger
  cancel-in-progress: false

jobs:
  regenerate:
    name: Build the shard durations ledger from main
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    # A checkout, a handful of API calls and five small downloads; capped so
    # the cost guard can price this workflow (tests/test_ci_cost_guard.py).
    timeout-minutes: 10
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The committed seed and the script come from main, whatever ref a
          # manual dispatch names.
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): every self-hosted job that checks out
      # the repo runs it; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      - name: Union the newest main run's five shard durations
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m scripts.ci_durations_ledger build \
            --repo "$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/durations-ledger/.test_durations"

      - name: Publish the ledger for ci.yml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations-ledger
          path: ${{ runner.temp }}/durations-ledger/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
