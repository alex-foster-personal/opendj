name: macOS Native Companion

# Build the production native waveform wheel on hosted macOS only when its
# result is release-relevant. Automatic runs are limited to wheel-impacting
# changes on main and release branches. A v* tag push reaches the job condition
# below, while workflow_dispatch keeps the gate available for any ref.

on:
  push:
    branches:
      - main
      - release/*
    # A v* tag push always runs: GitHub does not evaluate path filters for tag
    # pushes. This replaced a `create` trigger that started a skipped run on
    # every branch creation (ADR-NEW-macos-release-cut-on-tag-push).
    tags:
      - "v*"
    paths:
      - apps/analysis_waveform/**
      - apps/webui/server/native/waveform/**
      - apps/webui/server/rb_vendor.py
      - apps/webui/server/rb_vendor_pkg/**
      - scripts/check_waveform_native_wheel.py
      - scripts/check_waveform_installed_consumer.py
      - apps/sync/usb/pioneer/fixture_resolver.py
      - tests/fixtures/rb-usb-export.manifest.json
      - (private path)
      - Makefile
      - MANIFEST.in
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - .github/workflows/macos-native-companion.yml
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - apps/analysis_waveform/**
      - apps/webui/server/native/waveform/**
      - apps/webui/server/rb_vendor.py
      - apps/webui/server/rb_vendor_pkg/**
      - scripts/check_waveform_native_wheel.py
      - scripts/check_waveform_installed_consumer.py
      - apps/sync/usb/pioneer/fixture_resolver.py
      - tests/fixtures/rb-usb-export.manifest.json
      - (private path)
      - Makefile
      - MANIFEST.in
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - .github/workflows/macos-native-companion.yml
  workflow_dispatch:

concurrency:
  group: macos-native-companion-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  # Every main and tag push gets a SHA-specific group, so a later push cannot
  # cancel its predecessor. Pull requests and manual reruns keep a shared ref
  # group and cancel superseded work.
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_ARTIFACT_R2_ACCOUNT_ID: ${{ secrets.ARTIFACT_ARCHIVE_R2_ACCOUNT_ID }}
  CI_ARTIFACT_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_ARCHIVE_R2_ACCESS_KEY_ID }}
  CI_ARTIFACT_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_ARCHIVE_R2_SECRET_ACCESS_KEY }}
  CI_ARTIFACT_R2_BUCKET: ${{ vars.ARTIFACT_ARCHIVE_R2_BUCKET }}

jobs:
  macos-native-companion:
    name: macOS native companion wheel
    # Self-hosted macOS pool since Thu 15 Oct 2026 (hosted-runner exit, issue #5638).
    # vars.CI_RUNS_ON_MAC_ARM64 = ["self-hosted","macOS","ARM64","mac-light"]: the
    # wheel it proves is the arm64 production wheel, so megamac (X64) is excluded.
    # The fleet runners carry the ANLZ fixtures at MUX_FIXTURE_HOST (runner .env).
    # Unset variable = the hosted macos-14 fallback.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_MAC_ARM64 || '"macos-14"') }}
    timeout-minutes: 20
    # The canonical ANLZ fixture is not available to hosted macOS runners.
    # Until the maintainer enables the hosted macOS spend and fixture facility, automatic
    # push and pull-request runs must stay skipped. A v* release tag and an
    # explicit manual dispatch remain deliberate, human-invoked escape hatches.
    # Keep the variable conjoined with its event allowlist: a bare variable arm
    # would admit every event this workflow subscribes to.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (vars.CI_HOSTED_OS_JOBS == 'true'
      && (github.event_name == 'push' || github.event_name == 'pull_request'))

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Persistent self-hosted workspace contract (tests/scripts/test_ci_workspace_reuse.py).
          fetch-depth: 0
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Hosted only. A self-hosted Mac gets 3.11 from `uv venv --python 3.11` below
      # (uv-managed), because setup-python's macOS installer wants sudo there.
      - name: Setup Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Pinned toolchain for the setuptools-rust extension. On a self-hosted Mac
      # this installs into the runner's private RUSTUP_HOME, never the login user's.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          toolchain: "1.96.0"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        # No uv cache in a release-triggered workflow: a cache written by a PR run
        # must not feed a tag/release build (zizmor cache-poisoning).
        with:
          enable-cache: false

      # Self-hosted: uv-managed interpreters only. A login user's own python3.11 on the
      # runner PATH can be an x86_64 build, and the arm64 wheel gate then resolves for
      # macosx_x86_64 (demon-llama, Thu 15 Oct 2026). Hosted keeps uv's default.
      # (A step, because job-level env cannot read the runner context.)
      - name: Self-hosted uses uv-managed Python only
        if: runner.environment == 'self-hosted'
        run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"

      # Stale-install guard (PR #4251), required on every self-hosted checkout job.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      - name: Install release gate dependencies
        # ci_venv.sh with the release-check lock, not bare `uv venv` + `uv pip install`:
        # the persistent self-hosted workspace keeps .venv, uv refuses to create over
        # it, and a reused venv must be installed exactly from a hash-pinned lock
        # (tests/scripts/test_ci_workspace_reuse.py). Same lock as release-check.yml,
        # the workflow this job moved out of (#924); it carries requirements.txt + pytest.
        run: scripts/ci_venv.sh 3.11 --lock pylock.release-check.toml

      - name: Build, inspect, install, and prove real ANLZ parity
        run: |
          make waveform-native-release-check \
            PYTEST_BASETEMP="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-native-wheel"

      - name: Prove the macOS ABI3 wheel imports on Python 3.14
        # --refresh-package (not --no-cache): see ci.yml's matching step
        # (37da19267) -- this glob resolves to a wheel this same job just
        # built, whose filename uv's cache can otherwise match against a
        # stale prior build. --no-cache would also discard uv's unrelated
        # interpreter/dependency cache on every run, which --refresh-package
        # does not.
        run: |
          uv run --refresh-package music_dj_tools --isolated --no-project --python 3.14 --with numpy \
            --with dist/music_dj_tools-*.whl python -c \
            'import _rb_waveform_native as n, numpy as np; assert int(np.__version__.partition(".")[0]) >= 2; assert n.bands_payload({"low": np.array([0.0, 1.0])}, 100)["length"] == 2'

      - name: Upload macOS production wheel
        uses: ./.github/actions/r2-artifact
        with:
          mode: upload
          name: music-dj-tools-macos-arm64
          path: dist/music_dj_tools-*.whl
          if-no-files-found: error
