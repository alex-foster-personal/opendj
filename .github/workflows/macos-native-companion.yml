name: macOS Native Companion

# Build the production native waveform wheel on hosted macOS only when its
# result is release-relevant. Automatic runs are limited to wheel-impacting
# changes on main and release branches. A tag create reaches the job condition
# below, while workflow_dispatch keeps the gate available for any ref.

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - apps/analysis_waveform/**
      - apps/webui/server/native/waveform/**
      - apps/webui/server/rb_vendor.py
      - apps/webui/server/rb_vendor_pkg/**
      - scripts/check_waveform_native_wheel.py
      - scripts/check_waveform_installed_consumer.py
      - tests/fixtures/_resolver.py
      - tests/fixtures/rb-usb-export.manifest.json
      - tests/webui/test_waveform_native.py
      - Makefile
      - MANIFEST.in
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - .github/workflows/macos-native-companion.yml
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - apps/analysis_waveform/**
      - apps/webui/server/native/waveform/**
      - apps/webui/server/rb_vendor.py
      - apps/webui/server/rb_vendor_pkg/**
      - scripts/check_waveform_native_wheel.py
      - scripts/check_waveform_installed_consumer.py
      - tests/fixtures/_resolver.py
      - tests/fixtures/rb-usb-export.manifest.json
      - tests/webui/test_waveform_native.py
      - Makefile
      - MANIFEST.in
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - .github/workflows/macos-native-companion.yml
  # Tag creation has no changed-file list, so it cannot share the path-filtered
  # push trigger. The job condition admits only v* tags from this broad event.
  create:
  workflow_dispatch:

concurrency:
  group: macos-native-companion-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  # Every main and tag push gets a SHA-specific group, so a later push cannot
  # cancel its predecessor. Pull requests and manual reruns keep a shared ref
  # group and cancel superseded work.
  cancel-in-progress: true

jobs:
  macos-native-companion:
    name: macOS native companion wheel
    runs-on: macos-14
    timeout-minutes: 20
    # The canonical ANLZ fixture is not available to hosted macOS runners.
    # Until the maintainer enables the hosted macOS spend and fixture facility, automatic
    # push and pull-request runs must stay skipped. A v* release tag and an
    # explicit manual dispatch remain deliberate, human-invoked escape hatches.
    # Keep the variable conjoined with its event allowlist: a bare variable arm
    # would also admit every branch `create` event subscribed to above.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (vars.CI_HOSTED_OS_JOBS == 'true'
      && (github.event_name == 'push' || github.event_name == 'pull_request'))

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Install release gate dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt pytest

      - name: Build, inspect, install, and prove real ANLZ parity
        run: make waveform-native-release-check

      - name: Prove the macOS ABI3 wheel imports on Python 3.14
        run: |
          uv run --no-cache --isolated --no-project --python 3.14 --with numpy \
            --with dist/music_dj_tools-*.whl python -c \
            'import _rb_waveform_native as n, numpy as np; assert int(np.__version__.partition(".")[0]) >= 2; assert n.bands_payload({"low": np.array([0.0, 1.0])}, 100)["length"] == 2'

      - name: Upload macOS production wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: music-dj-tools-macos-arm64
          path: dist/music_dj_tools-*.whl
          if-no-files-found: error
          retention-days: 7
