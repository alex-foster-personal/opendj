name: Stable evidence
# A reconcile pass carries its own title, which is how it finds its own mark.
run-name: ${{ (github.event.schedule == '41 4 * * *' || inputs.reconcile) && 'Stable evidence reconcile' || 'Stable evidence' }}

# OPS-18. Merge-append each completed CI / Full CI / E2E / macOS Packaging
# run's conclusion onto ops/stable/<head_sha>.json on the runner.
#
# One scheduled pass, not one job per completion (RUN-COUNT round 2, issue
# #2196). The Actions queue is per job: a workflow_run job that fired on every
# completion held one queued job per completion ahead of PR CI whenever the
# pool was saturated (75 runs, 61 jobs in a 208-minute window on Tue 22 Sep
# 2026). Each pass lists every completed run since the previous pass's start
# (the mark, read back from GitHub's own record of this workflow, floored by
# OVERLAP_MINUTES so two passes always overlap) and appends the ones the
# per-completion job used to append, oldest first. Re-applying an overlap
# writes nothing: a run already recorded identically is left alone. The cost
# is one cadence of delay on the evidence file; release.sh gates on that file
# from a human's terminal, and workflow_dispatch below is the catch-up before
# a release. Rejected alternatives and the measurement are in
# docs/decisions/ADR-NEW-stable-evidence-one-scheduled-pass.md.
#
# The pass runs this branch's code against run METADATA only; it never
# executes a recorded sha (it may be an untrusted PR).

on:
  schedule:
    # Offset from ci-cost-guard.yml's */15 so the two passes never queue together.
    - cron: "7-59/15 * * * *"
    # Daily reconcile pass: the plain pass plus every run created up to 30 days
    # before the reconcile mark (see the reconcile mark step).
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      reconcile:
        description: "Run a reconcile pass (also lists runs created up to 30 days back)"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: stable-evidence-batch
  cancel-in-progress: false

env:
  # Keep .pyc out of the workspace: root-owned bytecode under .venv is what
  # made actions/checkout fail with EACCES and skip every test step (#1338).
  # This covers interpreters these workflows start directly. It does NOT reach
  # anything run through `sudo`, which resets the environment with no env_keep
  # for this name, so the pre-checkout hygiene step below is the repair path
  # for a root-run interpreter.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  append:
    name: Append suite results
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    # A reconcile pass lists 30 days of runs (about 150 calls) on top of the plain pass.
    timeout-minutes: 10
    env:
      # At least two cadences, so a late or failed pass loses nothing.
      OVERLAP_MINUTES: "30"
      # The listing filters on created_at; a Full CI run has taken 100 minutes
      # before a cancel (Fri 11 Sep 2026), so a run created this long before
      # the mark and completed after it is still listed.
      LOOKBACK_HOURS: "6"
      # A reconcile pass: the daily cron, or a dispatch with reconcile ticked. The
      # title must match run-name's reconcile title above.
      RECONCILE: ${{ github.event.schedule == '41 4 * * *' || inputs.reconcile == true }}
      RECONCILE_TITLE: "Stable evidence reconcile"
      RECONCILE_OVERLAP_HOURS: "48"
      RECONCILE_SEARCH_HOURS: "72"
    steps:
      # Pre-checkout hygiene for the persistent self-hosted workspace (#1338).
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # SHA-pinned to the v4 tag commit (matches ci.yml).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that. It also names a missing gh, which the mark step needs.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3 gh

      # Only a successful pass advances the mark, found however far back it is. A
      # failed pass may have written none of its batch; counting it, or searching
      # only a fixed window, lets a run of failures skip completions.
      - name: Read the high-water mark from the last successful pass
        id: mark
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          previous=$(python3 -m scripts.ci_run_batch mark --repository "$REPOSITORY" \
            --workflow-file stable-evidence.yml --this-run "$THIS_RUN")
          echo "[mark] previous successful pass started at: ${previous:-none, using the overlap floor}"
          echo "previous_started=$previous" >> "$GITHUB_OUTPUT"

      # A re-run keeps its run's created_at, so a run re-run long after creation is
      # below every plain pass's creation floor: 25 of 5,123 watched runs in the 7
      # days to Tue 29 Sep 2026 started their latest attempt more than 3 h after
      # creation, the oldest 143.6 h (Codex P1 on #3844). Once a day the pass also
      # lists the re-runs among runs created from GitHub's 30-day re-run limit
      # before the reconcile mark. That mark counts reconcile passes only, searched
      # RECONCILE_SEARCH_HOURS back (an unbounded search read 11,493 passes and
      # outran the timeout before the first reconcile ever succeeded), and is
      # floored RECONCILE_OVERLAP_HOURS back, so one missed day loses nothing.
      - name: Read the reconcile mark
        id: reconcile
        if: env.RECONCILE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          since=$(python3 -m scripts.ci_run_batch mark --repository "$REPOSITORY" \
            --workflow-file stable-evidence.yml --this-run "$THIS_RUN" \
            --display-title "$RECONCILE_TITLE" --overlap-hours "$RECONCILE_OVERLAP_HOURS" \
            --search-hours "$RECONCILE_SEARCH_HOURS")
          echo "[mark] reconcile pass since: $since"
          echo "since=$since" >> "$GITHUB_OUTPUT"

      # BEFORE the listing: a watched run still in flight that was created before the
      # lookback would fall out of every later listing, so the pass must not move the
      # mark past it. Taken first, a run completing mid-pass is in the census or in the
      # listing, never in neither. One CI run spanned 6.0 h from creation to completion
      # on Mon 28 Sep 2026. This step only counts; the pass's last step fails on it.
      - name: Count recorded runs in flight since before the lookback
        id: census
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WATCHED_WORKFLOWS: "CI,Full CI (on-demand),E2E,macOS Packaging"
        run: |
          set -euo pipefail
          python3 -m scripts.ci_run_batch census --repository "$REPOSITORY" \
            --watched "$WATCHED_WORKFLOWS" --lookback-hours "$LOOKBACK_HOURS"

      - name: Append every recorded completion since the mark
        id: batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PREVIOUS_STARTED: ${{ steps.mark.outputs.previous_started }}
          RECONCILE_SINCE: ${{ steps.reconcile.outputs.since }}
        run: |
          set -euo pipefail
          export OPENDJ_STABLE_EVIDENCE_DIR="${OPENDJ_STABLE_EVIDENCE_DIR:-$HOME/jobs/state/stable-evidence}"
          mkdir -p "$OPENDJ_STABLE_EVIDENCE_DIR"
          python3 -m scripts.stable_evidence_batch \
            --repository "$REPOSITORY" \
            --previous-started "$PREVIOUS_STARTED" \
            --reconcile-since "$RECONCILE_SINCE" \
            --overlap-minutes "$OVERLAP_MINUTES" \
            --lookback-hours "$LOOKBACK_HOURS" \
            --written-by github-actions

      # Last, so the pass's own work always lands first.
      - name: Fail while the census holds the mark
        env:
          HELD: ${{ steps.census.outputs.held }}
        run: |
          [ "$HELD" = "0" ] || { echo "::error::held=${HELD:-unmeasured}; the mark stays until those runs complete"; exit 1; }
