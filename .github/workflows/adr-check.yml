name: ADR Check

# WHY THIS IS ITS OWN WORKFLOW AND NOT A STEP IN CI
#
# Same two reasons as reqs-flip-gate.yml (issue #1605 / PR #1709), applied
# to the ADR line (issue #1489):
#
# 1. ABSENT on some of the PRs it exists for. ci.yml's `pull_request`
#    `paths` filter excludes `**.md` and `docs/**`, so a docs-only ADR
#    migration would schedule no ci.yml run. The gated surfaces
#    (`apps/cloud/`, `apps/engine_core/`, `apps/sync_hub/`,
#    `apps/webui/server/routes/`, `apps/database/`, `*/migrations/*`,
#    `.github/workflows/`, webui server state, REQUIREMENTS.md,
#    frontend/contract files) DO reach ci.yml, but the body line is
#    metadata: it must re-run when the body changes, not only when those
#    paths change. The duplicate-id check (issue #2678) is repo-wide and
#    fires even on a PR that touches nothing gated, which is a second
#    reason this cannot be a `paths:`-filtered ci.yml step.
# 2. STALE relative to the metadata it reads. Title and body change with
#    no new head SHA. `edited` is in the list below; the other three are
#    restated because naming `types` REPLACES the implicit list.
#
# Splitting it out is also what makes `edited` affordable. Adding that
# type to ci.yml would re-run the whole fast lane on every body edit.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: adr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  gate:
    # Trunk merge-queue drafts (trunk-merge/*) have no PR body of their own, so body validation
    # skips them, but their tree is exactly what lands on main: they run the merged-tree check
    # instead (PR #4227). The split lives on the two steps at the end, not on this job.
    name: adr check
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # Full history so origin/main is current enough for the ancestry guard
      # (issue #3513). edited below re-runs body declarations; ancestry catches
      # stale synthetic merge refs that predate trunk ADR fixes.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: ADR check (issue #1489)
        if: ${{ !startsWith(github.head_ref, 'trunk-merge/') }}
        # No venv: scripts.adr_check is stdlib only. It reads THIS PR's
        # docs/decisions/ for whether an id exists, and the PR body plus
        # the PR file list via gh. Exit 1 = gated path, no valid ADR line.
        # Exit 2 = the gate could not measure, which is never a pass.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.adr_check --pr "${{ github.event.pull_request.number }}"

      - name: ADR merged-tree check on Trunk queue drafts (PR #4227)
        if: ${{ startsWith(github.head_ref, 'trunk-merge/') }}
        # The batch tree about to land on main: duplicate numeric ids, duplicate
        # placeholders and stale renumber paths. Git only, no PR body and no gh.
        # Exit 2 = the gate could not measure, which is never a pass.
        run: |
          python -m scripts.adr_check --merge-base origin/main --merge-head HEAD
