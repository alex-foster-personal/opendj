      - name: Find the desktop Rust staged report
        id: rust-report-desktop
        if: always() && steps.trunk-token.outputs.present == 'true'
        run: |
          if [ -f "staged-rust-desktop/junit-rust-desktop.xml" ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the audio Rust staged report
        id: download-rust-audio
        if: always() && steps.trunk-token.outputs.present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-insights-rust-audio-attempt-${{ github.run_attempt }}
