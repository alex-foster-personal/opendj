name: CI

on:
  push:
    branches: [main]
  pull_request:
    # EVERY pull request triggers this workflow, docs-only ones included (issue
    # #4168). The docs-only skip (the maintainer's call Fri 28 Aug 2026, "momentum over
    # ceremony") still holds, but it is decided INSIDE the run: the `scope` job
    # evaluates `CI_PULL_REQUEST_PATHS` in scripts/ci_pr_scope.py (the one copy
    # of the list, `.planning/REQUIREMENTS.md` re-inclusion and all) against the
    # merge commit, and every heavy job runs only when it says in scope. Before
    # this, a trigger-level `paths` filter meant a docs-only change created no
    # run at all, so a merge queue waiting on a named check (Trunk, draft-PR
    # mode) waited out its timeout. `ci gate` below is now the one check-run a
    # queue or branch protection requires; it reports on every pull request.
    #
    # The three default activity types, spelled out so the trigger stays a
    # mapping (tests/quality/test_pr_ci_coverage.py reads it as one).
    types: [opened, synchronize, reopened]
    # Main has no direct fast-tier push control run: the fast tier is a PR
    # differential by design. `.github/workflows/main-control.yml` dispatches
    # this workflow against `main` every six hours, while its companion job
    # measures and alerts on the age of the newest open PR base behind main.
    # That scheduled dispatch is the explicit current-main control instrument.
  # A manual escape hatch, added for issue #1166: a re-run replays the
  # ORIGINAL run's resolved config, not today's, so `gh run rerun` on a run
  # created before CI_RUNS_ON_LINUX existed resurrects the retired
  # ubuntu-latest fallback, no runner claims it, and the job completes as a
  # "failure" with zero steps executed -- indistinguishable from a real code
  # defect in `gh pr checks` and every UI. Before this trigger, the only ways
  # to force a fresh, current-config run were a push or a close/reopen, both
  # owner actions on someone else's branch. `workflow_dispatch` re-resolves
  # `vars.CI_RUNS_ON_LINUX` at dispatch time against the target ref's current
  # head, with no push and no branch content touched, so a repo write-access
  # user can request a fresh verdict without disturbing the PR owner's work
  # (dispatch requires write access, and this workflow file must already
  # exist on the default branch). `tier: full` (the default) runs the same
  # jobs a push/pull_request run would define -- but a dispatch checks out the
  # branch HEAD un-merged with base, not the pull_request event's merge ref,
  # so any job or step gated on `github.event_name == 'pull_request'` or
  # reading `github.event.pull_request.*` is not equivalent evidence to the
  # PR gate; treat a dispatch run as a supplementary check, not a substitute.
  # `tier: fast` runs ONLY the pytest fast tier: it is what main-control.yml
  # dispatches every six hours, and without it each control run also launched
  # the five-shard full lane, the contract, frontend and quality jobs -- a full
  # CI run four times a day on the pytest pool (Codex P1 on PR #3651).
  workflow_dispatch:
    inputs:
      tier:
        description: "full: every job a push run defines. fast: only the pytest fast tier (the scheduled main control)."
        type: choice
        options:
          - full
          - fast
        default: full

# Supersede in-progress CI runs for the same PR, but never for a trunk push.
concurrency:
  # Push runs get a per-commit group, so a merge can never cancel the previous
  # merge's run: 53 of 60 trunk runs were cancelled on Mon 31 Aug 2026 and the
  # auto-play.ts merge-union regression rode in through the gap, unseen because
  # a cancelled run reads as neutral in every dashboard. Non-push runs keep one
  # group per ref, so a new commit still supersedes its predecessor.
  #
  # This replaces the conditional cancel-in-progress from PR #631, which left
  # the group shared and did NOT stop the cancellations: three post-fix trunk
  # runs died 1-2s after the next push run was created, each killer carrying
  # the guard at line 28. Whether GitHub mis-evaluates that expression is still
  # unproven and no longer matters -- a unique group removes the precondition
  # instead of depending on the conditional behaving as intended.
  #
  # A workflow_dispatch run is keyed by its TIER as well (issue #3582, Codex
  # P2 on #3651): main-control.yml dispatches the fast tier on main every six
  # hours, and an operator's `tier: full` dispatch on main is the escape hatch
  # for a fresh full verdict. Both used to resolve to `ci-refs/heads/main-shared`,
  # so the scheduled fast run cancelled the full one it overlapped. The job
  # guards below select jobs; they cannot stop a workflow-level cancel.
  # tests/quality/test_main_control_workflow.py pins the tier in the group.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || (github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.tier)) || 'shared' }}
  cancel-in-progress: true

env:
  # Keep .pyc out of the workspace: root-owned bytecode under .venv is what
  # made actions/checkout fail with EACCES and skip every test step (#1338).
  # This covers interpreters these workflows start directly. It does NOT reach
  # anything run through `sudo`, which resets the environment with no env_keep
  # for this name, so the pre-checkout hygiene step below is the repair path
  # for a root-run interpreter.
  PYTHONDONTWRITEBYTECODE: "1"
  # No runner has a real rekordbox stick, so the live stick tests report the
  # capability UNAVAILABLE in the skip summary instead of failing. This opts
  # out of the stick ALONE (tests/sync/usb/live_stick.py); every other
  # required fixture still fails closed here. Unset on a dev machine, a
  # missing stick fails loud.
  MDT_ALLOW_MISSING_USB_STICK: "1"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # SCOPE (issue #4168). Every pull request triggers this workflow; this job
  # decides whether its change set is in scope (scripts/ci_pr_scope.py holds the
  # list) and every job below that gates a merge, plus the `fast` tier, needs it
  # and runs only on `in_scope == 'true'`. A docs-only change therefore
  # occupies no pytest runner, and `ci gate` at the bottom still reports.
  # ---------------------------------------------------------------------------
  scope:
    name: ci scope (docs-only skip decision)
    # Seconds of work on the light pool, never the pytest or e2e label: the job
    # runs `git diff` on the merge commit and one stdlib script. Every event runs
    # it; only a pull_request can come out of scope.
    # A Trunk queue draft (trunk-merge/* head, author trunk-io[bot], same-repo
    # head) prefers the opt-in CI_RUNS_ON_MERGE_QUEUE pool on every job on its
    # path to a required status, the e2e gate excepted; unset, the chain is
    # unchanged (ADR-NEW-trunk-queue-drafts-use-a-reserved-runner-pool).
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON_MERGE_QUEUE || vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    # 10 min: the bounded steps' own caps sum to 8 (debris 2, stale-install 1,
    # selection 3, ledger 1, seam 1), and 2 more cover the unbounded reclaim,
    # checkout and decide steps, so the ledger step always reaches its fail-open
    # path before the job is cancelled. Typical runs take seconds.
    timeout-minutes: 10
    # actions: read lets the ledger step below find the newest published
    # durations ledger (durations-ledger.yml); job-level, so it replaces the
    # workflow's contents-only default for this job alone.
    permissions:
      contents: read
      actions: read
    outputs:
      in_scope: ${{ steps.decide.outputs.in_scope }}
      # full | affected | empty, or '' when the selector could not answer.
      # Read by the `fast` job only: see the step below.
      pr_selection: ${{ steps.pr-selection.outputs.mode }}
      # A durations-ledger.yml run id, or '' for the committed seed. Read by
      # every job that splits on or measures against `.test_durations`.
      ledger_run_id: ${{ steps.ledger.outputs.run_id }}
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (runner-b-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # 0, not 2: every persistent-runner checkout fetches full history
          # (docs/decisions/ADR-NEW-uniform-checkout-depth-on-persistent-runners.md),
          # which is a superset of the depth-2 this job used to need to diff
          # the pull_request test-merge commit against its first (base) parent.
          fetch-depth: 0
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout. Runs before the job's first python3;
      # tests/scripts/test_ci_workflow_stale_install_coverage.py enforces it.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      - name: Decide whether this change set is in ci.yml's scope
        id: decide
        run: python3 -m scripts.ci_required_gate scope --workflow ci.yml

      # TEST-CUT round 1 (specs/ci-test-cut.md, Fri 2 Oct 2026): the same PR-head
      # selection the shards make, decided once here so the `fast` job can see it.
      # When it says FULL, every shard runs its pytest-split fifth of the WHOLE lane,
      # with the same --ignore list as the legs (test_fast_job_ignores_match_the_shard_job),
      # so the four fast-tier legs re-run 17k tests the shards already run: 22 runner-min
      # per PR head and four pytest-pool seats. `fast` skips itself on that answer only.
      # Fail-open: a crash, a timeout or an old interpreter leaves `mode` empty, and an
      # empty mode runs the legs exactly as before. The record and the job summary stay
      # the shards' (GITHUB_STEP_SUMMARY is pointed at /dev/null here).
      # tests/scripts/test_ci_fast_tier_job.py pins the wiring and the ignore list.
      - name: PR test selection mode (decides whether the fast-tier legs add anything)
        id: pr-selection
        if: github.event_name == 'pull_request'
        timeout-minutes: 3
        continue-on-error: true
        env:
          CI_PR_TEST_SELECTION: ${{ vars.CI_PR_TEST_SELECTION }}
        run: |
          set -uo pipefail
          mode="$(GITHUB_STEP_SUMMARY=/dev/null timeout --kill-after=10 150 \
            python3 -m scripts.ci_test_selection select --shard 1 --shards 5 \
              --out-dir "${RUNNER_TEMP:?RUNNER_TEMP must be set}/scope-pr-selection" \
              --ignore=tests/analysis \
              --ignore=tests/vocals \
              --ignore=tests/sync/usb \
              --ignore=tests/sets \
              --ignore=tests/quality/test_frontend_typing_gate.py \
              --ignore=tests/quality/test_frontend_typing_directives.py \
              --ignore=tests/quality/test_mypy_cache.py \
              --ignore=tests/perf/test_library_playlist_switch_bench.py \
          )" || mode=""
          case "$mode" in
            full|affected|empty) ;;
            *) echo "::notice title=PR test selection unknown in scope::the fast-tier legs run as before"; mode="" ;;
          esac
          echo "[scope] PR test selection mode=[$mode]"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # The shard durations ledger every shard of THIS run splits on (TEST-CUT,
      # scripts/ci_durations_ledger.py): built on main by durations-ledger.yml,
      # so no PR commits `.test_durations` to refresh it. Resolved once here,
      # never per shard: two shards splitting on different ledgers can drop or
      # double-run a test with nothing going red. A resolve that cannot answer
      # falls back to the committed seed, with a warning, never to a smaller
      # run. A change set that edits `.test_durations` itself keeps its own file:
      # main's ledger cannot know the test ids that change renames or moves.
      # Skipped when nothing in this run reads the ledger (out of scope).
      - name: Resolve the main-side durations ledger
        id: ledger
        if: steps.decide.outputs.in_scope == 'true'
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ -n "$(git diff --name-only HEAD^1 HEAD -- .test_durations 2>/dev/null)" ]; then
            echo "::notice title=durations ledger::this change set edits .test_durations, so every shard splits on its own file"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolved once, never a bare python3 in argv (AGENTS.md, "Portable by default").
          py="$(command -v python3)" || {
            echo "::warning title=durations ledger::no python3 on PATH; every shard splits on the committed .test_durations"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          }
          run_id="$(timeout --kill-after=10 30 "$py" -m scripts.ci_durations_ledger resolve --repo "$GITHUB_REPOSITORY")" || run_id=""
          case "$run_id" in
            ''|*[!0-9]*)
              echo "::warning title=durations ledger::no published ledger resolved; every shard splits on the committed .test_durations"
              run_id=""
              ;;
            *)
              echo "[durations-ledger] every shard installs the ledger from durations-ledger.yml run $run_id"
              ;;
          esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # Seam CI round 13 SHADOW (docs/decisions/ADR-NEW-seam-ci.md): logs which seams
      # this change set touches and skips nothing. continue-on-error so a defect in the
      # shadow can never redden a PR; it still shows as a failed step.
      - name: Seam plan (shadow, skips nothing)
        timeout-minutes: 1
        continue-on-error: true
        run: python3 -m scripts.ci_seams shadow

  # ---------------------------------------------------------------------------
  # Trunk flaky-test quarantine, the token half (ADR-NEW-trunk-flaky-quarantine-on,
  # the maintainer Wed 30 Sep 2026: "Set TRUNK QUARANTINE to True so flakey tests stop
  # blocking merges so aggressively"). This job fetches the collection's
  # currently quarantined tests and hands them to the shards as a job output.
  # It runs NO repository code: no checkout, only curl and jq, on an ephemeral
  # hosted runner. The org token can change merge-queue settings, so it never
  # enters a job that runs the test suite on a shared self-hosted runner.
  #
  # Every failure here FAILS CLOSED. The step is continue-on-error, so a Trunk
  # outage never reddens a PR by itself; an empty or not-ok output makes each
  # shard's verdict step excuse nothing (scripts/ci_trunk_quarantine_verdict.py).
  # vars.TRUNK_QUARANTINE_CI is the kill switch: anything but 'true' skips this
  # job, which also excuses nothing. tests/scripts/test_ci_trunk_quarantine.py.
  trunk-quarantine-list:
    name: Trunk quarantined tests (list)
    if: ${{ vars.TRUNK_QUARANTINE_CI == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.tier == 'fast') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      list: ${{ steps.fetch.outputs.list }}
    steps:
      - name: Fetch the quarantined-test list from Trunk
        id: fetch
        continue-on-error: true
        timeout-minutes: 2
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
          TRUNK_API_URL: https://api.trunk.io
          TRUNK_TEST_COLLECTION_ID: dViMBgFA
        run: |
          set -euo pipefail
          : "${TRUNK_API_TOKEN:?TRUNK_API_TOKEN is not provisioned, so nothing is quarantined}"
          pages_dir=$(mktemp -d)
          cursor=""
          for page in $(seq 1 20); do
            args=(--get --silent --show-error --fail-with-body --max-time 20 --retry 2
              --header "Authorization: Bearer ${TRUNK_API_TOKEN}"
              --data-urlencode "testCollectionId=${TRUNK_TEST_COLLECTION_ID}"
              --data-urlencode "quarantineState=quarantined"
              --data-urlencode "limit=100")
            [ -z "$cursor" ] || args+=(--data-urlencode "cursor=${cursor}")
            curl "${args[@]}" "${TRUNK_API_URL}/v2/test-cases" > "${pages_dir}/page-${page}.json"
            # A body without a data array is an error envelope, not an empty list.
            jq -e '.data | type == "array"' "${pages_dir}/page-${page}.json" > /dev/null
            if [ "$(jq -r '.hasMore' "${pages_dir}/page-${page}.json")" != "true" ]; then
              list=$(jq -c -s '{status: "ok", tests: [.[].data[] | {c: .className, n: .name}]}' "${pages_dir}"/page-*.json)
              echo "Quarantined tests: $(jq '.tests | length' <<< "$list")"
              echo "list=${list}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cursor=$(jq -r '.nextCursor // empty' "${pages_dir}/page-${page}.json")
            [ -n "$cursor" ] || { echo "::error::hasMore without a nextCursor"; exit 1; }
          done
          echo "::error title=Trunk quarantine list::more than 20 pages; refusing a list that long"
          exit 1

  # The fast pytest lane runs as SHARDS, one self-hosted runner each (round 1
  # of the CI lane, Fri 4 Sep 2026). Measured on trunk before this change: the
  # single serial pytest step took 695-1057s (median 917s across 21 runs) and
  # was 80 percent of a 13-19 minute push-to-verdict, while 20 of 30 runners
  # sat idle. pytest-split deselects everything outside `--group N` AFTER the
  # reqs plugin has asserted `--collect-floor` on the full collection (its
  # hook is `trylast`), so every shard still proves the whole suite was
  # collected and only runs its slice. Shards are balanced from
  # `.test_durations`: the ledger durations-ledger.yml builds on main every six
  # hours, installed over the committed seed (the scope job resolves it). A PR
  # never commits the file to refresh it; a stale or missing published ledger
  # shows as the scope job's warning and the fast tier's `going stale` line.
  #
  # The wheel build and the reqs / OpenAPI sentinels moved to the `contracts`
  # job below: they are still hard PR gates, they just no longer sit in front
  # of the tests. tests/scripts/test_ci_shard_matrix.py pins this shape.
  test:
    name: pytest fast lane (shard ${{ matrix.shard }} of 5)
    # Skipped by a `tier: fast` dispatch (main-control.yml's six-hour control
    # wants the fast tier alone); `inputs` is empty on push and pull_request,
    # so this is a no-op for every other event.
    # trunk-quarantine-list is needed only for its output. !cancelled() plus
    # the scope result keeps the shards running when that job fails or is
    # switched off, which excuses nothing (ADR-NEW-trunk-flaky-quarantine-on).
    needs: [scope, trunk-quarantine-list]
    # actions: read downloads the durations ledger another workflow published.
    permissions:
      contents: read
      actions: read
    if: ${{ needs.scope.outputs.in_scope == 'true' && !cancelled() && needs.scope.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.tier == 'fast') }}
    strategy:
      # One red shard must not cancel the others: the point of sharding is
      # that every failure reports in the same run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      # The job venv IS `.venv`, the path `uv run` treats as the project
      # environment. Tests spawn `uv run --with modal ...` (apps/stems/job.py)
      # against the repo root, and a plain `uv run` SYNCS that environment to
      # uv.lock first: it pruned pytest, librosa and soundfile out from under
      # the running suite (trunk red Fri 4 Sep 2026 after #1106 moved the venv
      # here). UV_NO_SYNC makes every child `uv run` use `.venv` as provisioned.
      UV_NO_SYNC: "1"
      # One native thread per process. Shards share a host with fifteen
      # other runners, and on trunk e9ed11ecf (Fri 4 Sep 2026) `ps` on runner-b
      # showed `apps.analysis.run --backend librosa` subprocesses spawned by
      # the suite at 400-650 percent CPU each: OpenBLAS and numba fan every
      # call across all 32 threads, sixteen runners do it at once, and the
      # same shard then took 636 s there against 314 s on a quieter host.
      # The tests measure behavior, not wall time; one thread each is the
      # standard setting for a shared CI host. Pinned by
      # tests/scripts/test_ci_thread_caps.py.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    #
    # Round 4 (Mon 14 Sep 2026, an internal runner note
    # in afmac): this job alone pulls from CI_RUNS_ON_PYTEST first, falling
    # through to CI_RUNS_ON_E2E, then CI_RUNS_ON_LINUX, then the hardcoded
    # "ubuntu-latest" so a variableless public fork still runs. runner-b
    # runners carry the `runner-a` label too (the governor re-adds it every
    # tick), so CI_RUNS_ON_LINUX (`["self-hosted","linux","runner-a"]`) was
    # never actually excluding them the way the prior comment here claimed --
    # a 12h sample measured 146 of 154 runner-b shard jobs SIGKILLed at the
    # 1380s wall budget with 0 passing, against runner-a's 101 jobs, 1 kill,
    # mean pass ~952s. Root cause is WSL vhdx disk IO thrash from pytest
    # itself: capping runner-b to 12 concurrent runners (round 3) still left it
    # 0 for 15 while runner-a finished 20 in the same window. Nearly every CI
    # run carried a runner-b shard, so nearly every run was inconclusive.
    # CI_RUNS_ON_E2E (`["self-hosted","linux","e2e"]`) targets runner-a only,
    # which is why the shard job borrows it as the next fallback rather than
    # widening CI_RUNS_ON_LINUX itself -- every other CI_RUNS_ON_LINUX job
    # (contracts, frontend-build, frontend, quality, fast) is
    # unchanged and still lands on either host.
    #
    # A self-hosted target for THIS job has to be provisioned, not merely
    # online: unprivileged, AGENT_TOOLSDIRECTORY set, `file` available. The
    # requirements and how to widen the pool again are in "Self-hosted runner
    # provisioning" in the doc above.
    #
    # `workflow_dispatch` re-resolves whichever of these vars is set against
    # the target ref's current HEAD at dispatch time (see the trigger comment
    # near the top of this file), the same as every other vars.CI_RUNS_ON_*
    # read in this workflow -- this expression adds no new dispatch-semantics
    # exception, it only changes which variable wins.
    #
    # CI_RUNS_ON_MAIN_FIX (ADR-0041, the maintainer-approved standing lever, Mon 14 Sep
    # 2026): a trunk fix must never be fully starved behind a deep PR-CI
    # backlog the way it was earlier today (see the trunk-fix-starves-behind-
    # doomed-pr-ci incident referenced in the ADR). Exactly 2 self-hosted
    # runners carry the main-fix label, reserved by removing their other pool
    # labels host-side (runner-b the runner governor script), so this pool is
    # never contended by the general PR-CI backlog. It is preferred ONLY for
    # a pull_request carrying the ci:trunk-repair label -- every other event,
    # INCLUDING a push to main, falls through the CI_RUNS_ON_PYTEST /
    # CI_RUNS_ON_E2E / CI_RUNS_ON_LINUX chain unchanged. Main pushes were
    # routed here too until Mon 21 Sep 2026 (ADR-NEW-main-pushes-use-the-
    # general-pytest-pool): with every merge to main funnelled through the
    # two reserved runners, main's own shards queued 40-60 min behind each
    # other while the seven-runner pytest pool served PRs, so trunk could
    # not prove itself and every PR inherited an unmeasured red (#3708 s.2).
    # The guard checks event_name first, so a push event (which has no
    # pull_request context) never dereferences it.
    # An unset CI_RUNS_ON_MAIN_FIX (a fork, or before the variable is set)
    # degrades safely through the rest of the chain. Verified via 5 scratch
    # workflow runs on af--ci-main-fix-runner-reserve (run 34898282105):
    # unset-var and false-condition both fall through, a set var wins when
    # the condition is true, and the label-guard alone evaluates to false
    # with no error on a non-pull_request event. Pinned by
    # tests/scripts/test_ci_main_fix_runner_reserve.py.
    #
    # CI_RUNS_ON_TRUNK (ADR-NEW-trunk-ci-runs-on-runner-a-hosts-only, Sat 26
    # Sep 2026, the ADR-0041 priority-pool lever): by then the `pytest` label
    # sat on 9 runner-a runners AND 14 runner-b runners, so main's own
    # checkpoint landed 3 of 5 shards on runner-b (run 36237434128 at
    # cf36185ad: 31-40 min there, one at the wall budget with 0 failed,
    # against 20 min on runner-a). A push to main, and a ci:trunk-repair PR
    # when CI_RUNS_ON_MAIN_FIX is unset, now prefer CI_RUNS_ON_TRUNK, a label
    # (`trunk-runner-a`) only the runner-a pytest runners carry. The reserve
    # clause stays FIRST so a repair PR keeps the main-fix pair to itself,
    # and that pair gets no new label, so the trunk-tip sweeper on it never
    # queues behind main's shards. Unset CI_RUNS_ON_TRUNK and the chain is
    # exactly the one above.
    #
    # CI_RUNS_ON_MERGE_QUEUE (ADR-NEW-trunk-queue-drafts-use-a-reserved-runner-pool,
    # Tue 29 Sep 2026): a Trunk queue draft prefers the reserved `mq` pool,
    # after both repair clauses and the main-push clause, so repair routing
    # stays first. Unset it and the chain is exactly the one above.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:trunk-repair')) && vars.CI_RUNS_ON_MAIN_FIX || ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:trunk-repair'))) && vars.CI_RUNS_ON_TRUNK || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON_MERGE_QUEUE || vars.CI_RUNS_ON_PYTEST || vars.CI_RUNS_ON_E2E || vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    # A fifth of the old serial lane plus provisioning is ~4 minutes, and a
    # shard still running at 25 is stuck or wildly unbalanced, so it should
    # redden here rather than hold a runner. (#1139 had raised the serial
    # lane's cap 20 -> 35 after a green 1175 s suite was cancelled twice on
    # Thu 4 Sep 2026; sharding removed that failure mode and the cap dropped
    # to 15.)
    #
    # Raised 15 -> 25 on Thu 10 Sep 2026. 15 asserted that a shard past the
    # cap is stuck or WILDLY UNBALANCED. Both halves were checked and both
    # are false for the runs that hit it.
    #
    # Not unbalanced: on the all-green run 34454681711 shard 4 measured
    # 303 s of test time, a fifth of the 1539 s union across the five shard
    # artifacts, against a 324 s pytest-split estimate. It carries 2361 tests
    # to shard 5's 911 only because pytest-split balances TIME, not count, so
    # the count spread is the design working rather than a symptom.
    #
    # Not stuck either: the same shard, same estimate, was cancelled at the
    # cap twice on PR #1695 (run 34460452896, 967 s on the rerun) and once on
    # TRUNK (run 34457437569, 940 s), while finishing in 356 s and 577 s on
    # the trunk runs either side. runner-b was carrying 19 concurrent CI jobs
    # plus 8-10 agent workers on 32 cores at load 25-36 across that window.
    # Same work, 2.7x the wall clock, decided by how loaded the host was.
    #
    # A note on evidence, because it misled once: a cancelled run's uploaded
    # durations artifact is NOT that run's measurement. --clean-durations
    # rewrites the file when the shard finishes, so a run killed at the cap
    # uploads the pre-existing committed file byte for byte. Read per-shard
    # timings off a run where all five shards went green.
    #
    # So the cap has to clear the contention swing this file already documents
    # 20 lines up (636 s busy against 314 s quiet). Against a 650 s healthy
    # worst case that swing reaches ~1300 s, and 15 minutes is 900 s: the cap
    # was inside the normal range, not outside it. 25 minutes is 1500 s, which
    # leaves headroom without hiding a real stall, since a genuinely hung shard
    # still reddens, ten minutes later. Lower this again when the host stops
    # being oversubscribed, not before.
    #
    # 25 -> 35 on Thu 10 Sep 2026, and the extra five minutes are NOT given to
    # the shard. The pytest step now bounds itself (MDT_PYTEST_TIMEOUT_S, then
    # 1380 s = the 23 minutes this cap was really granting once provisioning is
    # taken off the top), so that a capped shard FAILS with a TIMEOUT annotation
    # instead of being cancelled by this cap. A `timeout-minutes` kill is
    # reported as CANCELLED, which is also what a superseded push and a
    # fail-fast cascade report; that is issue #1690, and it cost three separate
    # PRs a hand-written timing investigation each.
    #
    # EVERY step before pytest is now bounded too, and that is not decoration.
    # A hang in checkout, provisioning, preflight or the JIT warm-up would reach
    # THIS cap before the pytest step's own timeout existed, and the job would
    # be CANCELLED -- the same unexplained conclusion, moved one step earlier.
    # Each of those steps carries a `timeout-minutes` of its own, so a hang
    # there fails the step, and the job concludes FAILURE, without ever
    # consulting this cap.
    #
    # The arithmetic has to close, or the cap becomes the thing that fires
    # again: 1800 s of shard budget + 1140 s of pre-pytest bounds = 2940 s, under
    # this cap (Thu 10 Sep 2026: +120 s bounding the debris-clean step, +180 s
    # for the cold-runner system-deps step behind the packages lock, +120 s
    # giving the JIT warm-up a bound that survives the slowest host). The
    # pre-pytest figure is a SUM OF MAXIMA, not a duration: reaching it
    # requires a step to hang past its own bound, which fails the job before
    # the total is spent. Measured provisioning is ~112 s (all-green run
    # 34454681711, shard 3: 430 s of job wall for 318 s of test time).
    #
    # 40 -> 43 alongside that warm-up bound, and the 60 s of slack over 2520 s
    # is deliberate: at exactly 2520 the next step that gains a bound silently
    # inverts the inequality, and the guard below is the only thing that would
    # notice. tests/scripts/test_ci_shard_matrix.py pins all three numbers
    # against each other, and it is what caught this raise going in without
    # its matching cap.
    #
    # 43 -> 50 on Mon 21 Sep 2026 with the shard budget's 1380 -> 1800 (see
    # the pytest step): 1800 + 1140 = 2940 s, and the same 60 s of slack.
    #
    # 50 -> 60 on Tue 22 Sep 2026 with the shard budget's 1800 -> 2400 (see
    # the pytest step): 2400 + 1140 = 3540 s, and the same 60 s of slack.
    #
    # 60 -> 63 on Fri 2 Oct 2026 with the two 1-minute durations-ledger steps
    # (download, install): the pre-pytest bounds already summed to 1200 s, so
    # 2400 + 1320 = 3720 s, and the same 60 s of slack.
    timeout-minutes: 63

    steps:
      # Pre-checkout hygiene for the persistent self-hosted workspace (#1338).
      # checkout cleans the tree as the runner user, so one root-owned file in
      # it fails the unlink with EACCES, dies at step 2, and skips every test
      # step after it -- a red carrying no test evidence. The runner user has
      # NOPASSWD sudo (e2e.yml documents it). This runs as root, so it is
      # bounded three ways, and each bound is load-bearing. A mount point
      # beneath the workspace fails the step outright: `-xdev` alone is not
      # enough, because a bind mount from elsewhere on the SAME filesystem
      # keeps the same st_dev and is traversed regardless (measured on the
      # runner host, Fri 5 Sep 2026). `-xdev` then stops a cross-filesystem
      # mount appearing after that check. The workspace path is escaped the way
      # mountinfo escapes field 5 and handed to awk through ENVIRON, NOT `-v`:
      # `-v` processes escape sequences, so it decodes \040 straight back to a
      # space and undoes the escaping it was given. `chown -h` acts on a symlink
      # itself rather than its referent, so a link pointing out of the tree cannot
      # drag the repair outside. One `find` expression drives the count and
      # the repair, so the number reported is the set acted on.
      #
      # The counts come from `find`, not from `chown -c`: GNU coreutils prints
      # that report on stdout but uutils prints it on stderr, so a piped count
      # reads 0 forever on a uutils host and the log would claim the step found
      # nothing when it had just repaired thousands of files. `remaining` is
      # the proof the repair landed, and a non-zero one fails here rather than
      # letting checkout die at the next step with a worse message.
      #
      # It also NAMES the offending entries -- owner, UTC mtime, path -- and
      # names them BEFORE the chown, because the repair destroys the very
      # evidence that identifies the writer. #1338 could say 957 to 1130 files
      # per runner but not which process wrote them, and cost a forensic
      # session for want of exactly this. The listing goes to a file rather
      # than into `head` down a pipe: under `pipefail` a SIGPIPE'd `find`
      # fails the step. TZ reaches `find` through `env` because sudo here is
      # `env_reset` with no SETENV, so `sudo TZ=UTC find` is refused outright,
      # and an mtime printed in local time under a `Z` suffix is a lie.
      - name: Reclaim workspace ownership before checkout
        timeout-minutes: 1
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (runner-b-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # SHA-pinned to the v4 tag commit (resolved 2026-04-17).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 2
        with:
          persist-credentials: false
          # Progress-tree provenance validates historical feature commit SHAs.
          fetch-depth: 0
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup Python
        timeout-minutes: 1
        # SHA-pinned to the v5 tag commit (resolved 2026-04-17).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The project uses modern `X | Y` type syntax and `from __future__
          # import annotations` throughout, so 3.11 is enough. Python 3.14 is
          # what the dev machine runs but 3.11 is the stable target for CI
          # because tflite-runtime (pulled in transitively by openwakeword)
          # only publishes Linux wheels up to cp311.
          python-version: "3.11"

      - name: Setup uv for isolated dependency contracts
        timeout-minutes: 1
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: Provision isolated Python test environment
        timeout-minutes: 2
        # modal is deliberately absent from requirements.txt and the `dev`
        # extra (see pyproject.toml): every call site is `uv run --with modal`.
        # It is locked in via requirements-ci.in as a CI *test-environment* tool, not a package
        # dependency, because tests/vocals/test_envelope.py and
        # test_farm_scheduling.py import it at module scope and abort
        # collection without it. Those aborts drop their markers, so the
        # uploaded coverage-matrix artifact would silently understate coverage
        # and get stamped PARTIAL RUN by the reqs plugin.
        #
        # The project itself is NOT installed into this venv. The serial lane
        # used to get `apps` on site-packages as a side effect of `make
        # waveform-native-verify` reinstalling the built wheel into .venv
        # (Makefile), which the `contracts` job now does instead; tests that
        # spawn a fresh interpreter must import from the tree (cwd or `-m`),
        # and PR #1143 fixed the one that did not.
        run: |
          # Exact sync from a hash-pinned lock: zero index requests on a warm cache
          # (issue #4252). requirements-ci.in adds modal and the pyproject
          # `observability` extra to requirements.txt; scripts/ci_lock.py compiles it.
          scripts/ci_venv.sh 3.11 --lock pylock.ci.toml

      - name: System deps for pyrekordbox (SQLCipher) and Mach-O classification
        # 4 min: a cold install took 65-68 s (PR #1784 run, runner-b-19 and -25, Thu 10 Sep
        # 2026; 3-29 s warm), and every shard queues on the host-wide `packages` lock. The
        # lock wait is capped at 150 s here (default 900 s) so wait + cold run < this bound
        # and a stuck holder reports through the lock's own error, not a bare step timeout.
        timeout-minutes: 4
        env:
          MDT_CI_HOST_LOCK_TIMEOUT_S: "150"
        # Provision the interpreter first. The reqs and OpenAPI sentinels run
        # with `!cancelled()` to report after a prior failure, so they still
        # need their explicit interpreter when host provisioning fails.
        #
        # pyrekordbox pulls sqlcipher3 which links against libsqlcipher at
        # runtime. Ubuntu noble (24.04) dropped the transitional
        # libsqlcipher0 package; libsqlcipher-dev now ships the runtime
        # shared library (libsqlcipher.so) as well and is sufficient.
        #
        # `file` is DECLARED here rather than assumed: the GitHub-hosted
        # ubuntu images ship it, a self-hosted box need not, and runner-a did
        # not. tests/scripts/test_engine_payload_macho.py and
        # test_appstore_requirements.py shell out to it to tell a Mach-O
        # binary from a script, so its absence took out 8 tests with a bare
        # FileNotFoundError on the first self-hosted run of this lane.
        #
        # `just`: tests/scripts/test_entrypoint_module_guard.py (#1363) drives the
        # justfile recipes for real; runner-a had no `just` and trunk e6fbb1fa6 went
        # red on shard 2 (Sun 6 Sep 2026) while runner-b, which has it, stayed green.
        #
        # `bubblewrap` (bwrap): the ci-fixer recheck sandbox (#1056, moved to
        # fleet-af `ci_fixer/sandbox.py` Thu 1 Oct 2026) refuses to run a
        # credential-free recheck without it, by design. runner-a did not
        # have it; two trunk runs went red on shard 3 (Fri 4 Sep 2026). The
        # host also needs unprivileged user namespaces allowed for bwrap
        # (Ubuntu 24.04 restricts them; runner-a carries an AppArmor profile
        # at /etc/apparmor.d/bwrap for that).
        #
        # Shards share a host, so this goes through the named host lock:
        # dpkg's own lock does not queue, and the loser exits non-zero.
        #
        # `env -C /` because a `run:` step's cwd is GITHUB_WORKSPACE, so
        # without it this is a ROOT process holding the persistent workspace
        # as its working directory (caught live on runner-a, pid 1226650,
        # Sun 6 Sep 2026). apt provably writes nothing there -- reinstalling
        # a python3 package in a workspace-shaped tree, py3compile triggers
        # and all, left 0 foreign entries -- so this is prophylaxis against a
        # future maintainer script, not the repair path. NOT an invariant
        # either: Playwright's own `install --with-deps` sudo-apts with the
        # frontend directory as cwd and takes no such flag, which is why the
        # pre-checkout hygiene step stays the backstop (#1338).
        run: |
          scripts/ci_apt_present.sh libsqlcipher-dev file bubblewrap just ffmpeg || scripts/ci_host_lock.sh packages sudo env -C / sh -c 'apt-get update && apt-get install -y libsqlcipher-dev file bubblewrap just ffmpeg'

      - name: Runner preflight - host binaries the suite shells out to
        timeout-minutes: 1
        # Name the missing binary at second five rather than minute four:
        # `file`, `bwrap` (#1056), the Tauri toolchain (93e11a47f) and `just`
        # (#1363) each reddened a trunk shard as a bare FileNotFoundError when
        # its test landed on the host that lacked it, green on the PR because
        # that shard had landed on the other host. The list is pinned by
        # tests/scripts/test_ci_shard_binary_preflight.py; provisioning lives in
        # docs/ci-actions-cost-review-2026-08-16.md item 7.
        run: scripts/ci_runner_preflight.sh file bwrap just pkg-config cargo uv ffmpeg

      - name: The interpreter must run without a borrowed LD_LIBRARY_PATH
        timeout-minutes: 1
        # TRIPWIRE, not a fix. actions/setup-python installs an interpreter
        # whose RUNPATH is baked to the HOSTED tool-cache path
        # (/opt/hostedtoolcache/Python/<v>/x64/lib). On a self-hosted runner
        # whose tool cache lives somewhere else, that RUNPATH misses and
        # libpython is reachable ONLY through the LD_LIBRARY_PATH the action
        # exports into the job environment.
        #
        # Every test that launches a subprocess under a deliberately
        # controlled environment then loses it and gets exit 127 instead of
        # the behavior it is asserting on. That single cause produced 46 of
        # the 65 failures on the first self-hosted run of this lane
        # (tests/scripts/autoreposync_uv.py, test_paths_data_dir_override.py,
        # the provenance CLI suites), and none of them named it: they
        # reported missing interpreters, refused stores and uv resolve
        # failures. Fixing the interpreter is right; fixing 40 env dicts to
        # smuggle a loader path through is not.
        #
        # The fix belongs on the RUNNER - AGENT_TOOLSDIRECTORY=/opt/hostedtoolcache
        # in <runner-root>/.env, which is what actions/setup-python documents
        # for self-hosted runners, so the tool cache lands where the RUNPATH
        # already points. Deliberately NOT set from this workflow: on a runner
        # that cannot write /opt, setting it would break setup-python outright
        # rather than degrade. See "Self-hosted runner provisioning" in
        # docs/ci-actions-cost-review-2026-08-16.md.
        #
        # `env -i` reproduces the scrubbed environment those tests build, so a
        # runner that loses the setting fails HERE, in one step, naming the
        # cause - rather than ten minutes later as dozens of unrelated-looking
        # test failures.
        run: |
          env -i PATH=/usr/bin:/bin .venv/bin/python -c 'print("interpreter is self-contained")'

      - name: Keep the numba JIT cache across jobs on this runner
        timeout-minutes: 1
        # librosa's numba artifacts live beside its source by default, and this
        # job recreated `.venv` every run, so every job paid a 25-45 s cold
        # compile in the warm-up step (measured Tue 8 Sep 2026: 41-46 s on
        # every shard, 0.3 s once the cache survives venv recreation). One
        # directory per RUNNER: a runner runs one job at a time, so the
        # warm-up below is the only cold writer it ever sees, and the stamp
        # next to it is what lets the warm-up prove the cache is still what
        # that serial writer left. Hosted runners get a fresh HOME per job
        # and simply compile once, as before.
        # Keyed by the toolchain too (python, numba, llvmlite, librosa, numpy
        # versions, printed by the module that owns the cache): an upgrade
        # lands in an empty directory and compiles once under the lock,
        # instead of numba rejecting stale artifacts at first use in whatever
        # processes got there first, concurrently and cold.
        run: |
          identity="$(.venv/bin/python -m apps.analysis.jit_warmup --identity)"
          dir="$HOME/.cache/mdt-numba/${RUNNER_NAME:?RUNNER_NAME is unset}/${identity:?identity is empty}"
          mkdir -p "$dir/cache" "$dir/lock"
          chmod 700 "$HOME/.cache/mdt-numba" "$dir" "$dir/lock"
          { echo "NUMBA_CACHE_DIR=$dir/cache"; echo "MDT_NUMBA_WARMUP_DIR=$dir/lock"; } >> "$GITHUB_ENV"

      # Install the ledger the scope job resolved, so every shard of this run
      # splits on the same file (scripts/ci_durations_ledger.py). No fallback
      # here: a job that could not install it while its siblings did would
      # split differently, so it fails by name instead (a transient artifact
      # error, or a re-run after the 7-day retention, reads red; re-run it).
      - name: Download the main-side durations ledger
        if: needs.scope.outputs.ledger_run_id != ''
        timeout-minutes: 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-durations-ledger
          run-id: ${{ needs.scope.outputs.ledger_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/durations-ledger

      - name: Install the main-side durations ledger over the committed seed
        if: needs.scope.outputs.ledger_run_id != ''
        timeout-minutes: 1
        run: ./.venv/bin/python -m scripts.ci_durations_ledger install --src "$RUNNER_TEMP/durations-ledger/.test_durations"

      - name: Warm the numba JIT cache before the suite (#1316)
        # 3 minutes, not 1. The budget below assumes a cold compile costs
        # ~25-45 s, which held on runner-a and does not hold on runner-b:
        # that host is I/O bound, not CPU bound, and measured 64.28 s cold on
        # Thu 10 Sep 2026 (run 34528996758, shard 3). The step had already
        # printed `artifacts=78` -- the cache was WARM and correct -- when the
        # 1-minute cap killed it and took the whole shard, and trunk, red. A
        # cap that fires on success is measuring the host, not the hang it was
        # added to bound. 3 minutes still bounds a real hang; the warm path is
        # ~0.3 s, so the extra headroom is never spent on a healthy run.
        timeout-minutes: 3
        # librosa's `@numba.guvectorize(..., cache=True)` hot paths compile on
        # first call into `.nbi`/`.nbc` artifacts beside the librosa source.
        # Two processes meeting a COLD cache interleave those writes and every
        # later process that loads the result dies at a NULL instruction
        # pointer, with no traceback and no Python exception (issue #1316).
        # `apps.analysis.run` warms in the parent before it creates a pool, so
        # this step is belt and braces - but it moves the one-off compile out
        # of whichever test happens to touch analysis first, where it looks
        # like an unrelated timeout, and it costs nothing on a cache that is
        # already what a previous warm-up left.
        #
        # `--purge-if-stale`, not `--purge`: the cache now persists per runner
        # (step above), so a purge on every job would buy a cold ~25-45 s
        # compile each time to insure against a state a single serial writer
        # cannot produce. The stamp is the witness: a cache the last serial
        # warm-up left untouched is kept and the step takes ~0.3 s; a cache
        # without a matching stamp (killed writer, racing writer, librosa
        # upgrade) is purged before anything loads it, which is the only
        # repair for a poisoned cache, since loading it is what segfaults.
        # Pinned by tests/scripts/test_ci_jit_warmup.py.
        run: .venv/bin/python -m apps.analysis.jit_warmup --backend librosa --purge-if-stale

      - name: Run fast pytest lane shard (full suite + coverage live in Full CI, on-demand)
        # `id` is read by the staging step below as
        # steps.pytest-shard.outcome, which gates the copy: a pytest that never
        # ran stages an absence, not a report an earlier run left behind.
        # Renaming this id without updating that step turns the gate into one
        # that cannot fire; tests/scripts/test_ci_fast_lane_junit_staging.py
        # pins the pair.
        id: pytest-shard
        # continue-on-error: this step RECORDS the shard's exit code (output
        # `rc`) and the LAST step of this job, "Fast lane verdict", decides
        # it, so a failure whose every failed test Trunk has quarantined can
        # pass (ADR-NEW-trunk-flaky-quarantine-on). `outcome` still reads
        # failure for the CI Insights staging below; `conclusion` is what
        # continue-on-error rewrites. The verdict step is `if: always()` and
        # has no continue-on-error, so a red shard stays red unless that
        # script says otherwise. tests/scripts/test_ci_trunk_quarantine.py.
        continue-on-error: true
        # FAST LANE (the maintainer's call, Fri 28 Aug 2026): PR latency was ~8 min and
        # the pytest-with-coverage step was 352s of it. Measured locally on
        # the same tree (Apple M-series, serial, no coverage): full suite
        # 4107 tests in 208.7s, of which ~99s sat in 8 tests across four
        # product-edge suites (analysis backends, vocal farm workers, USB
        # export flows, model training). Those four suites and coverage move
        # to .github/workflows/full-ci.yml (workflow_dispatch only); this
        # lane keeps everything else so a typical webui/server PR still gets
        # real verification in a fraction of the time.
        #
        # Deliberately SINGLE PROCESS within a shard, unlike the local gate.
        # `-n auto` was tried here and measured, and it lost: this step ran
        # 273s / 279s / 289s serial across three `main` runs, and 295s under
        # `-n auto` on the same tree. Every worker re-pays the cold import
        # cost. `-n` stays out until somebody measures a win; parallelism
        # comes from the shard matrix instead, one runner per shard.
        #
        # --collect-floor DOES belong here: it costs nothing and it is what
        # stops a run that silently lost tests reading as a smaller green
        # suite. Raise it, never lower it. The floor is scoped to THIS lane's
        # collection (full-ci.yml keeps the full-suite floor of 3700) and is
        # asserted on the FULL collection before pytest-split deselects the
        # other shards, so a shard that imported less of the tree still fails.
        #
        # --durations=25 is the instrument for the next round: the self-hosted
        # lane runs 3x slower than the hosted one did (700-1050s against
        # 273-289s) with the hosts at low load, and the slow tests have to be
        # named before that can be fixed.
        #
        # tests/quality/test_frontend_typing_gate.py and
        # tests/quality/test_frontend_typing_directives.py (split off it,
        # Issue #724) are excluded here: their `any`/directive detection
        # shells out to apps/webui/frontend/scripts/ts-any-scan.mjs, which
        # imports the `typescript` package. This job never installs frontend
        # node_modules (that is the whole point of a fast lane), so both run
        # in the `quality` job below instead, which already installs them
        # for knip. Excluding them here must never mean they run nowhere;
        # they are a hard PR gate in that job, not deferred to on-demand
        # full-ci.
        #
        # --store-durations --clean-durations rewrites .test_durations with
        # THIS shard's tests only, measured on the runner that just ran them;
        # the upload below is what durations-ledger.yml reads (it unions the
        # five shard artifacts of a main push run). The local Mac run the file was first
        # recorded from over-weighted sleep-bound tests badly: on PR #1143 the
        # 28 "slowest" tests ran in 45 s while another shard took 404 s.
        #
        # --splitting-algorithm least_duration (Mon 14 Sep 2026, trunk runs
        # 34798615886 / 34803649465, shard 1 SIGKILLed twice at 1440 s while
        # still at 90% then 77% progress -- exit 137, and dmesg/journalctl on
        # runner-b carried no oom-killer entry for either window, so this was
        # the shard's own MDT_PYTEST_TIMEOUT_S wrapper, not a kernel OOM kill).
        # tests/cloudsync (subprocess hub servers, real sqlite writes, a
        # launchd/systemd script test) is far heavier than its committed
        # duration said and alphabetically contiguous, so pytest-split's
        # default duration_based_chunks put nearly all of it (699 of ~770
        # tests) in shard 1 every time. Correcting the durations alone did not
        # move that: it walks tests in order and cuts each boundary the first
        # time the running total crosses i/5 of the suite total, so shard 1's
        # own share of the correction grew its own 1/5 target by the same
        # motion and the cut landed on the identical test both before and
        # after (measured: 773.55s -> 835.10s estimated, 699 cloudsync tests
        # both times). least_duration greedily assigns each test to whichever
        # group currently holds the least cumulative duration instead, which
        # the plugin's own README calls the more balanced algorithm. Dry-run
        # (pytest --collect-only) against the corrected .test_durations: all
        # five groups landed at 625.65s each, against 835.10 / 625.74 / 625.86
        # / 631.00 / 410.53s under duration_based_chunks, and tests/cloudsync
        # spread to 102-169 tests per shard instead of 699 in one.
        # tests/scripts/test_ci_shard_matrix.py pins the flag.
        #
        # `--ignore=tests/perf/test_library_playlist_switch_bench.py` in both
        # pytest lanes: that test is a full Playwright bench (frontend build,
        # `pnpm exec playwright test`, a real engine, 10 samples, a 600 s test
        # timeout plus a 240 s webServer timeout). Once #3742 made it runnable
        # it ran inside shard 3 on PR #3732 at ac3ed20d from 20:09:53Z until the
        # shard's 1380 s wall budget killed the whole shard at 34% progress
        # (exit 124, the bench fixture, engine and node still alive in the
        # job-completed hook). This lane installs no frontend node_modules and
        # no browsers, so it is the wrong host whatever the duration. The bench
        # runs in e2e.yml's `extended` job, which has all three.
        # tests/scripts/test_ci_playlist_bench_lane.py pins both halves.
        # TMPDIR: tempfile/mkdtemp scratch (cloudsync sims, Chromium profiles,
        # opendj temp dirs) lands in the per-job RUNNER_TEMP beside --basetemp,
        # not /tmp. The runner empties RUNNER_TEMP at every job start, so a
        # killed shard cannot leak, and on hosts that mount it as tmpfs
        # (runner-a, runner-b-3..14) the churn never reaches the SSD.
        # ADR-NEW-ci-test-scratch-on-tmpfs; pinned by
        # tests/quality/test_pytest_scratch_in_runner_temp.py.
        #
        # PR-HEAD TEST SELECTION (DEVOPS-20, the maintainer Thu 1 Oct 2026, no trial;
        # docs/decisions/ADR-NEW-pr-heads-run-affected-tests.md). A pull
        # request HEAD runs only the test modules its change affects, spread
        # over these same five shards; a Trunk queue draft (trunk-merge/*), a
        # ci:trunk-repair PR, a main push and a dispatch run the full lane
        # below, unchanged, so every merge is still fully tested on the tree
        # that lands. Selection happens ONLY when the repo variable
        # CI_PR_TEST_SELECTION equals `affected`; unset or anything else is
        # the full suite (the kill switch and the revert). scripts/
        # ci_test_selection.py decides, logs the mode loudly, writes the job
        # summary and the record shard 1 uploads for the escape measurement
        # (scripts/ci_selection_escapes.py), and falls back to FULL, never to
        # an empty run, on any global path, UNKNOWN or error. Pinned by
        # tests/scripts/test_ci_test_selection_workflow.py.
        env:
          TMPDIR: ${{ runner.temp }}
          CI_PR_TEST_SELECTION: ${{ vars.CI_PR_TEST_SELECTION }}
        run: |
          set -uo pipefail
          # Remove any report left by an EARLIER run on this persistent
          # self-hosted workspace before writing a new one (Sol P1 on #3447).
          # NOTE: the JUnit report is written under RUNNER_TEMP, not into the
          # workspace, so there is nothing to clear here. See the --junitxml
          # path below for why that ends the stale-report problem outright
          # rather than guarding against it (Sol P1 on #3447, rounds 1-4).
          # MDT_PYTEST_TIMEOUT_S is this SHARD's own wall budget, and it is
          # load-bearing rather than belt and braces. A `timeout-minutes` kill
          # on the JOB is reported by GitHub as CANCELLED -- and so is a run
          # superseded by a newer push on the same ref, and so is a fail-fast
          # cascade. One conclusion, three causes, and only one of them is the
          # author's to act on, so every reader had to pull per-job timings to
          # tell them apart (#1690, measured on #1628, #1010 and #1686; #1686
          # reported state=FAILURE on a rollup holding zero FAILURE contexts
          # purely because two shards had been timed out into CANCELLED).
          #
          # Bounding the shard instead of the job breaks the tie with no
          # timings to fetch. `timeout` returns 124, so the step exits non-zero
          # and the job concludes FAILURE under an annotation that names the
          # cause; superseded and cascaded runs stay CANCELLED. A genuinely
          # hung shard still reddens, 24 minutes in.
          #
          # 1380 s was measured against this file's own contention record: a
          # shard read 314 s on a quiet host and 636 s on a busy one, so a
          # healthy worst case under that same swing reached ~1300 s. That
          # record is from a 4,100-test suite; this lane collects 14,706 now.
          #
          # 1380 -> 1800 (Mon 21 Sep 2026). Re-measured over the 60 most
          # recent completed ci.yml runs, 78 shard jobs across every runner in
          # the pytest pool and the main-fix reserve: GREEN shards take a
          # median of 1,150-1,260 s per runner and up to 1,385 s, and 12 of the
          # 78 were killed by this budget at 90-98% progress (run 35664779923
          # shard 4 at 95% after 1380 s, run 35664332373 shard 2 on main at
          # 98%, both on runner-a-13 back to back). A budget 10% over the
          # green median is not a hang detector, it is a coin flip on host
          # load, and it reddened a third of the shards in that window with 0
          # failing tests. 1800 s clears the slowest kill (~1,500 s to finish
          # at that rate) by 20%; a genuinely hung shard still reddens, 30
          # minutes in. The real fix is the pool's throughput (one shard is
          # ~4x slower here than the 273-289 s hosted figure above); this only
          # stops the budget from reporting that as a test failure.
          #
          # 1800 -> 2400 (Tue 22 Sep 2026). The runner-b-N runners joined
          # the `pytest` pool at ~11:50Z and took most shards from then on;
          # they share one host with the runner-a-N runners (11 of 18
          # in-progress jobs on that box at once, issue #3802). Measured over
          # every ci.yml shard job since Mon 21 Sep 12:00Z (1,314 jobs): GREEN
          # shards take a median 1,171 s of job wall on runner-a (p90 1,330 s,
          # max 1,637 s) and 1,583 s on runner-b (p90 1,688 s, max 1,812 s;
          # 27 of 38 over 1,500 s), and 9 shards were killed by the 1800 s
          # budget at 83-98% progress with 0 failing tests, 6 of them on
          # main (runs at 11:15Z-12:15Z, shards 1, 3, 4 and 5, all on
          # runner-b) and 3 on this PR (shards 3, 4, 5 at 90%, 98%, 83%).
          # The slowest kill needed ~2,170 s to finish at its rate; 2400 s
          # clears it by 10% and the runner-b green p90 by 40%. A genuinely
          # hung shard still reddens, 40 minutes in, and a single hung TEST
          # still fails by name at --timeout=900 long before that.
          #
          # The JOB cap is the outer backstop and must clear this budget by the
          # SUM OF THE PRE-PYTEST STEPS' OWN BOUNDS, which is what stops a hang
          # in checkout or provisioning from reaching the cap instead. Those
          # bounds live on each step; tests/scripts/test_ci_shard_matrix.py pins
          # the budget, their sum and the cap against each other.
          #
          # --kill-after: a suite that ignores TERM still dies rather than
          # running to the job cap. `timeout` puts the command in its own
          # process group, so pytest's subprocesses are reaped with it (#1338
          # is what orphaned processes in this workspace cost us).
          # --timeout=900 below is pytest-timeout's PER-TEST wall clock, so
          # a single hung test fails by name with its stack instead of taking
          # the whole shard to this budget (the fast tier's step documents
          # the incident). 900 s clears every recorded test in the ledger by
          # a wide margin (the slowest committed duration is ~400 s), so
          # it only fires on a hang. tests/scripts/test_ci_shard_matrix.py
          # pins it under the budget.
          # The selection below runs INSIDE this budget (pytest gets what is
          # left of it), so the job-cap arithmetic pinned in
          # tests/scripts/test_ci_shard_matrix.py is unchanged by it.
          MDT_PYTEST_TIMEOUT_S=2400
          started=$(date +%s)
          # The lane's ignores, ONE list: the full lane passes it to pytest,
          # and the selector drops these paths from a selection, because a
          # module named on the command line is collected even when an
          # --ignore covers it (measured, pytest 9.1).
          LANE_IGNORES=(
            --ignore=tests/analysis
            --ignore=tests/vocals
            --ignore=tests/sync/usb
            --ignore=tests/sets
            --ignore=tests/quality/test_frontend_typing_gate.py
            --ignore=tests/quality/test_frontend_typing_directives.py
            --ignore=tests/quality/test_mypy_cache.py
            --ignore=tests/perf/test_library_playlist_switch_bench.py
          )
          # Mode: full | affected | empty, one line on stdout. A selector
          # that cannot answer (crash, hang, nonsense) means FULL, loudly:
          # an unknown selection must never become a smaller run.
          selection_dir="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pr-test-selection"
          selection_rc=0
          mode="$(timeout --kill-after=10 300 .venv/bin/python -m scripts.ci_test_selection select \
            --shard ${{ matrix.shard }} --shards 5 --out-dir "$selection_dir" \
            "${LANE_IGNORES[@]}")" || selection_rc=$?
          case "$selection_rc:$mode" in
            0:full|0:affected|0:empty) ;;
            *)
              printf '\n::warning title=PR test selection UNKNOWN (shard %s of 5)::the selector exited %s with mode [%s]; running the FULL suite\n' \
                "${{ matrix.shard }}" "$selection_rc" "$mode"
              mode=full
              ;;
          esac
          echo "selection_mode=$mode" >> "$GITHUB_OUTPUT"
          case "$mode" in
            empty)
              printf '\n::notice title=pytest fast lane (shard %s of 5): 0 affected tests::this PR head selected no test module for this shard, so pytest did not start and the shard reports success. The Trunk merge queue runs the FULL suite on the exact tree that lands.\n' \
                "${{ matrix.shard }}"
              exit 0
              ;;
            affected)
              mapfile -t MODE_ARGS < "$selection_dir/shard-modules.txt"
              echo "[selection] AFFECTED: shard ${{ matrix.shard }} runs ${#MODE_ARGS[@]} selected module(s); the queue runs the full suite"
              ;;
            full)
              MODE_ARGS=(
                --collect-floor 3181
                --ledger-coverage-min 0.85 --ledger-coverage-warn 0.95
                --splits 5 --group ${{ matrix.shard }}
                --splitting-algorithm least_duration
                --durations-path .test_durations
                --store-durations --clean-durations
              )
              echo "[selection] FULL: shard ${{ matrix.shard }} runs its pytest-split slice of the whole lane"
              ;;
          esac
          budget_left=$(( MDT_PYTEST_TIMEOUT_S - ($(date +%s) - started) ))
          set +e
          timeout --kill-after=60 "$budget_left" \
            .venv/bin/pytest \
              --basetemp="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-shard-${{ matrix.shard }}" \
              --junitxml="${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-shard-${{ matrix.shard }}.xml" \
              "${MODE_ARGS[@]}" \
              --durations=25 \
              --timeout=900 \
              "${LANE_IGNORES[@]}"
          rc=$?
          set -e
          # Exit 5 (no test item collected) is a FAILURE, except in affected
          # mode when the JUnit report proves EACH selected module was
          # reached and skipped itself at module level, which the full lane
          # reports green for the same modules. An empty selection never gets
          # here: it exited 0 above without starting pytest.
          if [ "$mode" = affected ] && [ "$rc" -eq 5 ]; then
            if .venv/bin/python -m scripts.ci_test_selection junit-all-skipped \
                "${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-shard-${{ matrix.shard }}.xml" \
                --modules "$selection_dir/shard-modules.txt"; then
              echo "[selection] exit 5 with every selected module skipped at module level (JUnit evidence): success"
              rc=0
            else
              printf '\n::error title=pytest fast lane (shard %s of 5): selected modules collected nothing::pytest exit 5 and the JUnit report does not show every selected module skipped\n' \
                "${{ matrix.shard }}"
            fi
          fi
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            elapsed=$(( $(date +%s) - started ))
            # 124 is `timeout`'s own expiry. 137 is its KILL escalation: the
            # suite ignored TERM for the full --kill-after, so SIGKILL landed.
            # Handling only 124 would leave the hard hang -- the exact case
            # --kill-after exists for -- exiting 137 over a bare "Process
            # completed with exit code 137", which names nothing and is the
            # inference this step exists to remove.
            kill_note="its wall budget was reached"
            [ "$rc" -eq 124 ] || kill_note="its wall budget was reached and the suite ignored TERM for the 60s kill grace, so it was SIGKILLed"
            # The leading newline is load-bearing, not cosmetics. pytest's last
            # progress line has no trailing newline when SIGTERM lands, so a
            # plain `echo` emits the command PART-WAY THROUGH a log line, and
            # the runner only parses a workflow command at the START of one.
            # Measured on this workflow's first live cap-kill (run 34480866849,
            # shard 2, Thu 10 Sep 2026): the annotation text reached the log but
            # registered NO check-run annotation, leaving only "Process completed
            # with exit code 124" -- which is the inference this step exists to
            # remove. printf forces the command onto its own line.
            printf '\n::error title=pytest fast lane TIMEOUT (shard %s of 5)::shard %s of 5 exit %s: %s after %ss. This is a TIMEOUT, not a run superseded by a newer push and not a fail-fast cascade -- those two report CANCELLED, this reports FAILURE.\n' \
              "${{ matrix.shard }}" "${{ matrix.shard }}" "$rc" "$kill_note" "$elapsed"
            {
              echo "### pytest fast lane (shard ${{ matrix.shard }} of 5): TIMEOUT"
              echo
              echo "The shard was killed by its own wall-clock budget, not by the runner."
              echo
              echo "| field | value |"
              echo "|:--|:--|"
              echo "| shard budget | ${MDT_PYTEST_TIMEOUT_S}s |"
              echo "| exit code | ${rc} |"
              echo "| killed by | ${kill_note} |"
              echo "| elapsed | ${elapsed}s |"
              echo "| job cap | 30m, the runner backstop, which is not what fired |"
              echo
              echo "A run superseded by a newer push and a fail-fast cascade both report CANCELLED. This reports FAILURE, so the three are distinguishable without pulling per-job timings."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Upload this shard's measured durations
        # Always, including on a red shard: the durations of the tests that
        # did run are still the rebalance input.
        #
        # include-hidden-files: upload-artifact v4 skips dotfiles by default,
        # and with `if-no-files-found: warn` that skip was invisible: every
        # shard of trunk e9ed11ecf "uploaded" nothing and stayed green. An
        # empty upload is now an error, so the instrument cannot silently
        # stop measuring.
        #
        # FULL mode only (DEVOPS-20): an affected-mode PR head runs a
        # selection without --store-durations, so its .test_durations is the
        # committed file byte for byte, not a measurement of this shard's
        # slice, and an empty shard ran nothing. A step that never set the
        # mode never ran pytest either. Upload only what was measured.
        if: always() && steps.pytest-shard.outputs.selection_mode == 'full'
        # Non-fatal, on purpose: the durations feed the next rebalance of the
        # shard split, they are not this shard's verdict. Trunk 5534d0e78 went
        # red (Tue 8 Sep 2026 15:45 UTC) on this step alone with a 403 on
        # FinalizeArtifact when Actions storage crossed the plan's limit; a
        # storage block must never paint trunk red. One day of retention is all
        # the rebalance ever reads (5 artifacts per run, ~200 runs per day).
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations-shard-${{ matrix.shard }}
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload the PR test selection record (DEVOPS-20 escape measurement)
        # One copy per run, from shard 1 (every shard computes the identical
        # record). Keyed by the PR HEAD sha, which is what Trunk enqueues, and
        # by attempt, because v4 artifact names are immutable within a run.
        # scripts/ci_selection_escapes.py reads it back for every member PR of
        # a queue draft that failed a shard. Non-fatal like the uploads around
        # it: a storage block must never paint a PR red, and a missing record
        # reads as UNKNOWN there, never as "selected". Three days, the
        # repo's ceiling for a per-run byproduct (test_ci_artifact_storage.py):
        # measure a window within three days of it, or its older heads read
        # UNKNOWN.
        if: always() && matrix.shard == 1 && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-test-selection-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-test-selection/selection.json
          if-no-files-found: error
          retention-days: 3

      - name: Stage this shard's JUnit report for the isolated CI Insights job
        # ROUND 1, MEASURE ONLY (DevOps ruling, Wed 16 Sep 2026). Per-test
        # pass/fail history makes flakiness on this lane MEASURED instead of
        # argued about. It deliberately does NOT decide the shard's verdict:
        # `exit "$rc"` in the pytest step above is still the only thing that
        # reddens this job.
        #
        # WHY THIS ONLY STAGES, AND THE UPLOAD LIVES IN ANOTHER JOB: the
        # uploader's credential must never be in scope in a job that also runs
        # repository code. Scoping the secret to a single step is NOT enough
        # on a SELF-HOSTED runner, because the job's processes outlive the
        # step that started them: a test that forks a background process can
        # sit and read the upload action's INPUT_TOKEN at the moment it
        # appears (Sol P1 on #3256, round 2). A step boundary narrows the
        # window; only a JOB boundary removes the co-residency. So this job
        # writes the report to disk and stops, and `ci-insights` below --
        # which has no checkout step at all -- does the upload.
        if: always()
        # Non-fatal, like the artifact upload below it (Sol P2 on #3447). A
        # transient mkdir, copy, permission or disk-space failure here is an
        # INSTRUMENTATION failure, and round 1 is measure-only: pytest's exit
        # code is the shard's verdict. Reddening the lane because staging
        # broke would contradict that contract. The isolated job's
        # missing-report guard is what makes the failure visible instead.
        id: stage-insights
        continue-on-error: true
        env:
          # ATTEMPT-SCOPED, so staleness is impossible rather than cleaned up
          # (Sol P1 on #3447, round 2). The previous revision cleared a fixed
          # directory with `rm -rf`, but this script has no errexit: a failed
          # rm fell through to a `mkdir -p` that happily reused the surviving
          # directory, and the step still reported success. A name carrying
          # this run and attempt cannot collide with anything an earlier run
          # wrote, so correctness no longer rides on a cleanup succeeding.
          STAGE_DIR: ci-insights-out-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          PYTEST_OUTCOME: ${{ steps.pytest-shard.outcome }}
        run: |
          set -uo pipefail
          mkdir -p "$STAGE_DIR" || exit 1
          # REFUSE to copy a report the pytest step did not write (Sol P1 on
          # #3447, round 2). The source path under RUNNER_TEMP is what makes a
          # stale report impossible -- the runner empties that directory at the
          # start and end of EVERY job, so no earlier run can leave a file
          # there, and no cleanup of ours has to succeed for that to hold.
          # This outcome gate is the second line: a pytest that never ran has
          # no result, and no result must travel as an ABSENCE rather than as
          # whatever file happens to be present.
          case "$PYTEST_OUTCOME" in
            success|failure)
              # A shard SIGKILLed at its wall budget never reaches pytest's
              # report-writing, so an absent report is a real state here too,
              # and is carried as an absence rather than an empty file.
              if [ -f "${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-shard-${{ matrix.shard }}.xml" ]; then
                cp "${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-shard-${{ matrix.shard }}.xml" "$STAGE_DIR/" || {
                  printf '::error title=CI Insights UNMEASURED::the report existed but could not be staged; refusing to upload a directory that omits it\n'
                  exit 1
                }
              fi
              ;;
            *)
              printf '::notice title=CI Insights::pytest step did not run (outcome=%s); staging an absence rather than a report left by an earlier run\n' \
                "${PYTEST_OUTCOME:-empty}"
              ;;
          esac
          # These two writes are REQUIRED, not best-effort (Sol P1 on #3447,
          # round 4). This script has no errexit, so an unguarded write that
          # failed -- a full disk, a read-only workspace -- left the step
          # exiting 0. `continue-on-error` then recorded outcome=success and
          # the upload proceeded with a directory missing the very files the
          # downstream guard reads, so a WRITE failure arrived as an expected
          # absence instead of as UNMEASURED. Failing here is what lets the
          # upload's `outcome == 'success'` condition actually refuse.
          printf '%s' "$PYTEST_OUTCOME" > "$STAGE_DIR/outcome.txt" || {
            printf '::error title=CI Insights UNMEASURED::could not write outcome.txt; refusing to upload an incomplete staging directory\n'
            exit 1
          }
          printf 'stage_dir=%s\n' "$STAGE_DIR" >> "$GITHUB_OUTPUT" || {
            printf '::error title=CI Insights UNMEASURED::could not write stage_dir to GITHUB_OUTPUT; the upload would have no path to read\n'
            exit 1
          }
          # Best-effort prune, scoped to THIS SHARD and to directories that
          # are provably obsolete (Sol P1 on #3447, round 3). The first draft
          # matched `ci-insights-out*`, which would delete another shard's or
          # another attempt's directory in a shared workspace -- possibly one
          # freshly written and not yet uploaded, turning a real result into a
          # missing artifact. That is the same defect this change exists to
          # prevent, pointed the other way. `-mmin +120` is the obsolescence
          # proof: a shard's wall budget is far under two hours, so nothing
          # still in flight can match. Correctness does not depend on this
          # running at all; this attempt's directory is excluded from it.
          find . -maxdepth 1 -type d \
            -name "ci-insights-out-*-${{ matrix.shard }}" \
            ! -name "$STAGE_DIR" -mmin +120 \
            -exec rm -rf {} + 2>/dev/null || true

      - name: Upload this shard's JUnit report for CI Insights
        # Non-fatal for the same reason the durations upload above is: Actions
        # artifact storage has crossed the plan limit twice on this repository
        # (#2176, trunk 5534d0e78 Tue 8 Sep 2026), and a storage block must
        # never paint a pull request red. retention-days: 1 because the only
        # reader is the `ci-insights` job in this same run.
        # SUPPRESSED when staging did not genuinely succeed (Sol P1 on #3447,
        # round 2). `outcome` is read, not `conclusion`: outcome is the step's
        # real result BEFORE continue-on-error rewrites it, so this still sees
        # a staging failure that the lane deliberately does not redden over.
        if: always() && steps.stage-insights.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # run_attempt is in the NAME (Sol P1 on #3447, round 4). A re-run
          # keeps the same run_id and v4 artifacts are immutable by name, so
          # without it this upload fails on a re-run -- non-fatally, by design
          # -- and the isolated job then downloads attempt 1's artifact and
          # records its results as the current attempt's.
          name: ci-insights-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.stage-insights.outputs.stage_dir }}
          if-no-files-found: error
          retention-days: 1

      # THE shard's verdict, and the only step that turns a red pytest run
      # into a red job (the pytest step above is continue-on-error). Exit 0
      # passes. Exit 1 passes ONLY when every failed testcase in this shard's
      # JUnit is on the list the token-isolated trunk-quarantine-list job
      # fetched; no list, any other exit code, a timeout, or a pytest step
      # that never ran all fail. ADR-NEW-trunk-flaky-quarantine-on;
      # tests/scripts/test_ci_trunk_quarantine.py pins every branch.
      - name: Fast lane verdict (pytest exit code, Trunk quarantine applied)
        if: always()
        timeout-minutes: 1
        env:
          PYTEST_OUTCOME: ${{ steps.pytest-shard.outcome }}
          PYTEST_RC: ${{ steps.pytest-shard.outputs.rc }}
          TRUNK_QUARANTINE_LIST: ${{ needs.trunk-quarantine-list.outputs.list }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          case "$PYTEST_OUTCOME" in
            success)
              echo "VERDICT: PASS -- pytest exited 0"
              exit 0
              ;;
            failure)
              .venv/bin/python scripts/ci_trunk_quarantine_verdict.py \
                --pytest-rc "$PYTEST_RC" \
                --junit "${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-shard-${SHARD}.xml" \
                --shard "$SHARD"
              ;;
            *)
              printf '::error title=pytest fast lane did not run (shard %s of 5)::pytest step outcome=%s\n' "$SHARD" "${PYTEST_OUTCOME:-empty}"
              exit 1
              ;;
          esac

  # ----- CI Insights: fast-lane test health, isolated from repository code ----
  # Records the fast lane's per-test health in Trunk Flaky Tests, the only
  # test-health sink since Wed 30 Sep 2026 (ADR-NEW-trunk-is-the-only-merge-queue,
  # which retired ADR-0078's Mergify CI Insights upload). The job id and name are
  # kept, so the required-gate wiring and the job's history stay addressable.
  #
  # This job exists ONLY so that secrets.TRUNK_API_TOKEN is never in scope in
  # a job that runs repository code. It has NO `actions/checkout` step, on
  # purpose and permanently: it consumes the JUnit reports the `test` job
  # staged as artifacts and nothing else. tests/scripts/test_ci_trunk_flaky_shadow.py
  # pins that invariant, so moving the upload back beside the tests turns the
  # suite red however the secret is scoped there.
  #
  # runs-on is GitHub-hosted rather than the self-hosted pool the rest of the
  # fleet uses, which is the point: a fresh ephemeral VM cannot be carrying a
  # process left behind by an earlier job. The job downloads a few hundred KB
  # per shard and makes one upload call per shard.
  #
  # GATED behind vars.CI_INSIGHTS_ENABLED (ADR-NEW-ci-insights-cost-gate):
  # workflow_dispatch always runs it regardless of the variable, so the path
  # stays testable without flipping a human-only repo setting. ONE job, not a
  # 5-way strategy.matrix (same ADR): a matrix job bills once PER SHARD even
  # when each shard's work is seconds long, so each shard's steps (download,
  # find the report, upload) are repeated inside this single job instead.
  ci-insights:
    name: CI Insights
    # contracts as well as test: the Rust JUnit artifacts are produced there,
    # and a red contracts job is still worth recording. !cancelled() below
    # keeps a skipped or failed need from dropping the job.
    needs: [test, contracts]
    # !cancelled(): a RED shard's test health is exactly the data worth
    # recording, so this must not be skipped when `test` fails. It IS skipped
    # when the run is cancelled (ADR-NEW-ci-insights-skip-cancelled-runs):
    # under always() it started on every run a newer push superseded, 122 of
    # 254 CI runs in 12 h measured Tue 29 Sep 2026, billing a hosted minute to
    # download reports that were never written. A shard that hits its own
    # timeout does not cancel the run, so those runs are still recorded.
    #
    # The gate is CONJOINED with workflow_dispatch, not standing alone, for
    # the same reason vars.CI_HOSTED_OS_JOBS is conjoined with its events in
    # macos-packaging.yml: a bare `vars.X == 'true'` disjunct would be true
    # for every event this workflow subscribes to, which is fine here only
    # because ci.yml's own `pull_request.paths` filter already scopes which
    # events reach this workflow at all -- there is no `create`-style
    # unfiltered trigger for this gate to accidentally admit.
    if: >-
      !cancelled() &&
      !(github.event_name == 'workflow_dispatch' && inputs.tier == 'fast') &&
      (github.event_name == 'workflow_dispatch' || vars.CI_INSIGHTS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A secret cannot be read from a step `if:`, so its presence is turned
      # into a boolean here. An unprovisioned token means this lane is NOT
      # MEASURED, which is honest and must read differently from a token that
      # is present and rejected (.claude/rules/verification.md: a tool that
      # cannot measure must report UNKNOWN, never a verdict). Unset on forks
      # and before the secret is provisioned; both are fine. Checked once for
      # all five shards -- the token does not vary per shard.
      # Pinned by tests/scripts/test_ci_trunk_flaky_shadow.py.
      - name: Is a Trunk API token provisioned
        id: trunk-token
        timeout-minutes: 1
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
        run: |
          if [ -n "${TRUNK_API_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # ----- shard 1 -------------------------------------------------------
      - name: Download shard 1's staged report
        id: download-1
        if: always() && steps.trunk-token.outputs.present == 'true'
        # Non-fatal: the shard may have been cancelled, or the artifact upload
        # may have hit the storage block. Either way the guard step below says
        # so rather than this job failing and reading as a test failure.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Must match the upload's name exactly, run_attempt included, or
          # this downloads an earlier attempt's report (Sol P1 on #3447, r4).
          name: ci-insights-shard-1-attempt-${{ github.run_attempt }}
          path: staged-1

      - name: Find shard 1's staged report
        id: shard-report-1
        if: always() && steps.trunk-token.outputs.present == 'true'
        run: |
          if [ -f "staged-1/junit-shard-1.xml" ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi

      # ----- shard 2 -------------------------------------------------------
      - name: Download shard 2's staged report
        id: download-2
        if: always() && steps.trunk-token.outputs.present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-insights-shard-2-attempt-${{ github.run_attempt }}
          path: staged-2

      - name: Find shard 2's staged report
        id: shard-report-2
        if: always() && steps.trunk-token.outputs.present == 'true'
        run: |
          if [ -f "staged-2/junit-shard-2.xml" ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi

      # ----- shard 3 -------------------------------------------------------
      - name: Download shard 3's staged report
        id: download-3
        if: always() && steps.trunk-token.outputs.present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-insights-shard-3-attempt-${{ github.run_attempt }}
