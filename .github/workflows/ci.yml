        id: trunk-flaky-tests-rust-desktop
        if: always() && steps.trunk-token.outputs.present == 'true' && steps.rust-report-desktop.outputs.report == 'true'
        continue-on-error: true
        uses: trunk-io/analytics-uploader@14c0f18990953eecd01c9c5afe3cc63a73b6c371 # v2.1.5
        with:
          junit-paths: staged-rust-desktop/junit-rust-desktop.xml
