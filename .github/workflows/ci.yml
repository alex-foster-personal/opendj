          gh-repo-url: ${{ github.event.pull_request.base.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          gh-repo-head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          gh-repo-head-branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          gh-repo-head-commit-epoch: ${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
          # Pinned, never `latest`: the binary runs with the token in scope. 0.15.6 is
          # the newest release past the 3-day release-age wait (0.16.0 is 2 days old).
          cli-version: 0.15.6

      - name: Record shard 5's test health in Trunk Flaky Tests
        id: trunk-flaky-tests-5
        if: always() && steps.trunk-token.outputs.present == 'true' && steps.shard-report-5.outputs.report == 'true'
        continue-on-error: true
        uses: trunk-io/analytics-uploader@14c0f18990953eecd01c9c5afe3cc63a73b6c371 # v2.1.5
        with:
          junit-paths: staged-5/junit-shard-5.xml
          org-slug: seat-a-org
          token: ${{ secrets.TRUNK_API_TOKEN }}
          test-collection-id: dViMBgFA
          use-uncloned-repo: true
          quarantine: false
          # The uploader defaults these four to github.event.pull_request.*, which is
          # empty on a push to main or a dispatch, so every such upload failed with
