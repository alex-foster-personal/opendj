          gh-repo-url: ${{ github.event.pull_request.base.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          gh-repo-head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          gh-repo-head-branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          gh-repo-head-commit-epoch: ${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
          # Pinned, never `latest`: the binary runs with the token in scope. 0.15.6 is
          # the newest release past the 3-day release-age wait (0.16.0 is 2 days old).
          cli-version: 0.15.6

      # ----- cargo suites (desktop, audio) ---------------------------------
      # Same uploader contract as the five shards: one report per upload,
      # quarantine off, token-gated, no checkout. A dead cargo suite must be
      # its own upload so Trunk's infrastructure-failure protection can see it.
      - name: Download the desktop Rust staged report
        id: download-rust-desktop
        if: always() && steps.trunk-token.outputs.present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-insights-rust-desktop-attempt-${{ github.run_attempt }}
