      # ----- shard 4 -------------------------------------------------------
      - name: Download shard 4's staged report
        id: download-4
        if: always() && steps.trunk-token.outputs.present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-insights-shard-4-attempt-${{ github.run_attempt }}
          path: staged-4

      - name: Find shard 4's staged report
        id: shard-report-4
        if: always() && steps.trunk-token.outputs.present == 'true'
        run: |
          if [ -f "staged-4/junit-shard-4.xml" ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi

      # ----- shard 5 -------------------------------------------------------
      - name: Download shard 5's staged report
        id: download-5
        if: always() && steps.trunk-token.outputs.present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-insights-shard-5-attempt-${{ github.run_attempt }}
          path: staged-5

      - name: Find shard 5's staged report
        id: shard-report-5
        if: always() && steps.trunk-token.outputs.present == 'true'
        run: |
          if [ -f "staged-5/junit-shard-5.xml" ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi

      # ----- Trunk Flaky Tests ------------------------------------------------
      # ONE UPLOAD PER SHARD (ADR-NEW-trunk-flaky-quarantine-on). Trunk's
      # Infrastructure Failure Protection judges each UPLOAD: when more than
      # the collection's threshold (80%) of an upload's tests fail, the whole
      # upload is excluded from flaky detection. A single upload covering all
      # five shards made one dead shard only ~20% of it, so a runner that
      # errored every test in its shard (run 36655705046, shard 2 attempt 1 on
      # agbox3-7: 3508 errors of 3557, a stale basetemp) was read as 3508
      # flaky tests the moment the retry passed. Per shard, that same upload is
      # 98.6% failing and is excluded.
      #
      # Upload only: `quarantine: false` stays. The analytics CLI would turn
      # ANY non-zero exit green once every recorded failure is quarantined,
      # timeouts and collection errors included, so the verdict lives in the
      # test job's own "Fast lane verdict" step instead. A failed upload is
      # never the lane's verdict (continue-on-error); the guard makes it loud.
      - name: Record shard 1's test health in Trunk Flaky Tests
        id: trunk-flaky-tests-1
        if: always() && steps.trunk-token.outputs.present == 'true' && steps.shard-report-1.outputs.report == 'true'
        continue-on-error: true
        uses: trunk-io/analytics-uploader@14c0f18990953eecd01c9c5afe3cc63a73b6c371 # v2.1.5
        with:
          junit-paths: staged-1/junit-shard-1.xml
          org-slug: seat-a-org
          token: ${{ secrets.TRUNK_API_TOKEN }}
          test-collection-id: dViMBgFA
          use-uncloned-repo: true
          quarantine: false
          # The uploader defaults these four to github.event.pull_request.*, which is
          # empty on a push to main or a dispatch, so every such upload failed with
          # missing required arguments while this job stayed green.
          gh-repo-url: ${{ github.event.pull_request.base.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          gh-repo-head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          gh-repo-head-branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          gh-repo-head-commit-epoch: ${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
          # Pinned, never `latest`: the binary runs with the token in scope. 0.15.6 is
          # the newest release past the 3-day release-age wait (0.16.0 is 2 days old).
          cli-version: 0.15.6

      - name: Record shard 2's test health in Trunk Flaky Tests
        id: trunk-flaky-tests-2
        if: always() && steps.trunk-token.outputs.present == 'true' && steps.shard-report-2.outputs.report == 'true'
        continue-on-error: true
        uses: trunk-io/analytics-uploader@14c0f18990953eecd01c9c5afe3cc63a73b6c371 # v2.1.5
        with:
          junit-paths: staged-2/junit-shard-2.xml
          org-slug: seat-a-org
          token: ${{ secrets.TRUNK_API_TOKEN }}
          test-collection-id: dViMBgFA
          use-uncloned-repo: true
          quarantine: false
          # The uploader defaults these four to github.event.pull_request.*, which is
          # empty on a push to main or a dispatch, so every such upload failed with
          # missing required arguments while this job stayed green.
          gh-repo-url: ${{ github.event.pull_request.base.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          gh-repo-head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          gh-repo-head-branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          gh-repo-head-commit-epoch: ${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
          # Pinned, never `latest`: the binary runs with the token in scope. 0.15.6 is
          # the newest release past the 3-day release-age wait (0.16.0 is 2 days old).
          cli-version: 0.15.6

      - name: Record shard 3's test health in Trunk Flaky Tests
        id: trunk-flaky-tests-3
        if: always() && steps.trunk-token.outputs.present == 'true' && steps.shard-report-3.outputs.report == 'true'
        continue-on-error: true
        uses: trunk-io/analytics-uploader@14c0f18990953eecd01c9c5afe3cc63a73b6c371 # v2.1.5
        with:
          junit-paths: staged-3/junit-shard-3.xml
          org-slug: seat-a-org
          token: ${{ secrets.TRUNK_API_TOKEN }}
