    name: frontend unit + check + build
    needs: [scope, frontend-build]
    # Skipped by a `tier: fast` dispatch (main-control.yml's six-hour control
    # wants the fast tier alone); `inputs` is empty on push and pull_request,
    # so this is a no-op for every other event.
    if: ${{ needs.scope.outputs.in_scope == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.tier == 'fast') }}
    # See the runner-selection note on the `test` job above.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON_MERGE_QUEUE || vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
