        if: always() && steps.trunk-token.outputs.present == 'true' && steps.rust-report-audio.outputs.report == 'true'
        continue-on-error: true
        uses: trunk-io/analytics-uploader@14c0f18990953eecd01c9c5afe3cc63a73b6c371 # v2.1.5
        with:
          junit-paths: staged-rust-audio/junit-rust-audio.xml
          org-slug: seat-a-org
          token: ${{ secrets.TRUNK_API_TOKEN }}
          test-collection-id: dViMBgFA
          use-uncloned-repo: true
          quarantine: false
          gh-repo-url: ${{ github.event.pull_request.base.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          gh-repo-head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          gh-repo-head-branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          gh-repo-head-commit-epoch: ${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
          cli-version: 0.15.6

      - name: The Trunk uploads must have run
        # An instrument that stopped measuring has to say so. Per shard, in order:
        #
        # 1. No report. A failed download, a suppressed staging step and a
        #    shard that genuinely wrote no report all arrive here as "no
        #    file", so the download's own outcome separates them, and the
        #    transfer failure is checked FIRST so the legitimate-absence
        #    notice never claims an absence nobody measured.
        # 2. A report whose upload did not succeed is UNMEASURED.
        #
        # The uploader allows missing files, so an upload given nothing still
        # "succeeds" while recording nothing: a run where no shard upload
        # succeeded is UNMEASURED too. This annotates rather than exits
        # non-zero, on purpose: the upload is not this lane's verdict.
        if: always() && steps.trunk-token.outputs.present == 'true'
        env:
          HAS_REPORT_1: ${{ steps.shard-report-1.outputs.report }}
          TRUNK_UPLOAD_1: ${{ steps.trunk-flaky-tests-1.outcome }}
          DOWNLOAD_1: ${{ steps.download-1.outcome }}
          HAS_REPORT_2: ${{ steps.shard-report-2.outputs.report }}
          TRUNK_UPLOAD_2: ${{ steps.trunk-flaky-tests-2.outcome }}
          DOWNLOAD_2: ${{ steps.download-2.outcome }}
          HAS_REPORT_3: ${{ steps.shard-report-3.outputs.report }}
          TRUNK_UPLOAD_3: ${{ steps.trunk-flaky-tests-3.outcome }}
          DOWNLOAD_3: ${{ steps.download-3.outcome }}
          HAS_REPORT_4: ${{ steps.shard-report-4.outputs.report }}
          TRUNK_UPLOAD_4: ${{ steps.trunk-flaky-tests-4.outcome }}
          DOWNLOAD_4: ${{ steps.download-4.outcome }}
          HAS_REPORT_5: ${{ steps.shard-report-5.outputs.report }}
          TRUNK_UPLOAD_5: ${{ steps.trunk-flaky-tests-5.outcome }}
          DOWNLOAD_5: ${{ steps.download-5.outcome }}
          HAS_REPORT_RUST_desktop: ${{ steps.rust-report-desktop.outputs.report }}
          TRUNK_UPLOAD_RUST_desktop: ${{ steps.trunk-flaky-tests-rust-desktop.outcome }}
          DOWNLOAD_RUST_desktop: ${{ steps.download-rust-desktop.outcome }}
          HAS_REPORT_RUST_audio: ${{ steps.rust-report-audio.outputs.report }}
          TRUNK_UPLOAD_RUST_audio: ${{ steps.trunk-flaky-tests-rust-audio.outcome }}
          DOWNLOAD_RUST_audio: ${{ steps.download-rust-audio.outcome }}
        run: |
          set -uo pipefail
          uploaded=0
          for shard in 1 2 3 4 5; do
            has_report_var="HAS_REPORT_${shard}"; upload_var="TRUNK_UPLOAD_${shard}"
            download_var="DOWNLOAD_${shard}"
            has_report="${!has_report_var:-}"; upload="${!upload_var:-}"
            download="${!download_var:-}"
            if [ "$has_report" != "true" ] && [ "$download" != "success" ]; then
              printf '::error title=Trunk upload UNMEASURED (shard %s of 5)::the staged artifact could not be downloaded (download outcome=%s), so whether this shard produced a report is UNKNOWN. This is an instrumentation failure, NOT a shard that legitimately recorded nothing. It never affects the verdict.\n' "$shard" "${download:-empty}"
            elif [ "$has_report" != "true" ]; then
              printf '::notice title=Trunk: no report (shard %s of 5)::the artifact downloaded cleanly and contains no junit-shard-%s.xml, so this shard genuinely recorded no test health. Expected when the shard hit its wall budget or was cancelled; see the TIMEOUT annotation on the test job.\n' "$shard" "$shard"
            elif [ "$upload" = "success" ]; then
              echo "TRUNK_UPLOAD shard ${shard}: success"
              uploaded=$((uploaded + 1))
            else
              printf '::warning title=Trunk upload UNMEASURED (shard %s of 5)::the Trunk Flaky Tests upload did not succeed (outcome=%s), so this shard recorded nothing in Trunk. It never affects the verdict.\n' "$shard" "${upload:-empty}"
            fi
          done
          if [ "$uploaded" -eq 0 ]; then
            printf '::warning title=Trunk UNMEASURED::no shard report reached Trunk in this run. It never affects the verdict.\n'
          else
            echo "TRUNK_UPLOAD: success (${uploaded} of 5 shard uploads)"
          fi
          # Cargo suites. Fully unset vars mean this block is not in the
          # environment (the shard-only guard tests); a real run always sets
          # them from step outputs.
          rust_uploaded=0
          rust_seen=0
          for suite in desktop audio; do
            has_report_var="HAS_REPORT_RUST_${suite}"; upload_var="TRUNK_UPLOAD_RUST_${suite}"
            download_var="DOWNLOAD_RUST_${suite}"
            has_report="${!has_report_var:-}"; upload="${!upload_var:-}"
            download="${!download_var:-}"
            if [ -z "$has_report" ] && [ -z "$download" ] && [ -z "$upload" ]; then
              continue
            fi
            rust_seen=1
            if [ "$has_report" != "true" ] && [ "$download" != "success" ]; then
              printf '::error title=Trunk upload UNMEASURED (rust %s)::the staged artifact could not be downloaded (download outcome=%s). It never affects the verdict.\n' "$suite" "${download:-empty}"
            elif [ "$has_report" != "true" ]; then
              printf '::notice title=Trunk: no report (rust %s)::the artifact downloaded cleanly and contains no junit-rust-%s.xml.\n' "$suite" "$suite"
            elif [ "$upload" = "success" ]; then
              echo "TRUNK_UPLOAD rust ${suite}: success"
              rust_uploaded=$((rust_uploaded + 1))
            else
              printf '::warning title=Trunk upload UNMEASURED (rust %s)::the Trunk Flaky Tests upload did not succeed (outcome=%s). It never affects the verdict.\n' "$suite" "${upload:-empty}"
            fi
          done
          if [ "$rust_seen" -eq 1 ]; then
            echo "TRUNK_UPLOAD: rust (${rust_uploaded} of 2 cargo suite uploads)"
          fi

  # ----- fast tier (SMARTEST-CI round 6, Wed 16 Sep 2026) ---------------------
  # Replaces the affected-test canary (rounds 1 and 2). Measured Wed 16 Sep 2026
  # (specs/ci-fail-fast.md, docs/perf/an internal runner note): the
  # canary was green on 89% of runs while executing zero tests, because its
  # static-import selection was bimodal (0 or 33 to 1,552 modules) and it stood
  # down over its cap exactly on the changes that broke trunk. The fleet's first
  # failed job arrived at 4.4 min median and the final verdict at 211 min.
  #
  # This job runs EVERY fast test, FIRST, regardless of the diff, because they
  # are cheap: on main 5cca5d21f 11,700 of 13,879 collected tests are recorded
  # under 0.5 s and sum to 745 s of serial test time, against 4,582 s for the
  # other 2,179. Four legs of pytest-split over that subset. The sharded lane
  # above is unchanged and still runs everything, so this tier is purely
  # additive: it cannot hide a failure, only report one earlier. Round 6b makes
  # the slow shards the complement once this tier has a measured recall.
  #
  # Fail-fast: a leg that fails on an identity NOT already red on main (the
  # watcher's baseline, scripts/ci_main_red.py, PR #3293) cancels the whole run,
  # so the slow shards stop repeating a verdict the merging agent already has.
  # Armed by the repository variable CI_FAST_CANCEL=1; unset, the step reports
  # what it would have done. With no baseline importable it reports UNKNOWN and
  # cancels nothing: a missing baseline must never turn a trunk flake into a
  # cancelled run.
  #
  # Runner pool: CI_RUNS_ON_FAST first (a label reserved for this tier, so a
  # 6-minute leg never queues behind a 20-minute shard), then EXACTLY the
  # shard job's chain (PYTEST, E2E, LINUX, hosted). Measured on the first run
  # (35107758392, Wed 16 Sep 2026): the plain LINUX pool put all four legs on
  # runner-b, and 19 of their 20 reds were tests that pass on runner-a in the
  # same hour (ops/fleet KPI script tests, a GNU-find probe, an MP3 fixture
  # synth): host-dependent tests, not pull request defects. A tier whose
  # verdict depends on which host it landed on has no verdict, so the fast
  # legs must resolve to the same hosts the shards do, and CI_RUNS_ON_FAST
  # must name runners provisioned like those. tests/scripts/
  # test_ci_fast_tier_job.py pins this shape.
  #
  # Ledger guard: `--ledger-coverage-min 0.85` refuses a `.test_durations` that
  # names under 85% of the collection, and `--ledger-coverage-warn 0.95` puts a
  # warning annotation on any run under 95%. Before the 07:23Z regeneration on
  # Wed 16 Sep 2026 the ledger covered 22% and pytest-split balanced shards by
  # count: a shard estimated at 430 s ran 1,213 s. The same flags guard the
  # sharded lane above.
  #
  # 0.95 -> 0.85 refuse, 0.95 warn (Fri 2 Oct 2026). A hard 95% floor is crossed
  # by ordinary growth: every PR that adds tests lowers coverage a little, and
  # the run that crosses it refuses EVERY shard of EVERY run, PR heads and
  # queue drafts alike, until someone regenerates the ledger. It bounced the
  # whole Trunk queue twice: run 35977163789 (Sep, 94.999%) and Fri 2 Oct
  # (94.5%, draft #5050 run 37039160891, all five shards exit 4 before any
  # test ran; about a dozen queued PRs failed for it). Unseen tests are
  # weighted by pytest-split's average, so 5-15% unseen skews balance by
  # minutes, not the 3x of the 22% case. tests/scripts/test_ci_fast_tier_job.py
  # pins both flags on both jobs.
  fast:
    name: pytest fast tier (leg ${{ matrix.leg }} of 2)
    # Pull requests are the differential lane. The scheduled main-control
    # workflow dispatches this same fast tier on main (`tier: fast`, which
    # skips every other job above and below) so the current trunk has a direct
    # control result without changing the push policy. A `tier: full` dispatch
    # runs exactly what a push runs, so it does NOT admit this job: a red leg
    # here can reach the cancel step below and would cancel the very full run
    # an operator asked for (Codex P2 on #3651).
    needs: scope
    # NOT on a Trunk queue draft (trunk-merge/* opened by trunk-io[bot] from
    # this repo, the same three-part test every CI_RUNS_ON_MERGE_QUEUE clause
    # uses). There this tier gates nothing: Trunk's requiredStatuses are
    # `ci gate` and `e2e verdict` (ci/trunk-merge-queue.json), `ci gate` does
    # not need `fast`, and a draft is a pull_request so the tier is
    # continue-on-error. Its four legs only took four shared `pytest` runner
    # slots per draft from pull request heads while the draft's own five
    # shards ran the full lane on `mq` (measured Thu 1 Oct 2026 13:25Z: 124
    # pytest-label jobs queued against 37 busy runners). Round 6b, which makes
    # this tier a gate, must revisit this skip.
    # NOT on a PR head whose selection is FULL (TEST-CUT round 1): there the five
    # shards run every test the legs would, see the scope job's selection step.
    if: needs.scope.outputs.in_scope == 'true' && ((github.event_name == 'pull_request' && needs.scope.outputs.pr_selection != 'full' && !(startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) || (github.event_name == 'workflow_dispatch' && inputs.tier == 'fast'))
    # Round 6a: a SIGNAL, not a gate. Two real runs (35107758392, 35109932422)
    # read 19 and 8 reds per run that main's shards on runner-a do not, all in
    # host-dependent tests (ops/fleet KPI scripts that find a human `gh`
    # identity on runner-b hosts, GNU-find probes, an MP3 fixture synth). Until
    # the tier's precision against main's shards on the SAME host class is
    # measured (specs/ci-fail-fast.md round 6a, next target), a red leg must
    # not block a pull request on host noise. The verdict still reaches the
    # merging agent: the leg's log and JUnit are uploaded, the fail-fast step
    # writes an annotation and a step summary, and the watcher reads both.
    # Round 6b removes this line when the measurement licenses it.
    # Pull requests ONLY: on the six-hour `tier: fast` control dispatch
    # (main-control.yml) this job is the whole run, so a red leg must fail the
    # run or a persistent regression on main leaves every control green
    # (Codex P1 on #3651). The cancel step below is a dry run by default and
    # never cancels a failure already in the main baseline, so it is no
    # substitute for the job's own conclusion.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    # TWO legs, each half of the WHOLE fast tier (TEST-CUT round 3, Fri 2 Oct 2026;
    # was four). The legs exist on a narrowed PR head (and the six-hour control) to
    # run the fast tests selection did not pick, so they must keep covering the
    # whole tier: `--splits` below equals the matrix length, never a subset of it.
    # One leg was the ask, but measured over 40 PR runs with four green legs
    # (Fri 2 Oct 19:15Z to Sat 3 Oct 03:30Z) the whole tier is 1,556 s of pytest
    # step time (p90 1,991 s), so one leg runs about 25 min against a shard's
    # 11 min median: longer than a shard. Two legs are about 12 min each. Each
    # leg fewer saves only its fixed cost (job setup about 18 s plus collection
    # about 45 s of a 407 s mean leg), so this is about 2 runner-min and two
    # pytest seats per narrowed head, not the what-if harness's quarter-tier
    # figure. tests/scripts/test_ci_fast_tier_job.py pins legs == splits.
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2]
    permissions:
      contents: read
      actions: write   # `gh run cancel` in the fail-fast step
      checks: read     # ci_main_red reads main's check-runs for the baseline (403 without it)
    env:
      UV_NO_SYNC: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    # A ci:trunk-repair PR's legs prefer CI_RUNS_ON_TRUNK (runner-a pytest
    # runners only) ahead of the tier's own pool, the same host class as the
    # repair PR's shards and main's, so a repair's green head never depends on
    # which host a leg drew (ADR-NEW-trunk-ci-runs-on-runner-a-hosts-only).
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:trunk-repair')) && vars.CI_RUNS_ON_TRUNK || vars.CI_RUNS_ON_FAST || vars.CI_RUNS_ON_PYTEST || vars.CI_RUNS_ON_E2E || vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    # 2160 s pytest wall budget + provisioning (~2 min warm, more cold) + margin.
    timeout-minutes: 42
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (runner-b-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # SHA-pinned to the v4 tag commit (resolved 2026-04-17).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # Progress-tree provenance validates historical feature commit SHAs.
          fetch-depth: 0
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup Python
        # SHA-pinned to the v5 tag commit (resolved 2026-04-17).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The project uses modern `X | Y` type syntax and `from __future__
          # import annotations` throughout, so 3.11 is enough. Python 3.14 is
          # what the dev machine runs but 3.11 is the stable target for CI
          # because tflite-runtime (pulled in transitively by openwakeword)
          # only publishes Linux wheels up to cp311.
          python-version: "3.11"

      - name: Setup uv for isolated dependency contracts
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: Provision isolated Python test environment
        # modal is deliberately absent from requirements.txt and the `dev`
        # extra (see pyproject.toml): every call site is `uv run --with modal`.
        # It is locked in via requirements-ci.in as a CI *test-environment* tool, not a package
        # dependency, because tests/vocals/test_envelope.py and
        # test_farm_scheduling.py import it at module scope and abort
        # collection without it. Those aborts drop their markers, so the
        # uploaded coverage-matrix artifact would silently understate coverage
        # and get stamped PARTIAL RUN by the reqs plugin.
        #
        # The project itself is NOT installed into this venv. The serial lane
        # used to get `apps` on site-packages as a side effect of `make
        # waveform-native-verify` reinstalling the built wheel into .venv
        # (Makefile), which the `contracts` job now does instead; tests that
        # spawn a fresh interpreter must import from the tree (cwd or `-m`),
        # and PR #1143 fixed the one that did not.
        run: |
          # Exact sync from a hash-pinned lock: zero index requests on a warm cache
          # (issue #4252). requirements-ci.in adds modal and the pyproject
          # `observability` extra to requirements.txt; scripts/ci_lock.py compiles it.
          scripts/ci_venv.sh 3.11 --lock pylock.ci.toml

      - name: System deps for pyrekordbox (SQLCipher) and Mach-O classification
        # Provision the interpreter first. The reqs and OpenAPI sentinels run
        # with `!cancelled()` to report after a prior failure, so they still
        # need their explicit interpreter when host provisioning fails.
        #
        # pyrekordbox pulls sqlcipher3 which links against libsqlcipher at
        # runtime. Ubuntu noble (24.04) dropped the transitional
        # libsqlcipher0 package; libsqlcipher-dev now ships the runtime
        # shared library (libsqlcipher.so) as well and is sufficient.
        #
        # `file` is DECLARED here rather than assumed: the GitHub-hosted
        # ubuntu images ship it, a self-hosted box need not, and runner-a did
        # not. tests/scripts/test_engine_payload_macho.py and
        # test_appstore_requirements.py shell out to it to tell a Mach-O
        # binary from a script, so its absence took out 8 tests with a bare
        # FileNotFoundError on the first self-hosted run of this lane.
        #
        # `just`: tests/scripts/test_entrypoint_module_guard.py (#1363) drives the
        # justfile recipes for real; runner-a had no `just` and trunk e6fbb1fa6 went
        # red on shard 2 (Sun 6 Sep 2026) while runner-b, which has it, stayed green.
        #
        # `bubblewrap` (bwrap): the ci-fixer recheck sandbox (#1056, moved to
        # fleet-af `ci_fixer/sandbox.py` Thu 1 Oct 2026) refuses to run a
        # credential-free recheck without it, by design. runner-a did not
        # have it; two trunk runs went red on shard 3 (Fri 4 Sep 2026). The
        # host also needs unprivileged user namespaces allowed for bwrap
        # (Ubuntu 24.04 restricts them; runner-a carries an AppArmor profile
        # at /etc/apparmor.d/bwrap for that).
        #
        # Shards share a host, so this goes through the named host lock:
        # dpkg's own lock does not queue, and the loser exits non-zero.
        #
        # `env -C /` because a `run:` step's cwd is GITHUB_WORKSPACE, so
        # without it this is a ROOT process holding the persistent workspace
        # as its working directory (caught live on runner-a, pid 1226650,
        # Sun 6 Sep 2026). apt provably writes nothing there -- reinstalling
        # a python3 package in a workspace-shaped tree, py3compile triggers
        # and all, left 0 foreign entries -- so this is prophylaxis against a
        # future maintainer script, not the repair path. NOT an invariant
        # either: Playwright's own `install --with-deps` sudo-apts with the
        # frontend directory as cwd and takes no such flag, which is why the
        # pre-checkout hygiene step stays the backstop (#1338).
        run: |
          scripts/ci_apt_present.sh libsqlcipher-dev file bubblewrap just ffmpeg || scripts/ci_host_lock.sh packages sudo env -C / sh -c 'apt-get update && apt-get install -y libsqlcipher-dev file bubblewrap just ffmpeg'

      - name: Runner preflight - host binaries the suite shells out to
        # Name the missing binary at second five rather than minute four:
        # `file`, `bwrap` (#1056), the Tauri toolchain (93e11a47f) and `just`
        # (#1363) each reddened a trunk shard as a bare FileNotFoundError when
        # its test landed on the host that lacked it, green on the PR because
        # that shard had landed on the other host. The list is pinned by
        # tests/scripts/test_ci_shard_binary_preflight.py; provisioning lives in
        # docs/ci-actions-cost-review-2026-08-16.md item 7.
        run: scripts/ci_runner_preflight.sh file bwrap just pkg-config cargo uv ffmpeg

      - name: The interpreter must run without a borrowed LD_LIBRARY_PATH
        # TRIPWIRE, not a fix. actions/setup-python installs an interpreter
        # whose RUNPATH is baked to the HOSTED tool-cache path
        # (/opt/hostedtoolcache/Python/<v>/x64/lib). On a self-hosted runner
        # whose tool cache lives somewhere else, that RUNPATH misses and
        # libpython is reachable ONLY through the LD_LIBRARY_PATH the action
        # exports into the job environment.
        #
        # Every test that launches a subprocess under a deliberately
        # controlled environment then loses it and gets exit 127 instead of
        # the behavior it is asserting on. That single cause produced 46 of
        # the 65 failures on the first self-hosted run of this lane
        # (tests/scripts/autoreposync_uv.py, test_paths_data_dir_override.py,
        # the provenance CLI suites), and none of them named it: they
        # reported missing interpreters, refused stores and uv resolve
        # failures. Fixing the interpreter is right; fixing 40 env dicts to
        # smuggle a loader path through is not.
        #
        # The fix belongs on the RUNNER - AGENT_TOOLSDIRECTORY=/opt/hostedtoolcache
        # in <runner-root>/.env, which is what actions/setup-python documents
        # for self-hosted runners, so the tool cache lands where the RUNPATH
        # already points. Deliberately NOT set from this workflow: on a runner
        # that cannot write /opt, setting it would break setup-python outright
        # rather than degrade. See "Self-hosted runner provisioning" in
        # docs/ci-actions-cost-review-2026-08-16.md.
        #
        # `env -i` reproduces the scrubbed environment those tests build, so a
        # runner that loses the setting fails HERE, in one step, naming the
        # cause - rather than ten minutes later as dozens of unrelated-looking
        # test failures.
        run: |
          env -i PATH=/usr/bin:/bin .venv/bin/python -c 'print("interpreter is self-contained")'

      - name: Keep the numba JIT cache across jobs on this runner
        # librosa's numba artifacts live beside its source by default, and this
        # job recreated `.venv` every run, so every job paid a 25-45 s cold
        # compile in the warm-up step (measured Tue 8 Sep 2026: 41-46 s on
        # every shard, 0.3 s once the cache survives venv recreation). One
        # directory per RUNNER: a runner runs one job at a time, so the
        # warm-up below is the only cold writer it ever sees, and the stamp
        # next to it is what lets the warm-up prove the cache is still what
        # that serial writer left. Hosted runners get a fresh HOME per job
        # and simply compile once, as before.
        # Keyed by the toolchain too (python, numba, llvmlite, librosa, numpy
        # versions, printed by the module that owns the cache): an upgrade
        # lands in an empty directory and compiles once under the lock,
        # instead of numba rejecting stale artifacts at first use in whatever
        # processes got there first, concurrently and cold.
        run: |
          identity="$(.venv/bin/python -m apps.analysis.jit_warmup --identity)"
          dir="$HOME/.cache/mdt-numba/${RUNNER_NAME:?RUNNER_NAME is unset}/${identity:?identity is empty}"
          mkdir -p "$dir/cache" "$dir/lock"
          chmod 700 "$HOME/.cache/mdt-numba" "$dir" "$dir/lock"
          { echo "NUMBA_CACHE_DIR=$dir/cache"; echo "MDT_NUMBA_WARMUP_DIR=$dir/lock"; } >> "$GITHUB_ENV"

      # Install the ledger the scope job resolved, so every shard of this run
      # splits on the same file (scripts/ci_durations_ledger.py). No fallback
      # here: a job that could not install it while its siblings did would
      # split differently, so it fails by name instead (a transient artifact
      # error, or a re-run after the 7-day retention, reads red; re-run it).
      - name: Download the main-side durations ledger
        if: needs.scope.outputs.ledger_run_id != ''
        timeout-minutes: 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-durations-ledger
          run-id: ${{ needs.scope.outputs.ledger_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/durations-ledger

      - name: Install the main-side durations ledger over the committed seed
        if: needs.scope.outputs.ledger_run_id != ''
        timeout-minutes: 1
        run: ./.venv/bin/python -m scripts.ci_durations_ledger install --src "$RUNNER_TEMP/durations-ledger/.test_durations"

      - name: Warm the numba JIT cache before the suite (#1316)
        # librosa's `@numba.guvectorize(..., cache=True)` hot paths compile on
        # first call into `.nbi`/`.nbc` artifacts beside the librosa source.
        # Two processes meeting a COLD cache interleave those writes and every
        # later process that loads the result dies at a NULL instruction
        # pointer, with no traceback and no Python exception (issue #1316).
        # `apps.analysis.run` warms in the parent before it creates a pool, so
        # this step is belt and braces - but it moves the one-off compile out
        # of whichever test happens to touch analysis first, where it looks
        # like an unrelated timeout, and it costs nothing on a cache that is
        # already what a previous warm-up left.
        #
        # `--purge-if-stale`, not `--purge`: the cache now persists per runner
        # (step above), so a purge on every job would buy a cold ~25-45 s
        # compile each time to insure against a state a single serial writer
        # cannot produce. The stamp is the witness: a cache the last serial
        # warm-up left untouched is kept and the step takes ~0.3 s; a cache
        # without a matching stamp (killed writer, racing writer, librosa
        # upgrade) is purged before anything loads it, which is the only
        # repair for a poisoned cache, since loading it is what segfaults.
        # Pinned by tests/scripts/test_ci_jit_warmup.py.
        run: .venv/bin/python -m apps.analysis.jit_warmup --backend librosa --purge-if-stale
      - name: Run the fast tier leg (every test under 0.5 s, first)
        id: fast
        # TMPDIR: tempfile/mkdtemp scratch (cloudsync sims, Chromium profiles,
        # opendj temp dirs) lands in the per-job RUNNER_TEMP beside --basetemp,
        # not /tmp. The runner empties RUNNER_TEMP at every job start, so a
        # killed shard cannot leak, and on hosts that mount it as tmpfs
        # (runner-a, runner-b-3..14) the churn never reaches the SSD.
        # ADR-NEW-ci-test-scratch-on-tmpfs; pinned by
        # tests/quality/test_pytest_scratch_in_runner_temp.py.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -uo pipefail
          # --timeout=120 is pytest-timeout's PER-TEST wall clock, under the
          # leg budget below by 4x. Without it a hung test can only die with
          # the whole leg at MDT_FAST_TIMEOUT_S, anonymously: `-q` prints
          # dots, so the kill names no test. Mon 21 Sep 2026: six legs in one
          # evening stalled 2-6 min at the same 32% mark (jobs 106501413853,
          # 106532364812, 106517178623, 106529071057, 106507533486 and
          # 106547163340, four different legs, five different runners) and
          # every one read "exit 124 after 480s" and nothing else. Green
          # legs show no gap over 45 s at that mark, so it is intermittent,
          # and the durations ledger cannot see it either (a killed test is
          # never recorded). pytest-timeout fails the one test, prints its
          # stack, and the leg goes on. The ceiling is generous on purpose:
          # this tier is tests recorded UNDER 0.5 s, so 120 s is a hang, not
          # a slow test. tests/scripts/test_ci_fast_tier_job.py pins it.
          # 1080, not 720: re-measured Tue 22 Sep 2026 over every leg since
          # 12:00Z Mon 21 Sep (863 legs). Job wall on runner-a runners: 231
          # green legs, median 372 s, p90 468 s, max 519 s. On runner-b
          # runners, which share ONE host and ran 11 jobs at once at the time:
          # 18 green legs, median 499 s, p90 662 s, max 708 s, and a leg the
          # 720 s budget killed was at 93% with no failing test (#3740 leg 3,
          # run 35718455313, runner-b-14). 720 was itself 1.5x the runner-a
          # maximum measured Mon 21 Sep (117 legs, step max 470 s), before the
          # runner-b runners joined the pool. 1080 is 1.5x the runner-b
          # maximum. A hung test still fails by name at --timeout=120 below,
          # so the wall budget is only the backstop, and the four legs run in
          # parallel, so a green fast tier's wall clock does not move. Pinned
          # by tests/scripts/test_ci_fast_tier_job.py.
          # 2160 = 1080 x 4/2 (TEST-CUT round 3, Fri 2 Oct 2026): 1080 was set for a
          # QUARTER of the tier; a leg now runs HALF of it, so the same per-test
          # basis doubles. Re-measured Sat 3 Oct over 200 green quarter legs:
          # runner-b step median 528 s, p90 674 s; a half leg there is about
          # 2 x (step - 85 s collection) + 85 s, so about 1,390 s at the max.
          MDT_FAST_TIMEOUT_S=2160
          started=$(date +%s)
          set +e
          timeout --kill-after=30 "$MDT_FAST_TIMEOUT_S" \
            .venv/bin/pytest -q -p no:cacheprovider \
              --fast-tier fast --fast-tier-max-seconds 0.5 \
              --ledger-coverage-min 0.85 --ledger-coverage-warn 0.95 \
              --tier-min-selected 2000 \
              --timeout=120 \
              --basetemp="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-fast-${{ matrix.leg }}" \
              --junitxml="junit-fast-${{ matrix.leg }}.xml" \
              --splits 2 --group ${{ matrix.leg }} \
              --splitting-algorithm least_duration \
              --durations-path .test_durations \
              --ignore=tests/analysis \
              --ignore=tests/vocals \
              --ignore=tests/sync/usb \
              --ignore=tests/sets \
              --ignore=tests/quality/test_frontend_typing_gate.py \
              --ignore=tests/quality/test_frontend_typing_directives.py \
              --ignore=tests/quality/test_mypy_cache.py \
              --ignore=tests/perf/test_library_playlist_switch_bench.py \
            2>&1 | tee "fast-leg-${{ matrix.leg }}.log"
          rc=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - started ))
          budget_pct=$(( elapsed * 100 / MDT_FAST_TIMEOUT_S ))
          echo "fast tier leg ${{ matrix.leg }} of 2: exit $rc after ${elapsed}s (${budget_pct}% of ${MDT_FAST_TIMEOUT_S}s budget)"
          {
            echo "### Fast tier leg ${{ matrix.leg }} of 2"
            echo
            echo "- Exit: \`$rc\`"
            echo "- Duration: \`${elapsed}s\`"
            echo "- Budget: \`${budget_pct}%\` of \`${MDT_FAST_TIMEOUT_S}s\`"
          } >> "${GITHUB_STEP_SUMMARY:?GITHUB_STEP_SUMMARY must be set}"
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            printf '\n::error title=fast tier TIMEOUT (leg %s of 2)::exit %s after %ss (%s%% of a %ss budget). This is a TIMEOUT, not a superseded push and not a fail-fast cascade.\n' \
              "${{ matrix.leg }}" "$rc" "$elapsed" "$budget_pct" "$MDT_FAST_TIMEOUT_S"
          fi
          exit "$rc"

      # Upload BEFORE the cancel step: `gh run cancel` cancels this job too, and
      # a cancelled job keeps its finished steps' logs, annotations and uploaded
      # artifacts but not a step it never reached.
      - name: Upload the leg's log and JUnit for the watcher
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fast-tier-leg-${{ matrix.leg }}
          path: |
            fast-leg-${{ matrix.leg }}.log
            junit-fast-${{ matrix.leg }}.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Fail fast - cancel the run on a failure that is NEW against main
        if: failure() && steps.fast.outcome == 'failure'
        continue-on-error: true   # UNKNOWN must be visible, never masked as a second failure
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FAST_CANCEL: ${{ vars.CI_FAST_CANCEL }}
        run: |
          set -uo pipefail
          args=(--log "fast-leg-${{ matrix.leg }}.log" --run-id "${GITHUB_RUN_ID:?}" --leg "${{ matrix.leg }} of 2")
          if [ "${CI_FAST_CANCEL:-}" != "1" ]; then
            echo "::notice::CI_FAST_CANCEL is not 1: deciding in dry-run only, cancelling nothing"
            args+=(--dry-run)
          fi
          .venv/bin/python -m scripts.ci_fast_cancel "${args[@]}"

  contracts:
    name: reqs-check + native wheel + contract drift
    # Skipped by a `tier: fast` dispatch (main-control.yml's six-hour control
    # wants the fast tier alone); `inputs` is empty on push and pull_request,
    # so this is a no-op for every other event.
    # trunk-quarantine-list is needed only for its output. !cancelled() plus
    # an explicit scope-success check, same as the pytest shard job: a failed
    # or skipped list job must not skip this required job. No list excuses
    # nothing (the verdict step fail-closes).
    needs: [scope, trunk-quarantine-list]
    if: ${{ needs.scope.outputs.in_scope == 'true' && !cancelled() && needs.scope.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.tier == 'fast') }}
    env:
      # Same reason as the shard job: a child `uv run` must not resync `.venv`.
      UV_NO_SYNC: "1"
      # One native thread per process. Shards share a host with fifteen
      # other runners, and on trunk e9ed11ecf (Fri 4 Sep 2026) `ps` on runner-b
      # showed `apps.analysis.run --backend librosa` subprocesses spawned by
      # the suite at 400-650 percent CPU each: OpenBLAS and numba fan every
      # call across all 32 threads, sixteen runners do it at once, and the
      # same shard then took 636 s there against 314 s on a quieter host.
      # The tests measure behavior, not wall time; one thread each is the
      # standard setting for a shared CI host. Pinned by
      # tests/scripts/test_ci_thread_caps.py.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      # sccache as RUSTC_WRAPPER (issue #1750): every runner here cold-built
      # both Rust crates into its own private, non-shared `target/` (2.4G
      # measured), and the disk write volume stalled `io full avg60` enough
      # for the runner-governor's io-PSI ladder to cut the pool to its floor.
      # sccache caches compiled objects keyed by source+flags in a
      # concurrency-safe local server, unlike a shared CARGO_TARGET_DIR (which
      # would serialize the pool on cargo's lock file instead of fixing it).
      # SCCACHE_DIR is set below, from `$HOME`, once the runner's identity is
      # known.
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 10G
      # sccache cannot cache an incremental rustc invocation (it hashes the
      # whole compilation unit; incremental artifacts are keyed on local
      # state sccache never sees), so the dev/test profile's default
      # `incremental = true` (apps/desktop/src-tauri/Cargo.toml) would silently
      # produce a near-zero hit rate instead of the wrapper doing its job.
      CARGO_INCREMENTAL: "0"
    # See the runner-selection note on the `test` job above.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON_MERGE_QUEUE || vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    # Provisioning is seconds, the wheel build 25-60s; ten minutes is stuck.
    timeout-minutes: 10

    steps:
      # Pre-checkout hygiene for the persistent self-hosted workspace (#1338).
      # checkout cleans the tree as the runner user, so one root-owned file in
      # it fails the unlink with EACCES, dies at step 2, and skips every test
      # step after it -- a red carrying no test evidence. The runner user has
      # NOPASSWD sudo (e2e.yml documents it). This runs as root, so it is
      # bounded three ways, and each bound is load-bearing. A mount point
      # beneath the workspace fails the step outright: `-xdev` alone is not
      # enough, because a bind mount from elsewhere on the SAME filesystem
      # keeps the same st_dev and is traversed regardless (measured on the
      # runner host, Fri 5 Sep 2026). `-xdev` then stops a cross-filesystem
      # mount appearing after that check. The workspace path is escaped the way
      # mountinfo escapes field 5 and handed to awk through ENVIRON, NOT `-v`:
      # `-v` processes escape sequences, so it decodes \040 straight back to a
      # space and undoes the escaping it was given. `chown -h` acts on a symlink
      # itself rather than its referent, so a link pointing out of the tree cannot
      # drag the repair outside. One `find` expression drives the count and
      # the repair, so the number reported is the set acted on.
      #
      # The counts come from `find`, not from `chown -c`: GNU coreutils prints
      # that report on stdout but uutils prints it on stderr, so a piped count
      # reads 0 forever on a uutils host and the log would claim the step found
      # nothing when it had just repaired thousands of files. `remaining` is
      # the proof the repair landed, and a non-zero one fails here rather than
      # letting checkout die at the next step with a worse message.
      #
      # It also NAMES the offending entries -- owner, UTC mtime, path -- and
      # names them BEFORE the chown, because the repair destroys the very
      # evidence that identifies the writer. #1338 could say 957 to 1130 files
      # per runner but not which process wrote them, and cost a forensic
      # session for want of exactly this. The listing goes to a file rather
      # than into `head` down a pipe: under `pipefail` a SIGPIPE'd `find`
      # fails the step. TZ reaches `find` through `env` because sudo here is
      # `env_reset` with no SETENV, so `sudo TZ=UTC find` is refused outright,
      # and an mtime printed in local time under a `Z` suffix is a lie.
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (runner-b-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup uv for isolated dependency contracts
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: Provision isolated Python test environment
        # Same environment as a shard: the reqs generator, the OpenAPI dump
        # and the wheel's oracle test all import the project.
        run: |
          scripts/ci_venv.sh 3.11 --lock pylock.ci.toml

      # Seam CI round 14 SHADOW (docs/decisions/ADR-NEW-seam-ci.md): logs the pytest
      # modules a webui-only diff could break and skips nothing, so recall can be counted
      # against real failures first. continue-on-error: a defect here cannot redden a PR.
      - name: Seam pytest selection (shadow, skips nothing)
        timeout-minutes: 3
        continue-on-error: true
        run: .venv/bin/python -m scripts.ci_seam_select shadow

      - name: Contract drift - dev-server registry launch.json
        # Pinned by tests/scripts/test_dev_server_registry.py. Runs immediately
        # after the venv exists and BEFORE sccache, Rust, the native wheel, and
        # JIT guards so a stale launch.json fails in seconds, not after minutes
        # of unrelated build work. Uses the registry's deterministic default Web
        # UI profile so CI never depends on a developer's ignored .env or a live
        # port claim.
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/python -m scripts.dev_server_registry --check --profile default

      - name: System deps for pyrekordbox (SQLCipher) and Mach-O classification
        # Provision the interpreter first: the sentinels below run with
        # `!cancelled()` so they can report after a host setup failure.
        run: |
          scripts/ci_apt_present.sh libsqlcipher-dev file bubblewrap just ffmpeg || scripts/ci_host_lock.sh packages sudo env -C / sh -c 'apt-get update && apt-get install -y libsqlcipher-dev file bubblewrap just ffmpeg'

      - name: libclang for bindgen - probe, install only when none loads
        # apps/audio-engine's signalsmith-stretch runs bindgen, which dlopens ONE
        # libclang found the way clang-sys searches, and panics 'Unable to find
        # libclang' without it (PR #4361, runner-a, Wed 30 Sep 2026). Any LLVM
        # major serves, so probe first: a host with LLVM 21 (runner-b) passes
        # with no install, and only a host with nothing loadable installs the
        # distro default, libclang1, under the same packages lock. The second
        # probe fails the job here if the install still leaves nothing loadable.
        # Before the native wheel and both cargo steps; ci/runner-toolset.yml's
        # libclang1 entry runs the same probe as its verify.
        run: |
          .venv/bin/python -m scripts.ci_libclang_present || {
            scripts/ci_host_lock.sh packages sudo env -C / sh -c 'apt-get update && apt-get install -y libclang1'
            .venv/bin/python -m scripts.ci_libclang_present
          }

      - name: Runner preflight - host binaries the suite shells out to
        # Same list as the shard job; the contracts job builds the wheel and
        # runs the Rust tests, so cargo and pkg-config bite here first.
        run: scripts/ci_runner_preflight.sh file bwrap just pkg-config cargo uv ffmpeg

      - name: Verify FastAPI TestClient at exact minimum versions
        run: |
          uv run --isolated --no-project --python 3.11 \
            --with fastapi==0.115.0 \
            --with starlette==0.38.6 \
            --with httpx==0.28.0 \
            python tests/test_dependency_contract.py

      - name: Install sccache
        # SHA-pinned, matches the repo's action-pinning convention. Installs a
        # pinned sccache release onto PATH via the GitHub tool cache (outside
        # any runner's `_work` tree) -- deliberately NOT host-provisioned like
        # rustup/pkg-config (docs/ci-actions-cost-review-2026-08-16.md, "Self-
        # hosted runner provisioning"): `CI_RUNS_ON_LINUX` selects on the
        # `runner-a` label, which spans hosts this workflow cannot provision
        # by hand, and a preflight tripwire for a binary that isn't on every
        # labelled host would turn a slow build into a red trunk the moment it
        # landed (the exact shape of the pkg-config incident at 6b6ece85c,
        # item 15 in the doc above). An inline, self-installing action reaches
        # every host in the label pool with zero manual provisioning.
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          # Pinned like the action itself: unpinned defaults to "latest sccache
          # release", which would let sccache's own behavior drift under this
          # workflow with no diff to review.
          version: v0.17.0

      - name: Point sccache at the runner's persistent local disk cache
        # One SCCACHE_DIR per HOST (not per runner, unlike the numba cache
        # below): numba's cache has no concurrency control, so it needed one
        # directory per runner to keep a single serial writer. sccache's whole
        # design is a local server that serializes concurrent cache access
        # from many `cargo`/`rustc` invocations at once -- cross-runner
        # sharing on one host is the intended hit-rate mechanism, not a hazard
        # to avoid. `$HOME` is already shared by every runner instance under
        # this host's runner user (that's why the numba step above namespaces
        # by RUNNER_NAME at all), which gives free per-host isolation: runner-b
        # and runner-a each get their own cache with no extra keying.
        #
        # Start the server explicitly from `SCCACHE_DIR`, which lives outside
        # every runner's `_work` tree. Auto-spawn inherits the spawning job's
        # checkout as cwd, and `job-completed.sh` kills any process whose cwd OR
        # exe is under `<runner>/_work` after every job on that runner,
        # cancelled ones included (docs/ci-actions-cost-review-2026-08-16.md,
        # item 13). A server killed mid-request from a *different* runner still
        # building against it would fail that build outright, not just miss the
        # cache. The exe path from the tool-cache install is already outside
        # `_work`; pinning cwd here completes the contract.
        run: |
          dir="$HOME/.cache/mdt-sccache"
          mkdir -p "$dir"
          echo "SCCACHE_DIR=$dir" >> "$GITHUB_ENV"
          # sccache keys Rust compiles on absolute source paths. Each runner
          # service checks out under its own `<runner>/_work/...` root even
          # though SCCACHE_DIR is shared per host, so strip every such root on
          # this host before hashing (docs/research/toolchain-speed-audit-
          # 20260908-appendix-rust-audio-ci.md:35, sccache SCCACHE_BASEDIRS).
          bases=""
          for rd in "$HOME"/actions-runner-* /opt/actions-runner-*; do
            [ -d "$rd" ] || continue
            candidate="${rd}/_work/music-dj-tools/music-dj-tools"
            bases="${bases:+$bases:}${candidate}"
          done
          case ":${bases}:" in
            *:"${GITHUB_WORKSPACE}":*) ;;
            *) bases="${bases:+$bases:}${GITHUB_WORKSPACE}" ;;
          esac
          echo "SCCACHE_BASEDIRS=$bases" >> "$GITHUB_ENV"
          echo "[sccache] SCCACHE_DIR=$dir"
          echo "[sccache] SCCACHE_BASEDIRS=$bases"
          # GITHUB_ENV writes are not visible inside this same step; export for
          # --start-server while keeping the env-file writes for later steps.
          export SCCACHE_DIR="$dir"
          export SCCACHE_BASEDIRS="$bases"
          (
            cd "$dir"
            # Idempotent: a prior job on this host may already have started the
            # shared server. --start-server is non-zero when one is running and
            # would fail this step under set -e; probe with --show-stats first.
            if ! sccache --show-stats >/dev/null 2>&1; then
              sccache --start-server
            else
              echo "[sccache] server already running"
            fi
          )

      - name: A Rust toolchain must be present before the wheel is built
        # TRIPWIRE, not a fix, and the same shape as the LD_LIBRARY_PATH one
        # in the shard job. setuptools-rust builds `_rb_waveform_native` with
        # `optional = true` (see pyproject.toml), which is right for a source
        # install on a host with no cargo and wrong as a silent CI outcome: the
        # wheel builds fine, just without the extension, and the failure
        # surfaces one step later as "wheel lacks _rb_waveform_native
        # extension" - true, and no help at all in finding the cause.
        #
        # The hosted ubuntu image ships Rust, so this never came up until the
        # move to self-hosted. The fix belongs on the RUNNER, like the tool
        # cache: install rustup for the runner user and put ~/.cargo/bin on the
        # runner PATH. Naming it here costs one step and turns an hour of
        # tracing into a line of output.
        run: |
          command -v cargo >/dev/null || {
            echo "::error::no cargo on PATH - setuptools-rust would skip the optional native extension and the wheel gate below would fail as 'wheel lacks _rb_waveform_native extension'. Provision a Rust toolchain on this runner (docs/ci-actions-cost-review-2026-08-16.md)."
            exit 1
          }
          cargo --version

      - name: Install cargo-nextest (pinned prebuilt)
        # Job-provisioned (ci/runner-toolset.yml cargo-nextest). A source
        # `cargo install` compiles nextest and can spend this job's whole
        # 10 minute budget, so this fetches the release tarball. ~/.cargo/bin
        # is already on the runner PATH (the rustup provision).
        env:
          CARGO_NEXTEST_VERSION: "0.9.146"
        run: |
          set -euo pipefail
          if cargo nextest --version 2>/dev/null | grep -q "cargo-nextest ${CARGO_NEXTEST_VERSION}"; then
            cargo nextest --version
            exit 0
          fi
          tmp="$(mktemp -d)"
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/cargo-nextest-${CARGO_NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$tmp/nextest.tar.gz" "$url"
          tar -xzf "$tmp/nextest.tar.gz" -C "$tmp"
          mkdir -p "$HOME/.cargo/bin"
          install -m 755 "$tmp/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"
          cargo nextest --version | grep -q "cargo-nextest ${CARGO_NEXTEST_VERSION}"

      - name: Run desktop shell Rust tests
        id: desktop-rust
        continue-on-error: true
        # continue-on-error so the verdict step below, not this exit, decides
        # the job. nextest exit 100 (tests failed) is recorded as rc=1, the
        # only code scripts/ci_trunk_quarantine_verdict.py can excuse. 101
        # (build or setup) and every other code pass through unchanged.
        # TRIPWIRE FIRST, same shape as the cargo one above. The tauri shell
        # pulls `libdbus-sys`, whose build.rs shells out to pkg-config and, when
        # it is absent, PANICS with a 30-line Rust backtrace whose actionable
        # content is one buried sentence. Trunk 6b6ece85c went red exactly that
        # way: the step failed on every runner-a runner and passed on every
        # runner-b one, because runner-a had no pkg-config and no
        # libdbus-1-dev at all (fixed Sat 5 Sep 2026, apt). It read as a flake
        # by runner rather than as a missing package, which is the whole cost:
        # a host-wide provisioning gap that only some jobs happened to hit.
        #
        # This belongs on the RUNNER, like the tool cache and the Rust
        # toolchain. Naming it here costs one step and turns a panic into a
        # line that says which host is short and what to install on it. See
        # "Self-hosted runner provisioning" in
        # docs/ci-actions-cost-review-2026-08-16.md.
        #
        # SELF-HEAL: job 103936733320 (PR #2624, runner runner-b-12, Mon 14
        # Sep 2026) failed here with exit 101 from a CORRUPT persistent
        # target/ dir (E0786 invalid metadata files, E0463 missing a crate
        # Cargo.lock says is present), not a real compile error --
        # scripts/ci_clean_untracked.sh keeps target/ across jobs on this
        # runner on purpose, and reuse occasionally reads a half-written
        # .rlib/.so from a job killed mid-write (afmac
        # an internal runner note). On that
        # signature only, scripts/ci_cargo_selfheal.sh warns, runs
        # `cargo clean --profile dev` (the debug/dev target the failure
        # named, never the whole tree) and retries once; any other failure,
        # or a second failure of the same kind, stays red.
        run: |
          command -v pkg-config >/dev/null || {
            echo "::error::runner ${RUNNER_NAME:-unknown} has no pkg-config on PATH - libdbus-sys build.rs would panic building the tauri shell. Provision this host: sudo apt-get install -y pkg-config libdbus-1-dev (docs/ci-actions-cost-review-2026-08-16.md)."
            exit 1
          }
          pkg-config --exists dbus-1 || {
            echo "::error::runner ${RUNNER_NAME:-unknown} has pkg-config but no dbus-1 development files - libdbus-sys build.rs would panic building the tauri shell. Provision this host: sudo apt-get install -y pkg-config libdbus-1-dev (docs/ci-actions-cost-review-2026-08-16.md)."
            exit 1
          }
          mkdir -p apps/desktop/src-tauri/payload
          set +e
          scripts/ci_cargo_selfheal.sh apps/desktop/src-tauri/Cargo.toml dev \
            cargo nextest run --manifest-path apps/desktop/src-tauri/Cargo.toml --locked \
            --profile ci --config-file .config/nextest.toml
          rc=$?
          set -e
          if [ "$rc" -eq 100 ]; then
            echo "rc=1" >> "$GITHUB_OUTPUT"
          else
            echo "rc=$rc" >> "$GITHUB_OUTPUT"
          fi
          junit_src="apps/desktop/src-tauri/junit.xml"
          if [ -f "$junit_src" ]; then
            cp "$junit_src" "${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-rust-desktop.xml"
          fi
          exit "$rc"

      - name: Run audio engine Rust tests
        id: audio-rust
        continue-on-error: true
        # odj-audio (apps/audio-engine, GSD phase 20): its own crate and its
        # own target dir, so it never shares the shell's cold build. Default
        # features only: device output (cpal, ALSA on Linux) is behind the
        # `device` feature, so this needs no audio headers or sound card. The
        # tests include a zero-allocation render check and determinism
        # hashes; same self-heal wrapper as the shell step above.
        # signalsmith-stretch runs bindgen, and the runners' libclang ships
        # without its builtin headers ('stddef.h' file not found), so point it
        # at gcc's, which the same crate's C++ build already uses.
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS="-I$(gcc -print-file-name=include)"
          set +e
          scripts/ci_cargo_selfheal.sh apps/audio-engine/Cargo.toml dev \
            cargo nextest run --manifest-path apps/audio-engine/Cargo.toml --locked \
            --profile ci --config-file .config/nextest.toml
          rc=$?
          set -e
          if [ "$rc" -eq 100 ]; then
            echo "rc=1" >> "$GITHUB_OUTPUT"
          else
            echo "rc=$rc" >> "$GITHUB_OUTPUT"
          fi
          junit_src="apps/audio-engine/junit.xml"
          if [ -f "$junit_src" ]; then
            cp "$junit_src" "${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-rust-audio.xml"
          fi
          exit "$rc"

      - name: Drive the real odj-audio from its Python tests
        # Not every pytest shard host has libclang, which bindgen needs to build
        # this crate, so there these tests report UNAVAILABLE
        # (tests/rust_build_env.py). This host just built the crate, so here
        # the require flag turns that same gap into a failure, not a skip.
        env:
          MDT_REQUIRE_AUDIO_ENGINE_BUILD: "1"
        run: |
          .venv/bin/pytest -q -rs \
            --basetemp="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-audio-engine" \
            tests/engine_core/test_audio_engine_real.py tests/scripts/test_engine_payload_audio.py \
            tests/dedup/test_engine_fingerprint_real.py
          # The canonical decode fingerprint is odj-audio's (NAE-21), and the
          # shard hosts may have no build, so the tests that take it skip
          # there. Here they run, and a missing engine fails them.
          .venv/bin/pytest -q -rs -m requires_canonical_decode \
            --basetemp="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-canonical-decode" \
            tests/analysis_contract/test_pcm_fingerprint.py \
            tests/analysis_waveform/test_backfill_write.py \
            tests/webui/test_anlz_own_waveform.py \
            tests/analysis/test_own_key_jit_warmup.py \
            tests/analysis/test_key_projection_no_track_fields_write.py \
            tests/analysis_key/test_backfill_write.py

      - name: Build and prove the native production wheel
        # This is a required PR gate, not a release-only smoke. The focused
        # test imports the wheel with native mode fail-closed and compares it
        # with the Python oracle on the immutable real ANLZ fixture. It lives
        # here rather than in a shard so its 25-60s is paid in parallel with
        # the tests instead of in front of them.
        run: |
          make waveform-native-release-check \
            PY="$PWD/.venv/bin/python" PYTEST="$PWD/.venv/bin/pytest" \
            PYTEST_BASETEMP="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-native-wheel"

      - name: Report sccache hit rate
        # `if: always()` so a cache-side regression is visible even when the
        # Rust build it was covering failed. A near-zero hit rate on an
        # otherwise-unchanged commit means the wrapper is not wired up (see
        # the "non-cacheable reasons" breakdown sccache prints), not that the
        # cache is cold -- this repo's cargo invocations are pinned crates on
        # a persistent per-host `SCCACHE_DIR`, so a second run of the same
        # commit is expected to hit almost everything it built the first time.
        #
        # `|| true`: this is a report, not a gate -- the sccache-action's own
        # `post:` step already prints the same stats unconditionally, so this
        # step existing only for a grep-able plain-text copy in the log must
        # not be able to redden the job on its own if the CLI misbehaves.
        if: always()
        run: sccache --show-stats || true

      - name: Prove the ABI3 wheel imports on Python 3.14
        # --refresh-package (not --no-cache): this glob resolves to a wheel
        # this same job just built, whose filename uv's cache can otherwise
        # match against a stale prior build (added alongside the NumPy
        # version-assertion bump at 37da19267 for exactly that reason).
        # --no-cache would also discard uv's unrelated interpreter/dependency
        # cache (numpy, the 3.14 interpreter itself) on every run, which
        # --refresh-package does not.
        run: |
          uv run --refresh-package music_dj_tools --isolated --no-project --python 3.14 --with numpy \
            --with dist/music_dj_tools-*.whl python -c \
            'import _rb_waveform_native as n, numpy as np; assert int(np.__version__.partition(".")[0]) >= 2; assert n.bands_payload({"low": np.array([0.0, 1.0])}, 100)["length"] == 2'

      - name: JIT cache guards (#1316) - the sharded lane ignores tests/analysis
        # `--ignore=tests/analysis` below keeps the slow product-edge audio
        # suites out of the per-PR lane, and it would take the #1316 guards
        # with it: the compile-lock exclusion test, its negative control, the
        # parent-before-pool ordering test and the fingerprint tests would then
        # only ever run in on-demand Full CI, which is the same as not gating
        # them. They are ~10 s with no audio decode, so they run here.
        #
        # `-m "not slow"` leaves out the two cold-cache acceptance tests that
        # really compile librosa from scratch; those stay in Full CI, which
        # runs tests/analysis in full.
        #
        # Here rather than in the `test` job because that job is a SHARDED
        # matrix and tests/scripts/test_ci_shard_matrix.py requires it to hold
        # exactly ONE pytest step, so `--splits`, `--group` and
        # `.test_durations` can never be ambiguous. That is a real invariant
        # and this step is not worth weakening it for. `contracts` is the
        # non-sharded per-PR job, it already installs requirements.txt (so the
        # analysis extra is present), and it exists for focused gates exactly
        # like this one.
        # Pinned by tests/scripts/test_ci_jit_warmup.py.
        run: |
          set -euo pipefail
          .venv/bin/pytest tests/analysis/test_jit_warmup.py tests/analysis/test_jit_warmup_hygiene.py \
            --basetemp="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-jit-warmup-guards" \
            -m "not slow" -q --no-header > "${RUNNER_TEMP:-/tmp}/jit-guards.log" 2>&1 || {
              cat "${RUNNER_TEMP:-/tmp}/jit-guards.log"; exit 1;
            }
          cat "${RUNNER_TEMP:-/tmp}/jit-guards.log"
          # A POSITIVE floor, because this step's plausible failure is a green
          # zero. tests/analysis/conftest.py does `importorskip("soundfile")`
          # at module level, so a lane whose venv lost the analysis extra skips
          # the ENTIRE directory and pytest still exits 0 with "no tests ran".
          # `--collect-floor` cannot be used here: it rejects `-m` by design.
          # The number is a floor and only ever grows; it exists to catch 0,
          # not to pin an exact count.
          # `|| true` on the pipeline, not on the check: an absent match must
          # leave `passed` empty so the floor below reports it, rather than
          # aborting here under `set -e` with grep's exit code standing in for
          # the count.
          passed="$(grep -oE '[0-9]+ passed' "${RUNNER_TEMP:-/tmp}/jit-guards.log" | tail -1 | cut -d' ' -f1 || true)"
          if [ "${passed:-0}" -lt 8 ]; then
            echo "[ERROR] the #1316 guards reported '${passed:-0}' passed, under the floor of 8."
            echo "[ERROR] they did not run. Most likely the analysis extra is missing, which"
            echo "[ERROR] makes tests/analysis/conftest.py skip the whole directory silently."
            exit 1
          fi
          echo "[OK] #1316 guards: ${passed} passed"

      - name: Strict reqs-check (non-fatal until timestamp flake fix lands)
        # MUST RUN BEFORE the regenerate step below. `--check` compares
        # reqs.json ON DISK against a freshly built payload, so once the
        # regenerate step has rewritten that file the check is comparing it
        # with itself and CANNOT FAIL. It sat after the regenerate step until
        # Tue 1 Sep 2026, which made it vacuous for two independent reasons:
        # the `|| echo` suffix, and its input being overwritten first. Dropping
        # the suffix (as the note below invites) would have fixed only one of
        # them and produced a hard gate that still could not go red.
        #
        # Once the deterministic generated_at fix is reliably merged, drop the
        # `|| echo` suffix so this becomes a hard gate on REQUIREMENTS.md /
        # reqs.json drift. Keep it ahead of the regenerate step when you do.
        run: |
          .venv/bin/python -m scripts.build_reqs_json --check || echo "::warning::reqs-check warning (non-fatal)"

      - name: Regenerating reqs.json must produce no diff
        # ORDERING IS THE POINT OF THIS STEP. It used to sit BEFORE the pytest
        # lane, where `python -m scripts.build_reqs_json` rewrote reqs.json in
        # the working tree and the pytest lane then ran against the REGENERATED
        # file. That laundered
        # tests/scripts/test_build_reqs_json.py::test_real_reqs_json_is_in_sync_with_planning_md
        # into a permanent pass: that test compares the same two things this
        # step does, so once the file had been rewritten it was comparing it
        # with itself. The test was red on a clean checkout of main from
        # Mon 31 Aug 2026 and CI never showed it once.
        #
        # PR #667 moved the strict `--check` ahead of the old regenerate step,
        # which fixed the CLI half. The pytest half is fixed structurally now:
        # the shards run in their own jobs and never see this rewrite.
        #
        # `git diff --exit-code` is the assertion: regeneration must be a
        # no-op. That also still proves REQUIREMENTS.md is parseable, which is
        # all the old warn-only step actually established.
        #
        # `if: !cancelled()` follows the contract drift step below, for the
        # reason recorded there: a gate at the top of a job once skipped the
        # whole suite and hid a real test failure behind it. Both gates always
        # report; the job is red if either fails.
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/python -m scripts.build_reqs_json
          git diff --exit-code reqs.json

      - name: Contract drift - openapi.json (armed at T0)
        # T0 commits .ci/contract-drift-armed alongside the baseline
        # openapi.json; until then this step reports unarmed and passes.
        # MDT_LIBRARY_MODE: apps.shared.library_mode requires it on non-darwin
        # platforms; 'local' mirrors the darwin default the baseline was
        # dumped under (schema-only operation, no library data touched).
        #
        # ORDERING (Thu 28 Aug 2026): this step runs with `if: !cancelled()`,
        # because on Thu 28 Aug a drift failure at the top of the job skipped
        # the entire test suite and hid a real schema-parity test failure
        # behind it (fail-open). Both gates now always report; the job is red
        # if either fails. Fail-closed guard on the sentinel is unchanged.
        #
        # Dumps the ENGINE app as of T5, not the legacy server. The committed
        # baseline now describes what this lane ships: legacy + jobs endpoints
        # + engine health, minus the fan-out ledger router the chassis drops.
        # This must stay equivalent to the `engine_openapi_dump` recipe in the
        # justfile (same statements, same order); change both or neither. It is
        # spelled out here rather than shelling out to `just` because this job
        # installs python and uv only.
        if: ${{ !cancelled() }}
        env:
          MDT_LIBRARY_MODE: local
        run: |
          if [ ! -f .ci/contract-drift-armed ] && { [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_BASE_REF" = "main" ]; }; then
            echo "::error::contract drift sentinel .ci/contract-drift-armed is missing on main - the gate must stay armed (fail-open otherwise; sol review finding 1; re-pointed from af--rebuild-agentB-from-Fable when that lane landed, Fri 28 Aug 2026)"
            exit 1
          fi
          if [ -f .ci/contract-drift-armed ]; then
            .venv/bin/python -c "import json, sys, tempfile; from pathlib import Path; from apps.engine_core.config import apply_env_contract, build_config, prepare_layout; cfg = build_config(tempfile.mkdtemp(prefix='opendj-openapi-'), '127.0.0.1', 8683); apply_env_contract(cfg); prepare_layout(cfg); from apps.engine_core.app import create_app; out = Path(sys.argv[1]); out.parent.mkdir(parents=True, exist_ok=True); out.write_text(json.dumps(create_app(cfg).openapi(), indent=2, sort_keys=True) + '\n', encoding='utf-8')" "$RUNNER_TEMP/openapi.ci.json"
            diff -u apps/webui/openapi.json "$RUNNER_TEMP/openapi.ci.json"
          else
            echo "contract drift not armed yet (T0 arms it)"
          fi

      - name: Stage Rust JUnit reports for the isolated CI Insights job
        # Same contract as the pytest shard staging step: this self-hosted
        # job never sees TRUNK_API_TOKEN. One directory per suite so each
        # upload below is its own Trunk upload.
        id: stage-rust-insights
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          stage_one() {
            suite="$1"
            src="${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-rust-${suite}.xml"
            dir="ci-insights-rust-${suite}-${{ github.run_id }}-${{ github.run_attempt }}"
            mkdir -p "$dir" || return 1
            if [ -f "$src" ]; then
              cp "$src" "$dir/junit-rust-${suite}.xml" || return 1
            fi
          }
          stage_one desktop
          stage_one audio

      - name: Upload the desktop Rust JUnit report for CI Insights
        if: always() && steps.stage-rust-insights.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-insights-rust-desktop-attempt-${{ github.run_attempt }}
          path: ci-insights-rust-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload the audio Rust JUnit report for CI Insights
        if: always() && steps.stage-rust-insights.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-insights-rust-audio-attempt-${{ github.run_attempt }}
          path: ci-insights-rust-audio-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1

      # THE cargo verdict. Both suites must pass this step. nextest exit 100
      # was stored as rc=1; any other recorded rc (101 build failure, a
      # missing rc, a step that did not run) fails closed inside the script
      # or this case. No list excuses nothing.
      - name: Cargo verdict (nextest exit code, Trunk quarantine applied)
        if: always()
        timeout-minutes: 1
        env:
          DESKTOP_OUTCOME: ${{ steps.desktop-rust.outcome }}
          DESKTOP_RC: ${{ steps.desktop-rust.outputs.rc }}
          AUDIO_OUTCOME: ${{ steps.audio-rust.outcome }}
          AUDIO_RC: ${{ steps.audio-rust.outputs.rc }}
          TRUNK_QUARANTINE_LIST: ${{ needs.trunk-quarantine-list.outputs.list }}
        run: |
          set -uo pipefail
          fail=0
          decide() {
            label="$1"
            outcome="$2"
            rc="$3"
            junit="$4"
            case "$outcome" in
              success)
                echo "VERDICT: PASS -- ${label} exited 0"
                ;;
              failure)
                .venv/bin/python scripts/ci_trunk_quarantine_verdict.py \
                  --pytest-rc "$rc" \
                  --junit "$junit" \
                  --shard "$label" || fail=1
                ;;
              *)
                printf '::error title=cargo tests did not run (%s)::step outcome=%s\n' "$label" "${outcome:-empty}"
                fail=1
                ;;
            esac
          }
          decide rust-desktop "$DESKTOP_OUTCOME" "$DESKTOP_RC" \
            "${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-rust-desktop.xml"
          decide rust-audio "$AUDIO_OUTCOME" "$AUDIO_RC" \
            "${RUNNER_TEMP:?RUNNER_TEMP must be set}/junit-rust-audio.xml"
          exit "$fail"

  frontend-build:
    name: production frontend build
    # Skipped by a `tier: fast` dispatch (main-control.yml's six-hour control
    # wants the fast tier alone); `inputs` is empty on push and pull_request,
    # so this is a no-op for every other event.
    needs: scope
    if: ${{ needs.scope.outputs.in_scope == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.tier == 'fast') }}
    # One Vite/Rollup build per commit, shared with the `frontend` job here and
    # with e2e.yml via the stamped artifact (issue #1513).
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON_MERGE_QUEUE || vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 15

    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (runner-b-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history on every persistent runner: a shallow fetch here makes the next job --unshallow (test_ci_workspace_reuse.py).
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: apps/webui/frontend/pnpm-lock.yaml

      - name: Runner preflight - node tools and disk
        run: scripts/ci_node_preflight.sh apps/webui/frontend

      - name: Install frontend dependencies
        working-directory: apps/webui/frontend
        run: pnpm install --frozen-lockfile

      - name: Build production frontend
        working-directory: apps/webui/frontend
        run: pnpm build

      - name: Stamp production frontend artifact
        run: scripts/ci_frontend_build_stamp.sh "${{ github.sha }}"

      - name: Upload production frontend artifact
        # include-hidden-files: upload-artifact v4 skips dotfiles by default,
        # and the commit stamp is `.ci-production-frontend-sha`. Without this
        # the zip has index.html and e2e assert fails "stamp is missing"
        # (head ed73bf4f7, job 103219857971, Thu 11 Sep 2026).
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-frontend-${{ github.sha }}
          path: apps/webui/frontend/build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Cache production frontend build
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/webui/frontend/build
          key: production-frontend-${{ github.sha }}

