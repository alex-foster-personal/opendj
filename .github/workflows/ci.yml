          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (runner-b-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history on every persistent runner: a shallow fetch here makes the next job --unshallow (test_ci_workspace_reuse.py).
          fetch-depth: 0
          persist-credentials: false
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Order matters: corepack must run BEFORE setup-node so that a `pnpm`
      # shim exists on PATH by the time setup-node's `cache: pnpm` resolves
      # the store via `pnpm store path`. The runner's pre-installed Node
      # provides corepack here; setup-node then prepends its own 22.14.0
      # toolchain and the shim resolves against it.
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          # pnpm store caching, hosted runners only (see below). It was left
          # unconditional until Sat 5 Sep 2026 on the belief that self-hosted
          # "just gains less from it"; it actually overwrote the shared store.
          # pnpm on GitHub-hosted runners only. A self-hosted runner's store
          # already persists at the runner user's `pnpm store path` and is
          # SHARED by every runner service on the host; setup-node restores its
          # cache tarball with absolute paths straight into that store,
          # index.db included, under jobs that are reading it (trunk e14bd2f0a3,
          # Sat 5 Sep 2026: `[ERR_PNPM_ERR_SQLITE_ERROR] disk I/O error` on a
          # healthy disk). tests/scripts/test_ci_pnpm_cache_self_hosted.py.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: apps/webui/frontend/pnpm-lock.yaml

      - name: Runner preflight - node tools and disk
        # Fail here, naming the runner, rather than mid-install with a cryptic
        # pnpm error on a missing tool or a full disk. scripts/ci_node_preflight.sh
        # (it deliberately does not run `pnpm store status`; see the script).
        run: scripts/ci_node_preflight.sh apps/webui/frontend

      - name: Install frontend dependencies
        working-directory: apps/webui/frontend
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        # PARITY-02 (issue #1002): analysis-source-deck-refresh.test.mjs spawns a
        # real FastAPI/uvicorn fixture server (fixtures/analysis_source_anlz_server.py)
        # rather than a fabricated fetch response, per review discussion_r3921839834.
        # This job otherwise never touches Python, so give it a minimal interpreter.
        # SHA-pinned to the same v5 tag commit as the `test` job above.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup uv for the analysis-source fixture server
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: Provision minimal Python env for the fixture server
        # Only fastapi/uvicorn/pydantic + this repo's pure-Python apps.analysis
        # and apps.webui.server modules are ever imported by the fixture (verified:
        # no pyrekordbox/sqlcipher import anywhere in that chain), so this skips
        # the heavier system deps (libsqlcipher-dev etc.) the `test` job needs.
        # ci_venv.sh, not bare `uv venv`: the workspace is reused (clean: false), and a bare
        # `uv venv` over a live .venv is what test_self_hosted_jobs_never_run_bare_uv_venv bans.
        run: |
          scripts/ci_venv.sh 3.11 --lock pylock.ci.toml

      - name: Run frontend unit tests
        id: frontend_unit
        working-directory: apps/webui/frontend
        run: pnpm test:unit

      # The TAP reporter on stdout keeps a failure cascade from dying inside
      # the reporter (issue #3466), but it does not make the failure READABLE
      # here: the unit run emits about 25 MB across ~31k lines, and the job log
      # is truncated long before the end, so a `not ok` past the cutoff is as
      # invisible as the RangeError made it. The junit report is the durable
      # copy. `if: always()` because the run that needs it is the failing one.
      #
      # A MISSING report and a FAILED UPLOAD are different failures and are
      # checked separately. A missing report means the reporter regressed, which
      # is this change's own defect class, so it fails the job here, where it is
      # produced and where Actions storage cannot mask it. The upload that
      # follows is a byproduct and stays non-fatal: trunk 5534d0e78 went red on
      # a storage 403 alone, and tests/scripts/test_ci_artifact_storage.py holds
      # that line.
      - name: Verify the frontend unit report was written
        if: always()
        working-directory: apps/webui/frontend
        env:
          UNIT_OUTCOME: ${{ steps.frontend_unit.outcome }}
        run: |
          shopt -s nullglob
          reports=(junit-unit*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::the frontend unit run wrote no JUnit report; the junit reporter is broken, so a failure here would only exist in truncated TAP output"
            exit 1
          fi
          command -v python3 >/dev/null || {
            echo "::error::python3 is needed to validate the JUnit report; an unvalidated report is not evidence"
            exit 1
          }
          python3 - "${reports[@]}" <<'REPORTCHECK'
          import os
          import sys
          import xml.etree.ElementTree as ET

          # The file EXISTING is not the good thing; a readable report is. Node
          # opens the reporter destination when the run starts, so a crash or a
          # cancellation leaves a present but empty or half written file. That
          # would upload cleanly and carry no failure identity, which is exactly
          # the state this change exists to end.
          total = 0
          failures = 0
          for path in sys.argv[1:]:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  print(f"::error::{path} is not well formed XML ({exc}); the run died "
                        "partway through writing it, so no failure identity survives")
                  raise SystemExit(1)
              count = len(list(root.iter("testcase")))
              failed = sum(
                  1 for case in root.iter("testcase")
                  if case.find("failure") is not None or case.find("error") is not None
              )
              print(f"{path}: {count} testcase(s), {failed} failing")
              total += count
              failures += failed
          if total == 0:
              print("::error::the JUnit report holds no testcase; it cannot name a "
                    "failure, so the truncated TAP log would again be the only evidence")
              raise SystemExit(1)
          # A run that FAILED must be able to say what failed. A report of
          # nothing but passing cases alongside a failing run is the silent
          # failure case: the artifact looks captured, and the identity lives
          # only in the truncated TAP log, which is the whole defect here.
          if os.environ.get("UNIT_OUTCOME") == "failure" and not failures:
              print("::error::the unit run failed but its JUnit report names no failing "
                    "test; the reporter did not record the failure, so this run has no "
                    "recoverable identity")
              raise SystemExit(1)
          print(f"validated {len(sys.argv) - 1} report(s), {total} testcase(s), "
                f"{failures} failing")
          REPORTCHECK

      - name: Upload frontend unit test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-unit-junit
          path: apps/webui/frontend/junit-unit*.xml
          if-no-files-found: error
          retention-days: 3

      - name: Run Svelte checks
        working-directory: apps/webui/frontend
        run: pnpm check

      - name: Electron desktop shell unit tests
        # The Electron shell beside src-tauri (ADR NEW electron-desktop-shell).
        # These drive real processes (a fake engine, a real flock holder via
        # the python3 set up above, real sockets), so they need no Electron
        # binary: the download is skipped. The e2e of the real app needs a
        # display and runs under xvfb-run (apps/desktop/electron/README.md).
        timeout-minutes: 5
        working-directory: apps/desktop/electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Download production frontend artifact
        # Non-fatal: artifact storage quota exhaustion (Fri 11 Sep 2026, #2176)
        # makes the upload in frontend-build fail, so this download 404s. The
        # cache restore below is the fallback; the assert step stays fail-closed.
        id: download-production-frontend
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-frontend-${{ github.sha }}
          path: apps/webui/frontend/build

      - name: Restore production frontend build from cache (artifact fallback)
        if: steps.download-production-frontend.outcome != 'success'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/webui/frontend/build
          key: production-frontend-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Assert production frontend artifact matches this commit
        run: scripts/ci_frontend_build_assert.sh "${{ github.sha }}"

      - name: Bundle budgets (per-surface gzip ceilings)
        working-directory: apps/webui/frontend
        run: bash scripts/check-bundle-size.sh

      - name: Contract drift - TS client (armed at T0)
        working-directory: apps/webui/frontend
        run: |
          if [ ! -f ../../../.ci/contract-drift-armed ] && { [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_BASE_REF" = "main" ]; }; then
            echo "::error::contract drift sentinel ../../../.ci/contract-drift-armed is missing on main - the gate must stay armed (fail-open otherwise; sol review finding 1; re-pointed from af--rebuild-agentB-from-Fable when that lane landed, Fri 28 Aug 2026)"
            exit 1
          fi
          if [ -f ../../../.ci/contract-drift-armed ]; then
            pnpm run api:gen
            git diff --exit-code src/lib/api-types.ts
          else
            echo "contract drift not armed yet (T0 arms it)"
          fi

