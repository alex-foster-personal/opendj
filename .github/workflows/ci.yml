      # runner host, Fri 5 Sep 2026). `-xdev` then stops a cross-filesystem
      # mount appearing after that check. The workspace path is escaped the way
      # mountinfo escapes field 5 and handed to awk through ENVIRON, NOT `-v`:
      # `-v` processes escape sequences, so it decodes \040 straight back to a
      # space and undoes the escaping it was given. `chown -h` acts on a symlink
      # itself rather than its referent, so a link pointing out of the tree cannot
      # drag the repair outside. One `find` expression drives the count and
      # the repair, so the number reported is the set acted on.
      #
      # The counts come from `find`, not from `chown -c`: GNU coreutils prints
      # that report on stdout but uutils prints it on stderr, so a piped count
      # reads 0 forever on a uutils host and the log would claim the step found
      # nothing when it had just repaired thousands of files. `remaining` is
      # the proof the repair landed, and a non-zero one fails here rather than
      # letting checkout die at the next step with a worse message.
      #
      # It also NAMES the offending entries -- owner, UTC mtime, path -- and
      # names them BEFORE the chown, because the repair destroys the very
      # evidence that identifies the writer. #1338 could say 957 to 1130 files
      # per runner but not which process wrote them, and cost a forensic
      # session for want of exactly this. The listing goes to a file rather
      # than into `head` down a pipe: under `pipefail` a SIGPIPE'd `find`
      # fails the step. TZ reaches `find` through `env` because sudo here is
      # `env_reset` with no SETENV, so `sudo TZ=UTC find` is refused outright,
      # and an mtime printed in local time under a `Z` suffix is a lie.
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (runner-b-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # The hotspot report multiplies file size by commit count over the
          # last 90 days, so it needs real history, not a depth-1 clone.
          fetch-depth: 0
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Runner preflight - node tools and disk
        # Fail here, naming the runner, rather than mid-install with a cryptic
        # pnpm error on a missing tool or a full disk. scripts/ci_node_preflight.sh
        # (it deliberately does not run `pnpm store status`; see the script).
        run: scripts/ci_node_preflight.sh apps/webui/frontend

      - name: Install frontend dependencies
        # knip and the svelte-kit sync that precedes it resolve against the
        # real dependency tree, so this job needs node_modules even though it
        # never builds or runs the app.
        working-directory: apps/webui/frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend typing-gate unit tests
        # Moved here from the fast pytest lane (Issue #724): this suite's
        # `any`-detection shells out to
        # apps/webui/frontend/scripts/ts-any-scan.mjs, which needs
        # node_modules/typescript. This job installs that above; the fast
        # lane deliberately does not. Only pytest itself is added on top of
        # a bare interpreter (conftest.py's dependencies are stdlib-only),
        # matching the throwaway-environment principle the step below uses.
        # test_frontend_typing_directives.py is the directive-matching half
        # split off test_frontend_typing_gate.py (worker-rules' 600-line
        # ratchet); it needs the same node_modules/typescript, so it runs
        # here too, not in the fast lane.
        #
        # CI_VENV_PROBE_ALLOW_MISMATCH=1 (issue #3486): tests/conftest.py's
        # CI_VENV_PROBE now fails fast when a pytest session's interpreter is
        # not this repo's own .venv, and this is the one step that runs
        # pytest in a deliberately isolated, dependency-free uv environment
        # on purpose -- opt out of that guard for exactly this invocation.
        run: |
          CI_VENV_PROBE_ALLOW_MISMATCH=1 \
            uv run --no-project --isolated --python 3.11 --with pytest \
            -m pytest \
              --basetemp="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-frontend-typing-gate" \
              tests/quality/test_frontend_typing_gate.py \
              tests/quality/test_frontend_typing_directives.py

      - name: Keep the mypy incremental cache across jobs on this runner
        # checkout's `clean: true` deletes the workspace `.mypy_cache/` every
        # run, and `tests/test_quality_gate.py` invokes real mypy twice on
        # shard 4. One directory per RUNNER (same contract as numba): each
        # runner runs one job at a time, so the cache key file is the witness
        # that the directory still matches the pinned mypy + [tool.mypy] block.
        # Pinned by tests/scripts/test_ci_mypy_cache.py.
        run: |
          identity="$(uv run --no-project --isolated --python 3.11 \
            --with-requirements ops/quality/requirements.txt \
            python -c 'from scripts.mypy_cache import config_identity; print(config_identity())')"
          dir="$HOME/.cache/mdt-mypy/${RUNNER_NAME:?RUNNER_NAME is unset}/${identity:?identity is empty}"
          mkdir -p "$dir"
          chmod 700 "$HOME/.cache/mdt-mypy" "$dir"
          echo "MDT_MYPY_CACHE_DIR=$dir" >> "$GITHUB_ENV"

      - name: mypy cache acceptance (slow)
        # Real mypy twice per test; kept out of the fast lane (#1496) so a
        # shard does not pay ~5 minutes of cold gate work on top of its slice.
        timeout-minutes: 15
        run: |
          uv sync --extra dev
          uv run --no-sync pytest tests/quality/test_mypy_cache.py -m slow -q \
            --basetemp="${RUNNER_TEMP:?RUNNER_TEMP must be set}/pytest-basetemp-mypy-cache"

      - name: Quality ratchet
        # Every Python tool runs from ops/quality/requirements.txt in a
        # throwaway uv environment, so this job deliberately does NOT install
        # the project's own dependencies: a quality score must not depend on
        # whether an optional extra resolved.
        # TMPDIR: a cancelled or timed-out job skips the gate's `finally`, and
        # a self-hosted runner never tidies /tmp, so each kill leaked a
        # ~280 MB merge-base worktree (40 on runner-c, Tue 29 Sep 2026).
        # QUALITY_GATE_TMP is wiped as the job's first step, which caps the
        # leak at one run. Not runner.temp: runner-b-10..14 mount it as a
        # 2 GB tmpfs, too small for a worktree.
        # tests/quality/test_quality_ratchet_runner_temp.py pins it.
        # GH_TOKEN: this checkout's own `persist-credentials: false` leaves no
        # credential behind for `git worktree add` at the merge base, so on a
        # self-hosted runner's partial (promisor) clone the base's lazy blob
        # fetch had nothing to authenticate with and failed outright (job
        # 110140841841, #4426: "could not read Username for
        # 'https://github.com'"). `_origin_auth_env` in
        # scripts/quality_gate.py reads this ONLY for that one git invocation,
        # passed as GIT_CONFIG_* env (never argv, never .git/config), never
        # forwarded to the base's own committed gate
        # subprocess -- and it is already scoped read-only by this workflow's
        # top-level `permissions: contents: read`.
        env:
          TMPDIR: ${{ env.QUALITY_GATE_TMP }}
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            EXTRA_ARGS="--main-report-only"
          fi
          uv run --isolated --no-project --python 3.11 \
            --with-requirements ops/quality/requirements.txt \
            python -m scripts.quality_gate \
            --report ops/quality/report.md \
            --json ops/quality/metrics.json \
            $EXTRA_ARGS

      - name: Upload quality report
        if: always()
        # Non-fatal like the durations upload: the report is a byproduct, the
        # ratchet's verdict is the step before it, and a storage 403 must not
        # red a green run.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-report
          path: |
            ops/quality/report.md
            ops/quality/metrics.json
          if-no-files-found: warn
          retention-days: 2

  ci-gate:
    name: ci gate
    # THE check-run a merge queue or branch protection requires from this
    # workflow (Trunk Merge Queue's required status, issue #4168). Created on
    # every run because it needs `always()`; concludes SUCCESS only when the
    # scope job said out of scope and every gated job was skipped, or said in
    # scope and every gated job succeeded (scripts/ci_required_gate.py). Never
    # SKIPPED on a pull request, since how a queue reads `skipped` is
    # undocumented. Skipped on a `tier: fast` dispatch, which by design runs
    # none of the jobs it aggregates. `needs` is every merge-gating job here;
    # tests/scripts/test_ci_required_gate_wiring.py fails when a job is added
    # to this workflow without being listed here or declared non-gating there.
    needs:
      - scope
      - test
      - contracts
      - frontend-build
      - frontend
      - quality
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.tier == 'fast') }}
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON_MERGE_QUEUE || vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (runner-b-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # 0: every persistent-runner checkout fetches full history
          # (docs/decisions/ADR-NEW-uniform-checkout-depth-on-persistent-runners.md).
          fetch-depth: 0
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout. Runs before the job's first python3;
      # tests/scripts/test_ci_workflow_stale_install_coverage.py enforces it.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python3

      - name: Aggregate the gated jobs into one verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci_required_gate verdict
