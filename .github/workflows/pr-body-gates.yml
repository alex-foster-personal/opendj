name: PR body gates

# ONE WORKFLOW FOR THE PR-BODY GATES (S2 round 9, Wed 4 Nov 2026; ADR-NEW-pr-body-gates-one-workflow)
#
# ADR Check, Reqs Flip Gate and 10x Evidence had identical triggers, permissions, env and per-PR
# concurrency, and each started its own run on every PR event: 3,677 runs in the 24 h from
# Mon 2 Nov 22:35Z. Their jobs move here unchanged, so each keeps its own job, `if:`, runner and
# check name; one run per PR event replaces three. The perfbatch gate stays its own workflow: it
# is path-filtered to the pipeline (ADR-NEW-pr-side-workflows-path-filtered). The notes below
# are each file's own.
#
# ---- adr-check.yml, now job `adr` ----
# WHY THIS IS ITS OWN WORKFLOW AND NOT A STEP IN CI
#
# Same two reasons as reqs-flip-gate.yml (issue #1605 / PR #1709), applied
# to the ADR line (issue #1489):
#
# 1. ABSENT on some of the PRs it exists for. ci.yml's `pull_request`
#    `paths` filter excludes `**.md` and `docs/**`, so a docs-only ADR
#    migration would schedule no ci.yml run. The gated surfaces
#    (`apps/cloud/`, `apps/engine_core/`, `apps/sync_hub/`,
#    `apps/webui/server/routes/`, `apps/database/`, `*/migrations/*`,
#    `.github/workflows/`, webui server state, REQUIREMENTS.md,
#    frontend/contract files) DO reach ci.yml, but the body line is
#    metadata: it must re-run when the body changes, not only when those
#    paths change. The duplicate-id check (issue #2678) is repo-wide and
#    fires even on a PR that touches nothing gated, which is a second
#    reason this cannot be a `paths:`-filtered ci.yml step.
# 2. STALE relative to the metadata it reads. Title and body change with
#    no new head SHA. `edited` is in the list below; the other three are
#    restated because naming `types` REPLACES the implicit list.
#
# Splitting it out is also what makes `edited` affordable. Adding that
# type to ci.yml would re-run the whole fast lane on every body edit.
#
# ---- reqs-flip-gate.yml, now job `reqs_flip` ----
# WHY THIS IS ITS OWN WORKFLOW AND NOT A STEP IN CI
#
# The gate reads the PR's own title and body and fails when either cites a
# pending v1 requirement id the PR neither flips nor excuses with
# `reqs: no-flip <id> <reason>`. It lived in ci.yml's `contracts` job until
# Thu 10 Sep 2026, where TWO properties of that workflow made its verdict
# worth less than it looked, both found by Codex on #1709:
#
# 1. ABSENT on the PRs it exists for. ci.yml's `pull_request` `paths` filter
#    excludes `**.md`, `docs/**`, `handoffs/**`, `.planning/**` (re-including
#    only REQUIREMENTS.md), `specs/**` and `blog/**`, so a docs-only PR
#    schedules no ci.yml run at all and produced no check. A docs PR that
#    records a pending id without shipping it is the exact case this gate was
#    written to stop being silent about, and it was the one case that could
#    never reach it. There is NO paths filter here, deliberately.
#
# 2. STALE relative to the metadata it reads. Title and body change with no new
#    head SHA, and GitHub's default `pull_request` types are
#    opened/synchronize/reopened, so a green check outlived the body that
#    earned it. `edited` is in the list below; the other three are restated
#    because naming `types` REPLACES the implicit list rather than adding to it.
#
# Splitting it out is also what makes `edited` affordable. Adding that type to
# ci.yml would supersede the in-flight run for the ref and re-run the whole
# fast lane on every body edit; this job is one checkout and one stdlib script.
#
# Its trigger notes:
#   Per PR, so a burst of body edits leaves one run standing and a run here can
#   never cancel anything in ci.yml.
#   The default workflow permissions on this repository are "read", which covers
#   contents and packages and nothing else, so `gh pr view` came back with
#   "GraphQL: Resource not accessible by integration" and the gate could only
#   report UNKNOWN. Declaring a block REPLACES the default, so `contents: read`
#   has to be restated for actions/checkout.
#   Keep .pyc out of the persistent self-hosted workspace: root-owned bytecode
#   is what made actions/checkout fail with EACCES and skip every later step
#   (#1338). Pinned by (private path).
#
# ---- tenx-evidence.yml, now job `tenx` ----
# 10xHunter PRs (title prefix `10xHunter--`) claim a >9x improvement found by
# the 10x Constraint Hunt. This gate makes the claim reviewable: the body must
# carry a `## 10x Evidence` section (Before/After/Ratio/Scorer) and a
# `## 10x Workings` section (Card link + arithmetic). Other PRs pass untouched.
#
# Own workflow for the same reason as adr-check.yml: it reads PR metadata, so
# it must re-run on `edited`, which would be too costly to add to ci.yml.
# Self-hosted on bifrost1 since Thu 15 Oct 2026 (ADR-NEW-hosted-runner-exit):
# the hosted Actions budget is exhausted, so a hosted pin cannot start. It
# therefore carries the persistent-runner hygiene every self-hosted job runs.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-body-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  adr:
    # Every PR runs the `--pr` step: on Trunk's own merge-queue drafts it judges each batch
    # member on its own files and ADR declaration (scripts.adr_check evaluate_batch). Those
    # drafts also run the merged-tree step, because their tree is exactly what lands on main
    # (PR #4227, Codex r4135350279). A draft counts as Trunk's only when the branch is
    # trunk-merge/*, the author is the Trunk App (REST login trunk-io[bot], e.g. draft #4355)
    # and the head lives in this repository; a branch name alone is caller-controlled
    # (Codex r4120216186).
    name: adr check
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          # fleet-af #742: on the fleet's CI hosts sudo allows only this helper for workspace ownership.
          # A runner without it (GitHub-hosted) has unrestricted sudo, so the same verbs run through find.
          if [ -x /usr/local/sbin/ci-workspace-own ]; then
            own() { sudo -n /usr/local/sbin/ci-workspace-own "$1" "$ws"; }
          else
            foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
            entries() { tr -cd '\0' | wc -c; }
            own() {
              case "$1" in
                count) sudo find "$ws" -xdev -print0 | entries ;;
                foreign) foreign -print0 | entries ;;
                list) foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' ;;
                reclaim) foreign -exec chown -h "$uid:$gid" {} + ;;
                *) echo "::error::own: unknown verb $1"; return 1 ;;
              esac
            }
          fi
          scanned=$(own count)
          reclaimed=$(own foreign)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            own list >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || own reclaim >/dev/null
          remaining=$(own foreign)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -xdev -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # Full history so origin/main is current enough for the ancestry guard
      # (issue #3513). edited below re-runs body declarations; ancestry catches
      # stale synthetic merge refs that predate trunk ADR fixes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      # Step names are quoted: an unquoted ` #` starts a YAML comment and truncates them.
      - name: "ADR check (issue #1489)"
        # No venv: scripts.adr_check is stdlib only. It reads THIS PR's
        # (private path)/ for whether an id exists, and the PR body plus
        # the PR file list via gh. Exit 1 = gated path, no valid ADR line.
        # Exit 2 = the gate could not measure, which is never a pass.
        # --base is the PR's own base branch, not a hardcoded origin/main, so a
        # PR into an integration branch is checked for freshness against that
        # branch rather than failing "merge ref is stale" whenever main moves.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m scripts.adr_check --pr "$PR_NUMBER" --base "origin/$BASE_REF"

      - name: "New requirement ids carry the PR number (REQHYG-7077)"
        # Hand-picked "next free" requirement ids collided (31 renumbers in 30
        # days). This lives here, not in ci.yml, because ci.yml's contracts job
        # never runs on a pull request (TEST-BUDGET round 4) and this check only
        # means anything on one. Stdlib only, no venv. The checkout is the PR
        # merge commit with full history, so HEAD^1 is the base it merges into.
        # Only a real Trunk batch (bot author, same repo) may skip; its members
        # were checked on their own PRs. Exit 2 = could not measure, never a pass.
        #
        # Reused self-hosted workspaces (clean: false) can be partial clones left by
        # a sparse checkout, so HEAD^1's blobs are fetched lazily from the promisor
        # remote. persist-credentials: false leaves that fetch no credentials, and it
        # died with "could not read Username" (agbox2-3 and agbox2-9, #6235, Sat 31
        # Oct 2026). Hand git a read-only token for this step only, through
        # GIT_CONFIG_* env, so nothing is written to .git/config.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQ_PR_NUMBER: ${{ github.event.pull_request.number }}
          REQ_HEAD_REF: ${{ (github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && github.head_ref || '' }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          python -m scripts.req_id_pr_number --base HEAD^1 --head HEAD --pr "$REQ_PR_NUMBER" --head-ref "$REQ_HEAD_REF"

      - name: "ADR merged-tree check on Trunk queue drafts (PR #4227)"
        if: ${{ startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        # The batch tree about to land on main: duplicate numeric ids, duplicate
        # placeholders and stale renumber paths. Git only, no PR body and no gh.
        # Exit 2 = the gate could not measure, which is never a pass.
        run: |
          python -m scripts.adr_check --merge-base origin/main --merge-head HEAD

  reqs_flip:
    # Trunk merge-queue drafts re-test PRs that already passed this PR-body gate; the draft has
    # no body of its own. The skip is for Trunk's own drafts only: a trunk-merge/* branch name
    # alone is caller-controlled, so the author must be the Trunk App (REST login trunk-io[bot],
    # e.g. draft #4355) and the head must live in this repository (PR #4227, Codex r4120216186).
    if: ${{ !(startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: reqs flip gate
    # See the runner-selection note on ci.yml's `test` job.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    # A checkout and one stdlib script that makes a single `gh pr view` call.
    # Anything past five minutes is stuck, not slow.
    timeout-minutes: 5
    steps:
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          # fleet-af #742: on the fleet's CI hosts sudo allows only this helper for workspace ownership.
          # A runner without it (GitHub-hosted) has unrestricted sudo, so the same verbs run through find.
          if [ -x /usr/local/sbin/ci-workspace-own ]; then
            own() { sudo -n /usr/local/sbin/ci-workspace-own "$1" "$ws"; }
          else
            foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
            entries() { tr -cd '\0' | wc -c; }
