            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      # SHA-pinned to the v4 tag commit (resolved 2026-04-17).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 2
        with:
          # Full history on every persistent runner: a shallow fetch here makes the next job --unshallow (test_ci_workspace_reuse.py).
          fetch-depth: 0
          persist-credentials: false
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Stale-install guard (PR #4251): fail if this job's interpreter can import
      # music-dj-tools from outside the checkout, e.g. a wheel left in the shared
      # setup-python toolcache. Every self-hosted job that checks out the repo runs it,
      # after each setup step; tests/scripts/test_ci_workflow_stale_install_coverage.py
      # enforces that.
      - name: Stale-install guard - the interpreter imports only this checkout
        timeout-minutes: 1
        run: scripts/ci_runner_preflight.sh python

      - name: Reqs flip gate (issue #1605 enforcement)
        # No venv and no dependency install: scripts.reqs_flip_gate and the
        # scripts.reqs_cited_unflipped matcher it reuses are stdlib only, and
        # the reqs.json it reads is THIS PR's own checked-out copy, which is
        # what makes "the id is flipped in this PR" a readable question.
        # Exit 1 = a cited pending id is neither flipped nor excused.
        # Exit 2 = the gate could not measure, which is never a pass.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.reqs_flip_gate --pr "${{ github.event.pull_request.number }}"

  ci_tests:
    # Trunk merge-queue drafts re-test PRs that already passed this PR-body gate; the draft has
    # no body of its own. The skip is for Trunk's own drafts only: a trunk-merge/* branch name
    # alone is caller-controlled, so the author must be the Trunk App (REST login trunk-io[bot],
    # e.g. draft #4355) and the head must live in this repository (PR #4227, Codex r4120216186).
    if: ${{ !(startsWith(github.head_ref, 'trunk-merge/') && github.event.pull_request.user.login == 'trunk-io[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: ci tests declarations
    # See the runner-selection note on ci.yml's `test` job.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    # Thu 5 Nov 2026: #8822, #8857, #8761 and #9003 each lost a full CI cycle to one malformed
    # `CI-Tests:` line that the selector refuses (HARD CAP REFUSED) only once the shards run. This
    # job runs the selector's own parser and path rules on the body, in seconds, on every PR
    # event including `edited`, and spells out the fixed line. The shards stay as they are: they
    # live in ci.yml, a separate workflow, so they cannot `needs:` this job; the fast red here
    # tells the owner first. A checkout and one stdlib script; past five minutes is stuck.
    timeout-minutes: 5
