name: CI Cost Guard

on:
  workflow_run:
    # 'Build docs' was removed Mon 31 Aug 2026: it is a single 10-minute
    # Linux job that has never approached any threshold, and pricing it
    # doubled the guard's own run count for no signal. The cumulative view
    # in ci-budget-watch.yml covers every workflow, this one included.
    # Full CI was removed Tue 1 Sep 2026 on arithmetic, not preference. This
    # guard alerts ABOVE $0.30. A workflow whose own timeouts cap it below that
    # can never trip it, so pricing it buys one billed minute per run and zero
    # possible signal. Windows Parity was removed the same day and is BACK: the
    # row below priced it at exactly $0.30 by treating its timeout as an exact
    # billed duration, but production bills whole ceiling-minutes, so a run
    # cancelled at the 30-minute timeout bills 31 and DOES trip. Ceilings below
    # now carry that extra minute per job:
    #
    #   Release Check          30 Linux min      = $0.19  cannot, ever
    #   macOS Packaging        16 macOS min      = $1.05  CAN trip
    #   macOS Native Companion 20 macOS min      = $1.30  CAN trip
    #   E2E                    30 + 45 Linux min = $0.46  CAN trip (see below)
    #   CI                     20+15+20 Linux min = $0.35 CAN trip
    #   Windows Parity         30 Windows min    = $0.31  CAN trip on cancellation
    #   Full CI                20 Linux min      = $0.13  cannot, ever
    #
    # THAT TABLE IS NO LONGER LOAD-BEARING. It is a reader's convenience, and
    # the same table one revision ago was wrong: it priced E2E at one 30-minute
    # job when the workflow has two, the second being the 45-minute nightly
    # extended suite, so a scheduled run's ceiling is $0.45 and DOES trip. The
    # arithmetic is now derived from the workflow files themselves and enforced
    # by test_every_workflow_that_can_trip_the_guard_is_watched, which fails if
    # any workflow's own ceiling exceeds the threshold below while its name is
    # missing from this list. Codex found the E2E row on #713.
    #
    # E2E stays watched but is priced only on the events that can reach that
    # ceiling. Its `extended` job is gated on schedule / workflow_dispatch, so
    # a push or pull_request run is the 30-minute gate alone at $0.18 and
    # cannot trip. Pricing those bought 94 billed minutes on 1 Sep, 4.7% of the
    # monthly allowance, to answer a question whose answer was fixed at 'no'.
    # The job-level `if` below drops exactly those runs and keeps the ones that
    # can alert. That gating is itself pinned by a test, because it is the
    # assumption the skip rests on.
    workflows:
      [
        CI,
        E2E,
        macOS Native Companion,
        macOS Packaging,
        Periodic checks,
        Windows Parity (on-demand),
      ]
    types: [completed]

# workflow_run executes this file from the default branch. Never check out or
# execute the triggering run's head SHA: a pull request may contain untrusted
# code while this workflow has permission to open an alert issue.
permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-cost-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

env:
  # Keep .pyc out of the workspace: root-owned bytecode under .venv is what
  # made actions/checkout fail with EACCES and skip every test step (#1338).
  # This covers interpreters these workflows start directly. It does NOT reach
  # anything run through `sudo`, which resets the environment with no env_keep
  # for this name, so the pre-checkout hygiene step below is the repair path
  # for a root-run interpreter.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  assess:
    name: Price completed workflow run
    # Skip only the E2E runs that provably cannot trip: without the schedule or
    # a manual dispatch its 45-minute `extended` job does not run at all, so the
    # ceiling is the 30-minute gate, $0.18. Every other watched workflow is
    # priced on every event.
    if: >-
      github.event.workflow_run.name != 'E2E'
      || github.event.workflow_run.event == 'schedule'
      || github.event.workflow_run.event == 'workflow_dispatch'
    # Runner is a repo-variable switch; see ci.yml's `test` job for the full
    # rationale. Empty vars.CI_RUNS_ON_LINUX -> hosted ubuntu-latest.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5

    steps:
      # Pre-checkout hygiene for the persistent self-hosted workspace (#1338).
      # checkout cleans the tree as the runner user, so one root-owned file in
      # it fails the unlink with EACCES, dies at step 2, and skips every test
      # step after it -- a red carrying no test evidence. The runner user has
      # NOPASSWD sudo (e2e.yml documents it). This runs as root, so it is
      # bounded three ways, and each bound is load-bearing. A mount point
      # beneath the workspace fails the step outright: `-xdev` alone is not
      # enough, because a bind mount from elsewhere on the SAME filesystem
      # keeps the same st_dev and is traversed regardless (measured on the
      # runner host, Fri 5 Sep 2026). `-xdev` then stops a cross-filesystem
      # mount appearing after that check. The workspace path is escaped the way
      # mountinfo escapes field 5 and handed to awk through ENVIRON, NOT `-v`:
      # `-v` processes escape sequences, so it decodes \040 straight back to a
      # space and undoes the escaping it was given. `chown -h` acts on a symlink
      # itself rather than its referent, so a link pointing out of the tree cannot
      # drag the repair outside. One `find` expression drives the count and
      # the repair, so the number reported is the set acted on.
      #
      # The counts come from `find`, not from `chown -c`: GNU coreutils prints
      # that report on stdout but uutils prints it on stderr, so a piped count
      # reads 0 forever on a uutils host and the log would claim the step found
      # nothing when it had just repaired thousands of files. `remaining` is
      # the proof the repair landed, and a non-zero one fails here rather than
      # letting checkout die at the next step with a worse message.
      #
      # It also NAMES the offending entries -- owner, UTC mtime, path -- and
      # names them BEFORE the chown, because the repair destroys the very
      # evidence that identifies the writer. #1338 could say 957 to 1130 files
      # per runner but not which process wrote them, and cost a forensic
      # session for want of exactly this. The listing goes to a file rather
      # than into `head` down a pipe: under `pipefail` a SIGPIPE'd `find`
      # fails the step. TZ reaches `find` through `env` because sudo here is
      # `env_reset` with no SETENV, so `sudo TZ=UTC find` is refused outright,
      # and an mtime printed in local time under a `Z` suffix is a lie.
      - name: Reclaim workspace ownership before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-}"
          [ -d "$ws" ] || { echo "[hygiene] no workspace yet, nothing to reclaim"; exit 0; }
          uid="$(id -u)"; gid="$(id -g)"; LIST_CAP=20
          esc=${ws//\\/\\134}; esc=${esc// /\\040}; esc=${esc//$'\t'/\\011}; esc=${esc//$'\n'/\\012}
          nested=$(MDT_WS_ESC="$esc/" awk '$5 != "" && index($5, ENVIRON["MDT_WS_ESC"]) == 1 {print $5}' /proc/self/mountinfo)
          [ -z "$nested" ] || {
            echo "::error::mount point(s) beneath the workspace, refusing to chown across them: $nested"
            exit 1
          }
          foreign() { sudo env TZ=UTC find "$ws" -xdev \( ! -user "$uid" -o ! -group "$gid" \) "$@"; }
          entries() { tr -cd '\0' | wc -c; }
          scanned=$(sudo find "$ws" -xdev -print0 | entries)
          reclaimed=$(foreign -print0 | entries)
          offenders="$(mktemp)"
          trap 'rm -f "$offenders"' EXIT
          name_offenders() {
            foreign -printf '  %u:%g %TY-%Tm-%TdT%TH:%TM:%.2TSZ %p\n' >"$offenders"
            head -n "$LIST_CAP" "$offenders"
            [ "$1" -le "$LIST_CAP" ] || echo "  ... and $(( $1 - LIST_CAP )) more"
          }
          [ "$reclaimed" -eq 0 ] || {
            echo "[hygiene] entries not owned by uid $uid, listed before the repair:"
            name_offenders "$reclaimed"
          }
          [ "$reclaimed" -eq 0 ] || foreign -exec chown -h "$uid:$gid" {} +
          remaining=$(foreign -print0 | entries)
          echo "[hygiene] scanned=$scanned reclaimed=$reclaimed remaining=$remaining"
          [ "$remaining" -eq 0 ] || {
            echo "::error::$remaining of $scanned workspace entries are not owned by uid $uid; checkout would fail with EACCES"
            name_offenders "$remaining"
            exit 1
          }
          # A cancelled run can kill checkout's fetch mid ref-update and leave a .git/**/*.lock behind; every
          # later checkout on this runner then dies in seconds ("reference already exists"), draining the queue
          # as instant reds (nucbox-wsl-14, Fri 11 Sep 2026: 4 jobs in 5 min). This job has started no git
          # process yet, so a lock with no live git inside the workspace is stale by construction.
          if [ -d "$ws/.git" ]; then
            live=$(for p in $(pgrep -x git || true); do if [[ $(readlink -f "/proc/$p/cwd" 2>/dev/null) == "$ws"* ]]; then echo "$p"; fi; done)
            if [ -z "$live" ]; then
              echo "[hygiene] stale git locks removed=$(find "$ws/.git" -name '*.lock' -type f -print -delete | wc -l)"
            else
              echo "[hygiene] git still running in the workspace (pids: $(echo $live)); leaving its locks"
            fi
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # false on purpose: the next step cleans all but the dependency trees.
          clean: false

      - name: Remove untracked build debris, keeping dependency dirs
        timeout-minutes: 2
        run: scripts/ci_clean_untracked.sh

      # #1041: this job calls bare `python` below with no actions/setup-python
      # step (deliberately -- a watcher that costs setup time to price a run
      # is its own bug). GitHub-hosted images alias python -> python3; a
      # self-hosted box need not, and Ubuntu 24.04 does not unless
      # python-is-python3 is installed. Fail HERE, naming the runner and the
      # missing binary, rather than 20 steps into the cost calculation with a
      # bare exit 127.
      - name: Preflight - required runner executables present
        run: scripts/ci_runner_preflight.sh python

      - name: Calculate gross runner cost
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        # Threshold rationale (Mon 31 Aug 2026): the previous $1.00 was
        # unreachable. CI's worst case is 20+15+20 min of Linux timeouts =
        # 55 min x $0.006 = $0.33, so no single run could ever trip it and
        # the guard only ever fired on unpriced runners. $0.30 sits just
        # under that ceiling: a CI run that burns its timeouts now alerts,
        # a normal ~6-minute run (~$0.09) stays quiet.
        run: |
          python scripts/ci_cost_guard.py \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" \
            --run-url "$RUN_URL" \
            --workflow-name "$WORKFLOW_NAME" \
            --threshold 0.30

      - name: Open cost alert issue and fail visibly
        if: steps.guard.outputs.over_threshold == 'true' || steps.guard.outputs.unpriced_jobs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COST: ${{ steps.guard.outputs.estimated_cost_usd }}
          REPORT_FILE: ${{ steps.guard.outputs.report_file }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          UNPRICED: ${{ steps.guard.outputs.unpriced_jobs }}
        run: |
          if [[ "$UNPRICED" == "true" ]]; then
            title="CI cost telemetry alert: unpriced runner in run $RUN_ID"
          else
            title="CI cost alert: run $RUN_ID estimated at \$$COST"
          fi
          gh issue create --title "$title" --body-file "$REPORT_FILE"
          echo "::error title=$title::See the generated issue and job summary for the cost breakdown."
          exit 1
