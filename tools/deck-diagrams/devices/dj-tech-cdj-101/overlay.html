<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DJ-Tech CDJ-101 overlay (red recreation)</title>
<style>
:root {
  --bg: #0e1114;
  --ink: #e8eef2;
  --muted: #8a9aa6;
  --red: #ff2a2a;
  --accent: #3dd6c6;
  --panel: #1a2229;
  --shift: #ffb020;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--ink);
}
header {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 10px 14px; background: var(--panel); border-bottom: 1px solid #2a3540;
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
header .meta { color: var(--muted); font-size: 12px; }
.toolbar button, .toolbar label {
  background: #24303a; color: var(--ink); border: 1px solid #3a4a57;
  border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer;
}
.toolbar button.active, .toolbar button[aria-pressed="true"] {
  background: var(--shift); color: #111; border-color: var(--shift); font-weight: 600;
}
.stage-wrap { padding: 12px; overflow: auto; }
.stage {
  position: relative; width: min(1200px, 100%);
  margin: 0 auto; user-select: none;
}
.stage img.plate { width: 100%; height: auto; display: block; border-radius: 4px; }
.control {
  position: absolute; border: 2px solid var(--red); color: var(--red);
  background: rgba(255, 40, 40, 0.12); font-size: 9px; line-height: 1.1;
  display: flex; align-items: flex-start; justify-content: flex-start;
  padding: 1px 2px; overflow: hidden; cursor: pointer;
}
.control .tag { font-weight: 700; pointer-events: none; }
.control.kind-jog { border-radius: 50%; }
.control.kind-knob, .control.kind-encoder { border-radius: 50%; }
.control.kind-fader { border-radius: 2px; }
.control.kind-pad { border-radius: 3px; }
.control.pressed, .control:active { background: rgba(255,40,40,0.45); }
.control.shift-hot { border-color: var(--shift); color: var(--shift); background: rgba(255,176,32,0.18); }
#readout {
  position: sticky; bottom: 0; background: #12181e; border-top: 1px solid #2a3540;
  padding: 10px 14px; font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; min-height: 52px;
}
#readout .k { color: var(--accent); }
.legend { color: var(--muted); font-size: 11px; margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>DJ-Tech CDJ-101 - red overlay</h1>
  <span class="meta">Compare recreation vs official plate. Missing = no red box.</span>
  <div class="toolbar">
    <button type="button" id="shiftBtn" aria-pressed="false" title="Toggle SHIFT layer highlight">SHIFT</button>
  </div>
  <span class="legend">Hold keyboard Shift or click SHIFT · hover for MIDI</span>
</header>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <img class="plate" src="" alt="DJ-Tech CDJ-101 official plate"/>
    <div class="control kind-button" style="left:2.0%;top:4.0%;width:4.0%;height:4.5%;" data-fig="play" data-label="play" data-kind="button" data-midi-name="play" data-midi-type="note" data-midi-ch="1" data-midi-code="42" data-shift-name="" data-layer="base" title="play play"><span class="tag">play</span></div><div class="control kind-button" style="left:9.8%;top:4.0%;width:4.0%;height:4.5%;" data-fig="cue" data-label="cue" data-kind="button" data-midi-name="cue" data-midi-type="note" data-midi-ch="1" data-midi-code="43" data-shift-name="" data-layer="base" title="cue cue"><span class="tag">cue</span></div><div class="control kind-jog" style="left:17.6%;top:4.0%;width:6.0%;height:6.0%;" data-fig="jogtouch" data-label="jogtouch" data-kind="jog" data-midi-name="jogtouch" data-midi-type="note" data-midi-ch="1" data-midi-code="32" data-shift-name="" data-layer="base" title="jogtouch jogtouch"><span class="tag">jogtouch</span></div><div class="control kind-jog" style="left:25.4%;top:4.0%;width:6.0%;height:6.0%;" data-fig="jogouter" data-label="jogouter" data-kind="jog" data-midi-name="jogouter" data-midi-type="cc" data-midi-ch="1" data-midi-code="53" data-shift-name="" data-layer="base" title="jogouter jogouter"><span class="tag">jogouter</span></div><div class="control kind-jog" style="left:33.2%;top:4.0%;width:6.0%;height:6.0%;" data-fig="jogtop" data-label="jogtop" data-kind="jog" data-midi-name="jogtop" data-midi-type="cc" data-midi-ch="1" data-midi-code="54" data-shift-name="" data-layer="base" title="jogtop jogtop"><span class="tag">jogtop</span></div><div class="control kind-button" style="left:41.0%;top:4.0%;width:4.0%;height:4.5%;" data-fig="push" data-label="push" data-kind="button" data-midi-name="push" data-midi-type="note" data-midi-ch="1" data-midi-code="31" data-shift-name="" data-layer="base" title="push push"><span class="tag">push</span></div><div class="control kind-encoder" style="left:48.8%;top:4.0%;width:4.0%;height:4.5%;" data-fig="browse" data-label="browse" data-kind="encoder" data-midi-name="browse" data-midi-type="cc" data-midi-ch="1" data-midi-code="56" data-shift-name="" data-layer="base" title="browse browse"><span class="tag">browse</span></div><div class="control kind-button" style="left:56.6%;top:4.0%;width:4.0%;height:4.5%;" data-fig="play_2" data-label="play" data-kind="button" data-midi-name="play_2" data-midi-type="note" data-midi-ch="2" data-midi-code="42" data-shift-name="" data-layer="base" title="play_2 play"><span class="tag">play_2</span></div><div class="control kind-button" style="left:64.4%;top:4.0%;width:4.0%;height:4.5%;" data-fig="cue_2" data-label="cue" data-kind="button" data-midi-name="cue_2" data-midi-type="note" data-midi-ch="2" data-midi-code="43" data-shift-name="" data-layer="base" title="cue_2 cue"><span class="tag">cue_2</span></div><div class="control kind-jog" style="left:72.2%;top:4.0%;width:6.0%;height:6.0%;" data-fig="jogtouch_2" data-label="jogtouch" data-kind="jog" data-midi-name="jogtouch_2" data-midi-type="note" data-midi-ch="2" data-midi-code="32" data-shift-name="" data-layer="base" title="jogtouch_2 jogtouch"><span class="tag">jogtouch_2</span></div><div class="control kind-jog" style="left:80.0%;top:4.0%;width:6.0%;height:6.0%;" data-fig="jogouter_2" data-label="jogouter" data-kind="jog" data-midi-name="jogouter_2" data-midi-type="cc" data-midi-ch="2" data-midi-code="53" data-shift-name="" data-layer="base" title="jogouter_2 jogouter"><span class="tag">jogouter_2</span></div><div class="control kind-jog" style="left:87.8%;top:4.0%;width:6.0%;height:6.0%;" data-fig="jogtop_2" data-label="jogtop" data-kind="jog" data-midi-name="jogtop_2" data-midi-type="cc" data-midi-ch="2" data-midi-code="54" data-shift-name="" data-layer="base" title="jogtop_2 jogtop"><span class="tag">jogtop_2</span></div><div class="control kind-button" style="left:2.0%;top:10.5%;width:4.0%;height:4.5%;" data-fig="push_2" data-label="push" data-kind="button" data-midi-name="push_2" data-midi-type="note" data-midi-ch="2" data-midi-code="31" data-shift-name="" data-layer="base" title="push_2 push"><span class="tag">push_2</span></div><div class="control kind-encoder" style="left:9.8%;top:10.5%;width:4.0%;height:4.5%;" data-fig="browse_2" data-label="browse" data-kind="encoder" data-midi-name="browse_2" data-midi-type="cc" data-midi-ch="2" data-midi-code="56" data-shift-name="" data-layer="base" title="browse_2 browse"><span class="tag">browse_2</span></div>
  </div>
</div>
<div id="readout">Hover a control…</div>
<script>
const stage = document.getElementById('stage');
const readout = document.getElementById('readout');
const shiftBtn = document.getElementById('shiftBtn');
let shift = false;
const dials = new Map();

function setShift(on) {
  shift = on;
  shiftBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  shiftBtn.classList.toggle('active', on);
  document.querySelectorAll('.control').forEach(el => {
    const has = !!el.dataset.shiftName;
    el.classList.toggle('shift-hot', on && has);
    if (on && has) {
      const base = el.dataset.label;
      el.querySelector('.tag').innerHTML = el.dataset.fig + '<br>SHIFT: ' + el.dataset.shiftName;
      el.dataset._baseLabel = base;
    } else if (el.dataset._baseHtml) {
      el.querySelector('.tag').innerHTML = el.dataset._baseHtml;
    }
  });
}

document.querySelectorAll('.control').forEach(el => {
  el.dataset._baseHtml = el.querySelector('.tag').innerHTML;
  el.addEventListener('pointerenter', () => {
    const sn = el.dataset.shiftName;
    readout.innerHTML =
      `<span class="k">${el.dataset.fig}</span> ${el.dataset.label} · ` +
      `<span class="k">${el.dataset.midiType.toUpperCase()}</span> ch${el.dataset.midiCh} ` +
      `code ${el.dataset.midiCode} · name <span class="k">${el.dataset.midiName}</span>` +
      (sn ? ` · shift twin <span class="k">${sn}</span>` : ' · (no shift twin)') +
      (shift && sn ? ' · <span class="k">SHIFT LAYER ACTIVE</span>' : '');
  });
  el.addEventListener('pointerdown', (ev) => {
    el.classList.add('pressed');
    if (el.dataset.kind === 'knob' || el.dataset.kind === 'encoder' || el.dataset.kind === 'fader') {
      const id = el.dataset.fig;
      let v = dials.get(id) ?? 64;
      v = Math.max(0, Math.min(127, v + (ev.shiftKey ? -8 : 8)));
      dials.set(id, v);
      const dv = el.querySelector('.dial-value');
      if (dv) { dv.hidden = false; dv.textContent = String(v); }
      readout.innerHTML += ` · value <span class="k">${v}</span>`;
    }
  });
  el.addEventListener('pointerup', () => el.classList.remove('pressed'));
  el.addEventListener('pointerleave', () => el.classList.remove('pressed'));
});

shiftBtn?.addEventListener('click', () => setShift(!shift));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Shift') setShift(true);
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'Shift') setShift(false);
});
</script>
</body>
</html>
