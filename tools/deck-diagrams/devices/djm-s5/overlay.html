<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DJM-S5 overlay (red recreation)</title>
<style>
:root {
  --bg: #0e1114;
  --ink: #e8eef2;
  --muted: #8a9aa6;
  --red: #ff2a2a;
  --accent: #3dd6c6;
  --panel: #1a2229;
  --shift: #ffb020;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--ink);
}
header {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 10px 14px; background: var(--panel); border-bottom: 1px solid #2a3540;
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
header .meta { color: var(--muted); font-size: 12px; }
.toolbar button, .toolbar label {
  background: #24303a; color: var(--ink); border: 1px solid #3a4a57;
  border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer;
}
.toolbar button.active, .toolbar button[aria-pressed="true"] {
  background: var(--shift); color: #111; border-color: var(--shift); font-weight: 600;
}
.stage-wrap { padding: 12px; overflow: auto; }
.stage {
  position: relative; width: min(1200px, 100%);
  margin: 0 auto; user-select: none;
}
.stage img.plate { width: 100%; height: auto; display: block; border-radius: 4px; }
.control {
  position: absolute; border: 2px solid var(--red); color: var(--red);
  background: rgba(255, 40, 40, 0.12); font-size: 9px; line-height: 1.1;
  display: flex; align-items: flex-start; justify-content: flex-start;
  padding: 1px 2px; overflow: hidden; cursor: pointer;
}
.control .tag { font-weight: 700; pointer-events: none; }
.control.kind-jog { border-radius: 50%; }
.control.kind-knob, .control.kind-encoder { border-radius: 50%; }
.control.kind-fader { border-radius: 2px; }
.control.kind-pad { border-radius: 3px; }
.control.pressed, .control:active { background: rgba(255,40,40,0.45); }
.control.shift-hot { border-color: var(--shift); color: var(--shift); background: rgba(255,176,32,0.18); }
#readout {
  position: sticky; bottom: 0; background: #12181e; border-top: 1px solid #2a3540;
  padding: 10px 14px; font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; min-height: 52px;
}
#readout .k { color: var(--accent); }
.legend { color: var(--muted); font-size: 11px; margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>DJM-S5 - red overlay</h1>
  <span class="meta">Compare recreation vs official plate. Missing = no red box.</span>
  <div class="toolbar">
    <button type="button" id="shiftBtn" aria-pressed="false" title="Toggle SHIFT layer highlight">SHIFT</button>
  </div>
  <span class="legend">Hold keyboard Shift or click SHIFT · hover for MIDI</span>

v><div class="control kind-button" style="left:47.3267%;top:50.0671%;width:5.1485%;height:2.4161%;" data-fig="P7" data-label="MODE" data-kind="button" data-midi-name="mode" data-midi-type="note" data-midi-ch="7" data-midi-code="64" data-shift-name="" data-mode-name="" data-shift-mode-name="" data-layer="base" title="P7 MODE"><span class="tag">P7</span></div><div class="control kind-button" style="left:4.3564%;top:27.7852%;width:4.9505%;height:3.3557%;" data-fig="E1" data-label="FX1/CUT1" data-kind="button" data-midi-name="fx_cut1" data-midi-type="note" data-midi-ch="5" data-midi-code="112" data-shift-name="fx_cut1_shift" data-mode-name="" data-shift-mode-name="" data-layer="both" title="E1 FX1/CUT1"><span class="tag">E1</span></div><div class="control kind-button" style="left:11.2871%;top:27.7852%;width:4.9505%;height:3.3557%;" data-fig="E2" data-label="FX2/CUT2" data-kind="button" data-midi-name="fx_cut2" data-midi-type="note" data-midi-ch="5" data-midi-code="113" data-shift-name="fx_cut2_shift" data-mode-name="" data-shift-mode-name="" data-layer="both" title="E2 FX2/CUT2"><span class="tag">E2</span></div><div class="control kind-button" style="left:18.4158%;top:27.7852%;width:4.9505%;height:3.3557%;" data-fig="E3" data-label="FX3/CUT3" data-kind="button" data-midi-name="fx_cut3" data-midi-type="note" data-midi-ch="5" data-midi-code="114" data-shift-name="fx_cut3_shift" data-mode-name="" data-shift-mode-name="" data-layer="both" title="E3 FX3/CUT3"><span class="tag">E3</span></div><div class="control kind-button" style="left:76.6337%;top:27.7852%;width:4.9505%;height:3.3557%;" data-fig="E4" data-label="FX1/CUT4" data-kind="button" data-midi-name="fx_cut4" data-midi-type="note" data-midi-ch="6" data-midi-code="112" data-shift-name="fx_cut4_shift" data-mode-name="" data-shift-mode-name="" data-layer="both" title="E4 FX1/CUT4"><span class="tag">E4</span></div><div class="control kind-button" style="left:83.7624%;top:27.7852%;width:4.9505%;height:3.3557%;" data-fig="E5" data-label="FX2/CUT5" data-kind="button" data-midi-name="fx_cut5" data-midi-type="note" data-midi-ch="6" data-midi-code="113" data-shift-name="fx_cut5_shift" data-mode-name="" data-shift-mode-name="" data-layer="both" title="E5 FX2/CUT5"><span class="tag">E5</span></div><div class="control kind-button" style="left:90.6931%;top:27.7852%;width:4.9505%;height:3.3557%;" data-fig="E6" data-label="FX3/CUT6" data-kind="button" data-midi-name="fx_cut6" data-midi-type="note" data-midi-ch="7" data-midi-code="114" data-shift-name="fx_cut6_shift" data-mode-name="" data-shift-mode-name="" data-layer="both" title="E6 FX3/CUT6"><span class="tag">E6</span></div><div class="control kind-pad" style="left:4.1584%;top:47.9195%;width:9.1089%;height:6.1745%;" data-fig="P1" data-label="PAD 1 / 5" data-kind="pad" data-midi-name="pad1_ch8_bank1" data-midi-type="note" data-midi-ch="8" data-midi-code="0" data-shift-name="pad1_ch8_bank1_shift" data-mode-name="pad1_mode_single" data-shift-mode-name="pad1_mode_single_shift" data-layer="both" title="P1 PAD 1 / 5"><span class="tag">P1</span></div><div class="control kind-pad" style="left:14.4554%;top:47.9195%;width:9.1089%;height:6.1745%;" data-fig="P2" data-label="PAD 2 / 6" data-kind="pad" data-midi-name="pad2_ch8_bank1" data-midi-type="note" data-midi-ch="8" data-midi-code="1" data-shift-name="pad2_ch8_bank1_shift" data-mode-name="pad2_mode_single" data-shift-mode-name="pad2_mode_single_shift" data-layer="both" title="P2 PAD 2 / 6"><span class="tag">P2</span></div><div class="control kind-pad" style="left:24.9505%;top:47.9195%;width:9.1089%;height:6.1745%;" data-fig="P3" data-label="PAD 3 / 7" data-kind="pad" data-midi-name="pad3_ch8_bank1" data-midi-type="note" data-midi-ch="8" data-midi-code="2" data-shift-name="pad3_ch8_bank1_shift" data-mode-name="pad3_mode_single" data-shift-mode-name="pad3_mode_single_shift" data-layer="both" title="P3 PAD 3 / 7"><span class="tag">P3</span></div><div class="control kind-pad" style="left:35.4455%;top:47 <div id="readout">Hover a control…</div>
<script>
const stage = document.getElementById('stage');
const readout = document.getElementById('readout');
const shiftBtn = document.getElementById('shiftBtn');
let shift = false;
const dials = new Map();

function setShift(on) {
  shift = on;
  shiftBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  shiftBtn.classList.toggle('active', on);
  document.querySelectorAll('.control').forEach(el => {
    const has = !!el.dataset.shiftName;
    el.classList.toggle('shift-hot', on && has);
    if (on && has) {
      const base = el.dataset.label;
      el.querySelector('.tag').innerHTML = el.dataset.fig + '<br>SHIFT: ' + el.dataset.shiftName;
      el.dataset._baseLabel = base;
    } else if (el.dataset._baseHtml) {
      el.querySelector('.tag').innerHTML = el.dataset._baseHtml;
    }
  });
}

document.querySelectorAll('.control').forEach(el => {
  el.dataset._baseHtml = el.querySelector('.tag').innerHTML;
  el.addEventListener('pointerenter', () => {
    const sn = el.dataset.shiftName;
    readout.innerHTML =
      `<span class="k">${el.dataset.fig}</span> ${el.dataset.label} · ` +
      `<span class="k">${el.dataset.midiType.toUpperCase()}</span> ch${el.dataset.midiCh} ` +
      `code ${el.dataset.midiCode} · name <span class="k">${el.dataset.midiName}</span>` +
      (sn ? ` · shift twin <span class="k">${sn}</span>` : ' · (no shift twin)') +
      (el.dataset.modeName ? ` · mode twin <span class="k">${el.dataset.modeName}</span>` : '') +
      (el.dataset.shiftModeName ? ` · shift+mode twin <span class="k">${el.dataset.shiftModeName}</span>` : '') +
      (shift && sn ? ' · <span class="k">SHIFT LAYER ACTIVE</span>' : '');
  });
  el.addEventListener('pointerdown', (ev) => {
    el.classList.add('pressed');
    if (el.dataset.kind === 'knob' || el.dataset.kind === 'encoder' || el.dataset.kind === 'fader') {
      const id = el.dataset.fig;
      let v = dials.get(id) ?? 64;
      v = Math.max(0, Math.min(127, v + (ev.shiftKey ? -8 : 8)));
      dials.set(id, v);
      const dv = el.querySelector('.dial-value');
      if (dv) { dv.hidden = false; dv.textContent = String(v); }
      readout.innerHTML += ` · value <span class="k">${v}</span>`;
    }
  });
  el.addEventListener('pointerup', () => el.classList.remove('pressed'));
  el.addEventListener('pointerleave', () => el.classList.remove('pressed'));
});

shiftBtn?.addEventListener('click', () => setShift(!shift));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Shift') setShift(true);
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'Shift') setShift(false);
});
</script>
</body>
</html>
