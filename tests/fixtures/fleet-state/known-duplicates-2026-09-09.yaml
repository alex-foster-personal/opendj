# Snapshot of the in-repo fleet-state inventory as it stood Wed 9 Sep 2026,
# before #1580 cleanup. Two live names for one meter (dash vs underscore),
# the legacy acct3 short name beside the per-account meter, and a second
# writer bolted onto the underscore meter. The duplicate-writer check must
# go red on this file and name every path below.
files:
  - path: seat-b-five-hour-pct
    writer: ~/jobs/account-meters.sh
    readers:
      - ops/fleet/kpi.sh
  - path: seat-b-five-hour-pct
    writer:
      - ~/jobs/account-meters.sh
      - ~/jobs/usage-watch-mirror.sh
    readers:
      - ops/fleet/kpi.sh
      - ~/jobs/can-spawn.sh
  - path: acct3-5h-pct
    writer: ~/code/afmac/usage-watch/usage_watch.sh
    readers:
      - ops/fleet/kpi.sh
  - path: account3-five-hour-pct
    writer: ~/jobs/account-meters.sh
    readers:
      - ops/fleet/kpi.sh
      - ~/jobs/can-spawn.sh
  - path: ghost-five-hour-pct
    writer: none
    readers:
      - ops/fleet/kpi.sh
