<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="open-dj">
  <title>open-dj</title>
  <!-- Vinyl record body -->
  <circle cx="16" cy="16" r="14" fill="#111"/>
  <!-- Grooves -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#2a2a2a" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#2a2a2a" stroke-width="0.6"/>
  <!-- Label -->
  <circle cx="16" cy="16" r="5" fill="#ff5722"/>
  <!-- Spindle -->
  <circle cx="16" cy="16" r="1" fill="#111"/>
  <!-- Tonearm -->
  <line x1="27" y1="5" x2="19" y2="14" stroke="#ddd" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="27" cy="5" r="1.6" fill="#ddd"/>
</svg>
