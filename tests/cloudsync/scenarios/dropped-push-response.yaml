name: dropped-push-response
description: >
  Spoke A's push reaches the hub and commits, then the answer is lost on the
  way back (a timeout, a reset, a closed lid). A cannot know the row landed,
  so it must not step its fence, and its retry must be harmless: the hub
  already holds that exact row, so the replay loses the equal-stamp compare
  instead of applying (or logging) it twice. The edit still reaches B.

machines:
  - id: hub
    role: hub
  - id: spoke-a
    role: spoke
  - id: spoke-b
    role: spoke

seed:
  tracks:
    - stable_id: trk-1
      title: original
      "on": [spoke-a, spoke-b]

steps:
  - "on": spoke-a
    action: edit
    args:
      table: tracks
      stable_id: trk-1
      set: { title: edited on A }

  - "on": spoke-a
    action: fault
    args: { mode: drop_response_after_commit, path: push }
  - "on": spoke-a
    action: sync
    args:
      expect_error: transport

  # The retry re-offers the row; the hub already committed it.
  - "on": spoke-a
    action: sync
    args:
      expect: { pushed: 1, accepted: 0, rejected: 1 }

  - "on": spoke-b
    action: sync
    args:
      expect: { applied: 1 }
  - "on": spoke-b
    action: assert_converged
    args:
      table: tracks
      pk: { stable_id: trk-1 }
      field: title
      equals: edited on A

expected:
  digest_converged: true
